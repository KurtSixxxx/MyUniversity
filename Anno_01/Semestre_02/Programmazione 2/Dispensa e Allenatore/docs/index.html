  /* variabili CSS del tema «Terminale» costruite da un solo colore */
  function paletta(hex) {
    const rgb = rgbDa(hex), [h, s0] = hslDa(rgb), s = Math.min(100, s0), k = s / 100;
    const rgbs = rgb.join(', ');
    const chiaro = rgb.map(c => Math.round(c + (255 - c) * .42));
    return {
      '--fosforo': hex, '--fosforo-rgb': rgbs, '--fosforo-chiaro': `rgb(${chiaro.join(', ')})`,
      '--accento': hex, '--accento-2': `rgb(${chiaro.join(', ')})`, '--accento-tenue': `rgba(${rgbs}, .14)`,
      '--testo': hsl(h, 100 * k, 89), '--testo-2': hsl(h, 39 * k, 55), '--testo-3': hsl(h, 39 * k, 30),
      '--superficie': hsl(h, 70 * k, 1.4), '--superficie-2': hsl(h, 70 * k, .8),
      '--linea': `rgba(${rgbs}, .16)`, '--linea-forte': `rgba(${rgbs}, .34)`,
      '--riempi': `rgba(${rgbs}, .045)`, '--riempi-2': `rgba(${rgbs}, .085)`,
      '--seg': `rgba(${rgbs}, .05)`, '--seg-attivo': `rgba(${rgbs}, .2)`, '--bordo-card': `rgba(${rgbs}, .2)`,
      '--riga-attiva': `rgba(${rgbs}, .06)`, '--selezione': `rgba(${rgbs}, .3)`, '--c-com': hsl(h, 41 * k, 38),
      '--bagliore': `0 0 8px rgba(${rgbs}, .45)`,
      '--ombra-alta': `0 0 0 1px rgba(${rgbs}, .3), 0 0 40px rgba(${rgbs}, .12)`,
    };
  }
  /* terminale = true: tutta la paletta; altrimenti solo l'accento (temi chiaro/scuro) */
  function applicaAccento(hex, terminale, radice = document.documentElement) {
    const p = paletta(hex || COLORI[0][0]);
    const tutte = Object.keys(paletta('#33ff99'));
    for (const k of tutte) radice.style.removeProperty(k);
    const usa = terminale ? Object.keys(p) : ['--accento-tenue', '--fosforo', '--fosforo-rgb'];
    for (const k of usa) radice.style.setProperty(k, p[k]);
    if (!terminale) {   // nei temi chiaro/scuro l'accento vale come colore dei pulsanti
      radice.style.setProperty('--accento', hex);
      radice.style.setProperty('--accento-2', hex);
    }
  }

  window.Gioco = {
    oggiISO, registra, calcola, missioni, esitoMissioni,
    sogliaLivello, livelloDa, unisci, pulisci, pulisciProfilo, COLORI, paletta, applicaAccento, XP_ES,
    _util: { rgbDa, hslDa, hash, oggiISO },   // per bit.js
  };
})();

<script>/* =====================================================================

      occhi: [[8, 12], [14, 12]], bocca: [11, 15], guance: [[6, 14], [16, 14]], pancia: [19, 16], testa: [17, 5] },
    { // 2 Byte

  const mescola = (a, b, t) => a.map((c, i) => Math.round(c + (b[i] - c) * t));
  const hex = rgb => '#' + rgb.map(c => c.toString(16).padStart(2, '0')).join('');
  function hslHex(h, s, l) {
    s /= 100; l /= 100;
    const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
    return hex([f(0), f(8), f(4)]);
  }
  function colori(accento) {
    const rgb = rgbDa(accento), [h, s] = hslDa(rgb), grigio = s < 15;
    return {
      B: hex(rgb), L: hex(mescola(rgb, [255, 255, 255], .45)), D: hex(mescola(rgb, [0, 0, 0], .35)), O: hex(mescola(rgb, [0, 0, 0], .82)),
      A: grigio ? '#ff4fd8' : hslHex((h + 180) % 360, 88, 63), S: grigio ? '#5b3cc4' : hslHex((h + 205) % 360, 62, 40),
      G: '#ffd447', K: '#0b1020', W: '#ffffff', R: '#ff7aa8', P: hex(mescola(rgb, [0, 0, 0], .9)),
    };
  }

  /* palette dell'Armadio: 'app' segue il colore scelto nelle impostazioni */
  const PALETTE = [

    { id: 'ciano', nome: 'Ciano hacker', descr: 'Freddo come una shell alle tre di notte.', base: '#00e5ff', req: 'hello' },
    { id: 'magenta', nome: 'Cyberpunk magenta', descr: 'Neon, pioggia e codice che scorre.', base: '#ff2bd6', extra: { A: '#00f0ff', S: '#ffe600', R: '#00f0ff' }, req: 'promosso' },
    { id: 'gameboy', nome: 'GameBoy monocromo', descr: 'Quattro tonalità di verde e niente di più.', req: 'cento',
      fisso: { B: '#8bac0f', L: '#9bbc0f', D: '#306230', O: '#0f380f', A: '#306230', S: '#0f380f', G: '#9bbc0f', K: '#0f380f', W: '#9bbc0f', R: '#306230', P: '#0f380f' } },
    { id: 'oro', nome: 'Oro leggendario', descr: 'Riservato a chi ha raggiunto il livello 20.', req: 'liv20',
      fisso: { B: '#ffc93c', L: '#fff1a8', D: '#c98a00', O: '#3d2600', A: '#ff4d6d', S: '#8a1c3c', G: '#ffffff', K: '#1a1206', W: '#ffffff', R: '#ff8a5c', P: '#3d2600' } },
  ];
  function coloriPalette(id, accento) {
    const p = PALETTE.find(x => x.id === id);
    if (!p || id === 'app') return colori(accento || '#33ff99');
    if (p.fisso) return { ...p.fisso };
    return { ...colori(p.base), ...(p.extra || {}) };
  }

  const ALONE = { euforico: '#ffd447', felice: 'B', neutro: 'B', tranquillo: 'B', affamato: '#ff9f1a', dorme: '#6c8cff',
    errore: '#ff3b5c', triste: '#5b8cff', sbadiglio: 'B', mangia: '#ffd447' };

  /* geometria utile agli accessori: cima della testa (prima riga del contorno larga almeno 4) e larghezza di una riga */
  function geometria(px, sp) {
    let cima = 0;
    for (let y = 0; y < 24; y++) { let n = 0; for (let x = 0; x < 24; x++) if (px.get(x + ',' + y) === 'O') n++; if (n >= 4) { cima = y; break; } }
    const riga = y => { let a = 99, b = -1; for (let x = 0; x < 24; x++) if (px.has(x + ',' + y)) { a = Math.min(a, x); b = Math.max(b, x); } return [a, b]; };
    const [, ey] = sp.occhi[0];
    const collo = sp.bocca ? sp.bocca[1] + 3 : ey + 5;
    return { cima, riga, collo };
  }

  /* accessori dell'Armadio, disegnati sopra il viso */
  function accessorio(id, sp, g, C, rect) {
    const [[lx, ly], [rx, ry]] = sp.occhi, cx = 12;
    switch (id) {
      case 'thug':   // occhiali Thug Life: barra nera, lenti a gradini, riflessi bianchi
        return rect(lx - 2, ly - 1, rx - lx + 6, 1, C.K) + rect(lx - 1, ly, 4, 2, C.K) + rect(rx - 1, ly, 4, 2, C.K)
          + rect(lx, ly + 2, 2, 1, C.K) + rect(rx, ly + 2, 2, 1, C.K) + rect(lx + 3, ly, rx - lx - 4, 1, C.K)
          + rect(lx - 1, ly, 1, 1, C.W) + rect(lx, ly + 1, 1, 1, C.W) + rect(rx - 1, ly, 1, 1, C.W) + rect(rx, ly + 1, 1, 1, C.W);
      case 'monocolo':   // anello d'oro sull'occhio destro, catenella che pende
        return rect(rx - 1, ry - 1, 4, 1, C.G) + rect(rx - 1, ry + 2, 4, 1, C.G) + rect(rx - 1, ry, 1, 2, C.G) + rect(rx + 2, ry, 1, 2, C.G)
          + rect(rx + 2, ry + 3, 1, 1, C.G) + rect(rx + 3, ry + 4, 1, 2, C.G) + rect(rx + 2, ry + 6, 1, 1, C.G);
      case 'laurea': {   // tocco da laurea con nappa dorata
        const t = g.cima;
        return rect(cx - 4, t - 2, 8, 2, '#2c3352') + rect(cx - 7, t - 4, 14, 2, '#2c3352') + rect(cx - 6, t - 4, 12, 1, '#6370a8') + rect(cx - 7, t - 3, 14, 1, '#1d2238')
          + rect(cx - 1, t - 5, 2, 1, C.G) + rect(cx + 5, t - 3, 1, 3, C.G) + rect(cx + 4, t, 3, 1, C.G);
      }
      case 'cuffie': {   // archetto sopra la testa e padiglioni ai lati, all'altezza degli occhi
        const [a, b] = g.riga(ly), t = g.cima;
        const n = '#4a5272', l = '#7c86ad';
        return rect(a - 2, ly - 1, 3, 5, n) + rect(a - 1, ly, 1, 3, C.A) + rect(b, ly - 1, 3, 5, n) + rect(b + 1, ly, 1, 3, C.A)
          + rect(a - 1, t - 2, b - a + 3, 1, n) + rect(a, t - 2, b - a + 1, 1, l) + rect(a - 2, t - 1, 1, ly - t, n) + rect(b + 2, t - 1, 1, ly - t, n);
      }
      case 'sciarpa': {   // sciarpa blu C++ a righe bianche, con un capo che pende
        const y = g.collo, [a, b] = g.riga(y);
        let s = rect(a, y, b - a + 1, 2, '#00599c');
        for (let x = a + 2; x <= b - 1; x += 3) s += rect(x, y, 1, 2, '#ffffff');
        return s + rect(b - 4, y + 2, 3, 4, '#00599c') + rect(b - 4, y + 4, 3, 1, '#ffffff') + rect(b - 4, y + 6, 1, 1, '#00599c') + rect(b - 2, y + 6, 1, 1, '#00599c');
      }
      case 'baffetto': {   // baffi a manubrio, alla Oscar
        const [mx, my] = sp.bocca || [cx - 1, ly + 3];
        return rect(mx - 2, my - 1, 6, 1, C.K) + rect(mx - 3, my - 2, 1, 1, C.K) + rect(mx + 4, my - 2, 1, 1, C.K) + rect(mx, my - 2, 2, 1, C.K);
      }
    }
    return '';
  }

  /* svgPet(indice, umore, opz) -> stringa SVG animata dal CSS di bit.css
     opz: { colore, palette, lato, classe, accessori: {occhi, testa, collo, viso}, faccia, sguardo: 'su'|'giu'|'sx'|'dx',
            occhiali (reazione hype), mani: 'occhi'|'applauso' } */
  function svgPet(indice, umore, opz = {}) {
    if (umore === 'tranquillo') umore = 'neutro';
    const sp = SPRITE[Math.max(0, Math.min(SPRITE.length - 1, indice))];
    const C = coloriPalette(opz.palette, opz.colore);
    const acc = opz.accessori || {};
    const px = new Map();
    sp.righe.forEach((r, y) => { if (!r) return; const piena = r.padEnd(12, '.') + [...r.padEnd(12, '.')].reverse().join('');
      [...piena].forEach((c, x) => { if (c !== '.') px.set(x + ',' + y, c); }); });
    for (const [x, y, c] of sp.extra) px.set(x + ',' + y, c);
    const g = geometria(px, sp);
    // con un cappello o le cuffie, antenne e corone sopra la testa spariscono
    if (acc.testa) for (const k of [...px.keys()]) if (+k.split(',')[1] < g.cima) px.delete(k);
    const rect = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${C[c] || c}"/>`;
    let corpo = '';
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) {
      const c = px.get(x + ',' + y); if (!c) continue;
      let w = 1; while (px.get((x + w) + ',' + y) === c) w++;
      corpo += rect(x, y, w, 1, c); x += w - 1;
    }
    // --- viso: l'espressione scelta nell'armadio vale negli umori tranquilli (neutro e felice)
    const faccia = (umore === 'neutro' || umore === 'felice') && opz.faccia && opz.faccia !== 'normale' ? opz.faccia : null;
    const scuro = sp.visiera ? C.A : C.P;
    const chiusi = umore === 'dorme' || umore === 'sbadiglio';
    const arco = umore === 'felice' || umore === 'euforico' || umore === 'mangia' || faccia === 'gioia';
    const [dx, dy] = { su: [0, -1], giu: [0, 1], sx: [-1, 0], dx: [1, 0] }[opz.sguardo] || [0, 0];
    let occhi = '', aperti = false;
    sp.occhi.forEach(([x, y], i) => {
      const sx = i === 0 ? x - 1 : x;   // gli occhi larghi 3 si allargano verso l'esterno
      if (umore === 'errore') occhi += rect(sx, y - 1, 1, 1, '#ff3b5c') + rect(sx + 2, y - 1, 1, 1, '#ff3b5c') + rect(sx + 1, y, 1, 1, '#ff3b5c')
        + rect(sx, y + 1, 1, 1, '#ff3b5c') + rect(sx + 2, y + 1, 1, 1, '#ff3b5c');
      else if (chiusi) occhi += rect(sx, y + 1, 3, 1, scuro);
      else if (faccia === 'stelle') occhi += rect(sx + 1, y - 1, 1, 3, C.G) + rect(sx, y, 3, 1, C.G);
      else if (faccia === 'sornione') occhi += rect(sx, y, 3, 1, scuro) + rect(sx + 2, y + 1, 1, 1, scuro) + rect(sx + 1 + (i ? 1 : 0), y + 1, 1, 1, scuro);
      else if (faccia === 'giudice') occhi += rect(sx, y - 1, 3, 1, scuro) + rect(sx + (i ? 2 : 0), y - 2, 1, 1, scuro) + rect(sx + 1, y + 1, 1, 1, scuro);
      else if (arco) occhi += rect(sx, y + 1, 1, 1, scuro) + rect(sx + 1, y, 1, 1, scuro) + rect(sx + 2, y + 1, 1, 1, scuro);
      else if (umore === 'triste') occhi += rect(x, y + 1, 2, 1, scuro) + rect(x + (i ? 1 : 0), y, 1, 1, scuro) + rect(x + (i ? -1 : 2), y - 1, 1, 1, scuro)
        + (i === 0 ? rect(x, y + 2, 1, 2, '#6cc8ff') : '');
      else { aperti = true; occhi += rect(x + dx, y + dy, 2, 2, scuro) + rect(x + dx, y + dy, 1, 1, C.W); }
    });
    let bocca = '';
    if (sp.bocca) {
      const [x, y] = sp.bocca;
      if (umore === 'euforico') bocca = rect(x - 1, y, 4, 1, C.P) + rect(x, y + 1, 2, 1, C.R);
      else if (umore === 'felice' && !faccia) bocca = rect(x - 1, y, 1, 1, C.P) + rect(x, y + 1, 2, 1, C.P) + rect(x + 2, y, 1, 1, C.P);
      else if (umore === 'affamato') bocca = rect(x, y, 2, 2, C.P);
      else if (umore === 'dorme') bocca = rect(x - 1, y, 1, 1, C.P) + rect(x, y + 1, 1, 1, C.P) + rect(x + 1, y, 1, 1, C.P) + rect(x + 2, y + 1, 1, 1, C.P);
      else if (umore === 'errore') bocca = rect(x - 1, y + 1, 1, 1, C.P) + rect(x, y, 1, 1, C.P) + rect(x + 1, y + 1, 1, 1, C.P) + rect(x + 2, y, 1, 1, C.P);
      else if (umore === 'triste') bocca = rect(x - 1, y + 1, 1, 1, C.P) + rect(x, y, 2, 1, C.P) + rect(x + 2, y + 1, 1, 1, C.P);
      else if (umore === 'sbadiglio') bocca = rect(x - 1, y - 1, 4, 4, C.P) + rect(x, y + 1, 2, 1, C.R);
      else if (umore === 'mangia') bocca = rect(x - 1, y - 1, 4, 3, C.P) + rect(x, y, 2, 1, C.R);
      else if (faccia === 'stelle') bocca = rect(x - 1, y, 4, 1, C.P) + rect(x, y + 1, 2, 1, C.R);
      else bocca = rect(x, y, 2, 1, C.P);
    }
    const guance = sp.guance && (umore === 'felice' || umore === 'euforico' || umore === 'neutro' || umore === 'mangia')
      ? sp.guance.map(([x, y]) => rect(x, y, 2, 1, C.R)).join('') : '';
    // --- accessori dell'armadio (viso, collo, occhi, testa) e oggetti delle reazioni
    let vestiti = '';
    for (const slot of ['collo', 'viso', 'occhi', 'testa']) if (acc[slot] && !(slot === 'occhi' && (opz.occhiali || opz.mani === 'occhi')))
      vestiti += `<g class="pet-acc acc-${acc[slot]}">${accessorio(acc[slot], sp, g, C, rect)}<\/g>`;
    let reazione = '';
    if (opz.occhiali) reazione += `<g class="pet-occhiali">${accessorio('thug', sp, g, C, rect)}<\/g>`;
    if (opz.mani === 'occhi') reazione += `<g class="pet-mani-occhi">${sp.occhi.map(([x, y]) =>
      rect(x - 2, y - 2, 5, 5, C.O) + rect(x - 1, y - 1, 3, 3, C.L) + rect(x - 1, y - 2, 1, 1, C.L) + rect(x + 1, y - 2, 1, 1, C.L)).join('')}<\/g>`;
    if (opz.mani === 'applauso') {
      const y = Math.min(20, sp.pancia[1]);
      reazione += [['sx', 0], ['dx', 21]].map(([l, x]) => `<g class="pet-mano ${l}">${rect(x, y - 1, 3, 4, C.O)}${rect(x + (l === 'sx' ? 0 : 1), y, 2, 2, C.L)}<\/g>`).join('');
    }
    // --- decorazioni animate degli umori
    let extra = '';
    const [tx, ty] = sp.testa;
    if (umore === 'dorme') extra = [0, 1, 2].map(i => `<text class="pet-zzz" style="animation-delay:${i}s" x="${tx}" y="${ty + 4}" fill="${C.L}">z<\/text>`).join('');
    if (umore === 'affamato') { const [bx, by] = sp.pancia, o = '#ff9f1a';
      extra = `<g class="pet-grr">${rect(bx, by, 1, 1, o)}${rect(bx + 1, by - 1, 1, 1, o)}${rect(bx + 2, by, 1, 1, o)}${rect(bx, by + 2, 1, 1, o)}${rect(bx + 1, by + 1, 1, 1, o)}${rect(bx + 2, by + 2, 1, 1, o)}<\/g>`; }
    if (umore === 'euforico') extra = [[1, 4], [21, 6], [3, 18], [20, 19]].map(([x, y], i) =>
      `<g class="pet-scintilla" style="animation-delay:${i * .35}s">${rect(x, y - 1, 1, 3, C.G)}${rect(x - 1, y, 3, 1, C.G)}<\/g>`).join('');
    const alone = ALONE[umore] === 'B' || !ALONE[umore] ? C.B : ALONE[umore];
    const lato = opz.lato || 96;
    return `<svg class="pet-svg stadio-${indice} umore-${umore} ${opz.classe || ''}" viewBox="-3 -4 30 30" width="${lato}" height="${lato}"
      shape-rendering="crispEdges" style="--alone:${alone}" role="img" aria-label="${STADI[indice]?.nome || 'Bit'}, ${UMORI[umore] || umore}">
      <g class="pet-tutto"><g class="pet-corpo">${corpo}<g class="pet-guance">${guance}<\/g><g class="pet-bocca">${bocca}<\/g>
      <g class="pet-occhi ${aperti ? 'aperti' : ''}">${occhi}<\/g>${vestiti}${reazione}<\/g><\/g>${extra}<\/svg>`;
  }
  /* posizione della bocca in percentuale del riquadro (per le particelle di XP che vengono mangiate) */
  function puntoBocca(indice) {
    const sp = SPRITE[Math.max(0, Math.min(SPRITE.length - 1, indice))];
    const [x, y] = sp.bocca || [sp.occhi[0][0] + 3, sp.occhi[0][1] + 3];
    return [(x + 1 + 3) / 30, (y + .5 + 4) / 30];
  }

  /* ------------------------------------------------------------ Armadio: cosmetici sbloccati dai traguardi */
  const ACCESSORI = [
    { id: 'thug', slot: 'occhi', nome: 'Occhiali Thug Life', descr: 'Deal with it.', req: 'serie7' },
    { id: 'monocolo', slot: 'occhi', nome: 'Monocolo Senior Dev', descr: 'Per giudicare il codice altrui con eleganza.',

    { id: 'baffetto', slot: 'viso', nome: 'Baffetto alla Oscar', descr: 'Per commentare con teatralità.', req: 'oratore' },
  ];
  const FACCE = [
    { id: 'normale', nome: 'Normale', ascii: 'o_o', descr: 'Lo sguardo di sempre.' },
    { id: 'gioia', nome: 'Gioia', ascii: '^_^', descr: 'Sorride anche a un warning.', req: 'primo' },
    { id: 'sornione', nome: 'Sornione', ascii: '¬_¬', descr: 'Ha capito il trucco della domanda.', req: 'spazzino' },
    { id: 'giudice', nome: 'Giudice', ascii: 'ಠ_ಠ', descr: 'Disapprova i delete dimenticati.', req: 'perfetto' },
    { id: 'stelle', nome: 'Stelle', ascii: '*_*', descr: 'Occhi a stella per il codice elegante.', req: 'tris' },
  ];
  const SCELTE_VUOTE = { palette: 'app', faccia: 'normale', occhi: null, testa: null, collo: null, viso: null };
  function contesto(st, prog, imp) {
    let perfetti = 0;
    for (const s of Object.values(prog?.quiz || {})) if ((s.g || 0) >= 1 && !(s.s || 0)) perfetti++;
    return { st, perfetti, brani: (imp?.brani_ascoltati || []).length };
  }
  function valuta(voce, c) {
    if (voce.cond) return { ok: !!voce.cond(c), req: voce.testo, prog: voce.prog?.(c) || null };
    if (!voce.req) return { ok: true, req: '', prog: null };
    const t = (c.st?.traguardi || []).find(x => x.id === voce.req);
    return { ok: !!t?.ok, req: t ? `Traguardo «${t.nome}»: ${t.descr.replace(/\.$/, '')}` : 'Traguardo', prog: t?.prog || null };
  }
  /* catalogo completo con lo stato di ogni voce */
  function armadio(st, prog, imp) {
    const c = contesto(st, prog, imp);
    const voci = (lista, tipo) => lista.map(v => ({ ...v, tipo, ...valuta(v, c) }));
    const tutto = { palette: voci(PALETTE, 'palette'), accessori: voci(ACCESSORI, 'accessori'), facce: voci(FACCE, 'facce') };
    tutto.scelte = scelteValide(imp?.armadio, tutto);
    tutto.sbloccati = [...tutto.palette, ...tutto.accessori, ...tutto.facce].filter(v => v.ok && (v.req || v.cond)).map(v => v.id);
    tutto.totale = [...tutto.palette, ...tutto.accessori, ...tutto.facce].filter(v => v.req || v.cond).length;
    return tutto;
  }
  /* le scelte salvate, tenendo solo ciò che è davvero sbloccato */
  function scelteValide(salvate, tutto) {
    const s = { ...SCELTE_VUOTE, ...(salvate || {}) }, ok = (l, id) => l.some(v => v.id === id && v.ok);
    if (!ok(tutto.palette, s.palette)) s.palette = 'app';
    if (!ok(tutto.facce, s.faccia)) s.faccia = 'normale';
    for (const slot of ['occhi', 'testa', 'collo', 'viso']) if (s[slot] && !tutto.accessori.some(v => v.id === s[slot] && v.slot === slot && v.ok)) s[slot] = null;
    return s;
  }
  /* opzioni per svgPet con quello che Bit indossa (da unire a { colore }) */
  function vestito(st, prog, imp) {
    const s = armadio(st, prog, imp).scelte;
    return { palette: s.palette, faccia: s.faccia, accessori: { occhi: s.occhi, testa: s.testa, collo: s.collo, viso: s.viso } };
  }

  /* ------------------------------------------------------------ la finestra dell'Armadio */
  const ICONE = {   // icone 8×8 in pixel art
    orologio: ['..####..', '.#....#.', '#...#..#', '#...#..#', '#...###.', '#......#', '.#....#.', '..####..'],
    stomaco: ['........', '.##..##.', '#..##..#', '#......#', '.#.##.#.', '..#..#..', '...##...', '........'],
    lucchetto: ['..####..', '.#....#.', '.#....#.', '########', '###..###', '###..###', '########', '########'],
    stampella: ['...##...', '..#..#..', '.....#..', '....#...', '...#....', '.######.', '#......#', '########'],
  };
  function iconaPixel(nome, lato = 16, classe = 'cmp-icona') {
    const r = ICONE[nome]; if (!r) return '';
    let s = '';
    r.forEach((riga, y) => [...riga].forEach((c, x) => { if (c === '#') s += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }));
    return `<svg class="${classe}" viewBox="0 0 8 8" width="${lato}" height="${lato}" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${s}<\/svg>`;
  }
  const escHTML = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* apriArmadio({ stato, prog, imp, nome, colore, salva(scelte), chiuso() }) */
  function apriArmadio(o) {
    document.querySelector('.armadio-velo')?.remove();
    const st = o.stato, indice = indiceStadio(st.livello);
    let scheda = 'palette', scelte = armadio(st, o.prog, o.imp).scelte;
    const velo = document.createElement('div');
    velo.className = 'armadio-velo';
    velo.setAttribute('role', 'dialog'); velo.setAttribute('aria-modal', 'true'); velo.setAttribute('aria-label', `Armadio di ${o.nome}`);
    document.body.appendChild(velo);
    const svg = (sc, lato, umore = 'neutro', classe = '') => svgPet(indice, umore, { colore: o.colore, palette: sc.palette, faccia: sc.faccia,
      accessori: { occhi: sc.occhi, testa: sc.testa, collo: sc.collo, viso: sc.viso }, lato, classe });
    const indossa = (sc, v) => {
      const n = { ...sc };
      if (v.tipo === 'palette') n.palette = v.id;
      else if (v.tipo === 'facce') n.faccia = v.id;
      else n[v.slot] = sc[v.slot] === v.id ? null : v.id;
      return n;
    };
    const indossato = (sc, v) => v.tipo === 'palette' ? sc.palette === v.id : v.tipo === 'facce' ? sc.faccia === v.id : sc[v.slot] === v.id;
    const disegna = () => {
      const t = armadio(st, o.prog, { ...o.imp, armadio: scelte });
      const voci = t[scheda];
      const addosso = [PALETTE.find(p => p.id === scelte.palette)?.nome, FACCE.find(f => f.id === scelte.faccia)?.ascii,
        ...['testa', 'occhi', 'viso', 'collo'].map(s => ACCESSORI.find(a => a.id === scelte[s])?.nome)].filter(Boolean);
      velo.innerHTML = `<div class="armadio">
        <header class="arm-testa">
          <div><div class="arm-sopra">${iconaPixel('stampella', 14, 'arm-ic')} Armadio<\/div><h2>L'armadio di ${escHTML(o.nome)}<\/h2><\/div>
          <span class="arm-conta">${t.sbloccati.length}/${t.totale} sbloccati<\/span>
          <button class="arm-chiudi" data-arm="chiudi" aria-label="Chiudi">×<\/button>
        <\/header>
        <div class="arm-corpo">
          <div class="arm-anteprima">
            <div class="arm-palco">${svg(scelte, 168)}<\/div>
            <div class="arm-addosso">${addosso.map(x => `<span>${escHTML(x)}<\/span>`).join('')}<\/div>
            <button class="arm-btn" data-arm="spoglia">Togli tutto<\/button>
          <\/div>
          <div class="arm-scaffali">
            <div class="arm-schede" role="tablist">${[['palette', 'Palette'], ['accessori', 'Accessori'], ['facce', 'Espressioni']].map(([k, n]) =>
              `<button role="tab" aria-selected="${k === scheda}" class="${k === scheda ? 'attiva' : ''}" data-arm="scheda" data-k="${k}">${n}<\/button>`).join('')}<\/div>
            ${scheda === 'facce' ? '<p class="arm-nota">L\'espressione si vede quando Bit è neutro o felice: nelle reazioni prevale la sua faccia del momento.<\/p>' : ''}
            <div class="arm-griglia">${voci.map(v => {
              const su = indossato(scelte, v);
              const prova = indossa({ ...SCELTE_VUOTE, palette: scelte.palette }, v);   // anteprima: solo questa voce
              return `<button class="arm-voce ${v.ok ? 'ok' : 'chiuso'} ${su ? 'su' : ''}" data-arm="voce" data-id="${v.id}" aria-pressed="${su}"
                ${v.ok ? '' : `aria-disabled="true"`} title="${escHTML(v.ok ? v.descr : v.req)}">
                <span class="arm-mini">${svg(prova, 64)}${v.ok ? '' : iconaPixel('lucchetto', 18, 'arm-lucchetto')}<\/span>
                <b>${escHTML(v.nome)}${v.ascii ? ` <code>${escHTML(v.ascii)}<\/code>` : ''}<\/b>
                <small>${v.ok ? (su ? (v.tipo === 'accessori' ? 'Indossato · tocca per togliere' : 'In uso') : escHTML(v.descr)) : escHTML(v.req)}<\/small>
                ${!v.ok && v.prog ? `<i class="arm-barra"><i style="width:${Math.round(100 * v.prog[0] / Math.max(1, v.prog[1]))}%"><\/i><\/i>` : ''}
              <\/button>`;
            }).join('')}<\/div>
          <\/div>
        <\/div>
      <\/div>`;
    };
    const chiudi = () => { velo.remove(); removeEventListener('keydown', tasto, true); o.chiuso?.(); };
    const tasto = ev => { if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); chiudi(); } };
    addEventListener('keydown', tasto, true);
    velo.addEventListener('click', ev => {
      if (ev.target === velo) return chiudi();
      const b = ev.target.closest('[data-arm]'); if (!b) return;
      const a = b.dataset.arm;
      if (a === 'chiudi') return chiudi();
      if (a === 'scheda') { scheda = b.dataset.k; return disegna(); }
      if (a === 'spoglia') { scelte = { ...SCELTE_VUOTE }; o.salva(scelte); return disegna(); }
      if (a === 'voce') {
        const v = armadio(st, o.prog, o.imp)[scheda].find(x => x.id === b.dataset.id);
        if (!v) return;
        if (!v.ok) { b.classList.remove('nego'); void b.offsetWidth; b.classList.add('nego'); return; }
        scelte = indossa(scelte, v); o.salva(scelte); disegna();
        velo.querySelector('.arm-palco .pet-svg')?.classList.add('salta');
      }
    });
    disegna();
    velo.querySelector('.arm-chiudi')?.focus();
  }

  /* new Compagno({ stato, vestito, contesto, attivo, visibile, lato, classe, suono, osserva })
       stato()    -> Gioco.pet(...)      vestito() -> { colore, palette, faccia, accessori }
       contesto() -> 'quiz' | 'codice' | 'orale' | 'oggi' | 'bit'
     Bit NON si trascina: si ancora da solo al primo elemento .bit-posto visibile
     (data-posto = nome, data-layout = riga | riga-inv | colonna, data-lato = px, data-sguardo = su | giu | sx | dx).
     Se non ce n'è, sta nella postazione base in basso a destra. */
  class Compagno {
    constructor(o) {
      this.o = o; this.serie = 0; this.dorme = false; this.affamato = false; this.temp = null; this.evento = null;
      this.ultima = Date.now(); this.qChiave = null; this.qInizio = 0; this.posto = null; this.chiavePosto = null; this.entrato = 0;
      const el = this.el = document.createElement('div');
      el.className = 'compagno base ' + (o.classe || '');
      el.innerHTML = `<div class="cmp-fumetto" hidden><span class="cmp-icona-box"><\/span><span class="cmp-testo"><\/span><\/div>
        <button class="cmp-pet" type="button"><span class="cmp-aura"><\/span><span class="cmp-corpo"><span class="cmp-voce"><\/span><\/span><span class="cmp-effetti" aria-hidden="true"><\/span><\/button>`;
      document.body.appendChild(el);
      this.fumetto = el.querySelector('.cmp-fumetto'); this.testo = el.querySelector('.cmp-testo');
      this.voce = el.querySelector('.cmp-voce'); this.effetti = el.querySelector('.cmp-effetti');
      el.querySelector('.cmp-pet').addEventListener('click', () => this.reagisci('clic'));

      if (l) this.dice(scegli(l).replace('{m}', dati.m || 'questo modulo'));

      if (!this.attivo()) return;
      if (tipo === 'giusta' || tipo === 'prevediOk') {

      clearTimeout(this.tFine);
      this.temp = tipo === 'dorme' ? null : { umore: r.umore, occhiali: r.occhiali, mani: r.mani };
      if (tipo === 'dorme') this.dorme = true;
      if (tipo === 'fame') this.affamato = true;

      if (this.el.hidden) return;
      this.anima(r.anim, r.durata);
      if (r.part) this.particelle(r.part);

      this.dice(frase, r.icona || (tipo === 'esitazione' ? scegli(['orologio', 'stomaco']) : ''));

    }

    particelle(tipo) {
      const n = { fumo: 9, scintille: 10, coriandoli: 22, 'xp-in': 10 }[tipo] || 12;
      const [bx, by] = puntoBocca(this.pet.indice);
      const colori = ['#ffd447', '#ff4fd8', '#00e5ff', '#33ff99', '#ff7a45', '#ffffff'];
      for (let i = 0; i < n; i++) {
        const p = document.createElement('i');
        p.className = 'cmp-p ' + tipo;
        let ang = (i / n) * Math.PI * 2 + Math.random() * .5, dist = 34 + Math.random() * 26;
        if (tipo === 'fumo') { ang = -Math.PI / 2 + (Math.random() - .5) * 1.1; dist = 40 + Math.random() * 26; }
        if (tipo === 'coriandoli') { ang = -Math.PI / 2 + (Math.random() - .5) * 2.4; dist = 50 + Math.random() * 50;
          p.style.background = scegli(colori); p.style.setProperty('--cade', 40 + Math.random() * 60 + 'px'); p.style.setProperty('--giro', (Math.random() * 720 - 360) + 'deg'); }
        if (tipo === 'xp-in') { p.style.left = bx * 100 + '%'; p.style.top = by * 100 + '%'; dist = 46 + Math.random() * 30; }

    }

    /* fumetto con effetto macchina da scrivere; Bit molleggia e muove la bocca mentre «parla».
       Ancorato il fumetto resta (commenta in continuazione); nella postazione base sparisce dopo qualche secondo. */
    dice(frase, icona) {

      this.ultimaFrase = Date.now(); this.fraseIntera = frase;
      const f = this.fumetto, el = this.el;
      f.querySelector('.cmp-icona-box').innerHTML = icona ? iconaPixel(icona) : '';
      f.hidden = false; f.classList.remove('via'); f.classList.add('scrive'); el.classList.add('parla');
      this.testo.textContent = '';

      this.tScrivi = setInterval(() => {
        i += frase[i] === ' ' ? 2 : 1;
        this.testo.textContent = frase.slice(0, i);
        el.classList.toggle('bocca', i < frase.length && (i >> 1) % 2 === 0);
        if (i >= frase.length) { clearInterval(this.tScrivi); f.classList.remove('scrive'); el.classList.remove('parla', 'bocca'); }

    }
    zitto() {
      clearInterval(this.tScrivi); clearTimeout(this.tZitto);

      f.classList.add('via');
      setTimeout(() => { if (f.classList.contains('via')) { f.hidden = true; f.classList.remove('via'); } }, 220);
    }

    /* tempi morti: dopo 2 minuti fermi ha fame, dopo 6 si addormenta; il primo gesto lo sveglia */
    attivita() {
      this.ultima = Date.now();
      if (this.dorme && this.attivo()) { this.dorme = false; this.affamato = false; this.reagisci('sveglia'); }
      else if (this.affamato) { this.affamato = false; this.disegna(); }
    }
    controllaInattivita() {
      if (!this.attivo() || document.hidden) return;
      const fermo = Date.now() - this.ultima;
      if (!this.dorme && fermo > 360000) this.reagisci('dorme');
      else if (!this.dorme && !this.affamato && fermo > 120000) this.reagisci('fame');

  Object.assign(G, {
    STADI, UMORI, CONSIGLI, BATTUTE, pet, umoreBase, svgPet, puntoBocca, Compagno,
    PALETTE, ACCESSORI, FACCE, armadio, vestito, apriArmadio, iconaPixel,
  });
})();

   • YouTube: lettore ufficiale (IFrame API) ridotto a una miniatura:

      this.ferma();

    }
    ferma() { clearInterval(this.timer); this.timer = null; this.fruscio(false); }
    programma() {
      const B = this.brano, sed = 60 / B.bpm / 4;

        if (s % 4 === 2) this.colpo(t, { f: 9000, q: 1, dur: .05, vol: .03, tipo: 'highpass', riv: 0 });
        if (s === 14 && battuta % 4 === 3) this.voce({ note: [caso(B.scala)], t, dur: sed * 6, tipo: 'square', scordo: 5, vol: .025, att: .05, ril: .8, f0: 2500, riv: .5, eco: .5 });
      } else {   // ambient
        if (inizioAcc) {
          this.voce({ note: acc, t, dur: durAcc + 1.5, tipo: 'sawtooth', scordo: 10, vol: .02, att: 2.2, ril: 2.6, f0: 900, f1: 600, riv: .8 });
          this.voce({ note: [basso], t, dur: durAcc + .5, tipo: 'sine', scordo: 0, vol: .12, att: 1.5, ril: 1.5, f0: 400, riv: .2 });
        }
        if (s % 3 === 0 && Math.random() < .28) this.voce({ note: [caso(B.scala)], t, dur: 2.4, tipo: 'sine', scordo: 0, vol: .04, att: .005, ril: 2.2, f0: 5000, riv: .7, eco: .5 });
        if (s === 8 && Math.random() < .4) this.colpo(t, { f: 600, q: .4, dur: 2.5, vol: .02, tipo: 'lowpass', riv: .6 });
      }
    }
  }

  /* ================================================================ link -> identificativi */
  function uriSpotify(link) {
    link = String(link || '').trim();
    if (/^spotify:(playlist|album|track|artist|show|episode):\w+$/.test(link)) return link;
    const m = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(?:embed\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/.exec(link);
    return m ? `spotify:${m[1]}:${m[2]}` : null;
  }
  function idYouTube(link) {
    link = String(link || '').trim();
    const lista = /[?&]list=([A-Za-z0-9_-]+)/.exec(link);
    const video = /(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/.exec(link);
    if (!lista && !video) return null;
    return { lista: lista ? lista[1] : null, video: video ? video[1] : null };
  }
  /* indirizzo di YouTube Music per la finestra: con una playlist parte dal primo brano da solo */
  function urlYouTubeMusic(link) {
    const id = idYouTube(link);
    if (!id) return null;
    const p = new URLSearchParams();
    if (id.video) p.set('v', id.video);
    if (id.lista) p.set('list', id.lista);
    return 'https://music.youtube.com/watch?' + p.toString();
  }
  const carica = {};
  function script(src) {
    return carica[src] || (carica[src] = new Promise((ok, no) => {
      const s = document.createElement('script'); s.src = src; s.async = true; s.onerror = () => { delete carica[src]; no(new Error('rete')); };
      document.head.appendChild(s); setTimeout(() => ok(), 0);
    }));
  }

  /* ================================================================ il lettore */
  const SORGENTI = [['colonna', 'Colonna sonora'], ['spotify', 'Spotify'], ['youtube', 'YouTube'], ['nessuna', 'Silenzio']];
  const ESC = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  class Lettore {
    /* opz: { imp: () => impostazioni, salva: parz => void, dock: elemento, mini: [elementi],
              accediSpotify: () => void (solo PC), avviso: testo => void } */
    constructor(opz) {
      this.o = opz; this.ctx = null; this.motore = null; this.suona = false;
      this.spotify = null; this.spotifyPausa = true; this.yt = null; this.ytPronto = false;
      this.costruisciDock();
      this.aggiorna();
    }
    get imp() { return this.o.imp(); }
    get sorgente() { return this.imp.musica_sorgente || 'colonna'; }
    get muto() { return !!this.imp.musica_muto; }
    get volume() { return this.imp.musica_volume ?? 60; }
    /* PC: YouTube suona nella finestra di YouTube Music (predefinito), non nel lettore incorporato */
    get ytFinestra() { return !!this.o.youtubeFinestra && this.imp.youtube_modo !== 'incorporato'; }
    seguiFinestra() {
      if (this.tFinestra) return;
      const giro = async () => {
        let st = { aperta: false };
        try { st = await this.o.youtubeFinestra.stato(); } catch (e) { /* ignorato */ }
        this.ytAperta = !!st.aperta;
        if (!st.aperta) { clearInterval(this.tFinestra); this.tFinestra = null; }
        if (st.consenso && !this.avvisatoConsenso) { this.avvisatoConsenso = true; this.o.avviso?.('Nella finestra di YouTube accetta i cookie (solo la prima volta)'); }
        if (this.sorgente !== 'youtube' || !this.ytFinestra) return;
        const suona = !!st.aperta && !st.pausa && !!st.video;
        const titolo = st.titolo ? st.titolo + (st.autore ? ' · ' + st.autore : '') : (st.pubblicita ? 'YouTube Music · pubblicità' : '');
        if (suona !== this.suona || titolo !== this.ytTitolo) { this.suona = suona; this.ytTitolo = titolo; this.aggiorna(); }
      };
      this.tFinestra = setInterval(giro, 2000); giro();
    }
    salva(p) { this.o.salva(p); }
    segnaAscolto(chiave) {
      const visti = this.imp.brani_ascoltati || [];
      if (!visti.includes(chiave)) this.salva({ brani_ascoltati: [...visti, chiave] });
    }

    /* ---------------- audio di base (colonna + effetti) */
    audio() {
      if (this.ctx) return this.ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
      this.analisi = this.ctx.createAnalyser(); this.analisi.fftSize = 64;
      this.master.connect(comp).connect(this.analisi).connect(this.ctx.destination);
      this.livelloColonna = this.ctx.createGain(); this.livelloColonna.connect(this.master);
      this.motore = new MotoreColonna(this.ctx, this.livelloColonna);
      // ogni brano della colonna sonora ascoltato viene segnato (sblocca le cuffie di Bit nell'armadio)
      const avvia = this.motore.avvia.bind(this.motore);
      this.motore.avvia = i => { avvia(i); this.segnaAscolto('colonna-' + i); };
      this.applicaVolume();
      return this.ctx;
    }
    applicaVolume() {
      if (this.master) this.master.gain.setTargetAtTime(this.muto ? 0 : this.volume / 100 * .9, this.ctx.currentTime, .05);
      if (this.yt && this.ytPronto) { try { this.yt.setVolume(this.volume); this.muto ? this.yt.mute() : this.yt.unMute(); } catch (e) { /* non pronto */ } }
    }
    /* suoni brevi del gioco: XP, livello, traguardo (rispettano il muto) */
    effetto(tipo) {
      if (this.muto || this.imp.effetti === false) return;
      const c = this.audio(); if (!c) return;
      if (c.state !== 'running') c.resume().catch(() => {});
      const t = c.currentTime + .02, g = c.createGain(); g.connect(c.destination);
      const vol = Math.max(.05, this.volume / 100) * .22;
      const note = { xp: ['A5', 'E6'], livello: ['D5', 'F5', 'A5', 'D6', 'F6', 'A6'], traguardo: ['A5', 'C6', 'E6', 'A6'], missione: ['E5', 'A5', 'C#6'],
        errore: ['D#3', 'C3'], combo: ['C6', 'E6', 'G6', 'C7'] }[tipo] || ['A5'];
      const passo = tipo === 'xp' ? .06 : .09;
      note.forEach((n, i) => {
        const o = c.createOscillator(), e = c.createGain(); o.type = tipo === 'xp' ? 'triangle' : 'square';
        o.frequency.value = hz(n); e.gain.setValueAtTime(0, t + i * passo);
        e.gain.linearRampToValueAtTime(vol * (tipo === 'xp' ? .8 : .5), t + i * passo + .01);
        e.gain.exponentialRampToValueAtTime(.001, t + i * passo + (i === note.length - 1 ? .7 : .25));
        o.connect(e).connect(g); o.start(t + i * passo); o.stop(t + i * passo + .8);
      });
    }

    /* ---------------- comandi */
    async play() {
      const s = this.sorgente;
      if (s === 'nessuna') return;
      this.suona = true;
      if (s === 'colonna') {
        const c = this.audio(); if (!c) return;
        try { await c.resume(); } catch (e) { /* bloccato finché non si tocca la pagina */ }
        if (!this.motore.timer || this.motore.indice !== (this.imp.musica_traccia || 0)) this.motore.avvia(this.imp.musica_traccia || 0);
      } else if (s === 'spotify') {
        await this.preparaSpotify();
        try {
          if (!this.spotify) return;
          if (!this.spotifyAvviato) { this.spotify.play(); this.spotifyAvviato = true; } else this.spotify.resume();
          this.segnaAscolto('spotify');
        } catch (e) { /* ignorato */ }
      } else if (s === 'youtube' && this.ytFinestra) {
        const url = urlYouTubeMusic(this.linkYouTube());
        if (!url) return this.preparaYouTube();
        const st = await this.o.youtubeFinestra.stato();
        if (!st.aperta || this.ytUrl !== url) { this.ytUrl = url; await this.o.youtubeFinestra.apri(url); }
        else await this.o.youtubeFinestra.comando('play');
        this.segnaAscolto('youtube'); this.seguiFinestra();
      } else if (s === 'youtube') {
        await this.preparaYouTube();
        try { this.yt?.playVideo(); this.segnaAscolto('youtube'); } catch (e) { /* ignorato */ }
      }
      this.aggiorna();
    }
    pausa() {
      this.suona = false;
      this.motore?.ferma();
      try { this.spotify && !this.spotifyPausa && this.spotify.pause(); } catch (e) { /* ignorato */ }
      try { this.yt && this.ytPronto && this.yt.pauseVideo(); } catch (e) { /* ignorato */ }
      if (this.o.youtubeFinestra && this.ytAperta) this.o.youtubeFinestra.comando('pausa');
      this.aggiorna();
    }
    alterna() { (this.suona ? this.pausa() : this.play()); }
    alternaMuto() {
      this.salva({ musica_muto: !this.muto });
      this.applicaVolume();
      if (this.o.youtubeFinestra && this.ytAperta) this.o.youtubeFinestra.comando(this.muto ? 'muto' : 'audio');
      if (this.sorgente === 'spotify' && this.spotify) {   // Spotify non ha il volume: muto = pausa
        try {
          if (this.muto) { this.pausaPerMuto = !this.spotifyPausa; this.spotify.pause(); }
          else if (this.pausaPerMuto) { this.pausaPerMuto = false; this.spotify.resume(); }
        } catch (e) { /* ignorato */ }
      }
      this.aggiorna();
    }
    successivo() {
      if (this.sorgente === 'colonna') { this.salva({ musica_traccia: ((this.imp.musica_traccia || 0) + 1) % BRANI.length }); if (this.suona) this.motore.avvia(this.imp.musica_traccia); this.aggiorna(); }
      else if (this.sorgente === 'youtube' && this.ytFinestra) this.o.youtubeFinestra.comando('succ');
      else if (this.sorgente === 'youtube') { try { this.yt?.nextVideo(); } catch (e) { /* ignorato */ } }
    }
    precedente() {
      if (this.sorgente === 'colonna') { this.salva({ musica_traccia: ((this.imp.musica_traccia || 0) + BRANI.length - 1) % BRANI.length }); if (this.suona) this.motore.avvia(this.imp.musica_traccia); this.aggiorna(); }
      else if (this.sorgente === 'youtube' && this.ytFinestra) this.o.youtubeFinestra.comando('prec');
      else if (this.sorgente === 'youtube') { try { this.yt?.previousVideo(); } catch (e) { /* ignorato */ } }
    }
    cambiaSorgente(s) {
      const suonava = this.suona;
      this.pausa();
      this.salva({ musica_sorgente: s });
      this.disegnaCorpo();
      if (s === 'spotify') this.preparaSpotify();
      if (s === 'youtube') this.preparaYouTube();
      if (suonava && s === 'colonna') this.play();
      this.aggiorna();
    }

    /* ---------------- Spotify */
    linkSpotify() { return this.imp.spotify_link || window.CONFIG?.spotifyPlaylist || ''; }
    async preparaSpotify(forza) {
      const uri = uriSpotify(this.linkSpotify());
      const box = this.dock.querySelector('.md-spotify');
      if (!uri) { box.querySelector('.md-embed').innerHTML = '<div class="md-vuoto">Incolla qui sopra il link di una playlist di Spotify.<\/div>'; return; }
      if (this.spotify && !forza) { if (this.spotifyUri !== uri) { this.spotify.loadUri(uri); this.spotifyUri = uri; this.spotifyAvviato = false; } return; }
      try {
        const api = await new Promise((ok, no) => {
          if (window.__spotifyApi) return ok(window.__spotifyApi);
          window.onSpotifyIframeApiReady = a => { window.__spotifyApi = a; ok(a); };
          script('https://open.spotify.com/embed/iframe-api/v1').catch(no);
          setTimeout(() => no(new Error('tempo')), 15000);
        });
        if (this.spotify) { try { this.spotify.destroy(); } catch (e) { /* ignorato */ } }
        const posto = document.createElement('div');
        box.querySelector('.md-embed').replaceChildren(posto);
        await new Promise(ok => api.createController(posto, { uri, width: '100%', height: 152, theme: 'dark' }, ctrl => {
          this.spotify = ctrl; this.spotifyUri = uri; this.spotifyAvviato = false;
          ctrl.addListener('playback_update', e => {
            // arriva più volte al secondo (posizione del brano): si ridisegna solo se cambia play/pausa
            const pausa = !!e.data?.isPaused, prima = this.suona;
            this.spotifyPausa = pausa;
            if (this.sorgente === 'spotify' && prima !== !pausa) { this.suona = !pausa; this.aggiorna(); }
          });
          ok();
        }));
      } catch (e) {
        box.querySelector('.md-embed').innerHTML = '<div class="md-vuoto">Spotify non risponde: serve la connessione a Internet.<\/div>';
      }
    }

    /* ---------------- YouTube */
    linkYouTube() { return this.imp.youtube_link || window.CONFIG?.youtubePlaylist || ''; }
    async preparaYouTube(forza) {
      const id = idYouTube(this.linkYouTube());
      const box = this.dock.querySelector('.md-youtube .md-embed');
      if (!id) { box.innerHTML = '<div class="md-vuoto">Incolla qui sopra il link di una playlist (o di un video) di YouTube.<\/div>'; return; }
      if (this.ytFinestra) {
        if (this.yt) { try { this.yt.destroy(); } catch (e) { /* ignorato */ } this.yt = null; this.ytChiave = null; this.ytPronto = false; }
        box.innerHTML = `<div class="md-finestra"><b>YouTube Music in una finestra a parte<\/b>
          Si sentono tutti i brani, anche quelli che non si possono incorporare in altre app. Premi play: la finestra si apre
          e quando parte la musica si riduce a icona da sola (la prima volta accetta i cookie di YouTube).
          <button class="md-btn" data-md="yt-mostra">Mostra la finestra<\/button><\/div>`;
        return;
      }
      const chiave = (id.lista || '') + '|' + (id.video || '');
      if (this.yt && this.ytChiave === chiave && !forza) return;
      try {
        await new Promise((ok, no) => {
          if (window.YT && window.YT.Player) return ok();
          const prima = window.onYouTubeIframeAPIReady;
          window.onYouTubeIframeAPIReady = () => { prima?.(); ok(); };
          script('https://www.youtube.com/iframe_api').catch(no);
          setTimeout(() => no(new Error('tempo')), 15000);
        });
        if (this.yt) { try { this.yt.destroy(); } catch (e) { /* ignorato */ } }
        this.ytPronto = false; this.ytChiave = chiave;
        const posto = document.createElement('div');
        box.replaceChildren(posto);
        const vars = { playsinline: 1, rel: 0, modestbranding: 1, controls: 1, origin: location.origin, widget_referrer: location.href };
        if (id.lista) { vars.listType = 'playlist'; vars.list = id.lista; } else { vars.loop = 1; vars.playlist = id.video; }
        // con una playlist la chiave videoId NON deve esserci: l'API di YouTube rifiuta
        // videoId: undefined con «Invalid video id» (era la causa di «YouTube non risponde»)
        const base = { width: 192, height: 108, playerVars: vars };
        if (!id.lista) base.videoId = id.video;
        this.yt = new YT.Player(posto, {
          ...base,
          events: {
            onReady: () => { this.ytPronto = true; this.ytErrori = 0; this.applicaVolume(); if (this.suona && this.sorgente === 'youtube') this.yt.playVideo(); },
            onStateChange: e => { if (this.sorgente !== 'youtube') return; if (e.data === 1) { this.suona = true; this.ytErrori = 0; } if (e.data === 2) this.suona = false; this.aggiorna(); },
            onError: e => {
              // 101/150: il proprietario (spesso l'etichetta discografica) vieta la riproduzione fuori da YouTube
              const vietato = e.data === 150 || e.data === 101 || e.data >= 152;
              const lunghezza = (() => { try { return (this.yt.getPlaylist() || []).length; } catch (x) { return 0; } })();
              this.ytErrori = (this.ytErrori || 0) + 1;
              if (this.ytErrori >= Math.max(1, Math.min(lunghezza || 1, 15))) {   // basta saltare: nessun video si può suonare
                this.suona = false; this.aggiorna();
                this.o.avviso?.(vietato ? 'I video di questa playlist non si possono riprodurre fuori da YouTube (lo decide chi li ha pubblicati). Prova un\'altra playlist.' : 'YouTube: video non disponibili');
                return;
              }
              this.o.avviso?.(vietato ? 'Questo video non si può riprodurre fuori da YouTube: salto al successivo' : 'YouTube: video non disponibile');
              try { this.yt.nextVideo(); } catch (x) { /* ignorato */ }
            },
          },
        });
      } catch (e) {
        const rete = e && /^(rete|tempo)$/.test(e.message);
        box.innerHTML = rete ? '<div class="md-vuoto">YouTube non risponde: controlla la connessione a Internet.<\/div>'
          : `<div class="md-vuoto">Il lettore di YouTube non è partito (${ESC(e && e.message)}). Prova un altro link.<\/div>`;
      }
    }

    /* ---------------- interfaccia */
    costruisciDock() {
      const d = this.dock = this.o.dock;
      d.classList.add('musica-dock');
      d.innerHTML = `
        <div class="md-testa"><span class="md-titolo">MUSICA<\/span><span class="md-spazio"><\/span>
          <button class="md-chiudi" data-md="chiudi" title="Chiudi (la musica continua)">×<\/button><\/div>
        <div class="md-sorgenti">${SORGENTI.map(([k, t]) => `<button data-md="sorgente" data-s="${k}">${t}<\/button>`).join('')}<\/div>
        <div class="md-corpo">
          <div class="md-pannello md-colonna"><\/div>
          <div class="md-pannello md-spotify">
            <div class="md-riga"><input class="md-campo" data-md-campo="spotify" placeholder="Link di una playlist Spotify" spellcheck="false">
              <button class="md-btn" data-md="usa-spotify">Usa<\/button><\/div>
            <div class="md-embed"><\/div>
            <div class="md-nota">Per i brani interi accedi a Spotify ${this.o.accediSpotify ? 'con il pulsante qui sotto' : 'dal lettore (Accedi)'}: senza accesso Spotify fa sentire 30 secondi per brano.
              ${this.o.accediSpotify ? '<br><button class="md-btn" data-md="accedi-spotify">Accedi a Spotify<\/button>' : ''}
              <button class="md-link" data-md="predefinita-spotify">Torna alla playlist predefinita<\/button><\/div>
          <\/div>
          <div class="md-pannello md-youtube">
            <div class="md-riga"><input class="md-campo" data-md-campo="youtube" placeholder="Link di una playlist YouTube" spellcheck="false">
              <button class="md-btn" data-md="usa-youtube">Usa<\/button><\/div>
            ${this.o.youtubeFinestra ? `<div class="md-riga md-yt-modo"><span>Lettore<\/span>
              <button class="md-btn" data-md="yt-modo" data-v="finestra">Finestra di YouTube<\/button>
              <button class="md-btn" data-md="yt-modo" data-v="incorporato">Dentro l'app<\/button><\/div>` : ''}
            <div class="md-yt-riga"><div class="md-embed"><\/div>
              <div class="md-nota">La playlist suona in sottofondo anche con questo pannello chiuso.
                <button class="md-link" data-md="predefinita-youtube">Torna alla playlist predefinita<\/button><\/div><\/div>
          <\/div>
          <div class="md-pannello md-nessuna"><div class="md-vuoto">Silenzio. A volte è la colonna sonora migliore.<\/div><\/div>
        <\/div>
        <div class="md-controlli">
          <button class="md-tasto" data-md="prec" title="Precedente">|&lt;<\/button>
          <button class="md-tasto grande" data-md="play" title="Riproduci / pausa"><\/button>
          <button class="md-tasto" data-md="succ" title="Successivo">&gt;|<\/button>
          <button class="md-tasto" data-md="muto" title="Muto"><\/button>
          <input type="range" min="0" max="100" class="md-volume" data-md-vol title="Volume">
        <\/div>`;
      d.addEventListener('click', ev => {
        const b = ev.target.closest('[data-md]'); if (!b) return;
        const a = b.dataset.md;
        if (a === 'chiudi') this.chiudi();
        else if (a === 'sorgente') this.cambiaSorgente(b.dataset.s);
        else if (a === 'play') this.alterna();
        else if (a === 'muto') this.alternaMuto();
        else if (a === 'succ') this.successivo();
        else if (a === 'prec') this.precedente();
        else if (a === 'brano') { this.salva({ musica_traccia: +b.dataset.i }); this.play(); this.disegnaCorpo(); }
        else if (a === 'usa-spotify') this.usaLink('spotify');
        else if (a === 'usa-youtube') this.usaLink('youtube');
        else if (a === 'predefinita-spotify') { this.salva({ spotify_link: '' }); this.disegnaCorpo(); this.preparaSpotify(); }
        else if (a === 'predefinita-youtube') { this.salva({ youtube_link: '' }); this.disegnaCorpo(); this.preparaYouTube(true); }
        else if (a === 'accedi-spotify') this.o.accediSpotify?.();
        else if (a === 'yt-mostra') this.o.youtubeFinestra?.mostra();
        else if (a === 'yt-modo') { this.pausa(); this.salva({ youtube_modo: b.dataset.v }); this.disegnaCorpo(); this.preparaYouTube(true); }
      });
      d.querySelector('[data-md-vol]').addEventListener('input', ev => {
        this.salva({ musica_volume: +ev.target.value, musica_muto: false }); this.applicaVolume(); this.aggiorna();
      });
      d.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.dataset.mdCampo) this.usaLink(ev.target.dataset.mdCampo); ev.stopPropagation(); });
      this.disegnaCorpo();
      setInterval(() => this.disegnaOnde(), 140);
    }
    usaLink(tipo) {
      const v = this.dock.querySelector(`[data-md-campo="${tipo}"]`).value.trim();
      const ok = tipo === 'spotify' ? uriSpotify(v) : idYouTube(v);
      if (!ok) return this.o.avviso?.(tipo === 'spotify' ? 'Link di Spotify non riconosciuto (Condividi → Copia link)' : 'Link di YouTube non riconosciuto');
      this.salva({ [tipo + '_link']: v });
      if (this.sorgente !== tipo) this.cambiaSorgente(tipo);
      tipo === 'spotify' ? this.preparaSpotify() : this.preparaYouTube(true);
      this.o.avviso?.('Playlist impostata: premi play');
    }

const KW = new Set(('auto bool break case catch char class const const_cast continue default delete do double dynamic_cast else enum explicit false float for friend if inline int long namespace new nullptr operator override private protected public return short signed sizeof static static_cast struct switch template this throw true try typedef typeid typename unsigned using virtual void while').split(' '));

function cpp(src) {
  let out = '', ult = 0, m; RE_CPP.lastIndex = 0;
  while ((m = RE_CPP.exec(src))) {
    if (!m[0]) { RE_CPP.lastIndex++; continue; }
    out += esc(src.slice(ult, m.index));

    out += c ? '<span class="' + c + '">' + esc(t) + '</span>' : esc(t);
    ult = RE_CPP.lastIndex;

}

let STATO = null, traguardiVisti = null, armadioPrima = new Set();
function G() { return STATO || (STATO = Gioco.calcola(P, CAT, { obiettivo: IMP.obiettivo_xp || 300 })); }
function aggiornaGioco() {
  const prima = STATO; STATO = null; const dopo = G();
  if (!traguardiVisti) { traguardiVisti = new Set(IMP.traguardi_visti || dopo.traguardi.filter(t => t.ok).map(t => t.id)); armadioPrima = new Set(Gioco.armadio(dopo, P, IMP).sbloccati); }
  BIT?.aggiorna();
  if (!prima) return;
  const xp = dopo.xp - prima.xp;
  if (xp > 0) { xpVolante(xp); LETTORE?.effetto('xp'); setTimeout(saltaPet, 30); }
  const mp = prima.missioni.filter(m => m.fatto).length, md = dopo.missioni.filter(m => m.fatto).length;
  if (md > mp) { setTimeout(() => avviso(md === 3 ? 'Tutte le missioni completate! +100 XP' : 'Missione completata: +40 XP'), 300); LETTORE?.effetto('missione');
    if (md === 3) setTimeout(() => BIT?.reagisci('missioni'), 1600); }
  const arm = Gioco.armadio(dopo, P, IMP), nuoviArm = arm.sbloccati.filter(id => !armadioPrima.has(id));
  if (nuoviArm.length) setTimeout(() => avviso('Nuovo nell\'armadio: ' + [...arm.palette, ...arm.accessori, ...arm.facce].filter(v => nuoviArm.includes(v.id)).map(v => v.nome).join(', ')), 2200);
  armadioPrima = new Set(arm.sbloccati);
  const nuovi = dopo.traguardi.filter(t => t.ok && !traguardiVisti.has(t.id));
  if (nuovi.length) { nuovi.forEach(t => traguardiVisti.add(t.id)); salvaImp({ traguardi_visti: [...traguardiVisti] });
    setTimeout(() => { avviso('Traguardo: ' + nuovi.map(t => t.nome).join(', ')); LETTORE?.effetto('traguardo'); }, 1200); }
  if (dopo.livello > prima.livello) setTimeout(() => livelloNuovo(dopo, prima), 600);
}

  'quiz-nuovo': () => { Q.fase = 'scelta'; disegna(); },
  'orale-mostra': () => { O.mostrata = true; vistaOrale(); setTimeout(() => BIT?.parla('risposta'), 60); }, 'orale-salta': () => prossimaOrale(),
  'orale-voto': d => votaOrale(+d.v),
  'cod-modo': d => { C.modo = d.m; vistaCodice(); },
  'prev-mostra': () => { C.mostrato = true; vistaCodice(); $$('pre.uscita').at(-1)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  'prev-salta': () => prossimoPrevedi(),
  'prev-voto': d => { const s = P.prevedi[C.corrente.id] || (P.prevedi[C.corrente.id] = { n: 0 }); s.ok = d.v === '1'; s.n = (s.n || 0) + 1; s.data = oggiISO(); if (s.ok) Gioco.registra(P, 'p');
    BIT?.reagisci(s.ok ? 'prevediOk' : 'prevediNo'); salva(); prossimoPrevedi(); },
  'es-apri': d => { C.aperto = d.id; C.solAperta = false; vistaCodice(); window.scrollTo(0, 0); },
  'es-chiudi': () => { C.aperto = null; vistaCodice(); },
  'es-fatto': () => { const s = P.esercizi[C.aperto] || (P.esercizi[C.aperto] = {}); s.fatto = !s.fatto; s.data = oggiISO();
    if (s.fatto && !s.contato) { s.contato = true; Gioco.registra(P, 'e'); } salva(); vistaEsercizio(); },
  'copia': () => {
    const t = $('#codice-out'), testo = t.value;
    const ripiego = () => { t.focus(); t.select(); avviso('Codice selezionato: copialo dal menu'); };
    try { navigator.clipboard.writeText(testo).then(() => avviso('Codice copiato'), ripiego); } catch (e) { ripiego(); }
  },
  'importa': () => {
    try {
      const { prog: remoto, profilo } = leggiCodice($('#codice-in').value);
      P = unisci(P, remoto);
      // il profilo del PC riempie solo i campi ancora vuoti sul telefono
      for (const [k, v] of Object.entries(profilo)) {
        if (!CAMPI_PROFILO.includes(k) || !v) continue;
        if (k === 'data_esame') { if (!P.data_esame) P.data_esame = v; } else if (!IMP[k]) salvaImp({ [k]: v });
      }
      if (!IMP.configurato) salvaImp({ configurato: true });
      applicaColore(); salva(); avviso('Progressi uniti'); apriFoglio();
    }
    catch (e) { avviso(e.message && e.message.length < 60 ? e.message : 'Codice non valido: ricopialo per intero'); }
  },
  'azzera': () => { $('#zona-azzera').innerHTML = '<div class="secondario piccolo">Quiz, orale, esercizi e simulazioni ripartono da zero. Confermi?</div><div class="conferma"><button class="btn pieno" data-a="azzera-no">Annulla</button><button class="btn pieno" style="background:var(--rosso);color:#fff" data-a="azzera-si">Azzera</button></div>'; },
  'azzera-no': () => apriFoglio(),
  'azzera-si': () => { const d = P.data_esame; P = VUOTO(); P.data_esame = d; STATO = null; salva(); chiudiFoglio(); avviso('Progressi azzerati'); },
  'colore': d => { salvaImp({ accento: d.c }); applicaColore(); $$('.colori').forEach(c => { c.innerHTML = coloriHTML(); }); collegaColori(); },
  'obiettivo': (d, b) => { salvaImp({ obiettivo_xp: +d.n }); STATO = null; $$('[data-a="obiettivo"]').forEach(x => x.classList.toggle('attivo', x === b)); },
  'compagno': (d, b) => { salvaImp({ compagno: d.v === 'true' }); $$('[data-a="compagno"]').forEach(x => x.classList.toggle('attivo', x === b)); BIT?.aggiorna(); },
  'armadio': () => { $('#foglio-box').innerHTML = ''; apriArmadio(); },
  'effetti': (d, b) => { salvaImp({ effetti: d.v === 'true' }); $$('[data-a="effetti"]').forEach(x => x.classList.toggle('attivo', x === b)); },
  'musica-apri': () => { $('#foglio-box').innerHTML = ''; LETTORE.apri(); },
  'installa': async () => { if (!installa) return; installa.prompt(); try { await installa.userChoice; } catch (e) { /* annullato */ } installa = null; apriFoglio(); },
  'benvenuto-ok': () => {
    salvaImp({ nome: $('#bv-nome').value.trim(), professore: $('#bv-prof').value.trim(), nome_pet: $('#bv-pet').value.trim(), configurato: true });
    if ($('#bv-data').value) P.data_esame = $('#bv-data').value;
    salva(); $('#foglio-box').innerHTML = ''; disegna();
  },
  'benvenuto-sync': () => { salvaImp({ configurato: true }); apriFoglio(); setTimeout(() => $('#codice-in')?.scrollIntoView({ block: 'center' }), 100); },
};
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-a]'); if (!t || t.disabled) return;
  const f = AZ[t.dataset.a]; if (f) f(t.dataset, t, ev);
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.c === 'orale-filtro') { O.filtro = ev.target.value; O.corrente = null; prossimaOrale(); }
});
document.addEventListener('keydown', ev => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  if (vista === 'quiz' && Q.fase === 'sessione') {
    const k = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[ev.key.toLowerCase()];
    if (k !== undefined) return scegli(k);
    if (ev.key === 'Enter') return successiva();
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (SCHEDE.some(s => s[0] === h) && h !== vista && !(vista === 'quiz' && Q.fase === 'sessione')) { vista = h; disegna(); } });

/* ================================================================ AVVIO */
applicaColore();
const LETTORE = new Musica.Lettore({ imp: () => IMP, salva: p => salvaImp(p), dock: $('#musica-dock'), avviso: t => avviso(t),
  mini: () => $$('#musica-mini-bit') });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') LETTORE.chiudi(); });
var BIT = new Gioco.Compagno({
  stato: () => Gioco.pet(G(), nomePet()), vestito: vestitoBit, contesto: () => vista,
  attivo: () => IMP.compagno !== false && !!IMP.configurato,
  visibile: () => vista !== 'bit' && !(vista === 'quiz' && Q.fase === 'sessione' && Q.esame && !Q.finito),
  lato: 58, classe: 'telefono', osserva: $('#vista'), suono: t => LETTORE?.effetto(t),
});
const iniziale = location.hash.slice(1);
if (SCHEDE.some(s => s[0] === iniziale)) vista = iniziale;
G(); aggiornaGioco();
disegna();
collegaCloud();
if (!IMP.configurato) benvenuto();
if ('serviceWorker' in navigator && window.PWA && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
