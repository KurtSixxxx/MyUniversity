&amp; dest, double x)<\/code>: preleva da questo conto e deposita su <code>dest<\/code>. Va rifiutato se manca il saldo o se <code>dest<\/code> è lo stesso conto (confronta gli indirizzi: <code>&amp;dest == this<\/code>). La <code>&amp;<\/code> nel parametro serve a modificare il conto originale e non una copia (Modulo 3).<\/p>","soluzione":{"commento":"","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 1.9 - Bonifico tra conti (oggetti che si mandano messaggi)\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass ContoBancario {\nprivate:\n    string intestatario;\n    double saldo;\n\npublic:\n    ContoBancario(string nome, double s) {\n        intestatario = nome;\n        saldo = (s >= 0) ? s : 0;\n    }\n    bool deposita(double x) {\n        if (x <= 0) return false;\n        saldo += x;\n        return true;\n    }\n    bool preleva(double x) {\n        if (x <= 0 || x > saldo) return false;\n        saldo -= x;\n        return true;\n    }\n    // Un conto manda messaggi a UN ALTRO conto.\n    // 'dest' è passato per reference (&): così modifichiamo l'originale, non una copia.\n    bool bonifico(ContoBancario& dest, double x) {\n        if (&dest == this) return false;      // bonifico a se stessi: vietato\n        if (!preleva(x)) return false;        // prima tolgo da me...\n        dest.deposita(x);                     // ...poi do all'altro\n        return true;\n    }\n    void stampa() const {\n        cout << \"  \" << intestatario << \": \" << saldo << \" euro\" << endl;\n    }\n};\n\nint main() {\n    ContoBancario a(\"Anna\", 500), b(\"Bruno\", 100);\n    cout << \"Bonifico 200 da Anna a Bruno: \" << (a.bonifico(b, 200) ? \"ok\" : \"rifiutato\") << endl;\n    cout << \"Bonifico 1000 da Bruno ad Anna: \" << (b.bonifico(a, 1000) ? \"ok\" : \"rifiutato\") << endl;\n    cout << \"Bonifico 50 da Anna ad Anna: \" << (a.bonifico(a, 50) ? \"ok\" : \"rifiutato\") << endl;\n    a.stampa();\n    b.stampa();\n    return 0;\n}\n"}],"input":null,"output":"Bonifico 200 da Anna a Bruno: ok\nBonifico 1000 da Bruno ad Anna: rifiutato\nBonifico 50 da Anna ad Anna: rifiutato\n  Anna: 300 euro\n  Bruno: 300 euro\n"}},{"id":"m01-e10","modulo":1,"tipo":"es","numero":10,"titolo":"Frazione sempre semplificata","difficolta":"difficile","testo":"<p>Classe <code>Frazione<\/code> con numeratore e denominatore. <b>Invariante<\/b>: il denominatore è sempre positivo e la frazione è sempre ridotta ai minimi termini (usa l'MCD con l'algoritmo di Euclide, in un metodo privato). Denominatore 0 → la frazione diventa 0/1. Metodi <code>somma(Frazione)<\/code> e <code>prodotto(Frazione)<\/code> che restituiscono una <b>nuova<\/b> frazione, più <code>valore()<\/code> e <code>stampa()<\/code>.<\/p>","soluzione":{"commento":"<p><code>mcd<\/code> è <code>static<\/code>: non usa gli attributi di un oggetto, è una funzione di servizio della classe. <code>somma<\/code> e <code>prodotto<\/code> creano la nuova frazione con il costruttore, che la semplifica da solo: l'invariante è garantita in un unico punto.<\/p>","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 1.10 - Frazione sempre semplificata (invariante di classe)\n#include <iostream>\nusing namespace std;\n\nclass Frazione {\nprivate:\n    int num, den;        // INVARIANTE: den > 0 e frazione ridotta ai minimi termini\n\n    static int mcd(int a, int b) {        // algoritmo di Euclide\n        if (a < 0) a = -a;\n        while (b != 0) { int r = a % b; a = b; b = r; }\n        return a;\n    }\n    void semplifica() {                   // privato: lo chiamano solo i metodi della classe\n        if (den < 0) { num = -num; den = -den; }   // il segno sta sempre al numeratore\n        int m = mcd(num, den);\n        if (m > 1) { num /= m; den /= m; }\n    }\n\npublic:\n    Frazione(int n, int d) {\n        if (d == 0) { n = 0; d = 1; }     // denominatore nullo: diventa 0/1\n        num = n; den = d;\n        semplifica();\n    }\n    Frazione somma(Frazione altra) const {          // restituisce un NUOVO oggetto\n        return Frazione(num * altra.den + altra.num * den, den * altra.den);\n    }\n    Frazione prodotto(Frazione altra) const {\n        return Frazione(num * altra.num, den * altra.den);\n    }\n    double valore() const { return (double)num / den; }\n    void stampa() const {\n        cout << num;\n        if (den != 1) cout << \"/\" << den;\n    }\n};\n\nint main() {\n    Frazione a(2, 4), b(1, -3), c(5, 0);\n    cout << \"a = \"; a.stampa(); cout << endl;            // 1/2\n    cout << \"b = \"; b.stampa(); cout << endl;            // -1/3\n    cout << \"c = \"; c.stampa(); cout << endl;            // 0\n    cout << \"a + b = \"; a.somma(b).stampa(); cout << endl;\n    cout << \"a * b = \"; a.prodotto(b).stampa();\n    cout << \" = \" << a.prodotto(b).valore() << endl;\n    cout << \"a + a = \"; a.somma(a).stampa(); cout << endl;   // 1\n    return 0;\n}\n"}],"input":null,"output":"a = 1/2\nb = -1/3\nc = 0\na + b = 1/6\na * b = -1/6 = -0.166667\na + a = 1\n"}},{"id":"m02-pattern","modulo":2,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 2 (Introduzione al C++ ed Elementi Base).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 2 - Pattern: I/O sicuro, namespace, scoping, stringstream\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\n#include <string>\n#include <sstream>\n#include <limits>\nusing namespace std;\n\n// ---------- 1. NAMESPACE: un \"cognome\" per i nomi ----------\nnamespace geometria {\n    const double PI = 3.14159;\n    double area(double r) { return PI * r * r; }        // area del cerchio\n}\nnamespace finanza {\n    double area(double base, double altezza) {           // stesso nome, nessun conflitto\n        return base * altezza;\n    }\n}\n\n// ---------- 2. SCOPING: globale vs locale ----------\nint x = 100;                       // variabile GLOBALE\n\nvoid demoScope() {\n    int x = 5;                     // LOCALE: nasconde (shadowing) la globale\n    cout << \"x locale = \" << x << \", x globale = \" << ::x << endl;   // :: = scope globale\n    {\n        int x = 7;                 // blocco interno: nasconde quella locale\n        cout << \"x nel blocco = \" << x << endl;\n    }                              // qui la x=7 \"muore\"\n    cout << \"x locale di nuovo = \" << x << endl;\n}\n\n// ---------- 3. LETTURA SICURA DI UN INTERO ----------\nint leggiIntero(string messaggio) {\n    int valore;\n    while (true) {\n        cout << messaggio;\n        cin >> valore;\n        if (cin.fail()) {                                   // l'utente ha scritto \"ciao\"\n            cerr << \"Errore: inserisci un numero intero!\" << endl;\n            cin.clear();                                    // 1) spengo la spia d'errore\n            cin.ignore(numeric_limits<streamsize>::max(), '\\n');   // 2) butto la riga sbagliata\n        } else {\n            cin.ignore(numeric_limits<streamsize>::max(), '\\n');   // tolgo il '\\n' rimasto\n            return valore;\n        }\n    }\n}\n\nint main() {\n    cout << \"Area cerchio r=2: \" << geometria::area(2) << endl;\n    cout << \"Area rettangolo 3x4: \" << finanza::area(3, 4) << endl;\n\n    demoScope();\n\n    int eta = leggiIntero(\"Quanti anni hai? \");\n\n    string nomeCompleto;\n    cout << \"Nome e cognome: \";\n    getline(cin, nomeCompleto);                 // legge anche gli spazi\n    cout << \"Ciao \" << nomeCompleto << \", hai \" << eta << \" anni\" << endl;\n\n    // ---------- 4. STRINGSTREAM: \"spezzare\" una stringa ----------\n    string riga = \"Mario 22 1.80\";\n    stringstream ss(riga);\n    string nome; int anni; double altezza;\n    ss >> nome >> anni >> altezza;              // come cin, ma legge dalla stringa\n    cout << nome << \" | \" << anni << \" | \" << altezza << endl;\n\n    // e al contrario: costruire una stringa con <<\n    stringstream out;\n    out << \"Utente-\" << anni;\n    string codice = out.str();\n    cout << \"Codice generato: \" << codice << endl;\n    return 0;\n}\n"}],"input":"abc\n22\nMario Rossi\n","output":"Area cerchio r=2: 12.5664\nArea rettangolo 3x4: 12\nx locale = 5, x globale = 100\nx nel blocco = 7\nx locale di nuovo = 5\nQuanti anni hai? Errore: inserisci un numero intero!\nQuanti anni hai? Nome e cognome: Ciao Mario Rossi, hai 22 anni\nMario | 22 | 1.8\nCodice generato: Utente-22\n"}},{"id":"m02-lab","modulo":2,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Registro dei voti<\/b><\/p><p>Un docente vuole inserire da tastiera i voti di un appello, una riga per studente nel formato <code>cognome voto<\/code>, e ottenere un riepilogo. Non si può usare la STL: i dati vanno in array statici.<\/p><p><b>Step 1 – lettura sicura di un intero<\/b><br>Scrivi <code>int leggiIntero(string messaggio, int min, int max)<\/code>, che stampa il messaggio e legge un intero, ripetendo la richiesta finché l'utente non inserisce un numero valido compreso tra <code>min<\/code> e <code>max<\/code>. Gli errori vanno stampati su <code>cerr<\/code>. Usala per chiedere quanti studenti al massimo inserire (da 1 a 100).<br><b>Concetto nuovo:<\/b> <code>cin.fail<\/code>, <code>clear<\/code>, <code>ignore<\/code>, <code>cerr<\/code>.<\/p><p><b>Step 2 – un namespace per il registro<\/b><br>Sposta le costanti (<code>MAX = 100<\/code>, <code>VOTO_MIN = 18<\/code>, <code>VOTO_MAX = 30<\/code>) e tutte le funzioni in un <code>namespace registro<\/code>. Nel <code>main<\/code> usa <code>using namespace registro;<\/code>.<br><b>Concetto nuovo:<\/b> namespace, operatore <code>::<\/code>, <code>using<\/code>.<\/p><p><b>Step 3 – analizzare una riga<\/b><br>Scrivi <code>bool analizzaRiga(string riga, string&amp; cognome, int&amp; voto)<\/code> che, usando uno <code>stringstream<\/code>, accetta una riga solo se contiene <b>esattamente<\/b> un cognome e un voto intero tra 18 e 30. Nel <code>main<\/code> leggi le righe con <code>getline<\/code> fino a <code>fine<\/code> (o alla capienza), salta le righe vuote e segnala su <code>cerr<\/code> quelle non valide.<br><b>Concetto nuovo:<\/b> <code>getline<\/code>, <code>stringstream<\/code> in lettura, parametri <code>&amp;<\/code> per restituire più valori.<\/p><p><b>Step 4 – statistiche<\/b><br>Memorizza cognomi e voti in due array paralleli. Scrivi <code>double media(const int voti[], int n)<\/code> (attenzione alla divisione intera) e stampa l'elenco, la media e lo studente con il voto più alto.<br><b>Concetto nuovo:<\/b> array paralleli, cast a <code>double<\/code>.<\/p><p><b>Step 5 – codici ed estrazione casuale<\/b><br>Scrivi <code>string codice(int numero)<\/code>, che con uno <code>stringstream<\/code> costruisce codici a tre cifre del tipo <code>STU-007<\/code>, e usali nell'elenco. Infine chiedi un seme con <code>leggiIntero<\/code>, chiama <code>srand<\/code> e estrai <b>due studenti diversi<\/b> da interrogare.<br><b>Concetto nuovo:<\/b> <code>stringstream<\/code> in scrittura, <code>srand<\/code>/<code>rand<\/code>.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 2 - Laboratorio a step: registro dei voti\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <string>\n#include <sstream>\n#include <limits>\n#include <cstdlib>\nusing namespace std;\n\n// ===== STEP 2 =====  Tutto ciò che riguarda il registro sta in un namespace\nnamespace registro {\n    const int MAX = 100;\n    const int VOTO_MIN = 18;\n    const int VOTO_MAX = 30;\n\n    // ===== STEP 1 =====  Lettura sicura di un intero in un intervallo\n    int leggiIntero(string messaggio, int min, int max) {\n        int x;\n        while (true) {\n            cout << messaggio;\n            cin >> x;\n            if (cin.fail()) {                                         // non è un numero\n                cerr << \"  errore: serve un numero intero\" << endl;\n                cin.clear();                                          // 1. spengo la spia\n                cin.ignore(numeric_limits<streamsize>::max(), '\\n');  // 2. butto la riga\n            } else {\n                cin.ignore(numeric_limits<streamsize>::max(), '\\n');  // tolgo il '\\n'\n                if (x >= min && x <= max) return x;\n                cerr << \"  errore: deve essere tra \" << min << \" e \" << max << endl;\n            }\n        }\n    }\n\n    // ===== STEP 3 =====  Una riga \"cognome voto\" è valida solo se è esattamente così\n    bool analizzaRiga(string riga, string& cognome, int& voto) {\n        stringstream ss(riga);\n        if (!(ss >> cognome >> voto)) return false;   // manca qualcosa o il voto non è un numero\n        string avanzo;\n        if (ss >> avanzo) return false;               // c'è roba in più\n        return voto >= VOTO_MIN && voto <= VOTO_MAX;\n    }\n\n    // ===== STEP 4 =====  Statistiche\n    double media(const int voti[], int n) {\n        if (n == 0) return 0;\n        int somma = 0;\n        for (int i = 0; i < n; i++) somma += voti[i];\n        return (double)somma / n;                     // cast: niente divisione intera\n    }\n\n    // ===== STEP 5 =====  Codice studente costruito con uno stringstream: STU-007\n    string codice(int numero) {\n        stringstream out;\n        out << \"STU-\";\n        if (numero < 100) out << \"0\";\n        if (numero < 10) out << \"0\";\n        out << numero;\n        return out.str();\n    }\n}\n\nint main() {\n    using namespace registro;     // da qui posso scrivere MAX invece di registro::MAX\n\n    // STEP 1\n    int capienza = leggiIntero(\"Quanti studenti al massimo (1-100)? \", 1, MAX);\n\n    // STEP 3 e 4: lettura delle righe\n    string cognomi[MAX];\n    int voti[MAX];\n    int n = 0, scartate = 0;\n    string riga;\n    cout << \"Inserisci 'cognome voto' (fine per terminare):\" << endl;\n    while (n < capienza && getline(cin, riga)) {\n        if (riga == \"fine\") break;\n        if (riga.empty()) continue;\n        string c; int v;\n        if (analizzaRiga(riga, c, v)) {\n            cognomi[n] = c;\n            voti[n] = v;\n            n++;\n        } else {\n            cerr << \"  riga scartata: \\\"\" << riga << \"\\\"\" << endl;\n            scartate++;\n        }\n    }\n\n    cout << \"\\nRegistrati \" << n << \" studenti (scartate \" << scartate << \" righe)\" << endl;\n    if (n == 0) return 0;\n    int iMax = 0;\n    for (int i = 0; i < n; i++) {\n        cout << \"  \" << codice(i + 1) << \"  \" << cognomi[i] << \"  \" << voti[i] << endl;\n        if (voti[i] > voti[iMax]) iMax = i;\n    }\n    cout << \"Media: \" << media(voti, n) << endl;\n    cout << \"Migliore: \" << cognomi[iMax] << endl;\n\n    // STEP 5: estrazione casuale di due interrogati\n    int seme = leggiIntero(\"Seme per l'estrazione: \", 0, 1000000);\n    srand(seme);                                   // UNA sola volta\n    int primo = rand() % n;                        // indice tra 0 e n-1\n    int secondo = primo;\n    while (n > 1 && secondo == primo)              // il secondo deve essere diverso\n        secondo = rand() % n;\n    cout << \"Interrogati: \" << codice(primo + 1) << \" \" << cognomi[primo];\n    if (n > 1) cout << \" e \" << codice(secondo + 1) << \" \" << cognomi[secondo];\n    cout << endl;\n    return 0;\n}\n"}],"input":"tanti\n500\n5\nRossi 28\nBianchi trenta\n\nVerdi 31\nNeri 18\nGialli 25 extra\nBlu 30\nfine\n42\n","output":"Quanti studenti al massimo (1-100)?   errore: serve un numero intero\nQuanti studenti al massimo (1-100)?   errore: deve essere tra 1 e 100\nQuanti studenti al massimo (1-100)? Inserisci 'cognome voto' (fine per terminare):\n  riga scartata: \"Bianchi trenta\"\n  riga scartata: \"Verdi 31\"\n  riga scartata: \"Gialli 25 extra\"\n\nRegistrati 3 studenti (scartate 3 righe)\n  STU-001  Rossi  28\n  STU-002  Neri  18\n  STU-003  Blu  30\nMedia: 25.3333\nMigliore: Blu\nSeme per l'estrazione: Interrogati: STU-002 Neri e STU-003 Blu\n"}},{"id":"m02-e01","modulo":2,"tipo":"es","numero":1,"titolo":"Saluto","difficolta":"facile","testo":"<p>Chiedi l'età con <code>cin &gt;&gt;<\/code> e poi nome e cognome con <code>getline<\/code>. Stampa <code>Ciao &lt;nome&gt;! Tra 10 anni avrai &lt;eta+10&gt; anni.<\/code> Prova prima <i>senza<\/i> <code>cin.ignore<\/code> e osserva cosa succede, poi correggi.<\/p>","soluzione":{"commento":"","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 2.1 - Saluto: getline dopo cin >>\n#include <iostream>\n#include <string>\n#include <limits>\nusing namespace std;\n\nint main() {\n    int eta;\n    string nome;\n\n    cout << \"Quanti anni hai? \";\n    cin >> eta;\n    // Senza questa riga il '\\n' rimasto nel buffer verrebbe letto dalla getline,\n    // che restituirebbe subito una stringa vuota.\n    cin.ignore(numeric_limits<streamsize>::max(), '\\n');\n\n    cout << \"Come ti chiami (nome e cognome)? \";\n    getline(cin, nome);\n\n    cout << \"Ciao \" << nome << \"! Tra 10 anni avrai \" << eta + 10 << \" anni.\" << endl;\n    return 0;\n}\n"}],"input":"20\nMario Rossi\n","output":"Quanti anni hai? Come ti chiami (nome e cognome)? Ciao Mario Rossi! Tra 10 anni avrai 30 anni.\n"}},{"id":"m02-e02","modulo":2,"tipo":"es","numero":2,"titolo":"Calcolatrice","difficolta":"facile","testo":"<p>Leggi ripetutamente espressioni del tipo <code>3 + 4<\/code> (un <code>double<\/code>, un <code>char<\/code>, un <code>double<\/code>) fino a fine input. Gestisci <code>+ - * /<\/code> con uno <code>switch<\/code>; la divisione per zero e gli operatori sconosciuti vanno segnalati su <code>cerr<\/code>.<\/p>","soluzione":{"commento":"<p><code>while (cin &gt;&gt; a &gt;&gt; op &gt;&gt; b)<\/code> si ferma da solo a fine input o al primo dato illeggibile.<\/p>","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 2.2 - Calcolatrice \"a op b\"\n#include <iostream>\nusing namespace std;\n\nint main() {\n    double a, b;\n    char op;\n    // cin >> legge un double, poi un char (saltando gli spazi), poi un double\n    while (cin >> a >> op >> b) {\n        switch (op) {\n            case '+': cout << a << \" + \" << b << \" = \" << a + b << endl; break;\n            case '-': cout << a << \" - \" << b << \" = \" << a - b << endl; break;\n            case '*': cout << a << \" * \" << b << \" = \" << a * b << endl; break;\n            case '/':\n                if (b == 0) cerr << \"Errore: divisione per zero\" << endl;\n                else cout << a << \" / \" << b << \" = \" << a / b << endl;\n                break;\n            default:\n                cerr << \"Operatore sconosciuto: \" << op << endl;\n        }\n    }\n    return 0;\n}\n"}],"input":"3 + 4\n10 / 4\n7 / 0\n2 x 5\n6 * 7\n","output":"3 + 4 = 7\n10 / 4 = 2.5\nErrore: divisione per zero\nOperatore sconosciuto: x\n6 * 7 = 42\n"}},{"id":"m02-e03","modulo":2,"tipo":"es","numero":3,"titolo":"Due lingue","difficolta":"facile","testo":"<p>Crea i namespace <code>italiano<\/code> e <code>inglese<\/code>, ognuno con una funzione <code>string saluta(string nome)<\/code> e una costante <code>LINGUA<\/code>. Chiamale con il nome completo, poi usa <code>using namespace inglese;<\/code> <b>dentro un blocco<\/b> <code>{ }<\/code> e verifica che fuori dal blocco non valga più.<\/p>","soluzione":{"commento":"","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 2.3 - Due namespace con funzioni dallo stesso nome\n#include <iostream>\n#include <string>\nusing namespace std;\n\nnamespace italiano {\n    string saluta(string nome) { return \"Ciao, \" + nome + \"!\"; }\n    const string LINGUA = \"italiano\";\n}\n\nnamespace inglese {\n    string saluta(string nome) { return \"Hello, \" + nome + \"!\"; }\n    const string LINGUA = \"inglese\";\n}\n\nint main() {\n    // Con il nome completo (cognome::nome) non c'è nessuna ambiguità\n    cout << italiano::LINGUA << \": \" << italiano::saluta(\"Mario\") << endl;\n    cout << inglese::LINGUA << \": \" << inglese::saluta(\"Mario\") << endl;\n\n    {\n        using namespace inglese;          // vale solo dentro questo blocco\n        cout << \"Nel blocco: \" << saluta(\"Anna\") << endl;\n    }\n    // Qui fuori \"saluta\" da sola non esiste più: bisogna di nuovo scrivere il namespace.\n    // Se facessi \"using namespace\" di ENTRAMBI, saluta(\"x\") sarebbe AMBIGUA: errore.\n    cout << \"Fuori: \" << italiano::saluta(\"Anna\") << endl;\n    return 0;\n}\n"}],"input":null,"output":"italiano: Ciao, Mario!\ninglese: Hello, Mario!\nNel blocco: Hello, Anna!\nFuori: Ciao, Anna!\n"}},{"id":"m02-e04","modulo":2,"tipo":"es","numero":4,"titolo":"Indovina l'output","difficolta":"facile","testo":"<p>Senza eseguirlo, scrivi su un foglio cosa stampa la soluzione <code>es04.cpp<\/code> (righe da A a F). Poi eseguilo e confronta. Per ogni riga sbagliata, ritrova la regola di scope che non avevi applicato.<\/p>","soluzione":{"commento":"<p>La riga A stampa 1 perché, nel momento in cui viene eseguita, la <code>x<\/code> locale non è ancora stata dichiarata: lo scope di una variabile inizia dal punto della sua dichiarazione.<\/p>","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 2.4 - Indovina l'output: scope e shadowing\n#include <iostream>\nusing namespace std;\n\nint x = 1;                          // globale\n\nvoid f() {\n    cout << \"A: \" << x << endl;     // nessuna x locale ancora: usa la globale -> 1\n    int x = 2;\n    cout << \"B: \" << x << endl;     // la locale -> 2\n    x++;                            // incrementa la LOCALE\n    ::x = 10;                       // modifica la GLOBALE\n}\n\nint main() {\n    f();\n    cout << \"C: \" << x << endl;     // la globale, modificata da f -> 10\n    for (int x = 0; x < 2; x++)     // la x del for nasconde la globale\n        cout << \"D: \" << x << endl; // 0 e poi 1\n    cout << \"E: \" << x << endl;     // finito il for, torna visibile la globale -> 10\n    {\n        int x = 5;\n        { cout << \"F: \" << x + ::x << endl; }   // 5 + 10 = 15\n    }\n    return 0;\n}\n"}],"input":null,"output":"A: 1\nB: 2\nC: 10\nD: 0\nD: 1\nE: 10\nF: 15\n"}},{"id":"m02-e05","modulo":2,"tipo":"es","numero":5,"titolo":"Lettura robusta","difficolta":"medio","testo":"<p>Scrivi una funzione che chiede un intero tra 1 e 10 e ripete finché non è valido, distinguendo “non è un numero” da “fuori intervallo”. Conta i tentativi. Se l'input finisce (<code>cin.eof()<\/code>), restituisci -1 invece di ciclare all'infinito.<\/p>","soluzione":{"commento":"","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 2.5 - Lettura robusta di un intero in [1, 10]\n#include <iostream>\n#include <limits>\nusing namespace std;\n\nint leggiTraUnoEDieci() {\n    int x;\n    int tentativi = 0;\n    while (true) {\n        tentativi++;\n        cout << \"Numero tra 1 e 10: \";\n        if (cin >> x) {                  // l'estrazione è riuscita?\n            cin.ignore(numeric_limits<streamsize>::max(), '\\n');\n            if (x >= 1 && x <= 10) {\n                cout << \"(valido dopo \" << tentativi << \" tentativi)\" << endl;\n                return x;\n            }\n            cout << \"fuori intervallo\" << endl;\n        } else {\n            if (cin.eof()) {             // finito l'input (es. Ctrl+Z): esco\n                cout << \"fine input\" << endl;\n                return -1;\n            }\n            cout << \"non e' un numero\" << endl;\n            cin.clear();\n            cin.ignore(numeric_limits<streamsize>::max(), '\\n');\n        }\n    }\n}\n\nint main() {\n    int n = leggiTraUnoEDieci();\n    cout << \"Hai scelto \" << n << endl;\n    return 0;\n}\n"}],"input":"ciao\n0\n15\n7\n","output":"Numero tra 1 e 10: non e' un numero\nNumero tra 1 e 10: fuori intervallo\nNumero tra 1 e 10: fuori intervallo\nNumero tra 1 e 10: (valido dopo 4 tentativi)\nHai scelto 7\n"}},{"id":"m02-e06","modulo":2,"tipo":"es","numero":6,"titolo":"Conta parole","difficolta":"medio","testo":"<p>Per ogni riga letta con <code>getline<\/code> fino a fine input, usa uno <code>stringstream<\/code> per contare le parole e trovare la più lunga. Una riga vuota o fatta di soli spazi ha 0 parole.<\/p>","soluzione":{"commento":"","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 2.6 - Conta le parole di una riga e trova la più lunga\n#include <iostream>\n#include <string>\n#include <sstream>\nusing namespace std;\n\nint main() {\n    string riga;\n    while (getline(cin, riga)) {                // una riga alla volta fino a fine input\n        stringstream ss(riga);\n        string parola, piuLunga;\n        int conta = 0;\n        while (ss >> parola) {                  // >> salta gli spazi: una parola alla volta\n            conta++;\n            if (parola.length() > piuLunga.length()) piuLunga = parola;\n        }\n        cout << conta << \" parole\";\n        if (conta > 0) cout << \", la piu' lunga e' \\\"\" << piuLunga << \"\\\"\";\n        cout << endl;\n    }\n    return 0;\n}\n"}],"input":"Il C++ e un linguaggio orientato agli oggetti\n\n   tre   parole   qui\n","output":"8 parole, la piu' lunga e' \"linguaggio\"\n0 parole\n3 parole, la piu' lunga e' \"parole\"\n"}},{"id":"m02-e07","modulo":2,"tipo":"es","numero":7,"titolo":"Somma dei soli numeri","difficolta":"medio","testo":"<p>Leggi una riga come <code>3 4.5 abc 2 12abc -1.5<\/code> e somma solo le parole che sono <i>interamente<\/i> numeri. <i>Suggerimento<\/i>: leggi parola per parola come <code>string<\/code>, poi prova a convertirla con un secondo <code>stringstream<\/code> e controlla che non avanzino caratteri.<\/p>","soluzione":{"commento":"<p>Se leggessi direttamente <code>double<\/code> dalla riga, al primo <code>abc<\/code> lo stream andrebbe in errore e si fermerebbe tutto. Leggendo <code>string<\/code> la lettura non fallisce mai: la conversione avviene a parte, su uno stream usa e getta.<\/p>","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 2.7 - Somma dei soli numeri validi in una riga\n#include <iostream>\n#include <string>\n#include <sstream>\nusing namespace std;\n\n// Prova a convertire una parola in double: true se TUTTA la parola è un numero\nbool comeNumero(string s, double& valore) {\n    stringstream ss(s);\n    if (!(ss >> valore)) return false;      // non inizia con un numero\n    char resto;\n    if (ss >> resto) return false;          // es. \"12abc\": avanzano caratteri\n    return true;\n}\n\nint main() {\n    string riga;\n    getline(cin, riga);\n    stringstream ss(riga);\n    string parola;\n    double somma = 0, v;\n    int scartate = 0;\n    while (ss >> parola) {                  // leggo PAROLE, non numeri: così non mi blocco\n        if (comeNumero(parola, v)) somma += v;\n        else {\n            cout << \"scarto \\\"\" << parola << \"\\\"\" << endl;\n            scartate++;\n        }\n    }\n    cout << \"Somma = \" << somma << \" (\" << scartate << \" parole scartate)\" << endl;\n    return 0;\n}\n"}],"input":"3 4.5 abc 2 12abc -1.5\n","output":"scarto \"abc\"\nscarto \"12abc\"\nSomma = 8 (2 parole scartate)\n"}},{"id":"m02-e08","modulo":2,"tipo":"es","numero":8,"titolo":"Istogramma del dado","difficolta":"medio","testo":"<p>Con <code>srand(111222333)<\/code> simula 6000 lanci di un dado, conta le uscite in un array e stampa per ogni faccia la frequenza e una barra di asterischi (uno ogni 50 lanci). Le frequenze dovrebbero essere tutte vicine a 1000.<\/p>","soluzione":{"commento":"","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 2.8 - Istogramma di 6000 lanci di un dado\n#include <iostream>\n#include <cstdlib>\nusing namespace std;\n\nint main() {\n    srand(111222333);                   // seme fisso: stessi risultati a ogni esecuzione\n    const int LANCI = 6000;\n    int frequenza[7] = {0};             // uso gli indici 1..6, lo 0 resta inutilizzato\n\n    for (int i = 0; i < LANCI; i++) {\n        int faccia = 1 + rand() % 6;    // intervallo [1, 6]\n        frequenza[faccia]++;\n    }\n\n    for (int f = 1; f <= 6; f++) {\n        cout << f << \": \" << frequenza[f] << \"\\t\";\n        for (int s = 0; s < frequenza[f] / 50; s++) cout << '*';   // un * ogni 50 lanci\n        cout << endl;\n    }\n    return 0;\n}\n"}],"input":null,"output":"1: 974  *******************\n2: 993  *******************\n3: 996  *******************\n4: 960  *******************\n5: 1030 ********************\n6: 1047 ********************\n"}},{"id":"m02-e09","modulo":2,"tipo":"es","numero":9,"titolo":"Compilazione separata","difficolta":"difficile","testo":"<p>Dividi in tre file un piccolo modulo di geometria: <code>geometria.h<\/code> (namespace <code>geometria<\/code> con la costante <code>PI<\/code> e i prototipi di <code>areaCerchio<\/code>, <code>perimetroCerchio<\/code>, <code>areaRettangolo<\/code>, protetto da include guard), <code>geometria.cpp<\/code> (i corpi) e <code>main.cpp<\/code>. Compila con <code>g++ main.cpp geometria.cpp -o es09.exe<\/code>. Poi prova a compilare solo <code>main.cpp<\/code> e leggi l'errore del linker; prova anche a togliere la guard e a includere l'header due volte.<\/p><p><b>Nota: esercizio su più file.<\/b> Qui nell'editor scrivi tutto in un unico file, nell'ordine: contenuto dell'header, definizioni, main. Per provare la compilazione separata vera crea i file in una cartella e compila da terminale con <code>g++ -Wall geometria.cpp main.cpp -o prog<\/code>.<\/p>","soluzione":{"commento":"<p>tre file nella cartella <code>codice/m02/es09/<\/code>.<\/p>","files":[{"nome":"es09/geometria.h","contenuto":"// Esercizio 2.9 - INTERFACCIA: solo dichiarazioni (prototipi e costanti)\n#ifndef GEOMETRIA_H          // include guard: se GEOMETRIA_H non è ancora definito...\n#define GEOMETRIA_H          // ...lo definisco e includo il contenuto. La seconda volta salto.\n\nnamespace geometria {\n    const double PI = 3.14159265;\n    double areaCerchio(double r);\n    double areaRettangolo(double b, double h);\n    double perimetroCerchio(double r);\n}\n\n#endif\n"},{"nome":"es09/geometria.cpp","contenuto":"// Esercizio 2.9 - IMPLEMENTAZIONE: i corpi delle funzioni\n#include \"geometria.h\"       // virgolette: cerca prima nella cartella del progetto\n\nnamespace geometria {\n    double areaCerchio(double r)              { return PI * r * r; }\n    double areaRettangolo(double b, double h) { return b * h; }\n    double perimetroCerchio(double r)         { return 2 * PI * r; }\n}\n"},{"nome":"es09/main.cpp","contenuto":"// Esercizio 2.9 - USO: il main conosce solo l'interfaccia\n// Compila TUTTI i .cpp insieme:  g++ main.cpp geometria.cpp -o es09.exe\n#include <iostream>\n#include \"geometria.h\"\n#include \"geometria.h\"       // incluso due volte apposta: grazie alla guard non succede nulla\nusing namespace std;\n\nint main() {\n    cout << \"Area cerchio r=1:     \" << geometria::areaCerchio(1) << endl;\n    cout << \"Perimetro cerchio r=1: \" << geometria::perimetroCerchio(1) << endl;\n    cout << \"Area rettangolo 3x4:  \" << geometria::areaRettangolo(3, 4) << endl;\n    return 0;\n}\n"}],"input":null,"output":"Area cerchio r=1:     3.14159\nPerimetro cerchio r=1: 6.28319\nArea rettangolo 3x4:  12\n"}},{"id":"m02-e10","modulo":2,"tipo":"es","numero":10,"titolo":"Scontrino","difficolta":"difficile","testo":"<p>Leggi righe <code>prodotto;quantita;prezzo<\/code> fino a una riga vuota. Separa i campi con <code>getline(ss, campo, ';')<\/code>, convertili con <code>stringstream<\/code> e scarta (su <code>cerr<\/code>, con il numero di riga) le righe con campi mancanti o in più, nome vuoto, quantità non positiva o prezzo negativo. Stampa ogni riga valida con il parziale e infine il totale.<\/p>","soluzione":{"commento":"<p>La riga <code>questa non viene letta<\/code> si trova dopo la riga vuota, che chiude lo scontrino.<\/p>","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 2.10 - Scontrino da righe \"prodotto;quantita;prezzo\"\n#include <iostream>\n#include <string>\n#include <sstream>\nusing namespace std;\n\nnamespace scontrino {\n    // Separa la riga sui ';' con getline(stream, stringa, delimitatore)\n    bool analizza(string riga, string& prodotto, int& qta, double& prezzo) {\n        stringstream ss(riga);\n        string campoQta, campoPrezzo, avanzo;\n        if (!getline(ss, prodotto, ';')) return false;\n        if (!getline(ss, campoQta, ';')) return false;\n        if (!getline(ss, campoPrezzo, ';')) return false;\n        if (getline(ss, avanzo, ';')) return false;      // un campo di troppo\n        if (prodotto.empty()) return false;\n\n        stringstream sq(campoQta), sp(campoPrezzo);      // conversione testo -> numero\n        if (!(sq >> qta) || qta <= 0) return false;\n        if (!(sp >> prezzo) || prezzo < 0) return false;\n        return true;\n    }\n}\n\nint main() {\n    string riga, prodotto;\n    int qta, nRiga = 0;\n    double prezzo, totale = 0;\n    while (getline(cin, riga) && !riga.empty()) {        // riga vuota = fine scontrino\n        nRiga++;\n        if (scontrino::analizza(riga, prodotto, qta, prezzo)) {\n            double parziale = qta * prezzo;\n            cout << prodotto << \" x\" << qta << \" = \" << parziale << endl;\n            totale += parziale;\n        } else {\n            cerr << \"riga \" << nRiga << \" non valida: \" << riga << endl;\n        }\n    }\n    cout << \"TOTALE: \" << totale << endl;\n    return 0;\n}\n"}],"input":"pane;2;1.20\nlatte;1;0.99\nmele;tre;0.5\nuova;6;0.25;extra\n;1;3\nacqua;6;0.30\n\nquesta non viene letta\n","output":"pane x2 = 2.4\nlatte x1 = 0.99\nriga 3 non valida: mele;tre;0.5\nriga 4 non valida: uova;6;0.25;extra\nriga 5 non valida: ;1;3\nacqua x6 = 1.8\nTOTALE: 5.19\n"}},{"id":"m03-pattern","modulo":3,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 3 (Array, Puntatori, Reference, Stack e Heap).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 3 - Pattern: puntatori, reference, array statici e dinamici\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\nusing namespace std;\n\n// ---------- 1. TRE MODI DI PASSARE UN PARAMETRO ----------\nvoid scambiaValore(int a, int b) {         // riceve FOTOCOPIE: non cambia nulla fuori\n    int t = a; a = b; b = t;\n}\nvoid scambiaPuntatore(int* a, int* b) {    // riceve INDIRIZZI: lavora sugli originali\n    int t = *a; *a = *b; *b = t;\n}\nvoid scambiaReference(int& a, int& b) {    // riceve ALIAS: lavora sugli originali\n    int t = a; a = b; b = t;\n}\n\n// ---------- 2. ARRAY PASSATO A FUNZIONE ----------\n// int v[] e int* v sono LA STESSA COSA: la funzione riceve solo l'indirizzo\n// del primo elemento, quindi la dimensione va passata a parte.\ndouble media(const int v[], int n) {        // const: la funzione non modifica v\n    int somma = 0;\n    for (int i = 0; i < n; i++) somma += v[i];\n    return (double)somma / n;\n}\n\n// ---------- 3. FUNZIONE CHE CREA UN ARRAY DINAMICO ----------\n// Restituisce il puntatore all'array nello heap: chi lo riceve deve fare delete[]\nint* creaQuadrati(int n) {\n    int* a = new int[n];\n    for (int i = 0; i < n; i++) a[i] = i * i;\n    return a;                               // OK: lo heap sopravvive alla funzione\n}\n\n// ---------- 4. MATRICE DINAMICA r x c ----------\nint** creaMatrice(int r, int c) {\n    int** m = new int*[r];                  // array di r puntatori (le righe)\n    for (int i = 0; i < r; i++)\n        m[i] = new int[c];                  // ogni riga è un array di c int\n    return m;\n}\nvoid distruggiMatrice(int** m, int r) {\n    for (int i = 0; i < r; i++) delete[] m[i];   // prima le righe...\n    delete[] m;                                  // ...poi l'array di puntatori\n}\n\nint main() {\n    // --- Puntatori: & = \"indirizzo di\", * = \"vai all'indirizzo\" ---\n    int n = 75;\n    int* p = &n;            // p contiene l'indirizzo di n\n    *p = 100;               // modifico n passando da p\n    cout << \"n = \" << n << \", *p = \" << *p << endl;\n\n    int& r = n;             // r è un altro nome per n\n    r = 5;\n    cout << \"dopo r = 5: n = \" << n << endl;\n\n    // --- Passaggio parametri ---\n    int x = 1, y = 2;\n    scambiaValore(x, y);     cout << \"valore:    x=\" << x << \" y=\" << y << endl;\n    scambiaPuntatore(&x, &y); cout << \"puntatore: x=\" << x << \" y=\" << y << endl;\n    scambiaReference(x, y);  cout << \"reference: x=\" << x << \" y=\" << y << endl;\n\n    // --- Array statico e aritmetica dei puntatori ---\n    int v[5] = {10, 20, 30, 40, 50};\n    int* q = v;                              // il nome dell'array = indirizzo di v[0]\n    cout << \"v[2] = \" << v[2] << \", *(q+2) = \" << *(q + 2) << endl;\n    cout << \"sizeof(v) = \" << sizeof(v) << \" byte, elementi = \" << sizeof(v) / sizeof(v[0]) << endl;\n    cout << \"media = \" << media(v, 5) << endl;\n\n    // --- Array dinamico: dimensione decisa a run-time ---\n    int dim = 6;\n    int* quad = creaQuadrati(dim);\n    for (int i = 0; i < dim; i++) cout << quad[i] << \" \";\n    cout << endl;\n    delete[] quad;           // con [] perché è stato creato con new[]\n    quad = nullptr;          // niente puntatore pendente (dangling)\n\n    // --- Variabile dinamica singola ---\n    double* d = new double(3.14);\n    cout << \"*d = \" << *d << endl;\n    delete d;                // senza [] perché creato con new (non new[])\n    d = nullptr;\n\n    // --- Matrice dinamica ---\n    int R = 2, C = 3;\n    int** m = creaMatrice(R, C);\n    for (int i = 0; i < R; i++)\n        for (int j = 0; j < C; j++)\n            m[i][j] = i * 10 + j;\n    for (int i = 0; i < R; i++) {\n        for (int j = 0; j < C; j++) cout << m[i][j] << \"\\t\";\n        cout << endl;\n    }\n    distruggiMatrice(m, R);\n    m = nullptr;\n    return 0;\n}\n"}],"input":null,"output":"n = 100, *p = 100\ndopo r = 5: n = 5\nvalore:    x=1 y=2\npuntatore: x=2 y=1\nreference: x=1 y=2\nv[2] = 30, *(q+2) = 30\nsizeof(v) = 20 byte, elementi = 5\nmedia = 30\n0 1 4 9 16 25 \n*d = 3.14\n0       1       2       \n10      11      12      \n"}},{"id":"m03-lab","modulo":3,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Stazione meteo<\/b><\/p><p>Una stazione meteo registra temperature. Si vuole analizzarle senza usare la STL, gestendo la memoria a mano con <code>new<\/code> e <code>delete<\/code>.<\/p><p><b>Step 1 – più risultati da una funzione<\/b><br>Scrivi <code>void minMax(const double* v, int n, double&amp; mn, double&amp; mx)<\/code> che calcola minimo e massimo di un array. Provala nel <code>main<\/code> su un array statico di 5 temperature.<br><b>Concetto nuovo:<\/b> parametri <code>const T*<\/code> in sola lettura, reference per restituire più valori.<\/p><p><b>Step 2 – un array che cresce<\/b><br>Scrivi <code>void aggiungi(double*&amp; v, int&amp; n, int&amp; cap, double x)<\/code>, che inserisce <code>x<\/code> in coda e, se l'array è pieno, <b>raddoppia<\/b> la capacità (partendo da 2). Poi <code>double* leggiMisure(int&amp; n)<\/code>, che legge temperature da tastiera fino allo 0 e restituisce l'array.<br><b>Concetto nuovo:<\/b> <code>new[]<\/code>/<code>delete[]<\/code>, riallocazione, <code>double*&amp;<\/code>.<\/p><p><b>Step 3 – un nuovo array di dimensione esatta<\/b><br>Scrivi <code>double* sopraSoglia(const double* v, int n, double soglia, int&amp; m)<\/code>, che restituisce un <b>nuovo<\/b> array dinamico, di dimensione esattamente <code>m<\/code>, con le sole misure maggiori della soglia (o <code>nullptr<\/code> se non ce ne sono). Usa come soglia la media tra minimo e massimo.<br><b>Concetto nuovo:<\/b> funzione che restituisce memoria dello heap; schema “prima conto, poi alloco, poi copio”.<\/p><p><b>Step 4 – matrice dinamica<\/b><br>Con <code>srand(111222333)<\/code> riempi una matrice dinamica di 3 giorni × 4 rilevazioni con interi casuali tra 10 e 30 (<code>int** creaMatrice(int r, int c)<\/code>). Stampala e calcola in un nuovo array dinamico la media di ogni giorno (<code>double* medieRighe(int** m, int r, int c)<\/code>).<br><b>Concetto nuovo:<\/b> <code>int**<\/code>, array di puntatori, matrice a due livelli.<\/p><p><b>Step 5 – fare pulizia<\/b><br>Libera <b>tutta<\/b> la memoria allocata. Scrivi <code>void distruggiMatrice(int**&amp; m, int r)<\/code>, che libera nell'ordine corretto e imposta <code>m = nullptr<\/code>; verifica nel <code>main<\/code> che il puntatore sia davvero nullo.<br><b>Concetto nuovo:<\/b> ordine di deallocazione, dangling pointer, puntatore passato per reference per poterlo azzerare.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 3 - Laboratorio a step: stazione meteo\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <cstdlib>\nusing namespace std;\n\n// ===== STEP 1 =====  Più risultati con i parametri reference\nvoid minMax(const double* v, int n, double& mn, double& mx) {\n    mn = mx = v[0];\n    for (int i = 1; i < n; i++) {\n        if (v[i] < mn) mn = v[i];\n        if (v[i] > mx) mx = v[i];\n    }\n}\n\n// ===== STEP 2 =====  Array dinamico che raddoppia quando è pieno\nvoid aggiungi(double*& v, int& n, int& cap, double x) {\n    if (n == cap) {\n        cap = (cap == 0) ? 2 : cap * 2;\n        double* nuovo = new double[cap];       // 1. blocco più grande\n        for (int i = 0; i < n; i++)            // 2. copia\n            nuovo[i] = v[i];\n        delete[] v;                            // 3. libero il vecchio\n        v = nuovo;                             // 4. sposto il puntatore (per questo double*&)\n    }\n    v[n++] = x;\n}\n\ndouble* leggiMisure(int& n) {\n    double* v = nullptr;\n    int cap = 0;\n    n = 0;\n    double x;\n    while (cin >> x && x != 0)\n        aggiungi(v, n, cap, x);\n    cout << \"(capacita' finale \" << cap << \" per \" << n << \" misure)\" << endl;\n    return v;\n}\n\n// ===== STEP 3 =====  Nuovo array di dimensione ESATTA: prima conto, poi copio\ndouble* sopraSoglia(const double* v, int n, double soglia, int& m) {\n    m = 0;\n    for (int i = 0; i < n; i++) if (v[i] > soglia) m++;\n    if (m == 0) return nullptr;\n    double* r = new double[m];\n    int k = 0;\n    for (int i = 0; i < n; i++) if (v[i] > soglia) r[k++] = v[i];\n    return r;\n}\n\n// ===== STEP 4 =====  Matrice dinamica giorni x ore\nint** creaMatrice(int r, int c) {\n    int** m = new int*[r];\n    for (int i = 0; i < r; i++) m[i] = new int[c];\n    return m;\n}\n\ndouble* medieRighe(int** m, int r, int c) {\n    double* medie = new double[r];\n    for (int i = 0; i < r; i++) {\n        int somma = 0;\n        for (int j = 0; j < c; j++) somma += m[i][j];\n        medie[i] = (double)somma / c;\n    }\n    return medie;\n}\n\n// ===== STEP 5 =====  Liberare e azzerare: il puntatore passa per reference\nvoid distruggiMatrice(int**& m, int r) {\n    for (int i = 0; i < r; i++) delete[] m[i];\n    delete[] m;\n    m = nullptr;                               // il chiamante non resta con un dangling pointer\n}\n\nvoid stampa(const double* v, int n) {\n    cout << \"[ \";\n    for (int i = 0; i < n; i++) cout << v[i] << \" \";\n    cout << \"]\" << endl;\n}\n\nint main() {\n    // STEP 1: su un array statico\n    double prova[5] = {12.5, 9, 21.3, 17, 4.2};\n    double mn, mx;\n    minMax(prova, 5, mn, mx);\n    cout << \"STEP 1  min = \" << mn << \", max = \" << mx << endl;\n\n    // STEP 2: misure lette da tastiera fino a 0\n    int n;\n    cout << \"STEP 2  Inserisci le temperature (0 per finire):\" << endl;\n    double* misure = leggiMisure(n);\n    if (n == 0) return 0;\n    stampa(misure, n);\n    minMax(misure, n, mn, mx);\n    double soglia = (mn + mx) / 2;\n\n    // STEP 3\n    int m;\n    double* calde = sopraSoglia(misure, n, soglia, m);\n    cout << \"STEP 3  sopra \" << soglia << \" (\" << m << \"): \";\n    stampa(calde, m);\n\n    // STEP 4: 3 giorni x 4 rilevazioni casuali tra 10 e 30\n    srand(111222333);\n    const int G = 3, H = 4;\n    int** tab = creaMatrice(G, H);\n    for (int i = 0; i < G; i++)\n        for (int j = 0; j < H; j++)\n            tab[i][j] = 10 + rand() % 21;\n    cout << \"STEP 4\" << endl;\n    for (int i = 0; i < G; i++) {\n        cout << \"  giorno \" << i + 1 << \":\";\n        for (int j = 0; j < H; j++) cout << \" \" << tab[i][j];\n        cout << endl;\n    }\n    double* medie = medieRighe(tab, G, H);\n    cout << \"  medie: \";\n    stampa(medie, G);\n\n    // STEP 5: ogni new ha il suo delete\n    delete[] misure;\n    delete[] calde;          // se è nullptr, delete[] non fa nulla\n    delete[] medie;\n    distruggiMatrice(tab, G);\n    cout << \"STEP 5  memoria liberata, tab = \" << (tab == nullptr ? \"nullptr\" : \"???\") << endl;\n    return 0;\n}\n"}],"input":"18.5 22 14 30.5 25 11 27.5 0\n","output":"STEP 1  min = 4.2, max = 21.3\nSTEP 2  Inserisci le temperature (0 per finire):\n(capacita' finale 8 per 7 misure)\n[ 18.5 22 14 30.5 25 11 27.5 ]\nSTEP 3  sopra 20.75 (4): [ 22 30.5 25 27.5 ]\nSTEP 4\n  giorno 1: 25 18 20 18\n  giorno 2: 29 10 29 14\n  giorno 3: 22 13 23 29\n  medie: [ 20.25 20.5 21.75 ]\nSTEP 5  memoria liberata, tab = nullptr\n"}},{"id":"m03-e01","modulo":3,"tipo":"es","numero":1,"titolo":"Primi passi con i puntatori","difficolta":"facile","testo":"<p>Dichiara <code>int a = 10; int* p = &amp;a;<\/code> e stampa <code>a<\/code>, <code>&amp;a<\/code>, <code>p<\/code>, <code>*p<\/code>, <code>&amp;p<\/code>. Modifica <code>a<\/code> passando da <code>p<\/code>; poi fai puntare <code>p<\/code> a un'altra variabile <code>b<\/code> e verifica che modificare <code>*p<\/code> non tocchi più <code>a<\/code>. Infine usa un <code>int** pp = &amp;p<\/code> per modificare <code>b<\/code>.<\/p>","soluzione":{"commento":"<p>Gli indirizzi cambiano a ogni esecuzione: il sistema operativo carica il programma ogni volta in una posizione diversa.<\/p>","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 3.1 - Primi passi con i puntatori\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 10;\n    int* p = &a;            // p contiene l'indirizzo di a\n\n    cout << \"a   = \" << a  << \"   (il valore)\" << endl;\n    cout << \"&a  = \" << &a << \"   (l'indirizzo di a)\" << endl;\n    cout << \"p   = \" << p  << \"   (uguale a &a)\" << endl;\n    cout << \"*p  = \" << *p << \"   (il valore all'indirizzo p)\" << endl;\n    cout << \"&p  = \" << &p << \"   (anche p ha un indirizzo suo!)\" << endl;\n\n    *p = 20;                // modifico a passando da p\n    cout << \"dopo *p = 20, a = \" << a << endl;\n\n    int b = 99;\n    p = &b;                 // ora p punta a b: a non cambia piu'\n    *p = 0;\n    cout << \"dopo p = &b e *p = 0:  a = \" << a << \", b = \" << b << endl;\n\n    int** pp = &p;          // puntatore a puntatore\n    **pp = 7;               // pp -> p -> b\n    cout << \"dopo **pp = 7, b = \" << b << endl;\n    return 0;\n}\n"}],"input":null,"output":"a   = 10   (il valore)\n&a  = 0x72a5ffa74   (l'indirizzo di a)\np   = 0x72a5ffa74   (uguale a &a)\n*p  = 10   (il valore all'indirizzo p)\n&p  = 0x72a5ffa68   (anche p ha un indirizzo suo!)\ndopo *p = 20, a = 20\ndopo p = &b e *p = 0:  a = 20, b = 0\ndopo **pp = 7, b = 7\n"}},{"id":"m03-e02","modulo":3,"tipo":"es","numero":2,"titolo":"Ordinare tre numeri","difficolta":"facile","testo":"<p>Scrivi <code>void scambia(int&amp; x, int&amp; y)<\/code> e, usandola, <code>void ordinaTre(int&amp; a, int&amp; b, int&amp; c)<\/code> che riordina le tre variabili del chiamante in ordine crescente con al più tre scambi.<\/p>","soluzione":{"commento":"","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 3.2 - Ordinare tre numeri con scambi per reference\n#include <iostream>\nusing namespace std;\n\nvoid scambia(int& x, int& y) {\n    int t = x;\n    x = y;\n    y = t;\n}\n\n// Dopo la chiamata: a <= b <= c. Le variabili del chiamante vengono modificate.\nvoid ordinaTre(int& a, int& b, int& c) {\n    if (a > b) scambia(a, b);   // ora a <= b\n    if (b > c) scambia(b, c);   // ora c è il massimo\n    if (a > b) scambia(a, b);   // sistemo di nuovo i primi due\n}\n\nint main() {\n    int x = 9, y = 2, z = 5;\n    ordinaTre(x, y, z);\n    cout << x << \" \" << y << \" \" << z << endl;\n\n    int p = 3, q = 3, r = 1;\n    ordinaTre(p, q, r);\n    cout << p << \" \" << q << \" \" << r << endl;\n    return 0;\n}\n"}],"input":null,"output":"2 5 9\n1 3 3\n"}},{"id":"m03-e03","modulo":3,"tipo":"es","numero":3,"titolo":"Aritmetica dei puntatori","difficolta":"facile","testo":"<p>Senza usare le parentesi quadre, scrivi <code>int somma(const int* inizio, const int* fine)<\/code> (<code>fine<\/code> punta <i>uno dopo<\/i> l'ultimo elemento) e <code>const int* posizioneMassimo(const int* v, int n)<\/code>. Nel <code>main<\/code> ricava l'indice del massimo come differenza tra puntatori.<\/p>","soluzione":{"commento":"<p><code>pm - v<\/code> vale 5: la differenza tra due puntatori nello stesso array è il numero di <i>elementi<\/i> che li separa.<\/p>","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 3.3 - Somma e massimo con l'aritmetica dei puntatori (niente [])\n#include <iostream>\nusing namespace std;\n\nint somma(const int* inizio, const int* fine) {     // fine = uno DOPO l'ultimo\n    int s = 0;\n    for (const int* p = inizio; p < fine; p++)       // p avanza di un int alla volta\n        s += *p;\n    return s;\n}\n\nconst int* posizioneMassimo(const int* v, int n) {\n    const int* best = v;\n    for (const int* p = v + 1; p < v + n; p++)\n        if (*p > *best) best = p;\n    return best;                                     // restituisco un INDIRIZZO\n}\n\nint main() {\n    int v[6] = {4, 8, 15, 16, 23, 42};\n    cout << \"Somma: \" << somma(v, v + 6) << endl;\n    cout << \"Somma dei primi 3: \" << somma(v, v + 3) << endl;\n    const int* pm = posizioneMassimo(v, 6);\n    cout << \"Massimo: \" << *pm << \" in posizione \" << (pm - v) << endl;   // differenza = indice\n    return 0;\n}\n"}],"input":null,"output":"Somma: 108\nSomma dei primi 3: 27\nMassimo: 42 in posizione 5\n"}},{"id":"m03-e04","modulo":3,"tipo":"es","numero":4,"titolo":"Tre risultati","difficolta":"facile","testo":"<p>Scrivi <code>bool statistiche(const int v[], int n, int&amp; minimo, int&amp; massimo, double&amp; media)<\/code>, che restituisce <code>false<\/code> se l'array è vuoto. Provala con un array di voti e con <code>n = 0<\/code>.<\/p>","soluzione":{"commento":"","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 3.4 - Statistiche: tre risultati da una sola funzione\n#include <iostream>\nusing namespace std;\n\n// Restituisce false se l'array è vuoto. I risultati escono dai parametri reference.\nbool statistiche(const int v[], int n, int& minimo, int& massimo, double& media) {\n    if (n <= 0) return false;\n    minimo = massimo = v[0];\n    int somma = 0;\n    for (int i = 0; i < n; i++) {\n        if (v[i] < minimo) minimo = v[i];\n        if (v[i] > massimo) massimo = v[i];\n        somma += v[i];\n    }\n    media = (double)somma / n;\n    return true;\n}\n\nint main() {\n    int voti[] = {24, 30, 18, 27, 26};\n    int mn, mx;\n    double med;\n    if (statistiche(voti, 5, mn, mx, med))\n        cout << \"min \" << mn << \", max \" << mx << \", media \" << med << endl;\n    if (!statistiche(voti, 0, mn, mx, med))\n        cout << \"array vuoto: nessuna statistica\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"min 18, max 30, media 25\narray vuoto: nessuna statistica\n"}},{"id":"m03-e05","modulo":3,"tipo":"es","numero":5,"titolo":"Invertire sul posto","difficolta":"medio","testo":"<p>Scrivi <code>void inverti(int* v, int n)<\/code> che inverte l'array senza usarne un altro, con due puntatori che partono dalle due estremità e si incontrano a metà. Provala con un numero pari e uno dispari di elementi.<\/p>","soluzione":{"commento":"","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 3.5 - Invertire un array \"sul posto\" con due puntatori\n#include <iostream>\nusing namespace std;\n\nvoid inverti(int* v, int n) {\n    int* sx = v;              // primo elemento\n    int* dx = v + n - 1;      // ultimo elemento\n    while (sx < dx) {         // si incontrano a metà\n        int t = *sx;\n        *sx = *dx;\n        *dx = t;\n        sx++;\n        dx--;\n    }\n}\n\nvoid stampa(const int* v, int n) {\n    for (int i = 0; i < n; i++) cout << v[i] << \" \";\n    cout << endl;\n}\n\nint main() {\n    int pari[6] = {1, 2, 3, 4, 5, 6};\n    int dispari[5] = {10, 20, 30, 40, 50};\n    inverti(pari, 6);\n    inverti(dispari, 5);\n    stampa(pari, 6);\n    stampa(dispari, 5);\n    return 0;\n}\n"}],"input":null,"output":"6 5 4 3 2 1 \n50 40 30 20 10 \n"}},{"id":"m03-e06","modulo":3,"tipo":"es","numero":6,"titolo":"Dimensione scelta dall'utente","difficolta":"medio","testo":"<p>Chiedi all'utente quanti numeri vuole inserire, alloca un array dinamico della dimensione giusta, leggi i numeri e stampali al contrario. Gestisci una dimensione non valida e libera la memoria.<\/p>","soluzione":{"commento":"","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 3.6 - Array dinamico di dimensione scelta dall'utente\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cout << \"Quanti numeri? \";\n    cin >> n;\n    if (!cin || n <= 0) {\n        cerr << \"dimensione non valida\" << endl;\n        return 1;\n    }\n\n    int* v = new int[n];          // n è noto solo ora, a run-time: serve lo heap\n    for (int i = 0; i < n; i++) {\n        cout << \"v[\" << i << \"] = \";\n        cin >> v[i];\n    }\n\n    cout << endl << \"Al contrario: \";\n    for (int i = n - 1; i >= 0; i--) cout << v[i] << \" \";\n    cout << endl;\n\n    delete[] v;                   // creato con new[] -> delete[]\n    v = nullptr;\n    return 0;\n}\n"}],"input":"4\n7 -2 13 5\n","output":"Quanti numeri? v[0] = v[1] = v[2] = v[3] = \nAl contrario: 5 13 -2 7 \n"}},{"id":"m03-e07","modulo":3,"tipo":"es","numero":7,"titolo":"Senza duplicati","difficolta":"medio","testo":"<p>Scrivi <code>int* senzaDuplicati(const int* v, int n, int&amp; m)<\/code>, che restituisce un nuovo array dinamico di dimensione esatta con i valori di <code>v<\/code> presi una sola volta, nell'ordine della loro prima comparsa. Con <code>3 1 3 2 1 1 5 2<\/code> il risultato è <code>3 1 2 5<\/code>.<\/p>","soluzione":{"commento":"<p><code>contiene(v, i, v[i])<\/code> cerca <code>v[i]<\/code> solo tra gli elementi <i>precedenti<\/i>: se c'è già, è un duplicato.<\/p>","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 3.7 - Copia senza duplicati (nuovo array dinamico di dimensione esatta)\n#include <iostream>\nusing namespace std;\n\nbool contiene(const int* v, int n, int x) {\n    for (int i = 0; i < n; i++) if (v[i] == x) return true;\n    return false;\n}\n\nint* senzaDuplicati(const int* v, int n, int& m) {\n    // 1a passata: conto i valori \"nuovi\" (che non compaiono prima di loro)\n    m = 0;\n    for (int i = 0; i < n; i++)\n        if (!contiene(v, i, v[i])) m++;\n    // 2a passata: alloco esattamente m celle e copio\n    int* r = new int[m];\n    int k = 0;\n    for (int i = 0; i < n; i++)\n        if (!contiene(v, i, v[i])) r[k++] = v[i];\n    return r;\n}\n\nint main() {\n    int v[] = {3, 1, 3, 2, 1, 1, 5, 2};\n    int m;\n    int* u = senzaDuplicati(v, 8, m);\n    cout << \"Valori distinti (\" << m << \"): \";\n    for (int i = 0; i < m; i++) cout << u[i] << \" \";\n    cout << endl;\n    delete[] u;\n    return 0;\n}\n"}],"input":null,"output":"Valori distinti (4): 3 1 2 5 \n"}},{"id":"m03-e08","modulo":3,"tipo":"es","numero":8,"titolo":"Fusione di due array ordinati","difficolta":"medio","testo":"<p>Scrivi <code>int* fondi(const int* a, int na, const int* b, int nb)<\/code>, che riceve due array già ordinati e restituisce un nuovo array dinamico, ordinato, con tutti gli elementi di entrambi, in un solo passaggio. (È il cuore del MergeSort, Modulo 7.)<\/p>","soluzione":{"commento":"","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 3.8 - Fondere due array ordinati in un nuovo array ordinato\n#include <iostream>\nusing namespace std;\n\nint* fondi(const int* a, int na, const int* b, int nb) {\n    int* r = new int[na + nb];\n    int i = 0, j = 0, k = 0;\n    while (i < na && j < nb)                 // prendo sempre il più piccolo dei due \"in testa\"\n        r[k++] = (a[i] <= b[j]) ? a[i++] : b[j++];\n    while (i < na) r[k++] = a[i++];          // avanzi del primo\n    while (j < nb) r[k++] = b[j++];          // avanzi del secondo\n    return r;\n}\n\nint main() {\n    int a[] = {1, 4, 9, 12};\n    int b[] = {2, 3, 10, 15, 20};\n    int* f = fondi(a, 4, b, 5);\n    for (int k = 0; k < 9; k++) cout << f[k] << \" \";\n    cout << endl;\n    delete[] f;\n    return 0;\n}\n"}],"input":null,"output":"1 2 3 4 9 10 12 15 20 \n"}},{"id":"m03-e09","modulo":3,"tipo":"es","numero":9,"titolo":"Trasposta","difficolta":"difficile","testo":"<p>Scrivi <code>int** crea(int r, int c)<\/code>, <code>void distruggi(int**&amp; m, int r)<\/code> e <code>int** trasposta(int** m, int r, int c)<\/code>, che restituisce una <b>nuova<\/b> matrice c × r con <code>t[j][i] = m[i][j]<\/code>. Attenzione a passare a <code>distruggi<\/code> il numero giusto di righe per ciascuna matrice.<\/p>","soluzione":{"commento":"","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 3.9 - Trasposta di una matrice dinamica\n#include <iostream>\nusing namespace std;\n\nint** crea(int r, int c) {\n    int** m = new int*[r];\n    for (int i = 0; i < r; i++) m[i] = new int[c];\n    return m;\n}\n\nvoid distruggi(int**& m, int r) {\n    for (int i = 0; i < r; i++) delete[] m[i];\n    delete[] m;\n    m = nullptr;\n}\n\n// La trasposta di una matrice r x c è una matrice c x r: t[j][i] = m[i][j]\nint** trasposta(int** m, int r, int c) {\n    int** t = crea(c, r);\n    for (int i = 0; i < r; i++)\n        for (int j = 0; j < c; j++)\n            t[j][i] = m[i][j];\n    return t;\n}\n\nvoid stampa(int** m, int r, int c) {\n    for (int i = 0; i < r; i++) {\n        for (int j = 0; j < c; j++) cout << m[i][j] << \"\\t\";\n        cout << endl;\n    }\n}\n\nint main() {\n    int R = 2, C = 3;\n    int** m = crea(R, C);\n    int k = 1;\n    for (int i = 0; i < R; i++)\n        for (int j = 0; j < C; j++)\n            m[i][j] = k++;\n    cout << \"Originale \" << R << \"x\" << C << \":\" << endl;\n    stampa(m, R, C);\n\n    int** t = trasposta(m, R, C);\n    cout << \"Trasposta \" << C << \"x\" << R << \":\" << endl;\n    stampa(t, C, R);\n\n    distruggi(m, R);     // m ha R righe\n    distruggi(t, C);     // t ha C righe: attenzione a non sbagliare!\n    return 0;\n}\n"}],"input":null,"output":"Originale 2x3:\n1       2       3       \n4       5       6       \nTrasposta 3x2:\n1       4       \n2       5       \n3       6       \n"}},{"id":"m03-e10","modulo":3,"tipo":"es","numero":10,"titolo":"Inserire e rimuovere in mezzo","difficolta":"difficile","testo":"<p>Su un array dinamico con <code>n<\/code> elementi e capacità <code>cap<\/code>, scrivi <code>bool inserisci(int*&amp; v, int&amp; n, int&amp; cap, int pos, int x)<\/code> (sposta a destra gli elementi da <code>pos<\/code> in poi e raddoppia se pieno) e <code>bool rimuovi(int*&amp; v, int&amp; n, int&amp; cap, int pos)<\/code> (sposta a sinistra e dimezza la capacità quando <code>n<\/code> scende a un quarto di <code>cap<\/code>). Entrambe rifiutano posizioni non valide.<\/p>","soluzione":{"commento":"<p>Per inserire si sposta partendo dal <b>fondo<\/b> (<code>i = n<\/code> scendendo), altrimenti ogni elemento sovrascriverebbe il successivo prima di averlo spostato. Per rimuovere si parte invece dalla posizione tolta.<\/p>","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 3.10 - Array dinamico con inserimento/rimozione in posizione\n//                  che cresce (x2) e si restringe (/2)\n#include <iostream>\nusing namespace std;\n\nvoid ridimensiona(int*& v, int n, int& cap, int nuovaCap) {\n    int* nuovo = new int[nuovaCap];\n    for (int i = 0; i < n; i++) nuovo[i] = v[i];\n    delete[] v;\n    v = nuovo;\n    cap = nuovaCap;\n    cout << \"  [capacita' -> \" << cap << \"]\" << endl;\n}\n\nbool inserisci(int*& v, int& n, int& cap, int pos, int x) {\n    if (pos < 0 || pos > n) return false;\n    if (n == cap) ridimensiona(v, n, cap, cap * 2);\n    for (int i = n; i > pos; i--) v[i] = v[i - 1];   // sposto a destra, partendo dal fondo\n    v[pos] = x;\n    n++;\n    return true;\n}\n\nbool rimuovi(int*& v, int& n, int& cap, int pos) {\n    if (pos < 0 || pos >= n) return false;\n    for (int i = pos; i < n - 1; i++) v[i] = v[i + 1]; // sposto a sinistra\n    n--;\n    if (cap > 2 && n <= cap / 4) ridimensiona(v, n, cap, cap / 2);   // spreco troppo: dimezzo\n    return true;\n}\n\nvoid stampa(const int* v, int n, int cap) {\n    cout << \"n=\" << n << \" cap=\" << cap << \": \";\n    for (int i = 0; i < n; i++) cout << v[i] << \" \";\n    cout << endl;\n}\n\nint main() {\n    int cap = 2, n = 0;\n    int* v = new int[cap];\n    for (int x = 1; x <= 5; x++) inserisci(v, n, cap, n, x * 10);   // in coda\n    stampa(v, n, cap);\n    inserisci(v, n, cap, 0, 5);          // in testa\n    inserisci(v, n, cap, 3, 25);         // in mezzo\n    stampa(v, n, cap);\n    if (!inserisci(v, n, cap, 99, 1)) cout << \"posizione 99 non valida\" << endl;\n    while (n > 1) rimuovi(v, n, cap, 0); // svuoto dalla testa\n    stampa(v, n, cap);\n    delete[] v;\n    return 0;\n}\n"}],"input":null,"output":"  [capacita' -> 4]\n  [capacita' -> 8]\nn=5 cap=8: 10 20 30 40 50 \nn=7 cap=8: 5 10 20 25 30 40 50 \nposizione 99 non valida\n  [capacita' -> 4]\n  [capacita' -> 2]\nn=1 cap=2: 50 \n"}},{"id":"m04-pattern","modulo":4,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 4 (Classi e Oggetti: Costruttori, Distruttore, Regola dei Tre).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 4 - Pattern: classe che possiede memoria dinamica + Regola dei Tre\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\nclass Vettore {\nprivate:\n    int* dati;          // blocco nello HEAP: lo possiede l'oggetto\n    int n;\n\npublic:\n    // 1. COSTRUTTORE (con parametro di default e lista di inizializzazione)\n    Vettore(int dim = 3) : dati(nullptr), n(dim) {\n        if (n < 1) n = 1;\n        dati = new int[n];\n        for (int i = 0; i < n; i++) dati[i] = 0;\n        cout << \"  [costruttore n=\" << n << \"]\" << endl;\n    }\n\n    // 2. DISTRUTTORE: restituisce la memoria presa dal costruttore\n    ~Vettore() {\n        cout << \"  [distruttore n=\" << n << \"]\" << endl;\n        delete[] dati;\n    }\n\n    // 3. COSTRUTTORE DI COPIA: copia PROFONDA (un blocco nuovo tutto suo)\n    Vettore(const Vettore& altro) : dati(nullptr), n(altro.n) {\n        dati = new int[n];\n        for (int i = 0; i < n; i++) dati[i] = altro.dati[i];\n        cout << \"  [costruttore di copia]\" << endl;\n    }\n\n    // 4. OPERATORE DI ASSEGNAMENTO: libera il vecchio, copia il nuovo\n    Vettore& operator=(const Vettore& altro) {\n        cout << \"  [operator=]\" << endl;\n        if (this == &altro) return *this;     // a = a: non fare danni\n        delete[] dati;                        // libero il MIO vecchio blocco\n        n = altro.n;\n        dati = new int[n];                    // ne prendo uno della misura giusta\n        for (int i = 0; i < n; i++) dati[i] = altro.dati[i];\n        return *this;                         // permette a = b = c\n    }\n\n    // Accesso controllato: eccezione se l'indice è fuori dai limiti\n    void set(int i, int valore) {\n        if (i < 0 || i >= n) throw out_of_range(\"indice non valido\");\n        dati[i] = valore;\n    }\n    int get(int i) const {\n        if (i < 0 || i >= n) throw out_of_range(\"indice non valido\");\n        return dati[i];\n    }\n    int size() const { return n; }\n\n    void stampa() const {\n        cout << \"[ \";\n        for (int i = 0; i < n; i++) cout << dati[i] << \" \";\n        cout << \"]\" << endl;\n    }\n};\n\nint main() {\n    cout << \"Creo a:\" << endl;\n    Vettore a(3);\n    a.set(0, 10); a.set(1, 20); a.set(2, 30);\n\n    cout << \"Creo b come copia di a:\" << endl;\n    Vettore b = a;              // costruttore di copia (b NASCE ora)\n    b.set(0, 99);               // modifico solo b\n    cout << \"a = \"; a.stampa();\n    cout << \"b = \"; b.stampa();\n\n    cout << \"Creo c e poi assegno c = a:\" << endl;\n    Vettore c(5);\n    c = a;                      // operator= (c esisteva già)\n    cout << \"c = \"; c.stampa();\n\n    cout << \"Provo un indice sbagliato:\" << endl;\n    try {\n        a.set(7, 1);\n    } catch (const out_of_range& e) {\n        cout << \"  eccezione catturata: \" << e.what() << endl;\n    }\n\n    cout << \"Fine del main: distruzione in ordine inverso (c, b, a)\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"Creo a:\n  [costruttore n=3]\nCreo b come copia di a:\n  [costruttore di copia]\na = [ 10 20 30 ]\nb = [ 99 20 30 ]\nCreo c e poi assegno c = a:\n  [costruttore n=5]\n  [operator=]\nc = [ 10 20 30 ]\nProvo un indice sbagliato:\n  eccezione catturata: indice non valido\nFine del main: distruzione in ordine inverso (c, b, a)\n  [distruttore n=3]\n  [distruttore n=3]\n  [distruttore n=3]\n"}},{"id":"m04-lab","modulo":4,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Playlist musicale<\/b><\/p><p>Si vuole gestire una raccolta di playlist. Ogni playlist ha un nome e contiene un numero variabile di brani, memorizzati in un array dinamico (niente STL). Ogni brano ha titolo, artista e durata in secondi.<\/p><p><b>Step 1 – la classe Brano<\/b><br>Scrivi <code>Brano<\/code> con titolo, artista e durata. Prevedi: un costruttore di default (“?”, “?”, 0), un costruttore completo con <b>lista di inizializzazione<\/b> (durata negativa → 0) e un costruttore con solo il titolo che <b>delega<\/b> al completo con artista “Sconosciuto” e durata 180. Getter <code>const<\/code> e <code>stampa()<\/code> nel formato <code>Titolo - Artista (m:ss)<\/code>.<br><b>Concetto nuovo:<\/b> overloading dei costruttori, lista di inizializzazione, delega.<\/p><p><b>Step 2 – la classe Playlist<\/b><br><code>Playlist<\/code> ha un nome e un array dinamico di <code>Brano<\/code> (<code>Brano* brani<\/code>), con <code>n<\/code> brani presenti e capacità <code>cap<\/code>. Il costruttore riceve il nome e alloca spazio per 2 brani; il <b>distruttore<\/b> libera l'array. Fai stampare a entrambi un messaggio.<br><b>Concetto nuovo:<\/b> distruttore, risorsa acquisita nel costruttore e rilasciata nel distruttore.<\/p><p><b>Step 3 – aggiungere brani<\/b><br>Aggiungi <code>void aggiungi(const Brano&amp; b)<\/code>, che raddoppia la capacità quando serve tramite un metodo <b>privato<\/b> <code>cresci()<\/code>, e <code>int durataTotale() const<\/code>.<br><b>Concetto nuovo:<\/b> riallocazione dentro una classe, parametro <code>const&amp;<\/code>.<\/p><p><b>Step 4 – copiare una playlist<\/b><br>Scrivi il <b>costruttore di copia<\/b> profondo: la copia ha come nome quello originale seguito da “ (copia)” e un array tutto suo. Nel <code>main<\/code> crea una copia dentro un blocco <code>{ }<\/code>, aggiungile un brano e verifica che l'originale non cambi e che la copia venga distrutta alla fine del blocco.<br><b>Concetto nuovo:<\/b> costruttore di copia, copia profonda.<\/p><p><b>Step 5 – assegnare una playlist<\/b><br>Scrivi <code>operator=<\/code> (che copia i brani ma <b>non<\/b> il nome), con controllo di autoassegnamento. Prova <code>r = p;<\/code> e <code>r = r;<\/code>.<br><b>Concetto nuovo:<\/b> operatore di assegnamento, <code>this<\/code>, Regola dei Tre.<\/p><p><b>Step 6 – contatore ed eccezioni<\/b><br>Aggiungi un attributo <code>static int vive<\/code> che conta le playlist esistenti (aggiornato da costruttori e distruttore) e un metodo statico <code>quanteVive()<\/code>. Aggiungi <code>Brano&amp; at(int i)<\/code>, che lancia <code>out_of_range<\/code> se l'indice non è valido, e gestisci l'errore nel <code>main<\/code> con <code>try<\/code>/<code>catch<\/code>.<br><b>Concetto nuovo:<\/b> membri <code>static<\/code>, <code>throw<\/code>, <code>try<\/code>, <code>catch<\/code>.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 4 - Laboratorio a step: playlist musicale\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\n// ===== STEP 1 =====  Costruttori, lista di inizializzazione, const\nclass Brano {\nprivate:\n    string titolo;\n    string artista;\n    int durata;                                   // secondi\n\npublic:\n    Brano() : titolo(\"?\"), artista(\"?\"), durata(0) {}            // di default\n    Brano(string t, string a, int d) : titolo(t), artista(a), durata(d) {\n        if (durata < 0) durata = 0;\n    }\n    Brano(string t) : Brano(t, \"Sconosciuto\", 180) {}            // costruttore con delega\n\n    string getTitolo() const { return titolo; }\n    int getDurata() const { return durata; }\n    void stampa() const {\n        cout << titolo << \" - \" << artista << \" (\" << durata / 60 << \":\"\n             << (durata % 60 < 10 ? \"0\" : \"\") << durata % 60 << \")\";\n    }\n};\n\n// ===== STEP 2 =====  Una classe che possiede un array dinamico: costruttore + distruttore\nclass Playlist {\nprivate:\n    string nome;\n    Brano* brani;          // array nello heap\n    int n, cap;\n    static int vive;       // ===== STEP 6 ===== quante playlist esistono ora\n\n    // ===== STEP 3 =====  crescita (metodo privato di servizio)\n    void cresci() {\n        cap *= 2;\n        Brano* nuovo = new Brano[cap];\n        for (int i = 0; i < n; i++) nuovo[i] = brani[i];\n        delete[] brani;\n        brani = nuovo;\n    }\n\npublic:\n    Playlist(string nomePlaylist) : nome(nomePlaylist), brani(new Brano[2]), n(0), cap(2) {\n        vive++;\n        cout << \"  + creata \\\"\" << nome << \"\\\" (vive: \" << vive << \")\" << endl;\n    }\n\n    ~Playlist() {\n        vive--;\n        cout << \"  - distrutta \\\"\" << nome << \"\\\" (vive: \" << vive << \")\" << endl;\n        delete[] brani;\n    }\n\n    // ===== STEP 4 =====  Costruttore di copia PROFONDO\n    Playlist(const Playlist& altra)\n        : nome(altra.nome + \" (copia)\"), brani(new Brano[altra.cap]), n(altra.n), cap(altra.cap) {\n        for (int i = 0; i < n; i++) brani[i] = altra.brani[i];\n        vive++;\n        cout << \"  + copiata in \\\"\" << nome << \"\\\" (vive: \" << vive << \")\" << endl;\n    }\n\n    // ===== STEP 5 =====  Operatore di assegnamento (Regola dei Tre completa)\n    Playlist& operator=(const Playlist& altra) {\n        if (this == &altra) return *this;          // autoassegnamento\n        Brano* nuovo = new Brano[altra.cap];       // prima alloco (se fallisce, non ho rotto nulla)\n        for (int i = 0; i < altra.n; i++) nuovo[i] = altra.brani[i];\n        delete[] brani;                            // poi libero il vecchio\n        brani = nuovo;\n        n = altra.n;\n        cap = altra.cap;\n        // il nome NON si copia: la playlist resta \"se stessa\"\n        return *this;\n    }\n\n    void aggiungi(const Brano& b) {\n        if (n == cap) cresci();\n        brani[n++] = b;\n    }\n\n    // ===== STEP 6 =====  Eccezione invece di un valore \"a caso\"\n    Brano& at(int i) {\n        if (i < 0 || i >= n) throw out_of_range(\"brano \" + to_string(i) + \" inesistente\");\n        return brani[i];\n    }\n\n    int durataTotale() const {\n        int s = 0;\n        for (int i = 0; i < n; i++) s += brani[i].getDurata();\n        return s;\n    }\n\n    static int quanteVive() { return vive; }      // metodo statico: niente this\n\n    void stampa() const {\n        cout << \"Playlist \\\"\" << nome << \"\\\" (\" << n << \" brani, \" << durataTotale() << \" s):\" << endl;\n        for (int i = 0; i < n; i++) {\n            cout << \"  \" << i + 1 << \". \";\n            brani[i].stampa();\n            cout << endl;\n        }\n    }\n};\n\nint Playlist::vive = 0;     // definizione dell'attributo statico (UNA volta, fuori dalla classe)\n\nint main() {\n    cout << \"=== STEP 1 ===\" << endl;\n    Brano b1(\"Volare\", \"Modugno\", 205);\n    Brano b2(\"Azzurro\");                         // delega: artista e durata di default\n    b1.stampa(); cout << endl;\n    b2.stampa(); cout << endl;\n\n    cout << \"\\n=== STEP 2-3 ===\" << endl;\n    Playlist p(\"Classici\");\n    p.aggiungi(b1);\n    p.aggiungi(b2);\n    p.aggiungi(Brano(\"Caruso\", \"Dalla\", 302));    // terzo brano: la capacità raddoppia\n    p.stampa();\n\n    cout << \"\\n=== STEP 4 ===\" << endl;\n    {\n        Playlist q = p;                          // costruttore di copia\n        q.aggiungi(Brano(\"Albachiara\", \"Vasco\", 254));\n        q.stampa();                              // 4 brani\n        p.stampa();                              // ancora 3: le copie sono indipendenti\n    }                                            // q muore qui\n\n    cout << \"\\n=== STEP 5 ===\" << endl;\n    Playlist r(\"Vuota\");\n    r = p;                                       // operator=\n    r = r;                                       // autoassegnamento: nessun danno\n    r.stampa();\n\n    cout << \"\\n=== STEP 6 ===\" << endl;\n    cout << \"Playlist vive: \" << Playlist::quanteVive() << endl;\n    try {\n        cout << \"Brano 0: \" << p.at(0).getTitolo() << endl;\n        string t = p.at(9).getTitolo();                       // lancia: si salta al catch\n        cout << \"questa riga non viene eseguita: \" << t << endl;\n    } catch (const out_of_range& e) {\n        cout << \"Errore: \" << e.what() << endl;\n    }\n    cout << \"Fine del main\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"=== STEP 1 ===\nVolare - Modugno (3:25)\nAzzurro - Sconosciuto (3:00)\n\n=== STEP 2-3 ===\n  + creata \"Classici\" (vive: 1)\nPlaylist \"Classici\" (3 brani, 687 s):\n  1. Volare - Modugno (3:25)\n  2. Azzurro - Sconosciuto (3:00)\n  3. Caruso - Dalla (5:02)\n\n=== STEP 4 ===\n  + copiata in \"Classici (copia)\" (vive: 2)\nPlaylist \"Classici (copia)\" (4 brani, 941 s):\n  1. Volare - Modugno (3:25)\n  2. Azzurro - Sconosciuto (3:00)\n  3. Caruso - Dalla (5:02)\n  4. Albachiara - Vasco (4:14)\nPlaylist \"Classici\" (3 brani, 687 s):\n  1. Volare - Modugno (3:25)\n  2. Azzurro - Sconosciuto (3:00)\n  3. Caruso - Dalla (5:02)\n  - distrutta \"Classici (copia)\" (vive: 1)\n\n=== STEP 5 ===\n  + creata \"Vuota\" (vive: 2)\nPlaylist \"Vuota\" (3 brani, 687 s):\n  1. Volare - Modugno (3:25)\n  2. Azzurro - Sconosciuto (3:00)\n  3. Caruso - Dalla (5:02)\n\n=== STEP 6 ===\nPlaylist vive: 2\nBrano 0: Volare\nErrore: brano 9 inesistente\nFine del main\n  - distrutta \"Vuota\" (vive: 1)\n  - distrutta \"Classici\" (vive: 0)\n"}},{"id":"m04-e01","modulo":4,"tipo":"es","numero":1,"titolo":"Rettangolo flessibile","difficolta":"facile","testo":"<p>Classe <code>Rettangolo<\/code> con un <b>unico<\/b> costruttore a parametri di default (<code>Rettangolo(double b = 1, double h = 1)<\/code>) che usa la lista di inizializzazione e corregge i valori non positivi. Metodi <code>const<\/code>: <code>area<\/code>, <code>perimetro<\/code>, <code>diagonale<\/code>, <code>isQuadrato<\/code>. Crea un <code>const Rettangolo<\/code> e verifica quali metodi puoi chiamare. (È l'esercizio delle slide del corso.)<\/p>","soluzione":{"commento":"","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 4.1 - Rettangolo con parametri di default e lista di inizializzazione\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\nclass Rettangolo {\nprivate:\n    double base, altezza;\n\npublic:\n    // Un solo costruttore copre tre casi: R(), R(b), R(b, h)\n    Rettangolo(double b = 1, double h = 1) : base(b > 0 ? b : 1), altezza(h > 0 ? h : 1) {}\n\n    double getBase() const { return base; }\n    double getAltezza() const { return altezza; }\n    bool setBase(double b) { if (b <= 0) return false; base = b; return true; }\n    bool setAltezza(double h) { if (h <= 0) return false; altezza = h; return true; }\n\n    double area() const { return base * altezza; }\n    double perimetro() const { return 2 * (base + altezza); }\n    double diagonale() const { return sqrt(base * base + altezza * altezza); }\n    bool isQuadrato() const { return base == altezza; }\n\n    void stampa() const {\n        cout << base << \"x\" << altezza << \": area \" << area() << \", perimetro \"\n             << perimetro() << \", diagonale \" << diagonale()\n             << (isQuadrato() ? \" (quadrato)\" : \"\") << endl;\n    }\n};\n\nint main() {\n    Rettangolo r1;            // 1 x 1\n    Rettangolo r2(4);         // 4 x 1\n    Rettangolo r3(3, 4);      // 3 x 4\n    Rettangolo r4(-2, 5);     // base non valida -> 1\n    r1.stampa(); r2.stampa(); r3.stampa(); r4.stampa();\n    const Rettangolo fisso(2, 2);\n    cout << \"Area del rettangolo costante: \"
