 a memoria già liberata","memoria allocata con <code>new<\/code> che non viene più liberata e non è più raggiungibile","l'uso di una variabile non inizializzata","un accesso fuori dai limiti di un array"],"giusta":1,"commento":"<p>La A è un dangling pointer.<\/p>"},{"id":"esame-q05","modulo":0,"rif":4,"domanda":"<p>Quando è necessario scrivere costruttore di copia, <code>operator=<\/code> e distruttore?<\/p>","opzioni":["sempre, in ogni classe","quando la classe ha attributi <code>private<\/code>","quando la classe gestisce risorse dinamiche (ad esempio memoria allocata con <code>new<\/code>)","solo nelle classi template"],"giusta":2,"commento":"<p>Regola dei Tre.<\/p>"},{"id":"esame-q06","modulo":0,"rif":4,"domanda":"<p>In che ordine vengono distrutti due oggetti locali <code>a<\/code> e <code>b<\/code>, dichiarati in quest'ordine?<\/p>","opzioni":["prima <code>a<\/code>, poi <code>b<\/code>","prima <code>b<\/code>, poi <code>a<\/code>","in ordine casuale","non vengono distrutti: serve <code>delete<\/code>"],"giusta":1,"commento":"<p>Gli oggetti locali vengono distrutti in ordine inverso di creazione.<\/p>"},{"id":"esame-q07","modulo":0,"rif":5,"domanda":"<p>Perché il codice di una classe template si scrive tutto nel file header?<\/p>","opzioni":["perché i template non possono avere metodi","perché il compilatore deve vedere il codice completo per generare la versione per ogni tipo usato","per renderlo più veloce in esecuzione","è solo una convenzione di stile"],"giusta":1,"commento":""},{"id":"esame-q08","modulo":0,"rif":6,"domanda":"<p>T(n) = 3n² + 5nlog n + 100. Qual è la complessità?<\/p>","opzioni":["O(n log n)","O(100)","O(n³)","O(n²)"],"giusta":3,"commento":"<p>Si tiene il termine che cresce di più: n² cresce più di n log n.<\/p>"},{"id":"esame-q09","modulo":0,"rif":6,"domanda":"<p>Qual è la complessità di <code>for (i = 0; i &lt; n; i++) for (j = 0; j &lt; i; j++) c++;<\/code>?<\/p>","opzioni":["O(n)","O(n²)","O(n log n)","O(2ⁿ)"],"giusta":1,"commento":"<p>Il ciclo interno fa 0 + 1 + … + (n-1) giri, circa n²/2.<\/p>"},{"id":"esame-q10","modulo":0,"rif":7,"domanda":"<p>Quale condizione è necessaria per la ricerca binaria?<\/p>","opzioni":["l'array deve essere ordinato","l'array deve avere lunghezza pari","gli elementi devono essere distinti","l'array deve essere allocato dinamicamente"],"giusta":0,"commento":""},{"id":"esame-q11","modulo":0,"rif":7,"domanda":"<p>Quale algoritmo ha costo O(n log n) anche nel caso peggiore?<\/p>","opzioni":["quick sort","insertion sort","merge sort","bubble sort"],"giusta":2,"commento":"<p>Il quick sort è O(n²) nel caso peggiore.<\/p>"},{"id":"esame-q12","modulo":0,"rif":8,"domanda":"<p>Cosa succede eseguendo una funzione ricorsiva senza caso base?<\/p>","opzioni":["restituisce 0","il compilatore la trasforma in un ciclo","le chiamate si accumulano finché lo stack si esaurisce (stack overflow)","viene eseguita una sola volta"],"giusta":2,"commento":""},{"id":"esame-q13","modulo":0,"rif":9,"domanda":"<p><code>Base* p = new Derivata; delete p;<\/code> – perché il distruttore di <code>Base<\/code> dovrebbe essere <code>virtual<\/code>?<\/p>","opzioni":["perché altrimenti <code>delete<\/code> non compila","perché altrimenti viene eseguito solo il distruttore di <code>Base<\/code> e le risorse di <code>Derivata<\/code> non vengono liberate","perché i distruttori sono sempre virtuali","per poter chiamare il distruttore esplicitamente"],"giusta":1,"commento":"<p>Senza <code>virtual<\/code> il binding è statico: decide il tipo del puntatore, <code>Base*<\/code>.<\/p>"},{"id":"esame-q14","modulo":0,"rif":9,"domanda":"<p>Una classe con almeno un metodo virtuale puro:<\/p>","opzioni":["non può essere istanziata","non può avere costruttori","non può avere attributi","non può essere usata come tipo di un puntatore"],"giusta":0,"commento":"<p>Può però avere costruttori, attributi, ed essere tipo di puntatori.<\/p>"},{"id":"esame-q15","modulo":0,"rif":10,"domanda":"<p>Perché <code>operator&lt;&lt;<\/code> per stampare un oggetto si definisce come funzione esterna (non metodo)?<\/p>","opzioni":["perché gli operatori non possono essere metodi","perché l'operando sinistro è un <code>ostream<\/code>, non un oggetto della nostra classe","perché deve essere <code>static<\/code>","per renderlo virtuale"],"giusta":1,"commento":"<p>In <code>cout &lt;&lt; x<\/code> l'operando sinistro è <code>cout<\/code>: un metodo dovrebbe appartenere a <code>ostream<\/code>.<\/p>"},{"id":"esame-q16","modulo":0,"rif":11,"domanda":"<p>Qual è il costo dell'inserimento in testa in una lista semplicemente concatenata con n elementi?<\/p>","opzioni":["O(1)","O(log n)","O(n)","O(n²)"],"giusta":0,"commento":""},{"id":"esame-q17","modulo":0,"rif":12,"domanda":"<p>Su una pila vuota si eseguono: push(1), push(2), push(3), pop, pop, push(4), pop. Quali valori restituiscono i tre pop, in ordine?<\/p>","opzioni":["1 2 4","3 2 4","3 2 1","1 2 3"],"giusta":1,"commento":"<p>Dopo i tre push la pila è 1 2 3 (cima 3): pop dà 3, pop dà 2; push(4) mette 4 in cima, pop dà 4.<\/p>"},{"id":"esame-q18","modulo":0,"rif":13,"domanda":"<p>In un BST si cancella un nodo con due figli. Chi ne prende il posto?<\/p>","opzioni":["il figlio sinistro","la radice","una foglia qualsiasi","il successore (minimo del sottoalbero destro)"],"giusta":3,"commento":""},{"id":"esame-q19","modulo":0,"rif":14,"domanda":"<p>Quale visita di un grafo calcola le distanze minime (in numero di archi) da una sorgente?<\/p>","opzioni":["la DFS","la BFS","la visita in-order","l'ordinamento topologico"],"giusta":1,"commento":""},{"id":"esame-q20","modulo":0,"rif":10,"domanda":"<p>Cosa dovrebbe restituire <code>operator=<\/code> di una classe <code>T<\/code>?<\/p>","opzioni":["<code>void<\/code>","una copia di <code>*this<\/code> (tipo <code>T<\/code>)","un riferimento a <code>*this<\/code> (tipo <code>T&amp;<\/code>)","<code>bool<\/code>"],"giusta":2,"commento":"<p>Così si possono concatenare gli assegnamenti (<code>a = b = c<\/code>) senza copie inutili.<\/p>"}],"orale":[{"id":"m01-o01","modulo":1,"domanda":"Che differenza c'è tra classe e oggetto?","risposta":"<p>La classe è la <b>descrizione<\/b> di un tipo di oggetti: stabilisce quali attributi e quali metodi avranno, ed esiste solo nel codice. L'oggetto è un'<b>istanza<\/b> concreta della classe, creata in memoria durante l'esecuzione, con i propri valori degli attributi, cioè il suo stato. Da una classe si possono creare molti oggetti con la stessa struttura e stato diverso. I metodi invece non vengono duplicati: il codice è uno solo, condiviso da tutti gli oggetti.<\/p>"},{"id":"m01-o02","modulo":1,"domanda":"Incapsulamento e information hiding sono la stessa cosa?","risposta":"<p>No. L'<b>incapsulamento<\/b> è raccogliere in un'unica unità, la classe, i dati e i metodi che li manipolano. L'<b>information hiding<\/b> è nascondere all'esterno i dettagli interni, lasciando visibile solo l'interfaccia pubblica; in C++ si ottiene con <code>private<\/code> e <code>public<\/code>. I vantaggi sono tre: i dati non possono finire in stati non validi, perché si modificano solo tramite metodi che li controllano; l'implementazione si può cambiare senza toccare il codice che usa la classe; gli errori sono più facili da trovare, perché i dati si modificano in pochi punti.<\/p>"},{"id":"m01-o03","modulo":1,"domanda":"Cos'è il polimorfismo e come si realizza?","risposta":"<p>È la capacità di uno stesso messaggio di produrre comportamenti diversi a seconda dell'oggetto che lo riceve. Ad esempio <code>accelera()<\/code> ha un'implementazione diversa in <code>Automobile<\/code> e in <code>Moto<\/code>. Se una variabile di tipo “veicolo” può riferirsi a entrambe, il metodo giusto deve essere scelto <b>durante l'esecuzione<\/b>: è il <b>collegamento dinamico<\/b>. In C++ si ottiene con i metodi <code>virtual<\/code> (Modulo 9).<\/p>"},{"id":"m01-o04","modulo":1,"domanda":"Differenza tra associazione, aggregazione e composizione?","risposta":"<p>Sono relazioni via via più forti. L'<b>associazione<\/b> è una relazione d'uso: una classe usa l'altra, ad esempio inviandole messaggi o ricevendone un oggetto come parametro. L'<b>aggregazione<\/b> è una relazione intero–parte in cui la parte è un attributo dell'intero ma può esistere indipendentemente o appartenere a più interi (Azienda–Persona). La <b>composizione<\/b> è un'aggregazione con appartenenza esclusiva: la parte appartiene a un solo intero alla volta (Automobile–Pneumatico).<\/p>"},{"id":"m01-o05","modulo":1,"domanda":"Cos'è un messaggio e quali parti ha?","risposta":"<p>Nella OOP gli oggetti interagiscono scambiandosi messaggi, cioè richieste di attivare un metodo. Un messaggio ha tre parti: il <b>destinatario<\/b> (l'oggetto che lo riceve), il <b>selettore<\/b> (il metodo da attivare) e gli <b>argomenti<\/b> (i parametri passati). In C++ un messaggio si scrive <code>destinatario.selettore(argomenti)<\/code>. L'effetto è un'azione o un cambiamento dello stato del destinatario.<\/p>"},{"id":"m02-o01","modulo":2,"domanda":"Che cos'è uno stream?","risposta":"<p>È un oggetto che fa da <b>intermediario<\/b> tra il programma e una sorgente o destinazione di dati: tastiera, schermo, file o stringa. Il programma usa sempre la stessa interfaccia (<code>&gt;&gt;<\/code> per estrarre, <code>&lt;&lt;<\/code> per inserire), indipendentemente dal dispositivo. Gli stream standard sono <code>cin<\/code> (input da tastiera), <code>cout<\/code> (output su schermo) e <code>cerr<\/code> (messaggi di errore, non bufferizzato). Lo stream mantiene anche dei flag di stato: ad esempio, se una lettura fallisce si attiva il <i>failbit<\/i>.<\/p>"},{"id":"m02-o02","modulo":2,"domanda":"Cos'è un namespace? Perché evitare using namespace std negli header?","risposta":"<p>Un namespace è un ambito con nome che raggruppa identificatori per evitare collisioni: due funzioni con lo stesso nome possono convivere in namespace diversi e si distinguono con l'operatore di scope <code>::<\/code>. La libreria standard sta nel namespace <code>std<\/code>. <code>using namespace std;<\/code> rende visibili tutti i suoi nomi senza prefisso. In un header è sconsigliato perché <code>#include<\/code> è un copia-incolla: la direttiva finirebbe in ogni file che include l'header, con possibili conflitti di nomi.<\/p>"},{"id":"m02-o03","modulo":2,"domanda":"Quali sono le fasi della compilazione?","risposta":"<p>Prima il <b>preprocessore<\/b> esegue le direttive <code>#<\/code>: inclusione di file, macro, include guard. Poi il <b>compilatore<\/b> traduce ogni unità di traduzione in codice oggetto, controllando sintassi e tipi. Infine il <b>linker<\/b> collega i file oggetto tra loro e con le librerie e produce l'eseguibile. Una funzione dichiarata ma mai definita supera la compilazione ma dà errore al linker (<i>undefined reference<\/i>).<\/p>"},{"id":"m02-o04","modulo":2,"domanda":"Come si gestisce un input non valido?","risposta":"<p>Se l'estrazione non riesce a convertire i caratteri nel tipo richiesto, lo stream imposta il failbit e le letture successive vengono ignorate. Si controlla con <code>cin.fail()<\/code>. Poi si chiama <code>cin.clear()<\/code> per azzerare i flag e <code>cin.ignore(numeric_limits&lt;streamsize&gt;::max(), '\\n')<\/code> per scartare i caratteri errati rimasti nel buffer. Di solito tutto questo sta in un ciclo che richiede il dato finché non è valido.<\/p>"},{"id":"m02-o05","modulo":2,"domanda":"Che differenza c'è tra scope e tempo di vita di una variabile?","risposta":"<p>Lo <b>scope<\/b> è la porzione di codice in cui il nome della variabile è visibile; il <b>tempo di vita<\/b> è l'intervallo di tempo, durante l'esecuzione, in cui la variabile esiste in memoria. Per una variabile locale coincidono quasi: nasce quando si entra nel blocco e muore quando se ne esce. Una variabile globale ha scope su tutto il file e vive per tutta l'esecuzione. Se una variabile interna ha lo stesso nome di una esterna la nasconde (shadowing); la globale resta raggiungibile con <code>::nome<\/code>.<\/p>"},{"id":"m03-o01","modulo":3,"domanda":"Differenza tra puntatore e reference?","risposta":"<p>Un puntatore è una variabile che contiene l'indirizzo di un'altra variabile: ha un proprio indirizzo, può essere nullo, può essere spostato su un'altra variabile e per accedere al valore va dereferenziato con <code>*<\/code>. Una reference è un alias di una variabile esistente: va inizializzata nella dichiarazione, non può essere nulla, non può essere spostata e si usa con la sintassi di una variabile normale. Internamente il compilatore la realizza come un puntatore costante dereferenziato automaticamente.<\/p>"},{"id":"m03-o02","modulo":3,"domanda":"Che differenza c'è tra stack e heap?","risposta":"<p>Lo stack contiene le variabili automatiche, cioè locali e parametri: vengono allocate quando si entra nella funzione, nel suo record di attivazione, e distrutte automaticamente quando la funzione termina; la loro dimensione deve essere nota a compile-time. Lo heap contiene la memoria dinamica, allocata a run-time con <code>new<\/code>, di dimensione decisa anche durante l'esecuzione: resta allocata finché il programmatore non la libera con <code>delete<\/code>, perché in C++ non c'è un garbage collector.<\/p>"},{"id":"m03-o03","modulo":3,"domanda":"Cosa sono memory leak e dangling pointer?","risposta":"<p>Un <b>memory leak<\/b> si verifica quando un blocco di heap non è più raggiungibile da nessun puntatore e quindi non può più essere liberato: ad esempio quando si riassegna un puntatore senza aver fatto <code>delete<\/code>. Un <b>dangling pointer<\/b> è un puntatore che contiene l'indirizzo di memoria non più valida: dopo un <code>delete<\/code>, o quando punta a una variabile locale di una funzione già terminata. Dereferenziarlo è comportamento indefinito. Si previene assegnando <code>nullptr<\/code> dopo il <code>delete<\/code>.<\/p>"},{"id":"m03-o04","modulo":3,"domanda":"Perché un array passato a una funzione “perde” la dimensione?","risposta":"<p>Perché nel passaggio il nome dell'array decade nel puntatore al primo elemento: <code>int v[]<\/code> come parametro equivale a <code>int* v<\/code>. Alla funzione arriva solo un indirizzo, e <code>sizeof(v)<\/code> restituisce la dimensione del puntatore. Per questo la dimensione si passa come parametro separato. Gli array sono di fatto sempre passati per indirizzo: la funzione può modificarne gli elementi, a meno che il parametro non sia dichiarato <code>const<\/code>.<\/p>"},{"id":"m03-o05","modulo":3,"domanda":"Quali differenze ci sono tra new/delete e malloc/free?","risposta":"<p><code>new<\/code> e <code>delete<\/code> sono operatori del linguaggio, non funzioni di libreria: non richiedono header né cast, perché il tipo restituito è già quello giusto, e calcolano da soli la dimensione da allocare in base al tipo. Soprattutto, <code>new<\/code> chiama il <b>costruttore<\/b> dell'oggetto creato e <code>delete<\/code> ne chiama il <b>distruttore<\/b>, mentre <code>malloc<\/code> e <code>free<\/code> si limitano a riservare e liberare byte. Per gli array si usano le forme <code>new[]<\/code> e <code>delete[]<\/code>.<\/p>"},{"id":"m04-o01","modulo":4,"domanda":"Cosa sono costruttore e distruttore?","risposta":"<p>Sono metodi speciali invocati automaticamente. Il costruttore viene eseguito quando un oggetto viene creato: ha lo stesso nome della classe, nessun tipo di ritorno, può avere parametri e può essere sovraccaricato; serve a portare l'oggetto in uno stato iniziale valido. Il distruttore viene eseguito quando l'oggetto viene distrutto (fine del blocco, <code>delete<\/code>, fine del programma): si chiama come la classe preceduto da <code>~<\/code>, non ha parametri né tipo di ritorno ed è unico. Serve a rilasciare le risorse acquisite dall'oggetto, tipicamente la memoria dinamica allocata nel costruttore.<\/p>"},{"id":"m04-o02","modulo":4,"domanda":"Differenza tra copia superficiale e copia profonda?","risposta":"<p>Se una classe non definisce il costruttore di copia, il compilatore copia gli attributi membro a membro. Se un attributo è un puntatore viene copiato l'indirizzo, e i due oggetti condividono lo stesso blocco di heap: è la copia superficiale. Le conseguenze sono modifiche incrociate, dangling pointer e doppia deallocazione da parte dei distruttori. La copia profonda alloca invece per la copia un nuovo blocco e vi copia il contenuto, rendendo i due oggetti indipendenti; si ottiene definendo il costruttore di copia e l'operatore di assegnamento.<\/p>"},{"id":"m04-o03","modulo":4,"domanda":"Quando viene chiamato il costruttore di copia e quando operator=?","risposta":"<p>Il costruttore di copia viene chiamato quando un oggetto <b>nasce<\/b> come copia di un altro: inizializzazione (<code>Classe b = a;<\/code> o <code>Classe b(a);<\/code>), passaggio di un oggetto per valore e restituzione per valore. L'operatore di assegnamento viene chiamato quando a un oggetto <b>già esistente<\/b> se ne assegna un altro (<code>b = a;<\/code>). Per questo <code>operator=<\/code> deve prima liberare le risorse che l'oggetto possiede già e deve gestire l'autoassegnamento.<\/p>"},{"id":"m04-o04","modulo":4,"domanda":"Cos'è la Regola dei Tre?","risposta":"<p>Afferma che se una classe ha bisogno di definire esplicitamente uno tra distruttore, costruttore di copia e operatore di assegnamento, allora deve definirli tutti e tre. Il motivo è che la necessità nasce dalla gestione di una risorsa, tipicamente memoria dinamica: il distruttore la rilascia, e le versioni generate dal compilatore di copia e assegnamento la condividerebbero, causando copie superficiali e doppie deallocazioni.<\/p>"},{"id":"m04-o05","modulo":4,"domanda":"Cos'è il puntatore this e quando si usa?","risposta":"<p><code>this<\/code> è un puntatore implicito, disponibile in ogni metodo non statico, che contiene l'indirizzo dell'oggetto su cui il metodo è stato invocato; è il modo in cui un unico codice dei metodi lavora sui dati dell'oggetto giusto. Si usa per distinguere gli attributi dai parametri con lo stesso nome (<code>this-&gt;x = x<\/code>), per restituire l'oggetto stesso (<code>return *this<\/code>, come in <code>operator=<\/code>) e per verificare l'autoassegnamento (<code>this == &amp;altro<\/code>). I metodi statici non hanno <code>this<\/code>.<\/p>"},{"id":"m04-o06","modulo":4,"domanda":"Come funzionano le eccezioni in C++?","risposta":"<p>Quando una funzione incontra una situazione che non può gestire, la segnala con <code>throw<\/code>, lanciando un oggetto che descrive l'errore. L'esecuzione si interrompe e risale le chiamate finché non trova un blocco <code>try<\/code> con un <code>catch<\/code> adatto al tipo lanciato, che gestisce l'errore. La libreria <code>&lt;stdexcept&gt;<\/code> offre classi pronte come <code>invalid_argument<\/code> e <code>out_of_range<\/code>, tutte derivate da <code>exception<\/code>, il cui metodo <code>what()<\/code> restituisce il messaggio. Si catturano per reference costante. Un costruttore che lancia un'eccezione impedisce la creazione dell'oggetto.<\/p>"},{"id":"m05-o01","modulo":5,"domanda":"Cos'è un template e a cosa serve?","risposta":"<p>Un template è un modello di funzione o di classe parametrizzato su uno o più tipi, che permette di scrivere un algoritmo o una struttura dati una sola volta, indipendentemente dal tipo degli elementi su cui opera: è lo strumento della programmazione generica in C++. Il tipo viene specificato come se fosse un parametro. Si evita così di duplicare codice identico per tipi diversi, mantenendo la tipizzazione statica: i tipi sono determinati e controllati a compile-time.<\/p>"},{"id":"m05-o02","modulo":5,"domanda":"Cosa significa istanziare un template?","risposta":"<p>Significa che il compilatore, quando incontra un uso del template con un tipo concreto, genera una versione specializzata del codice sostituendo il parametro con quel tipo. Per i template di funzione il tipo viene di solito dedotto dagli argomenti, ma si può indicare esplicitamente con <code>f&lt;tipo&gt;(...)<\/code>; per i template di classe va sempre indicato (<code>Pila&lt;int&gt;<\/code>). Il codice sorgente contiene un solo template, quello compilato contiene una copia per ogni tipo usato.<\/p>"},{"id":"m05-o03","modulo":5,"domanda":"Perché i template si scrivono interamente negli header?","risposta":"<p>Perché per istanziare un template il compilatore deve vederne la definizione completa nel punto in cui viene usato. Se i corpi dei metodi stessero in un <code>.cpp<\/code> separato, compilando il file che usa il template il compilatore vedrebbe solo le dichiarazioni, e compilando il <code>.cpp<\/code> del template non saprebbe per quali tipi generarlo: il risultato è un errore del linker. Per questo dichiarazione e definizione si mettono insieme nell'header.<\/p>"},{"id":"m05-o04","modulo":5,"domanda":"Cos'è la specializzazione di un template?","risposta":"<p>È una versione alternativa del template scritta per un tipo particolare, che il compilatore usa al posto di quella generale quando il parametro è proprio quel tipo. Si scrive con <code>template &lt;&gt;<\/code> seguito dalla funzione o classe con il tipo indicato. Si usa quando l'algoritmo generale non è corretto o efficiente per quel tipo: ad esempio il confronto con <code>==<\/code> tra <code>double<\/code>, che va fatto con una tolleranza, o tra stringhe C, dove <code>==<\/code> confronterebbe gli indirizzi.<\/p>"},{"id":"m05-o05","modulo":5,"domanda":"Che requisiti deve avere un tipo per essere usato in un template?","risposta":"<p>Deve supportare tutte le operazioni che il template usa sugli oggetti di quel tipo: operatori di confronto, aritmetici, di stampa, costruttore di default se il template crea array con <code>new T[n]<\/code>, costruttore di copia e assegnamento se li copia. Se un requisito manca, l'errore emerge in compilazione al momento dell'istanziazione. Per le classi definite dall'utente bisogna quindi sovraccaricare gli operatori necessari.<\/p>"},{"id":"m06-o01","modulo":6,"domanda":"Come si misura la complessità di un algoritmo?","risposta":"<p>La si esprime in funzione della dimensione n dell'input, contando il numero di operazioni elementari eseguite (complessità temporale, nel modello RAM ogni operazione costa 1) o il numero di celle di memoria aggiuntive (complessità spaziale). Il costo di una sequenza è la somma dei costi; quello di un <code>if<\/code> è il costo della guardia più il maggiore dei due rami; quello di un ciclo è la somma dei costi di tutte le iterazioni. Di solito si considera il caso peggiore e si studia il comportamento asintotico, cioè come cresce il costo per n grande, ignorando costanti e termini di ordine inferiore.<\/p>"},{"id":"m06-o02","modulo":6,"domanda":"Cosa significa O-grande?","risposta":"<p>f(n) = O(g(n)) se esistono una costante c &gt; 0 e un n₀ tali che f(n) ≤ c · g(n) per ogni n &gt; n₀. In parole: da un certo punto in poi f non cresce più velocemente di g, a meno di una costante. È un limite superiore asintotico; non è unico, perché anche ogni funzione più grande lo è, e per questo si indica il più piccolo noto.<\/p>"},{"id":"m06-o03","modulo":6,"domanda":"Differenza tra O, Omega e Theta?","risposta":"<p>O è un limite superiore: f cresce al più come g. Ω è un limite inferiore: f cresce almeno come g, cioè f(n) ≥ c · g(n) da un certo n in poi. Θ indica che valgono entrambi, quindi f cresce esattamente come g. Per un problema, se un algoritmo ha costo O(f(n)) e si dimostra che il problema richiede Ω(f(n)), l'algoritmo è ottimo e la complessità del problema è Θ(f(n)): è il caso dell'ordinamento per confronti con n log n.<\/p>"},{"id":"m06-o04","modulo":6,"domanda":"Quali sono le principali classi di complessità?","risposta":"<p>In ordine crescente: costante O(1), logaritmica O(log n), lineare O(n), O(n log n), polinomiale (quadratica O(n²), cubica O(n³), …) ed esponenziale O(cⁿ). Un ciclo con incremento costante è lineare, uno che moltiplica o divide per una costante è logaritmico, cicli annidati moltiplicano le complessità. Gli algoritmi esponenziali sono impraticabili già per input piccoli.<\/p>"},{"id":"m06-o05","modulo":6,"domanda":"Come si analizza un algoritmo ricorsivo?","risposta":"<p>Si scrive una relazione di ricorrenza che esprime il costo per n in funzione del costo sui sottoproblemi più piccoli più il lavoro della singola chiamata. Alcune ricorrenze fondamentali: C_N = C_(N-1) + N dà O(N²); C_N = C_(N/2) + 1 dà O(log N), come la ricerca binaria; C_N = 2C_(N/2) + N dà O(N log N), tipica del divide et impera come il MergeSort. Ad esempio la potenza xⁿ calcolata come x · xⁿ⁻¹ costa O(n), mentre calcolata dimezzando l'esponente costa O(log n). Nella ricorsione va considerato anche lo spazio: ogni chiamata attiva occupa un record nello stack.<\/p>"},{"id":"m07-o01","modulo":7,"domanda":"Come funziona il merge sort e qual è la sua complessità?","risposta":"<p>È un algoritmo divide et impera: divide l'array in due metà, le ordina ricorsivamente fino ad arrivare a sottoarray di un elemento (caso base) e poi le fonde con la procedura merge, che scorre le due metà ordinate e prende ogni volta il minore dei due elementi in testa. La fusione costa O(n) e i livelli di ricorsione sono log n, perciò la complessità è O(n log n) nel caso migliore, medio e peggiore. Richiede un array d'appoggio, quindi spazio O(n), ed è stabile.<\/p>"},{"id":"m07-o02","modulo":7,"domanda":"Come funziona il quick sort? Qual è il suo caso peggiore?","risposta":"<p>Si sceglie un pivot e si partiziona l'array in modo che a sinistra ci siano gli elementi minori o uguali al pivot e a destra quelli maggiori o uguali; poi si ordinano ricorsivamente le due parti, senza bisogno di fusione. Se le partizioni sono bilanciate (anche solo in proporzione costante) la complessità è O(n log n), che è anche il caso medio. Il caso peggiore si ha quando il pivot è sempre il minimo o il massimo: le partizioni hanno dimensione 0 e n-1 e la complessità diventa O(n²), ad esempio con pivot sul primo elemento di un array già ordinato. Ordina in loco e in pratica è il più veloce.<\/p>"},{"id":"m07-o03","modulo":7,"domanda":"Differenza tra bubble, selection e insertion sort?","risposta":"<p>Sono tutti O(n²) nel caso peggiore. Il bubble sort scambia elementi adiacenti fuori ordine, portando a ogni passata il massimo in fondo; con il controllo sugli scambi termina in O(n) se l'array è ordinato. Il selection sort cerca a ogni passata il minimo della parte non ordinata e lo mette in posizione: fa sempre n(n-1)/2 confronti ma pochi scambi. L'insertion sort inserisce ogni elemento al suo posto tra i precedenti già ordinati: O(n) nel caso migliore ed efficiente su array quasi ordinati. Bubble e insertion sono stabili.<\/p>"},{"id":"m07-o04","modulo":7,"domanda":"Come funziona la ricerca binaria e perché è logaritmica?","risposta":"<p>Si applica a un array ordinato. Si confronta il valore cercato con l'elemento centrale: se coincide si è trovato; se è maggiore si prosegue nella metà destra, altrimenti nella sinistra. A ogni passo l'intervallo di ricerca si dimezza, quindi dopo al più circa log₂ n confronti l'intervallo diventa vuoto. La ricorrenza è C_N = C_(N/2) + 1, con soluzione O(log n).<\/p>"},{"id":"m07-o05","modulo":7,"domanda":"Cosa significa che un ordinamento è stabile? E in loco?","risposta":"<p>È stabile se elementi con la stessa chiave mantengono, dopo l'ordinamento, l'ordine relativo che avevano prima: ad esempio studenti già in ordine alfabetico, ordinati per voto, restano in ordine alfabetico a parità di voto. Merge, insertion e bubble sort sono stabili; selection e quick sort no. È in loco se usa solo memoria aggiuntiva costante (o al più lo stack della ricorsione): tutti tranne il merge sort, che ha bisogno di un array d'appoggio.<\/p>"},{"id":"m08-o01","modulo":8,"domanda":"Cos'è una funzione ricorsiva e quali requisiti deve avere?","risposta":"<p>Una funzione è ricorsiva quando chiama se stessa, direttamente o tramite altre funzioni. Per essere corretta deve soddisfare due requisiti: risolvere esplicitamente uno o più casi base senza chiamate ricorsive, e fare in modo che ogni chiamata ricorsiva riceva argomenti più piccoli, cioè più vicini al caso base. Il legame con l'induzione matematica permette di convincersi della correttezza: se il caso base è giusto e, supponendo corretta la soluzione per i casi più piccoli, la funzione costruisce correttamente quella per n, allora è corretta per ogni n.<\/p>"},{"id":"m08-o02","modulo":8,"domanda":"Cosa succede in memoria durante una chiamata ricorsiva?","risposta":"<p>Ogni chiamata, ricorsiva o no, crea nello stack un nuovo record di attivazione con i propri parametri, le variabili locali e l'indirizzo di ritorno. In una ricorsione ogni chiamata ha quindi una propria copia delle variabili, indipendente dalle altre. Le chiamate in attesa restano nello stack finché quelle successive non terminano; quando una chiamata restituisce il suo valore, il suo record viene rimosso e la precedente riprende da dove si era interrotta. Lo spazio occupato è proporzionale alla profondità massima della ricorsione: se è troppo grande si ha uno stack overflow.<\/p>"},{"id":"m08-o03","modulo":8,"domanda":"Ricorsione o iterazione: vantaggi e svantaggi?","risposta":"<p>Ogni problema risolvibile ricorsivamente si può risolvere anche iterativamente. La ricorsione ha costi aggiuntivi: tempo per gestire ogni chiamata e memoria nello stack per le chiamate in sospeso. Ad esempio la potenza ricorsiva usa spazio O(n), quella iterativa spazio costante. In compenso, per molti problemi le soluzioni ricorsive sono più semplici, più brevi e rispecchiano direttamente la strategia di soluzione, come nel divide et impera; spesso si possono poi trasformare in versioni iterative più efficienti.<\/p>"},{"id":"m08-o04","modulo":8,"domanda":"Cos'è la ricorsione di coda?","risposta":"<p>Una funzione è ricorsiva di coda quando la chiamata ricorsiva è l'ultima operazione eseguita e il suo risultato viene restituito senza ulteriori elaborazioni. Ad esempio l'algoritmo di Euclide <code>return mcd(b, a % b);<\/code> è di coda, mentre <code>return n * fatt(n - 1);<\/code> non lo è, perché dopo la chiamata va eseguita la moltiplicazione. Una ricorsione di coda si trasforma direttamente in un ciclo, e molti compilatori lo fanno automaticamente, eliminando il costo dello stack. Spesso si ottiene aggiungendo un parametro accumulatore.<\/p>"},{"id":"m08-o05","modulo":8,"domanda":"Come si calcola la complessità di una funzione ricorsiva?","risposta":"<p>Si scrive una relazione di ricorrenza che esprime il costo per input di dimensione n in funzione del costo delle chiamate su input più piccoli più il lavoro della singola chiamata. In modo pratico: numero totale di chiamate per il lavoro di ciascuna. Il fattoriale fa n + 1 chiamate di costo costante, quindi O(n); il massimo con divide et impera fa circa 2n chiamate, O(n); la torre di Hanoi 2ⁿ - 1 mosse, O(2ⁿ). Per lo spazio si considera la profondità massima della ricorsione.<\/p>"},{"id":"m09-o01","modulo":9,"domanda":"Cos'è l'ereditarietà e come si differenzia una sottoclasse?","risposta":"<p>L'ereditarietà permette di costruire una nuova classe a partire da una esistente: la classe derivata riceve tutti gli attributi e i metodi della classe base e può differenziarsene per estensione, aggiungendo nuovi attributi e metodi, o per ridefinizione, fornendo una nuova implementazione di metodi ereditati. Esprime la relazione “è un”. In C++ si scrive <code>class Derivata : public Base<\/code>; lo specificatore (public, protected, private) stabilisce con che livello di accesso i membri ereditati sono esposti. I membri privati della base sono ereditati ma non accessibili dalla derivata; quelli protected sì.<\/p>"},{"id":"m09-o02","modulo":9,"domanda":"Differenza tra binding statico e dinamico?","risposta":"<p>Il binding è l'associazione tra una chiamata e il codice da eseguire. Nel binding statico l'associazione è fatta dal compilatore in base al tipo dichiarato del puntatore o della variabile; in quello dinamico è fatta durante l'esecuzione in base al tipo effettivo dell'oggetto. In C++ il default è statico; per avere il dinamico si dichiara il metodo <code>virtual<\/code> nella classe base. Il binding dinamico realizza il polimorfismo e si implementa tramite le tabelle dei metodi virtuali: ogni oggetto ha un puntatore nascosto alla vtable della propria classe. È più flessibile ma leggermente meno efficiente.<\/p>"},{"id":"m09-o03","modulo":9,"domanda":"Cos'è una classe astratta?","risposta":"<p>È una classe con almeno un metodo virtuale puro, dichiarato con <code>= 0<\/code> e privo di implementazione. Non si possono creare oggetti di una classe astratta, ma si possono usare puntatori e reference al suo tipo. Serve a definire un'interfaccia comune per una gerarchia, cioè quali operazioni devono offrire tutte le classi derivate. Una classe derivata è istanziabile solo se ridefinisce tutti i metodi virtuali puri ereditati.<\/p>"},{"id":"m09-o04","modulo":9,"domanda":"Perché il distruttore della base deve essere virtuale?","risposta":"<p>Perché quando si distrugge con <code>delete<\/code> un oggetto derivato tramite un puntatore alla base, se il distruttore non è virtuale si applica il binding statico e viene eseguito solo il distruttore della base: la parte derivata non viene distrutta e le sue risorse, ad esempio la memoria dinamica, non vengono liberate. Formalmente è comportamento indefinito. Con il distruttore virtuale vengono eseguiti, in ordine, il distruttore della derivata e poi quello della base.<\/p>"},{"id":"m09-o05","modulo":9,"domanda":"Cos'è il principio di sostituzione di Liskov?","risposta":"<p>Afferma che se S è un sottotipo di T, gli oggetti di tipo T possono essere sostituiti da oggetti di tipo S senza alterare le proprietà desiderabili del programma. In C++ ne deriva che dove è richiesto un oggetto della classe base (tramite puntatore o reference) si può usare un oggetto di una classe derivata: ad esempio una funzione che accetta una <code>Persona&amp;<\/code> accetta anche uno <code>Studente<\/code>, ma non il contrario. È ciò che permette di gestire oggetti di tipi diversi in modo uniforme, ad esempio in un array di puntatori alla base.<\/p>"},{"id":"m09-o06","modulo":9,"domanda":"Cosa sono dynamic_cast e typeid?","risposta":"<p>Fanno parte dell'RTTI e permettono di conoscere a run-time il tipo effettivo di un oggetto di una classe polimorfica. <code>dynamic_cast&lt;Derivata*&gt;(p)<\/code> converte un puntatore alla base in uno alla derivata se l'oggetto è di quel tipo (o di un suo sottotipo), altrimenti restituisce <code>nullptr<\/code>; sulle reference, in caso di fallimento, lancia <code>bad_cast<\/code>. <code>typeid(*p)<\/code> restituisce le informazioni sul tipo esatto dell'oggetto e si usa per confronti come <code>typeid(*p) == typeid(Cane)<\/code>.<\/p>"},{"id":"m10-o01","modulo":10,"domanda":"Cos'è l'overloading degli operatori?","risposta":"<p>È la possibilità di definire il comportamento degli operatori del linguaggio (<code>+<\/code>, <code>==<\/code>, <code>&lt;&lt;<\/code>, <code>[]<\/code>, …) quando gli operandi sono oggetti di classi definite dall'utente, così da usarli con la stessa sintassi dei tipi predefiniti. Un operatore è una funzione con un nome speciale, <code>operator<\/code>: l'espressione <code>a + b<\/code> viene tradotta in <code>a.operator+(b)<\/code> se l'operatore è un metodo, o in <code>operator+(a, b)<\/code> se è una funzione esterna. Non si possono creare nuovi operatori né cambiarne precedenza o numero di operandi, e alcuni (<code>::<\/code>, <code>.<\/code>, <code>?:<\/code>, <code>sizeof<\/code>) non si possono sovraccaricare.<\/p>"},{"id":"m10-o02","modulo":10,"domanda":"Quando un operatore va definito come metodo e quando come funzione esterna?","risposta":"<p>Come metodo, l'operando sinistro è l'oggetto stesso (<code>*this<\/code>): è obbligatorio per <code>=<\/code>, <code>[]<\/code> e <code>()<\/code>, e naturale per gli operatori composti e unari. Come funzione esterna entrambi gli operandi sono parametri: è necessario quando l'operando sinistro non è un oggetto della classe, come per <code>&lt;&lt;<\/code> e <code>&gt;&gt;<\/code> con gli stream, ed è preferibile per gli operatori simmetrici, perché consente conversioni implicite su entrambi gli operandi. Se la funzione esterna deve accedere ai membri privati, la classe la dichiara <code>friend<\/code>.<\/p>"},{"id":"m10-o03","modulo":10,"domanda":"Cosa sono le funzioni friend? Violano l'incapsulamento?","risposta":"<p>Una funzione <code>friend<\/code> è una funzione non membro a cui una classe concede l'accesso ai propri membri privati e protetti, dichiarandola con la parola <code>friend<\/code> all'interno della propria definizione. Non viola l'incapsulamento, perché è la classe stessa a decidere chi sono i suoi amici: nessuna funzione esterna può dichiararsi amica da sola. L'uso tipico è l'overloading degli operatori di input/output, che uniforma l'interfaccia della classe a quella degli stream standard.<\/p>"},{"id":"m10-o04","modulo":10,"domanda":"Perché operator&lt;&lt; restituisce un riferimento allo stream?","risposta":"<p>Perché l'espressione <code>cout &lt;&lt; a &lt;&lt; b<\/code> viene valutata come <code>(cout &lt;&lt; a) &lt;&lt; b<\/code>: il risultato della prima chiamata è l'operando sinistro della seconda. Restituendo lo stesso stream ricevuto si permette la concatenazione. Si restituisce per riferimento perché gli stream non sono copiabili e perché la scrittura deve avvenire sempre sullo stesso stream.<\/p>"},{"id":"m10-o05","modulo":10,"domanda":"Come si distinguono ++ prefisso e postfisso?","risposta":"<p>Il prefisso <code>++a<\/code> si dichiara <code>T&amp; operator++()<\/code>: incrementa l'oggetto e restituisce l'oggetto stesso per riferimento. Il postfisso <code>a++<\/code> si dichiara <code>T operator++(int)<\/code>: il parametro <code>int<\/code> è fittizio e serve solo al compilatore per distinguere le due versioni; salva una copia del valore corrente, incrementa l'oggetto e restituisce la copia per valore. Per questo il postfisso è leggermente meno efficiente.<\/p>"},{"id":"m11-o01","modulo":11,"domanda":"Differenze tra array e lista concatenata?","risposta":"<p>Nell'array gli elementi occupano locazioni contigue, quindi l'accesso all'i-esimo è diretto, in O(1); la dimensione però è fissa, e inserimenti e rimozioni in mezzo richiedono di spostare elementi, in O(n). Nella lista ogni nodo contiene il valore e il puntatore al successivo, e i nodi possono stare ovunque in memoria: l'accesso è sequenziale, in O(i), ma la dimensione cresce e cala dinamicamente e inserimenti e rimozioni, noto il punto in cui farli, costano O(1). La lista occupa più memoria per via dei puntatori e non permette la ricerca binaria.<\/p>"},{"id":"m11-o02","modulo":11,"domanda":"Come si rimuove un elemento da una lista semplice?","risposta":"<p>Si scorre la lista con due puntatori: <code>pos<\/code> sul nodo corrente e <code>ant<\/code> sul precedente, finché <code>pos<\/code> non punta al nodo da rimuovere. Se <code>ant<\/code> è nullo il nodo è la testa, e la testa diventa <code>pos-&gt;succ<\/code>; altrimenti si fa puntare <code>ant-&gt;succ<\/code> a <code>pos-&gt;succ<\/code>, scavalcando il nodo. Infine si libera la memoria del nodo con <code>delete<\/code>. La ricerca costa O(n); lo scollegamento O(1).<\/p>"},{"id":"m11-o03","modulo":11,"domanda":"Cos'è una lista doppiamente concatenata? Vantaggi e svantaggi?","risposta":"<p>È una lista in cui ogni nodo contiene, oltre al valore, due puntatori: al successivo e al precedente. Permette di scorrere la lista in entrambe le direzioni e di rimuovere un nodo di cui si conosce l'indirizzo in O(1), senza cercarne il predecessore. Gli svantaggi sono la memoria per il puntatore aggiuntivo e il fatto che ogni inserimento o rimozione richiede di aggiornare più collegamenti.<\/p>"},{"id":"m11-o04","modulo":11,"domanda":"Cos'è una lista circolare con sentinella?","risposta":"<p>In una lista circolare l'ultimo nodo è collegato al primo. La sentinella è un nodo speciale, sempre presente, che non contiene informazione utile e marca l'inizio e la fine della lista. In una lista doppia circolare con sentinella il primo elemento è il successore della sentinella e l'ultimo il suo predecessore, entrambi accessibili in O(1); inoltre ogni nodo ha sempre un precedente e un successivo, per cui spariscono i casi particolari di lista vuota, inserimento in testa e in coda.<\/p>"},{"id":"m11-o05","modulo":11,"domanda":"Perché una classe lista ha bisogno della Regola dei Tre?","risposta":"<p>Perché possiede risorse dinamiche: i nodi allocati con <code>new<\/code>. Il distruttore deve scorrere la lista e liberare ogni nodo. Senza un costruttore di copia e un operatore di assegnamento scritti a mano, la copia generata dal compilatore copierebbe solo il puntatore alla testa: le due liste condividerebbero i nodi e alla distruzione si avrebbe una doppia deallocazione. La copia corretta crea nuovi nodi con gli stessi valori; in alternativa si può vietare la copia dichiarando quei metodi <code>= delete<\/code>.<\/p>"},{"id":"m12-o01","modulo":12,"domanda":"Cos'è una pila e come si implementa?","risposta":"<p>Una pila è una struttura dati lineare a cui si accede da un solo estremo, la cima, gestita con politica LIFO: l'ultimo elemento inserito è il primo a essere estratto. Le operazioni sono <code>push<\/code> (inserimento in cima), <code>pop<\/code> (rimozione dalla cima), <code>top<\/code> (lettura della cima) e il test di pila vuota. Con un array si usa un indice che segna la cima, incrementato a ogni <code>push<\/code>; la capacità è fissa e la pila può essere piena. Con una lista concatenata la cima è la testa della lista: <code>push<\/code> e <code>pop<\/code> sono inserimento e rimozione in testa, in O(1), senza limiti di capacità. Estrarre da una pila vuota provoca un underflow.<\/p>"},{"id":"m12-o02","modulo":12,"domanda":"Cos'è una coda e come si implementa?","risposta":"<p>Una coda è una struttura lineare gestita con politica FIFO: gli elementi si inseriscono in fondo (<code>enqueue<\/code>) e si rimuovono dalla testa (<code>dequeue<\/code>), nello stesso ordine in cui sono entrati; <code>front<\/code> legge l'elemento in testa. Con una lista concatenata si mantengono due puntatori, alla testa e al fondo, così entrambe le operazioni sono O(1). Con un array si usa una coda circolare: un indice di inizio e il numero di elementi, con gli indici calcolati modulo la dimensione, per non dover spostare elementi.<\/p>"},{"id":"m12-o03","modulo":12,"domanda":"Pila su array o su lista: vantaggi e svantaggi?","risposta":"<p>Su array l'accesso è molto veloce e non c'è spazio extra per i puntatori, ma la capacità è fissata: la pila può riempirsi, oppure va riallocata raddoppiando, con un costo occasionale O(n). Su lista la dimensione è illimitata e ogni operazione è O(1), ma ogni elemento occupa memoria in più per il puntatore e ogni <code>push<\/code> richiede un'allocazione dinamica.<\/p>"},{"id":"m12-o04","modulo":12,"domanda":"Fai un esempio di uso della pila.","risposta":"<p>Il controllo delle parentesi bilanciate: si scorre l'espressione, si fa <code>push<\/code> di ogni parentesi aperta e, per ogni parentesi chiusa, si fa <code>pop<\/code> verificando che corrisponda; l'espressione è bilanciata se non si incontrano errori e alla fine la pila è vuota. Altri esempi: la valutazione di espressioni in notazione postfissa, l'annulla/ripeti negli editor e soprattutto lo stack delle chiamate di funzione, che è una pila di record di attivazione.<\/p>"},{"id":"m13-o01","modulo":13,"domanda":"Cos'è un albero binario di ricerca?","risposta":"<p>È un albero binario in cui per ogni nodo x tutte le chiavi del sottoalbero sinistro sono minori della chiave di x e tutte quelle del sottoalbero destro sono maggiori o uguali. Questa proprietà permette di cercare un valore scendendo dalla radice e scegliendo a ogni nodo un solo sottoalbero, come nella ricerca binaria. Ricerca, inserimento, cancellazione, minimo e massimo costano O(h), dove h è l'altezza: O(log n) se l'albero è bilanciato, O(n) se è degenere. La visita in-order restituisce le chiavi in ordine crescente.<\/p>"},{"id":"m13-o02","modulo":13,"domanda":"Quali sono le visite di un albero binario?","risposta":"<p>Le tre visite in profondità, definite ricorsivamente, differiscono per il momento in cui si visita la radice: in pre-order prima la radice, poi il sottoalbero sinistro e il destro; in in-order il sinistro, la radice, il destro; in post-order il sinistro, il destro e infine la radice. Hanno tutte costo Θ(n), perché visitano ogni nodo una volta. La visita per livelli (in ampiezza) usa invece una coda e visita i nodi livello per livello.<\/p>"},{"id":"m13-o03","modulo":13,"domanda":"Come si cancella un nodo da un BST?","risposta":"<p>Si distinguono tre casi. Se il nodo non ha figli, lo si elimina e il puntatore del padre diventa nullo. Se ha un solo figlio, il figlio con il suo sottoalbero prende il posto del nodo. Se ha due figli, si individua il successore, cioè il minimo del sottoalbero destro, che non ha figlio sinistro: il successore prende il posto del nodo, e se non era figlio diretto del nodo viene prima sostituito dal proprio figlio destro. Nelle slide gli spostamenti si fanno con la procedura <i>Trapianta<\/i>, che sostituisce un sottoalbero con un altro aggiornando il padre. Il costo è O(h).<\/p>"},{"id":"m13-o04","modulo":13,"domanda":"Perché un BST può degenerare e cosa comporta?","risposta":"<p>La forma di un BST dipende dall'ordine di inserimento. Inserendo chiavi già ordinate, ogni nuovo nodo diventa figlio destro dell'ultimo inserito e l'albero si riduce a una lista di altezza n - 1: tutte le operazioni, che costano O(h), diventano O(n). Un albero bilanciato ha invece altezza O(log n). Esistono BST autobilancianti (come gli alberi AVL o rosso-neri) che mantengono l'altezza logaritmica; nei casi semplici si può costruire un albero bilanciato inserendo prima il mediano dei valori.<\/p>"},{"id":"m13-o05","modulo":13,"domanda":"Perché gli algoritmi sugli alberi sono quasi sempre ricorsivi?","risposta":"<p>Perché l'albero è una struttura ricorsiva: un albero è vuoto oppure è formato da una radice e da sottoalberi che sono a loro volta alberi. Un'operazione sull'intero albero si scompone quindi nell'operazione sulla radice e nella stessa operazione sui sottoalberi, con caso base l'albero vuoto: visite, altezza, conteggio dei nodi, distruzione. La profondità della ricorsione è pari all'altezza dell'albero.<\/p>"},{"id":"m14-o01","modulo":14,"domanda":"Cos'è un grafo? Che differenza c'è tra orientato e non orientato?","risposta":"<p>Un grafo G = (V, E) è formato da un insieme di vertici V e da un insieme di archi E, ciascuno dei quali è una coppia di vertici. In un grafo orientato la coppia è ordinata: l'arco (u, v) esce da u ed entra in v, e non implica l'arco (v, u). In un grafo non orientato le coppie non sono ordinate, quindi l'adiacenza è simmetrica, e nelle slide non sono ammessi cappi. Diversamente da un albero, un grafo può contenere cicli e non ha una radice; un albero è un caso particolare di grafo non orientato, connesso e aciclico.<\/p>"},{"id":"m14-o02","modulo":14,"domanda":"Come si rappresenta un grafo in memoria? Quando conviene ciascuna rappresentazione?","risposta":"<p>Con la matrice di adiacenza, una matrice |V| × |V| in cui l'elemento (i,j) vale 1 se c'è l'arco da i a j: occupa O(|V|²) e permette di sapere in tempo costante se due vertici sono adiacenti; per un grafo non orientato è simmetrica. Oppure con le liste di adiacenza, un array di |V| liste in cui la lista del vertice u contiene i suoi adiacenti: occupa O(|V| + |E|), la somma delle lunghezze delle liste è |E| per un grafo orientato e 2|E| per uno non orientato. Le liste convengono per grafi sparsi e per gli algoritmi che scorrono i vicini, come le visite; la matrice per grafi densi o quando servono molte verifiche di adiacenza.<\/p>"},{"id":"m14-o03","modulo":14,"domanda":"Descriva la visita in ampiezza.","risposta":"<p>La BFS parte da una sorgente s e scopre i vertici in ordine di distanza da s. Tutti i vertici sono inizialmente bianchi; s diventa grigio con distanza 0 e viene messo in una coda. Finché la coda non è vuota si estrae un vertice u e, per ogni suo adiacente bianco v, lo si colora di grigio, si pone d[v] = d[u] + 1 e pred[v] = u e lo si accoda; finiti gli adiacenti, u diventa nero. La coda contiene sempre i vertici grigi. Alla fine d[v] è la lunghezza del cammino minimo da s a v e i predecessori formano il breadth-first tree, da cui la procedura ricorsiva Print-Path ricostruisce il cammino. Con le liste di adiacenza il costo è O(|V| + |E|).<\/p>"},{"id":"m14-o04","modulo":14,"domanda":"Descriva la visita in profondità e un suo uso.","risposta":"<p>La DFS esplora a partire dal vertice scoperto più di recente che ha ancora archi non esplorati; quando non ce ne sono più torna indietro (backtracking). Si implementa con una procedura ricorsiva DFS-Visit, chiamata da DFS(G) su ogni vertice ancora bianco, per cui il risultato è una foresta. Ogni vertice riceve due timestamp: d[v] quando viene scoperto e f[v] quando ha finito di esaminare la sua lista. Il costo è Θ(|V| + |E|). Un uso è l'ordinamento topologico di un grafo orientato aciclico: si esegue la DFS e ogni vertice, quando finisce, viene inserito in testa a una lista; si ottengono i vertici in ordine decrescente di f, e ogni arco va da un vertice a uno successivo. Altri usi sono la ricerca di cicli e le componenti connesse.<\/p>"},{"id":"m14-o05","modulo":14,"domanda":"Perché nelle visite di un grafo servono i colori, mentre negli alberi no?","risposta":"<p>Perché un grafo può contenere cicli e più cammini verso lo stesso vertice. Senza tenere traccia dei vertici già scoperti, la visita ripasserebbe più volte dagli stessi vertici e, in presenza di un ciclo, non terminerebbe. In un albero ogni nodo ha un solo padre e scendendo non si torna mai a un nodo già visto, quindi il problema non si pone. I colori garantiscono anche che ogni vertice venga esaminato una sola volta, da cui il costo lineare O(|V| + |E|).<\/p>"}],"esercizi":[{"id":"m01-pattern","modulo":1,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 1 (Introduzione alla OOP &amp; Information Hiding).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 1 - Pattern: classe con Information Hiding\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass ContoBancario {\nprivate:                       // ZONA PRIVATA: nessuno da fuori può toccare questi dati\n    string intestatario;\n    double saldo;\n\npublic:                        // INTERFACCIA PUBBLICA: l'unico \"sportello\" verso l'esterno\n    // Costruttore: prepara l'oggetto appena nasce (lo vedremo bene nel Modulo 4)\n    ContoBancario(string nome, double saldoIniziale) {\n        intestatario = nome;\n        // Il controllo sta DENTRO la classe: lo stato resta sempre valido\n        saldo = (saldoIniziale >= 0) ? saldoIniziale : 0;\n    }\n\n    // Setter \"controllato\": restituisce false se l'operazione non è valida\n    bool deposita(double importo) {\n        if (importo <= 0) return false;\n        saldo += importo;\n        return true;\n    }\n\n    bool preleva(double importo) {\n        if (importo <= 0 || importo > saldo) return false;   // niente saldo negativo\n        saldo -= importo;\n        return true;\n    }\n\n    // Getter: const = promette di NON modificare l'oggetto\n    double getSaldo() const { return saldo; }\n    string getIntestatario() const { return intestatario; }\n\n    void stampa() const {\n        cout << intestatario << \" -> saldo: \" << saldo << \" euro\" << endl;\n    }\n};\n\nint main() {\n    ContoBancario c1(\"Mario\", 100);     // oggetto 1\n    ContoBancario c2(\"Lucia\", -50);     // saldo negativo corretto a 0 dal costruttore\n\n    c1.deposita(50);                    // messaggio: destinatario c1, selettore deposita, argomento 50\n    if (!c1.preleva(1000))\n        cout << \"Prelievo rifiutato: saldo insufficiente\" << endl;\n\n    // c1.saldo = 1000000;              // ERRORE DI COMPILAZIONE: 'saldo' è private\n\n    c1.stampa();\n    c2.stampa();\n    return 0;\n}\n"}],"input":null,"output":"Prelievo rifiutato: saldo insufficiente\nMario -> saldo: 150 euro\nLucia -> saldo: 0 euro\n"}},{"id":"m01-lab","modulo":1,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Gestione di una biblioteca<\/b><\/p><p>Si vuole gestire il catalogo di una piccola biblioteca. Ogni libro ha un titolo, un autore, un anno di pubblicazione e può essere disponibile o in prestito.<\/p><p><b>Step 1 – la classe Libro<\/b><br>Scrivi la classe <code>Libro<\/code> con attributi privati <code>titolo<\/code>, <code>autore<\/code> (<code>string<\/code>), <code>anno<\/code> (<code>int<\/code>) e <code>disponibile<\/code> (<code>bool<\/code>). Aggiungi un costruttore <code>Libro(string t, string a, int y)<\/code> che crea un libro disponibile, i getter <code>const<\/code> e un metodo <code>stampa() const<\/code>.<br><b>Concetto nuovo:<\/b> classe, attributi privati, costruttore, getter <code>const<\/code>.<\/p><p><b>Step 2 – proteggere lo stato<\/b><br>Il costruttore deve correggere i dati non validi: titolo vuoto → “Senza titolo”; anno prima del 1450 o dopo il 2026 → 0. Aggiungi <code>bool presta()<\/code> e <code>bool restituisci()<\/code>: prestare un libro già in prestito, o restituirne uno disponibile, deve essere <b>rifiutato<\/b> (<code>false<\/code>) senza cambiare nulla.<br><b>Concetto nuovo:<\/b> invariante di classe, metodi che controllano prima di modificare.<\/p><p><b>Step 3 – array di oggetti e numeri casuali<\/b><br>Nel <code>main<\/code>, con <code>srand(111222333)<\/code>, crea un array di 4 libri inizializzato con le graffe ed esegui 5 tentativi di prestito su libri scelti a caso (<code>rand() % N<\/code>), stampando per ognuno se è riuscito o è stato rifiutato.<br><b>Concetto nuovo:<\/b> array di oggetti, messaggi inviati a elementi diversi.<\/p><p><b>Step 4 – la classe Biblioteca<\/b><br>Scrivi la classe <code>Biblioteca<\/code>, che contiene un array privato di (al massimo) 10 <code>Libro<\/code> e il numero <code>n<\/code> di libri presenti. Metodi: <code>bool aggiungi(Libro l)<\/code> (rifiuta se piena), <code>bool prestaTitolo(string t)<\/code> (cerca il libro e gli manda il messaggio <code>presta()<\/code>), <code>int contaDisponibili() const<\/code> e <code>stampa() const<\/code>. <i>Attenzione<\/i>: per dichiarare l'array serve un costruttore <code>Libro()<\/code> senza parametri.<br><b>Concetto nuovo:<\/b> aggregazione, oggetti che mandano messaggi ad altri oggetti.<\/p><p><b>Step 5 – ricerche<\/b><br>Aggiungi a <code>Biblioteca<\/code> i metodi <code>void stampaAutore(string a) const<\/code>, <code>int indicePiuVecchio() const<\/code> (restituisce -1 se la biblioteca è vuota) e <code>Libro getLibro(int i) const<\/code>, che restituisce una <i>copia<\/i> del libro i-esimo. Nel <code>main<\/code> stampa i libri di Eco e il libro più vecchio.<br><b>Concetto nuovo:<\/b> ricerca del minimo su un array di oggetti, restituire oggetti.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 1 - Laboratorio a step: Biblioteca\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <string>\n#include <cstdlib>\nusing namespace std;\n\n// ===== STEP 1 =====  Classe con attributi privati, costruttore, getter, stampa\n// ===== STEP 2 =====  Metodi che cambiano lo stato SOLO se l'operazione è valida\nclass Libro {\nprivate:\n    string titolo;\n    string autore;\n    int anno;\n    bool disponibile;\n\npublic:\n    // Costruttore \"vuoto\": serve per poter creare array di Libro (STEP 4)\n    Libro() {\n        titolo = \"?\";\n        autore = \"?\";\n        anno = 0;\n        disponibile = false;\n    }\n\n    // STEP 2: il costruttore corregge i dati non validi\n    Libro(string t, string a, int y) {\n        titolo = (t == \"\") ? \"Senza titolo\" : t;\n        autore = a;\n        anno = (y < 1450 || y > 2026) ? 0 : y;   // 1450 = invenzione della stampa\n        disponibile = true;\n    }\n\n    // STEP 2: prestito e restituzione rispettano lo stato\n    bool presta() {\n        if (!disponibile) return false;     // già in prestito: rifiuto\n        disponibile = false;\n        return true;\n    }\n    bool restituisci() {\n        if (disponibile) return false;      // non era in prestito: rifiuto\n        disponibile = true;\n        return true;\n    }\n\n    string getTitolo() const { return titolo; }\n    string getAutore() const { return autore; }\n    int getAnno() const { return anno; }\n    bool isDisponibile() const { return disponibile; }\n\n    void stampa() const {\n        cout << \"  \\\"\" << titolo << \"\\\" di \" << autore << \" (\" << anno << \") - \"\n             << (disponibile ? \"disponibile\" : \"in prestito\") << endl;\n    }\n};\n\n// ===== STEP 4 =====  Una classe che CONTIENE altri oggetti (aggregazione)\nclass Biblioteca {\nprivate:\n    static const int MAX = 10;\n    Libro scaffale[MAX];        // array di oggetti Libro: serve Libro()\n    int n;                      // quanti libri ci sono davvero\n\npublic:\n    Biblioteca() { n = 0; }\n\n    bool aggiungi(Libro l) {\n        if (n == MAX) return false;         // scaffale pieno\n        scaffale[n] = l;\n        n++;\n        return true;\n    }\n\n    int getNumeroLibri() const { return n; }\n\n    // La Biblioteca manda un MESSAGGIO al Libro: scaffale[i].presta()\n    bool prestaTitolo(string titolo) {\n        for (int i = 0; i < n; i++)\n            if (scaffale[i].getTitolo() == titolo)\n                return scaffale[i].presta();\n        return false;                       // titolo non trovato\n    }\n\n    int contaDisponibili() const {\n        int c = 0;\n        for (int i = 0; i < n; i++)\n            if (scaffale[i].isDisponibile()) c++;\n        return c;\n    }\n\n    // ===== STEP 5 =====  Ricerca: restituisce l'indice, -1 se non c'è\n    int indicePiuVecchio() const {\n        if (n == 0) return -1;\n        int iMin = 0;\n        for (int i = 1; i < n; i++)\n            if (scaffale[i].getAnno() < scaffale[iMin].getAnno())\n                iMin = i;\n        return iMin;\n    }\n\n    // Restituisce una COPIA del libro i-esimo (chi la riceve non tocca lo scaffale)\n    Libro getLibro(int i) const {\n        if (i < 0 || i >= n) return Libro();\n        return scaffale[i];\n    }\n\n    void stampaAutore(string autore) const {\n        cout << \"Libri di \" << autore << \":\" << endl;\n        for (int i = 0; i < n; i++)\n            if (scaffale[i].getAutore() == autore)\n                scaffale[i].stampa();\n    }\n\n    void stampa() const {\n        cout << \"Biblioteca (\" << n << \" libri, \" << contaDisponibili() << \" disponibili):\" << endl;\n        for (int i = 0; i < n; i++) scaffale[i].stampa();\n    }\n};\n\nint main() {\n    // ----- STEP 1 e 2: un oggetto da solo -----\n    cout << \"=== STEP 1-2 ===\" << endl;\n    Libro l1(\"Il nome della rosa\", \"Eco\", 1980);\n    Libro l2(\"\", \"Anonimo\", 3000);           // dati sbagliati: corretti dal costruttore\n    l1.stampa();\n    l2.stampa();\n    cout << \"presta l1: \" << l1.presta() << endl;     // 1 = true\n    cout << \"presta l1: \" << l1.presta() << endl;     // 0 = false (già prestato)\n    cout << \"restituisci l1: \" << l1.restituisci() << endl;\n\n    // ----- STEP 3: array di oggetti + prestiti casuali -----\n    cout << \"\\n=== STEP 3 ===\" << endl;\n    srand(111222333);\n    const int N = 4;\n    Libro v[N] = {\n        Libro(\"Odissea\", \"Omero\", 1488),\n        Libro(\"I promessi sposi\", \"Manzoni\", 1840),\n        Libro(\"Il Gattopardo\", \"Tomasi\", 1958),\n        Libro(\"Fosca\", \"Tarchetti\", 1869)\n    };\n    for (int k = 0; k < 5; k++) {\n        int i = rand() % N;\n        cout << \"tentativo di prestito di \\\"\" << v[i].getTitolo() << \"\\\": \"\n             << (v[i].presta() ? \"ok\" : \"RIFIUTATO\") << endl;\n    }\n\n    // ----- STEP 4: la Biblioteca contiene i libri -----\n    cout << \"\\n=== STEP 4 ===\" << endl;\n    Biblioteca b;\n    for (int i = 0; i < N; i++) b.aggiungi(v[i]);    // COPIE dei libri (con il loro stato)\n    b.aggiungi(Libro(\"Il nome della rosa\", \"Eco\", 1980));\n    b.aggiungi(Libro(\"Baudolino\", \"Eco\", 2000));\n    b.prestaTitolo(\"Baudolino\");\n    b.stampa();\n\n    // ----- STEP 5: ricerche -----\n    cout << \"\\n=== STEP 5 ===\" << endl;\n    b.stampaAutore(\"Eco\");\n    int iv = b.indicePiuVecchio();\n    cout << \"Il piu' vecchio (indice \" << iv << \"):\" << endl;\n    b.getLibro(iv).stampa();\n    return 0;\n}\n"}],"input":null,"output":"=== STEP 1-2 ===\n  \"Il nome della rosa\" di Eco (1980) - disponibile\n  \"Senza titolo\" di Anonimo (0) - disponibile\npresta l1: 1\npresta l1: 0\nrestituisci l1: 1\n\n=== STEP 3 ===\ntentativo di prestito di \"Il Gattopardo\": ok\ntentativo di prestito di \"Il Gattopardo\": RIFIUTATO\ntentativo di prestito di \"Il Gattopardo\": RIFIUTATO\ntentativo di prestito di \"I promessi sposi\": ok\ntentativo di prestito di \"Odissea\": ok\n\n=== STEP 4 ===\nBiblioteca (6 libri, 2 disponibili):\n  \"Odissea\" di Omero (1488) - in prestito\n  \"I promessi sposi\" di Manzoni (1840) - in prestito\n  \"Il Gattopardo\" di Tomasi (1958) - in prestito\n  \"Fosca\" di Tarchetti (1869) - disponibile\n  \"Il nome della rosa\" di Eco (1980) - disponibile\n  \"Baudolino\" di Eco (2000) - in prestito\n\n=== STEP 5 ===\nLibri di Eco:\n  \"Il nome della rosa\" di Eco (1980) - disponibile\n  \"Baudolino\" di Eco (2000) - in prestito\nIl piu' vecchio (indice 0):\n  \"Odissea\" di Omero (1488) - in prestito\n"}},{"id":"m01-e01","modulo":1,"tipo":"es","numero":1,"titolo":"Rettangolo","difficolta":"facile","testo":"<p>Classe <code>Rettangolo<\/code> con <code>base<\/code> e <code>altezza<\/code> private. Costruttore con due parametri; setter <code>bool setBase(double)<\/code> e <code>bool setAltezza(double)<\/code> che rifiutano valori ≤ 0; metodi <code>area()<\/code>, <code>perimetro()<\/code> e <code>stampa()<\/code>. Se il costruttore riceve un valore non valido, usa 1. <i>Suggerimento:<\/i> fai chiamare i setter al costruttore.<\/p>","soluzione":{"commento":"","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 1.1 - Rettangolo\n#include <iostream>\nusing namespace std;\n\nclass Rettangolo {\nprivate:\n    double base, altezza;\n\npublic:\n    Rettangolo(double b, double h) {\n        base = 1; altezza = 1;          // valori sicuri di partenza\n        setBase(b);                     // riuso i setter: il controllo è in un solo posto\n        setAltezza(h);\n    }\n    bool setBase(double b) {\n        if (b <= 0) return false;\n        base = b;\n        return true;\n    }\n    bool setAltezza(double h) {\n        if (h <= 0) return false;\n        altezza = h;\n        return true;\n    }\n    double area() const { return base * altezza; }\n    double perimetro() const { return 2 * (base + altezza); }\n    void stampa() const {\n        cout << \"Rettangolo \" << base << \" x \" << altezza\n             << \" -> area \" << area() << \", perimetro \" << perimetro() << endl;\n    }\n};\n\nint main() {\n    Rettangolo r(3, 4);\n    r.stampa();\n    if (!r.setBase(-5)) cout << \"Base -5 rifiutata\" << endl;\n    r.setAltezza(10);\n    r.stampa();\n    Rettangolo s(0, 2);                 // base non valida: resta 1\n    s.stampa();\n    return 0;\n}\n"}],"input":null,"output":"Rettangolo 3 x 4 -> area 12, perimetro 14\nBase -5 rifiutata\nRettangolo 3 x 10 -> area 30, perimetro 26\nRettangolo 1 x 2 -> area 2, perimetro 6\n"}},{"id":"m01-e02","modulo":1,"tipo":"es","numero":2,"titolo":"Contatore di persone","difficolta":"facile","testo":"<p>Classe <code>Contatore<\/code> con un intero privato che parte da 0: <code>incrementa()<\/code>, <code>bool decrementa()<\/code> (non può scendere sotto 0), <code>reset()<\/code> e <code>getValore() const<\/code>. Usalo per contare le persone che entrano ed escono da una stanza.<\/p>","soluzione":{"commento":"","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 1.2 - Contatore\n#include <iostream>\nusing namespace std;\n\nclass Contatore {\nprivate:\n    int valore;\n\npublic:\n    Contatore() { valore = 0; }\n    void incrementa() { valore++; }\n    bool decrementa() {\n        if (valore == 0) return false;   // mai sotto zero\n        valore--;\n        return true;\n    }\n    void reset() { valore = 0; }\n    int getValore() const { return valore; }\n};\n\nint main() {\n    Contatore persone;                   // conta le persone in una stanza\n    for (int i = 0; i < 3; i++) persone.incrementa();\n    cout << \"Dentro: \" << persone.getValore() << endl;\n    persone.decrementa();\n    cout << \"Dopo un'uscita: \" << persone.getValore() << endl;\n    persone.reset();\n    if (!persone.decrementa())\n        cout << \"Impossibile scendere sotto zero\" << endl;\n    cout << \"Valore finale: \" << persone.getValore() << endl;\n    return 0;\n}\n"}],"input":null,"output":"Dentro: 3\nDopo un'uscita: 2\nImpossibile scendere sotto zero\nValore finale: 0\n"}},{"id":"m01-e03","modulo":1,"tipo":"es","numero":3,"titolo":"struct contro class","difficolta":"facile","testo":"<p>Scrivi <code>struct PuntoS { double x, y; };<\/code> e una <code>class PuntoC<\/code> con <code>x<\/code> e <code>y<\/code> <b>senza<\/b> specificatori, più un costruttore pubblico e un metodo <code>distanzaOrigine()<\/code>. Nel <code>main<\/code> prova ad assegnare <code>x<\/code> direttamente in entrambi i casi e leggi l'errore del compilatore. (Serve <code>#include &lt;cmath&gt;<\/code> per <code>sqrt<\/code>.)<\/p>","soluzione":{"commento":"","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 1.3 - struct contro class\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\nstruct PuntoS {          // struct: senza specificatori tutto è PUBLIC\n    double x, y;\n};\n\nclass PuntoC {           // class: senza specificatori tutto è PRIVATE\n    double x, y;         // <- privati!\npublic:\n    PuntoC(double a, double b) { x = a; y = b; }\n    double distanzaOrigine() const { return sqrt(x * x + y * y); }\n};\n\nint main() {\n    PuntoS p;\n    p.x = 3;             // OK: x è public\n    p.y = 4;\n    cout << \"struct: distanza = \" << sqrt(p.x * p.x + p.y * p.y) << endl;\n\n    PuntoC q(3, 4);\n    // q.x = 3;          // ERRORE: 'double PuntoC::x' is private within this context\n    cout << \"class:  distanza = \" << q.distanzaOrigine() << endl;\n    return 0;\n}\n"}],"input":null,"output":"struct: distanza = 5\nclass:  distanza = 5\n"}},{"id":"m01-e04","modulo":1,"tipo":"es","numero":4,"titolo":"Termometro","difficolta":"facile","testo":"<p>Classe <code>Termometro<\/code> che memorizza <b>solo<\/b> la temperatura in gradi Celsius e offre <code>getFahrenheit()<\/code> (C · 9/5 + 32) e <code>getKelvin()<\/code> (C + 273.15). Il setter rifiuta temperature sotto lo zero assoluto (-273.15). Perché è meglio non memorizzare anche Fahrenheit e Kelvin come attributi?<\/p>","soluzione":{"commento":"<p>Memorizzare tre temperature vorrebbe dire tenerle sempre allineate: basterebbe dimenticarsene una in un setter per avere un oggetto incoerente. Con un solo dato le altre si calcolano e non possono essere sbagliate.<\/p>","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 1.4 - Termometro\n#include <iostream>\nusing namespace std;\n\nclass Termometro {\nprivate:\n    double celsius;      // UNA sola rappresentazione interna: niente dati duplicati\n    static constexpr double ZERO_ASSOLUTO = -273.15;\n\npublic:\n    Termometro() { celsius = 20; }\n    bool setCelsius(double c) {\n        if (c < ZERO_ASSOLUTO) return false;\n        celsius = c;\n        return true;\n    }\n    double getCelsius() const { return celsius; }\n    // Le altre scale si CALCOLANO: chi usa la classe non sa come è fatta dentro\n    double getFahrenheit() const { return celsius * 9 / 5 + 32; }\n    double getKelvin() const { return celsius - ZERO_ASSOLUTO; }\n};\n\nint main() {\n    Termometro t;\n    t.setCelsius(100);\n    cout << t.getCelsius() << \" C = \" << t.getFahrenheit() << \" F = \"\n         << t.getKelvin() << \" K\" << endl;\n    if (!t.setCelsius(-300))\n        cout << \"-300 C rifiutato: sotto lo zero assoluto\" << endl;\n    cout << \"Temperatura rimasta: \" << t.getCelsius() << \" C\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"100 C = 212 F = 373.15 K\n-300 C rifiutato: sotto lo zero assoluto\nTemperatura rimasta: 100 C\n"}},{"id":"m01-e05","modulo":1,"tipo":"es","numero":5,"titolo":"Lampadina","difficolta":"medio","testo":"<p>Classe <code>Lampadina<\/code> con stato acceso/spento, numero di accensioni e durata massima (passata al costruttore). <code>bool accendi()<\/code> fallisce se è già accesa o bruciata; se le accensioni superano la durata, la lampadina si brucia e non si accende più. Prova con durata 2 e tre accensioni.<\/p>","soluzione":{"commento":"","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 1.5 - Lampadina che si brucia\n#include <iostream>\nusing namespace std;\n\nclass Lampadina {\nprivate:\n    bool accesa;\n    bool bruciata;\n    int accensioni;\n    int durata;          // numero massimo di accensioni\n\npublic:\n    Lampadina(int maxAccensioni) {\n        accesa = false;\n        bruciata = false;\n        accensioni = 0;\n        durata = (maxAccensioni > 0) ? maxAccensioni : 1;\n    }\n    bool accendi() {\n        if (bruciata || accesa) return false;\n        accensioni++;\n        if (accensioni > durata) {       // l'ultima accensione la brucia\n            bruciata = true;\n            return false;\n        }\n        accesa = true;\n        return true;\n    }\n    void spegni() { accesa = false; }\n    void stampa() const {\n        cout << \"Lampadina: \"\n             << (bruciata ? \"BRUCIATA\" : (accesa ? \"accesa\" : \"spenta\"))\n             << \" (accensioni: \" << accensioni << \"/\" << durata << \")\" << endl;\n    }\n};\n\nint main() {\n    Lampadina l(2);\n    for (int i = 1; i <= 3; i++) {\n        bool ok = l.accendi();\n        cout << \"Accensione \" << i << \": \" << (ok ? \"riuscita\" : \"fallita\") << endl;\n        l.spegni();\n    }\n    l.stampa();\n    return 0;\n}\n"}],"input":null,"output":"Accensione 1: riuscita\nAccensione 2: riuscita\nAccensione 3: fallita\nLampadina: BRUCIATA (accensioni: 3/2)\n"}},{"id":"m01-e06","modulo":1,"tipo":"es","numero":6,"titolo":"Orologio","difficolta":"medio","testo":"<p>Classe <code>Orologio<\/code> con ore, minuti e secondi. Il costruttore porta a <code>00:00:00<\/code> un orario non valido. <code>avanza()<\/code> aggiunge un secondo gestendo i riporti (<code>23:59:59<\/code> → <code>00:00:00<\/code>). <code>stampa()<\/code> scrive sempre due cifre (<code>09:05:03<\/code>): usa un metodo <b>privato<\/b> di supporto.<\/p>","soluzione":{"commento":"","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 1.6 - Orologio\n#include <iostream>\nusing namespace std;\n\nclass Orologio {\nprivate:\n    int ore, minuti, secondi;\n\n    // Metodo PRIVATO: è un dettaglio interno, da fuori non serve\n    void stampaDueCifre(int x) const {\n        if (x < 10) cout << \"0\";\n        cout << x;\n    }\n\npublic:\n    Orologio(int h, int m, int s) {\n        bool valido = h >= 0 && h < 24 && m >= 0 && m < 60 && s >= 0 && s < 60;\n        ore = valido ? h : 0;\n        minuti = valido ? m : 0;\n        secondi = valido ? s : 0;\n    }\n    void avanza() {                       // +1 secondo con i riporti\n        secondi++;\n        if (secondi == 60) { secondi = 0; minuti++; }\n        if (minuti == 60)  { minuti = 0;  ore++; }\n        if (ore == 24)     { ore = 0; }\n    }\n    void stampa() const {\n        stampaDueCifre(ore);    cout << \":\";\n        stampaDueCifre(minuti); cout << \":\";\n        stampaDueCifre(secondi); cout << endl;\n    }\n};\n\nint main() {\n    Orologio o(23, 59, 58);\n    for (int i = 0; i < 3; i++) {\n        o.stampa();\n        o.avanza();\n    }\n    Orologio sbagliato(25, 70, 0);        // non valido: parte da mezzanotte\n    sbagliato.stampa();\n    return 0;\n}\n"}],"input":null,"output":"23:59:58\n23:59:59\n00:00:00\n00:00:00\n"}},{"id":"m01-e07","modulo":1,"tipo":"es","numero":7,"titolo":"Libretto universitario","difficolta":"medio","testo":"<p>Classe <code>Studente<\/code> con nome e un array privato di al massimo 30 voti. <code>bool aggiungiVoto(int)<\/code> accetta solo voti tra 18 e 30; poi <code>media()<\/code>, <code>votoMassimo()<\/code> e <code>stampa()<\/code>. Nel <code>main<\/code> prova i voti 28, 15, 30, 24, 33, 27.<\/p>","soluzione":{"commento":"","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 1.7 - Studente con libretto\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Studente {\nprivate:\n    string nome;\n    int voti[30];        // il libretto: massimo 30 esami\n    int nVoti;\n\npublic:\n    Studente(string n) { nome = n; nVoti = 0; }\n\n    bool aggiungiVoto(int v) {\n        if (v < 18 || v > 30) return false;   // voto non valido\n        if (nVoti == 30) return false;        // libretto pieno\n        voti[nVoti] = v;\n        nVoti++;\n        return true;\n    }\n    double media() const {\n        if (nVoti == 0) return 0;\n        int somma = 0;\n        for (int i = 0; i < nVoti; i++) somma += voti[i];\n        return (double)somma / nVoti;\n    }\n    int votoMassimo() const {\n        int m = 0;\n        for (int i = 0; i < nVoti; i++)\n            if (voti[i] > m) m = voti[i];\n        return m;\n    }\n    void stampa() const {\n        cout << nome << \": \" << nVoti << \" esami, media \" << media()\n             << \", voto massimo \" << votoMassimo() << endl;\n    }\n};\n\nint main() {\n    Studente s(\"Mario\");\n    int prove[] = {28, 15, 30, 24, 33, 27};\n    for (int i = 0; i < 6; i++)\n        if (!s.aggiungiVoto(prove[i]))\n            cout << \"Voto \" << prove[i] << \" rifiutato\" << endl;\n    s.stampa();\n    return 0;\n}\n"}],"input":null,"output":"Voto 15 rifiutato\nVoto 33 rifiutato\nMario: 4 esami, media 27.25, voto massimo 30\n"}},{"id":"m01-e08","modulo":1,"tipo":"es","numero":8,"titolo":"Flotta di automobili","difficolta":"medio","testo":"<p>Classe <code>Automobile<\/code> con modello, velocità (massimo 180 km/h) e carburante (serbatoio da 40 litri). <code>bool accelera(int delta)<\/code> consuma 1 litro ogni 10 km/h e rifiuta se non c'è abbastanza benzina; <code>frena<\/code>, <code>fermati<\/code>, <code>double rifornisci(double)<\/code> (restituisce i litri effettivamente messi). Nel <code>main<\/code>, con <code>srand(111222333)<\/code>, crea 3 auto, applica 5 accelerazioni casuali tra 10 e 90 a ciascuna e stampa la più veloce.<\/p>","soluzione":{"commento":"<p>Nota <code>delta / 10.0<\/code>: con <code>delta / 10<\/code> avresti una divisione <b>intera<\/b> (45/10 = 4, non 4.5). L'output dipende dalla sequenza di <code>rand()<\/code> di MinGW: con un altro compilatore i numeri possono cambiare.<\/p>","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 1.8 - Automobile\n// Compila: g++ -g es08.cpp -o es08.exe\n#include <iostream>\n#include <string>\n#include <cstdlib>\n#include <ctime>\nusing namespace std;\n\nclass Automobile {\nprivate:\n    string modello;\n    int velocita;         // km/h, mai negativa, mai oltre VEL_MAX\n    double carburante;    // litri, tra 0 e SERBATOIO\n\n    static const int VEL_MAX = 180;\n    static constexpr double SERBATOIO = 40.0;\n\npublic:\n    Automobile(string m, double litri) {\n        modello = m;\n        velocita = 0;\n        if (litri < 0) litri = 0;\n        if (litri > SERBATOIO) litri = SERBATOIO;\n        carburante = litri;\n    }\n\n    // Accelera di 'delta' km/h consumando 1 litro ogni 10 km/h\n    bool accelera(int delta) {\n        if (delta <= 0) return false;\n        double consumo = delta / 10.0;\n        if (consumo > carburante) return false;           // non basta benzina\n        carburante -= consumo;\n        velocita += delta;\n        if (velocita > VEL_MAX) velocita = VEL_MAX;       // limite fisico\n        return true;\n    }\n\n    void frena(int delta) {\n        if (delta <= 0) return;\n        velocita -= delta;\n        if (velocita < 0) velocita = 0;\n    }\n\n    void fermati() { velocita = 0; }\n\n    double rifornisci(double litri) {                    // restituisce i litri effettivamente messi\n        if (litri <= 0) return 0;\n        double spazio = SERBATOIO - carburante;\n        double messi = (litri < spazio) ? litri : spazio;\n        carburante += messi;\n        return messi;\n    }\n\n    int getVelocita() const { return velocita; }\n    double getCarburante() const { return carburante; }\n    string getModello() const { return modello; }\n\n    void stampa() const {\n        cout << \"[\" << modello << \"] vel=\" << velocita\n             << \" km/h, carburante=\" << carburante << \" L\" << endl;\n    }\n};\n\nint main() {\n    srand(111222333);                       // seed fisso: risultati riproducibili\n\n    const int N = 3;\n    Automobile flotta[N] = {\n        Automobile(\"Panda\", 5),\n        Automobile(\"Punto\", 30),\n        Automobile(\"Tipo\", 100)             // verrà limitato a 40 litri\n    };\n\n    // 5 accelerazioni casuali (tra 10 e 90 km/h) su ogni auto\n    for (int i = 0; i < N; i++) {\n        for (int k = 0; k < 5; k++) {\n            int delta = 10 + rand() % 81;\n            if (!flotta[i].accelera(delta))\n                cout << flotta[i].getModello() << \": accelerazione di \" << delta << \" rifiutata\" << endl;\n        }\n    }\n\n    // Trova l'auto più veloce\n    int iMax = 0;\n    for (int i = 1; i < N; i++)\n        if (flotta[i].getVelocita() > flotta[iMax].getVelocita())\n            iMax = i;\n\n    for (int i = 0; i < N; i++) flotta[i].stampa();\n    cout << \"La piu' veloce e': \" << flotta[iMax].getModello() << endl;\n\n    flotta[0].fermati();\n    cout << \"Messi \" << flotta[0].rifornisci(100) << \" litri nella Panda\" << endl;\n    flotta[0].stampa();\n    return 0;\n}\n"}],"input":null,"output":"Panda: accelerazione di 45 rifiutata\nPanda: accelerazione di 90 rifiutata\n[Panda] vel=50 km/h, carburante=0 L\n[Punto] vel=180 km/h, carburante=3.2 L\n[Tipo] vel=180 km/h, carburante=6.6 L\nLa piu' veloce e': Punto\nMessi 40 litri nella Panda\n[Panda] vel=0 km/h, carburante=40 L\n"}},{"id":"m01-e09","modulo":1,"tipo":"es","numero":9,"titolo":"Bonifico tra conti","difficolta":"difficile","testo":"<p>Riprendi <code>ContoBancario<\/code> del pattern e aggiungi <code>bool bonifico(ContoBancario
