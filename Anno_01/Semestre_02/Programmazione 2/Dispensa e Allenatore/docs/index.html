<style>
/* =====================================================================
   Allenatore Prog2 — gioco e musica (condiviso tra PC e telefono)
   Lettore musicale, compagno Bit, XP, traguardi, missioni.
   Usa le variabili del tema: --fosforo, --fosforo-rgb, --testo, --linea...
   ===================================================================== */
:root { --fosforo: #33ff99; --fosforo-rgb: 51, 255, 153; }

/* ------------------------------------------------------------ lettore musicale */
.musica-dock {
  position: fixed; z-index: 7000; left: 16px; bottom: 16px; width: 360px; max-width: calc(100vw - 32px);
  background: var(--superficie, #000); color: var(--testo, #cfe); border: 1px solid var(--linea-forte, rgba(var(--fosforo-rgb), .34));
  box-shadow: 0 0 0 1px rgba(var(--fosforo-rgb), .12), 0 18px 60px rgba(0, 0, 0, .55), 0 0 40px rgba(var(--fosforo-rgb), .1);
  font-family: var(--mono, monospace); font-size: 13px; padding: 12px 14px 12px;
  transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none;
  transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .2s;
}
.musica-dock.aperto { transform: none; opacity: 1; pointer-events: auto; }
.md-testa { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.md-titolo { letter-spacing: .2em; font-weight: 700; color: var(--fosforo); text-shadow: 0 0 8px rgba(var(--fosforo-rgb), .5); }
.md-titolo::before { content: '> '; color: var(--testo-3, #2c6447); }
.md-spazio { flex: 1; }
.md-chiudi { background: none; border: 0; color: var(--testo-2); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; }
.md-chiudi:hover { color: var(--fosforo); }
.md-sorgenti { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--linea); margin-bottom: 12px; }
.md-sorgenti button { background: none; border: 0; color: var(--testo-2); padding: 7px 2px; font: inherit; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.md-sorgenti button + button { border-left: 1px solid var(--linea); }
.md-sorgenti button.attivo { background: rgba(var(--fosforo-rgb), .14); color: var(--fosforo); box-shadow: inset 0 -2px 0 var(--fosforo); }
.md-pannello { display: none; }
.musica-dock[data-sorgente="colonna"] .md-colonna, .musica-dock[data-sorgente="nessuna"] .md-nessuna { display: block; }
/* Spotify e YouTube restano nel documento anche nascosti: così la musica continua */
.md-spotify, .md-youtube { display: block; height: 0; overflow: hidden; visibility: hidden; }
.musica-dock[data-sorgente="spotify"] .md-spotify, .musica-dock[data-sorgente="youtube"] .md-youtube { height: auto; overflow: visible; visibility: visible; }
.md-brani { display: flex; flex-direction: column; gap: 4px; }
.md-brano { display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 1px solid transparent; color: var(--testo); font: inherit; padding: 7px 8px; cursor: pointer; }
.md-brano:hover { border-color: var(--linea); }
.md-brano.attivo { border-color: var(--fosforo); background: rgba(var(--fosforo-rgb), .08); }
.md-brano b { display: block; font-weight: 600; }
.md-brano small { color: var(--testo-2); font-size: 11px; }
.md-num { color: var(--testo-3); font-size: 11px; }
.md-brano.attivo .md-num { color: var(--fosforo); }
.md-riga { display: flex; gap: 6px; margin-bottom: 8px; }
.md-campo { flex: 1; min-width: 0; background: #000; border: 1px solid var(--linea); color: var(--testo); font: inherit; font-size: 12px; padding: 7px 8px; outline: none; }
.md-campo:focus { border-color: var(--fosforo); }
.md-btn { background: none; border: 1px solid var(--linea-forte); color: var(--testo); font: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; cursor: pointer; }
.md-btn:hover { border-color: var(--fosforo); color: var(--fosforo); }
.md-link { background: none; border: 0; padding: 0; color: var(--testo-2); font: inherit; font-size: 11px; text-decoration: underline; cursor: pointer; }
.md-nota { color: var(--testo-2); font-size: 11.5px; line-height: 1.5; margin-top: 8px; }
.md-nota .md-btn { margin: 8px 8px 0 0; }
.md-vuoto { color: var(--testo-2); padding: 14px 4px; font-size: 12px; }
.md-embed iframe { display: block; border: 0; }
.md-yt-riga { display: flex; gap: 10px; align-items: flex-start; }
.md-yt-riga .md-embed { flex: none; width: 192px; min-height: 108px; background: #000; border: 1px solid var(--linea); }
.md-yt-riga .md-nota { margin-top: 0; }
/* YouTube nella finestra di YouTube Music: niente riquadro del video, solo la spiegazione */
.md-yt-riga:has(.md-finestra) { flex-direction: column; }
.md-yt-riga .md-embed:has(.md-finestra) { width: auto; min-height: 0; background: none; border: 0; }
.md-finestra { color: var(--testo-2); font-size: 11.5px; line-height: 1.5; }
.md-finestra b { display: block; color: var(--testo); margin-bottom: 4px; }
.md-finestra .md-btn { display: block; margin-top: 8px; }
.md-yt-modo { align-items: center; font-size: 11px; color: var(--testo-2); }
.md-yt-modo span { margin-right: 4px; }
.md-yt-modo .md-btn.attivo { border-color: var(--fosforo); color: var(--fosforo); }
.md-controlli { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--linea); }
.md-tasto { background: none; border: 1px solid var(--linea); color: var(--testo); font: inherit; font-size: 12px; min-width: 36px; height: 32px; cursor: pointer; }
.md-tasto:hover { border-color: var(--fosforo); color: var(--fosforo); }
.md-tasto.grande { background: var(--fosforo); color: #000; border-color: var(--fosforo); font-weight: 700; min-width: 46px; box-shadow: 0 0 14px rgba(var(--fosforo-rgb), .4); }
.md-tasto.attivo { color: var(--rosso, #ff5c77); border-color: currentColor; }
.md-volume { flex: 1; min-width: 60px; accent-color: var(--fosforo); }

/* lettore in miniatura (barra laterale del PC, scheda Bit del telefono) */
.musica-mini { display: flex; align-items: center; gap: 4px; border: 1px solid var(--linea); font-family: var(--mono, monospace); font-size: 12px; min-width: 0; }
.musica-mini button { background: none; border: 0; color: var(--testo-2); font: inherit; cursor: pointer; padding: 7px 8px; }
.musica-mini button:hover { color: var(--fosforo); }
.musica-mini .mm-play { color: var(--fosforo); font-weight: 700; min-width: 30px; }
.musica-mini .mm-testo { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; padding-left: 2px; }
.musica-mini .mm-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--testo); }
.musica-mini .mm-muto.attivo { color: var(--rosso, #ff5c77); }
.md-onde { color: var(--fosforo); letter-spacing: -1px; flex: none; text-shadow: 0 0 6px rgba(var(--fosforo-rgb), .5); }

/* ------------------------------------------------------------ Bit */
.pet { font-family: var(--mono, monospace); }
.pet-arte {
  margin: 0; white-space: pre; line-height: 1.15; font-size: 15px; color: var(--fosforo);
  text-shadow: 0 0 8px rgba(var(--fosforo-rgb), .55); animation: pet-respiro 3.2s ease-in-out infinite; display: inline-block;
}
.pet-arte.dorme { animation-duration: 6s; opacity: .7; }
.pet-arte.euforico { animation: pet-salto .9s ease-in-out infinite; }
@keyframes pet-respiro { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes pet-salto { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-9px); } 60% { transform: translateY(-9px); } }
.pet-nuvola { position: relative; border: 1px solid var(--linea-forte); padding: 10px 12px; color: var(--testo); font-size: 13px; line-height: 1.45; }
.pet-nuvola::before { content: ''; position: absolute; left: -7px; top: 18px; width: 12px; height: 12px; background: var(--superficie, #000); border-left: 1px solid var(--linea-forte); border-bottom: 1px solid var(--linea-forte); transform: rotate(45deg); }
.pet-mini { display: flex; align-items: center; gap: 10px; border: 1px solid var(--linea); padding: 8px 10px; cursor: pointer; background: none; width: 100%; color: inherit; font: inherit; text-align: left; }
.pet-mini:hover { border-color: var(--linea-forte); }
.pet-mini .pet-faccia { color: var(--fosforo); font-family: var(--mono, monospace); font-size: 13px; text-shadow: 0 0 6px rgba(var(--fosforo-rgb), .5); white-space: pre; }
.pet-mini .pm-testo { flex: 1; min-width: 0; font-family: var(--mono, monospace); font-size: 11.5px; }
.pet-mini .pm-livello { color: var(--fosforo); font-weight: 700; }
.pet-mini .pm-sotto { color: var(--testo-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* barre di avanzamento in stile terminale: [#####.....] */
.xp-barra { height: 8px; border: 1px solid var(--linea-forte); background: rgba(var(--fosforo-rgb), .05); position: relative; overflow: hidden; }
.xp-barra i { position: absolute; inset: 0 auto 0 0; background: var(--fosforo); box-shadow: 0 0 12px rgba(var(--fosforo-rgb), .6); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.xp-barra.sottile { height: 4px; border: 0; background: rgba(var(--fosforo-rgb), .12); }
.xp-barra.cibo i { background: var(--arancio, #ffb000); box-shadow: 0 0 10px rgba(255, 176, 0, .5); }

/* ------------------------------------------------------------ missioni e traguardi */
.missioni { display: flex; flex-direction: column; gap: 8px; }
.missione { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; font-family: var(--mono, monospace); font-size: 12.5px; }
.missione .ms-casella { color: var(--testo-3); white-space: pre; }
.missione.fatta .ms-casella { color: var(--fosforo); text-shadow: 0 0 6px rgba(var(--fosforo-rgb), .6); }
.missione.fatta .ms-testo { color: var(--testo-2); text-decoration: line-through; text-decoration-color: rgba(var(--fosforo-rgb), .5); }
.missione .ms-conta { color: var(--testo-2); font-variant-numeric: tabular-nums; }
.traguardi { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.traguardo { border: 1px solid var(--linea); padding: 12px 10px 10px; text-align: center; font-family: var(--mono, monospace); position: relative; }
.traguardo .tg-icona { font-size: 17px; font-weight: 700; color: var(--testo-3); letter-spacing: .04em; margin-bottom: 6px; }
.traguardo .tg-nome { font-size: 12.5px; font-weight: 700; color: var(--testo-2); }
.traguardo .tg-descr { font-size: 11px; color: var(--testo-3); margin-top: 4px; line-height: 1.35; }
.traguardo .xp-barra { margin-top: 8px; }
.traguardo.ok { border-color: rgba(var(--fosforo-rgb), .45); background: rgba(var(--fosforo-rgb), .05); }
.traguardo.ok .tg-icona { color: var(--fosforo); text-shadow: 0 0 10px rgba(var(--fosforo-rgb), .7); }
.traguardo.ok .tg-nome { color: var(--testo); }
.traguardo.ok .tg-descr { color: var(--testo-2); }

/* ------------------------------------------------------------ XP che sale, livello nuovo */
.xp-volante {
  position: fixed; z-index: 8500; pointer-events: none; font: 700 15px var(--mono, monospace); color: var(--fosforo);
  text-shadow: 0 0 10px rgba(var(--fosforo-rgb), .8); animation: xp-sale 1.4s ease-out forwards; white-space: nowrap;
}
@keyframes xp-sale { 0% { opacity: 0; transform: translateY(8px) scale(.9); } 15% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-46px); } }
.livello-nuovo {
  position: fixed; inset: 0; z-index: 8800; display: grid; place-items: center; background: rgba(0, 0, 0, .82);
  font-family: var(--mono, monospace); color: var(--testo); animation: compari-lv .25s ease; cursor: pointer;
}
@keyframes compari-lv { from { opacity: 0; } to { opacity: 1; } }
.livello-nuovo .ln-box { text-align: center; padding: 34px 44px; border: 1px solid var(--fosforo); background: #000; box-shadow: 0 0 60px rgba(var(--fosforo-rgb), .35); max-width: 90vw; }
.livello-nuovo .ln-sopra { letter-spacing: .4em; color: var(--testo-2); font-size: 12px; }
.livello-nuovo .ln-num { font-size: 84px; font-weight: 200; color: var(--fosforo); text-shadow: 0 0 30px rgba(var(--fosforo-rgb), .8); line-height: 1.1; animation: ln-colpo .7s ease-out; }
@keyframes ln-colpo { 0% { transform: scale(1.6); filter: brightness(3); } 100% { transform: none; filter: none; } }
.livello-nuovo .ln-titolo { font-size: 18px; text-transform: uppercase; letter-spacing: .12em; color: var(--fosforo); margin: 6px 0 18px; }
.livello-nuovo .pet-arte { font-size: 16px; margin-bottom: 12px; }
.livello-nuovo .ln-nota { color: var(--testo-2); font-size: 13px; max-width: 420px; margin: 0 auto; line-height: 1.5; }
.livello-nuovo .ln-chiudi { margin-top: 18px; color: var(--testo-3); font-size: 11px; letter-spacing: .2em; }
/* Bit in pixel art, Bit in scena e l'Armadio: vedi bit.css */

/* =====================================================================
   Allenatore Prog2 — Bit: pixel art, animazioni, Bit in scena, Armadio
   Usa le variabili del tema: --fosforo, --fosforo-rgb, --testo, --linea...
   Niente regola prefers-reduced-motion: le animazioni di Bit restano sempre
   attive (richiesta dello studente; vedi le eccezioni in stile.css).
   ===================================================================== */

/* ------------------------------------------------------------ Bit in pixel art */
.pet-svg { display: block; overflow: visible; image-rendering: pixelated;
  filter: drop-shadow(0 0 3px var(--alone)) drop-shadow(0 0 12px color-mix(in srgb, var(--alone) 55%, transparent)); transition: filter .6s; }
.pet-svg.umore-neutro { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--alone) 35%, transparent)); }
.pet-svg.umore-dorme { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--alone) 40%, transparent)) saturate(.75) brightness(.85); }
.pet-svg.umore-triste { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--alone) 55%, transparent)) saturate(.7); }
.pet-svg.umore-euforico { animation: pet-alone 1.6s ease-in-out infinite; }
@keyframes pet-alone { 50% { filter: drop-shadow(0 0 4px var(--alone)) drop-shadow(0 0 22px var(--alone)); } }
.pet-svg g, .pet-svg text { transform-box: fill-box; }

/* bit-idle-breath: respiro rilassato, il corpo si gonfia appena, appoggiato a terra */
.pet-corpo { transform-origin: 50% 100%; animation: bit-idle-breath 3.2s ease-in-out infinite; }
@keyframes bit-idle-breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, .965); } }
.umore-dorme .pet-corpo { animation-duration: 5.5s; }
.umore-triste .pet-corpo { animation-duration: 4.4s; }
.umore-euforico .pet-corpo { animation: pet-saltella .9s ease-in-out infinite; }
@keyframes pet-saltella { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.06, .92); }
  45% { transform: translateY(-2.5px) scale(.96, 1.05); } 75% { transform: translateY(0) scale(1.04, .95); } }
/* micro-blink delle palpebre */
.pet-occhi.aperti { transform-origin: 50% 50%; animation: bit-blink 4.6s infinite; }
@keyframes bit-blink { 0%, 91%, 97%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.12); } }
/* l'uovo dondola */
.stadio-0 .pet-tutto { transform-origin: 50% 90%; animation: pet-dondola 3.4s ease-in-out infinite; }
@keyframes pet-dondola { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-7deg); } 84% { transform: rotate(6deg); } 92% { transform: rotate(-3deg); } }
/* fame: lo stomaco brontola */
.umore-affamato .pet-tutto { transform-origin: 50% 100%; animation: pet-brontola 2.8s infinite; }
@keyframes pet-brontola { 0%, 62%, 100% { transform: translateX(0); } 66% { transform: translateX(-.6px); } 70% { transform: translateX(.6px); }
  74% { transform: translateX(-.5px); } 78% { transform: translateX(.4px); } 82% { transform: translateX(0); } }
.pet-grr { transform-origin: 0 50%; animation: pet-grr 2.8s infinite; opacity: 0; }
@keyframes pet-grr { 0%, 60%, 100% { opacity: 0; transform: translateX(0); } 66%, 80% { opacity: 1; transform: translateX(1px); } }
/* bit-sleep-zzz: le Z salgono come bolle */
.pet-zzz { font: 700 5px/1 var(--mono, monospace); opacity: 0; animation: bit-sleep-zzz 3s linear infinite; }
@keyframes bit-sleep-zzz { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: 1; }
  60% { transform: translate(3px, -6px) scale(1.05); } 100% { opacity: 0; transform: translate(5px, -11px) scale(1.3); } }
/* euforico: scintille */
.pet-scintilla { transform-origin: 50% 50%; animation: pet-scintilla 1.4s ease-in-out infinite; opacity: 0; }
@keyframes pet-scintilla { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
/* salto quando arrivano XP (classe aggiunta da JS) */
.pet-svg.salta .pet-tutto { animation: pet-salta .75s cubic-bezier(.3, 1.6, .5, 1) 1; }
@keyframes pet-salta { 0% { transform: translateY(0) scale(1.1, .85); } 35% { transform: translateY(-6px) scale(.92, 1.1); }
  70% { transform: translateY(0) scale(1.08, .9); } 100% { transform: translateY(0) scale(1); } }
/* evoluzione: il vecchio stadio lampeggia e sparisce, il nuovo arriva in un lampo */
.evoluzione { position: relative; display: grid; place-items: center; margin: 0 auto 12px; }
.evoluzione > * { grid-area: 1 / 1; }
.evoluzione .vecchio { animation: evo-via 1.8s forwards; }
.evoluzione .nuovo { opacity: 0; animation: evo-arriva 1.8s forwards; }
.evoluzione .lampo { width: 140%; height: 140%; border-radius: 50%; background: radial-gradient(circle, #fff 0, var(--fosforo) 35%, transparent 70%);
  opacity: 0; animation: evo-lampo 1.8s forwards; pointer-events: none; }
@keyframes evo-via { 0%, 12%, 26%, 40% { opacity: 1; filter: brightness(1); } 6%, 19%, 33% { filter: brightness(4); } 50%, 100% { opacity: 0; transform: scale(1.15); } }
@keyframes evo-arriva { 0%, 48% { opacity: 0; transform: scale(1.5); filter: brightness(5); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; filter: none; } }
@keyframes evo-lampo { 0%, 40% { opacity: 0; transform: scale(.3); } 52% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.4); } }
.pet-mini .pet-svg { flex: none; }
/* oggetti delle reazioni */
.pet-occhiali { animation: cmp-occhiali .7s steps(5) .35s both; }
@keyframes cmp-occhiali { from { transform: translateY(-9px); opacity: 0; } 20% { opacity: 1; } to { transform: none; opacity: 1; } }
.pet-mani-occhi { animation: cmp-mani .3s steps(2) infinite; }
@keyframes cmp-mani { 50% { transform: translateY(.5px); } }
.pet-mano.sx { animation: cmp-clap-sx .26s steps(2) infinite; }
.pet-mano.dx { animation: cmp-clap-dx .26s steps(2) infinite; }
@keyframes cmp-clap-sx { 50% { transform: translateX(3px) translateY(-1px); } }
@keyframes cmp-clap-dx { 50% { transform: translateX(-3px) translateY(-1px); } }

/* ------------------------------------------------------------ Bit in scena */
.compagno { --px: var(--fosforo); font-family: var(--mono, ui-monospace, monospace); }
.compagno[hidden] { display: none !important; }
/* postazione base: fissa in basso a destra (Oggi e le pagine senza un posto per Bit) */
.compagno.base { position: fixed; z-index: 25; right: 22px; bottom: 18px; width: max-content; pointer-events: none; }
.compagno.base > * { pointer-events: auto; }
.compagno.base .cmp-fumetto { position: absolute; right: 6px; bottom: calc(100% + 16px); width: max-content; max-width: min(280px, calc(100vw - 40px)); }
/* ancorato: dentro un .bit-posto della vista, fumetto accanto o sopra (stile «Oscar») */
.bit-posto { display: flex; min-width: 0; }
body.senza-bit .bit-posto { display: none; }   /* Bit spento nelle impostazioni */
.compagno.ancorato { position: relative; display: flex; align-items: center; gap: 18px; width: 100%; min-width: 0; }
/* nel markup il fumetto viene prima di Bit: riga = Bit a sinistra, riga-inv = Bit a destra, colonna = fumetto sopra */
.bit-posto[data-layout="riga"] .compagno { flex-direction: row-reverse; justify-content: flex-end; }
.bit-posto[data-layout="riga-inv"] .compagno { flex-direction: row; justify-content: flex-end; }
.bit-posto[data-layout="colonna"] .compagno { flex-direction: column; align-items: center; gap: 16px; }
.compagno.ancorato .cmp-fumetto { position: relative; flex: 0 1 auto; max-width: 620px; min-width: 0; }

.cmp-pet { position: relative; display: block; flex: none; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  -webkit-tap-highlight-color: transparent; outline: none; }
.cmp-pet:focus-visible { outline: 1px dashed var(--fosforo); outline-offset: 4px; }
.cmp-corpo, .cmp-voce { display: block; transform-origin: 50% 100%; }
.compagno.riposo .cmp-corpo { opacity: .85; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border-radius: 0 !important; }
html, body { height: 100%; }
body { background: var(--sfondo); color: var(--testo); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%; margin: 0; letter-spacing: .005em; }

o <code>saldo<\/code> è <code>private<\/code>. Cosa succede scrivendo <code>c1.saldo = 10;<\/code> nel <code>main<\/code>?<\/p>","opzioni":["l'istruzione viene eseguita normalmente","errore a tempo di esecuzione (run-time)","errore di compilazione","solo un warning, poi viene eseguita"],"giusta":2,"commento":"<p>Il controllo d'accesso lo fa <b>il compilatore<\/b>: il programma non viene nemmeno prodotto.<\/p>"},{"id":"m01-q04","modulo":1,"rif":null,"domanda":"<p>Il collegamento dinamico (dynamic binding):<\/p>","opzioni":["sceglie il metodo da eseguire durante la compilazione","sceglie il metodo da eseguire durante l'esecuzione ed è alla base del polimorfismo","è un altro nome del linker","riguarda esclusivamente le librerie dinamiche (.dll)"],"giusta":1,"commento":"<p>“Dinamico” significa a run-time. Il linker (C) è un'altra cosa: collega i file oggetto (Modulo 2).<\/p>"},{"id":"m01-q05","modulo":1,"rif":null,"domanda":"<p>Una persona può lavorare contemporaneamente per più aziende. La relazione tra <code>Azienda<\/code> e <code>Persona<\/code> è:<\/p>","opzioni":["associazione semplice","aggregazione","composizione","ereditarietà"],"giusta":1,"commento":"<p>È una relazione “intero–parte”, ma la parte non appartiene in modo esclusivo a un solo intero: aggregazione. Se fosse esclusiva (pneumatico–auto) sarebbe composizione.<\/p>"},{"id":"m01-q06","modulo":1,"rif":null,"domanda":"<p>Chi può accedere a un attributo <code>private<\/code> di una classe?<\/p>","opzioni":["qualunque funzione scritta nello stesso file","solo i metodi della stessa classe","solo il <code>main<\/code>","le classi derivate, ma non i metodi della classe stessa"],"giusta":1,"commento":"<p>Solo i metodi della classe (e le funzioni dichiarate <code>friend<\/code>, che vedrai con gli operatori). Le classi derivate (D) accedono ai membri <code>protected<\/code>, non ai <code>private<\/code>.<\/p>"},{"id":"m01-q07","modulo":1,"rif":null,"domanda":"<p>Un metodo dichiarato <code>int getX() const<\/code> :<\/p>","opzioni":["restituisce un valore che non si può modificare","promette di non modificare lo stato dell'oggetto","può essere chiamato solo su oggetti costanti","è condiviso da tutti gli oggetti e non ha accesso agli attributi"],"giusta":1,"commento":"<p><code>const<\/code> dopo le parentesi riguarda l'oggetto su cui si chiama il metodo, non il valore restituito. Un metodo <code>const<\/code> si può chiamare su qualunque oggetto, costante o no (C è falsa).<\/p>"},{"id":"m01-q08","modulo":1,"rif":null,"domanda":"<p>Si creano 100 oggetti della classe <code>Auto<\/code>, che ha 3 attributi e 5 metodi. In memoria esistono:<\/p>","opzioni":["100 copie degli attributi e 100 copie del codice dei metodi","100 copie degli attributi e una sola copia del codice dei metodi","una sola copia degli attributi e 100 copie dei metodi","una sola copia di tutto, condivisa"],"giusta":1,"commento":"<p>Ogni oggetto ha i <i>suoi<\/i> attributi (il suo stato), ma il codice dei metodi è uno solo.<\/p>"},{"id":"m01-q09","modulo":1,"rif":null,"domanda":"<p>Nell'istruzione <code>auto1.accelera(20);<\/code> il <i>selettore<\/i> del messaggio è:<\/p>","opzioni":["<code>auto1<\/code>","<code>accelera<\/code>","<code>20<\/code>","il punto"],"giusta":1,"commento":"<p>Destinatario <code>auto1<\/code>, selettore <code>accelera<\/code>, argomento <code>20<\/code>.<\/p>"},{"id":"m01-q10","modulo":1,"rif":null,"domanda":"<p>Una sottoclasse si può differenziare dalla sua sopraclasse:<\/p>","opzioni":["solo aggiungendo attributi e metodi (estensione)","solo riscrivendo metodi ereditati (ridefinizione)","sia per estensione sia per ridefinizione","in nessun modo: è una copia identica"],"giusta":2,"commento":"<p>Estensione (aggiungo) e ridefinizione (modifico) si possono usare insieme.<\/p>"},{"id":"m01-q11","modulo":1,"rif":null,"domanda":"<p>Qual è l'unica differenza tra <code>struct<\/code> e <code>class<\/code> in C++?<\/p>","opzioni":["le <code>struct<\/code> non possono avere metodi","le <code>struct<\/code> non possono avere membri privati","l'accesso di default: <code>public<\/code> nelle <code>struct<\/code>, <code>private<\/code> nelle <code>class<\/code>","le <code>class<\/code> si allocano nello heap, le <code>struct<\/code> nello stack"],"giusta":2,"commento":"<p>Anche le <code>struct<\/code> C++ hanno metodi e membri privati; dove vengono allocate dipende da come le crei, non dal fatto che siano <code>struct<\/code> o <code>class<\/code>.<\/p>"},{"id":"m02-q01","modulo":2,"rif":null,"domanda":"<p>L'utente digita <code>42<\/code> e Invio. Il codice esegue <code>cin &gt;&gt; n;<\/code> e subito dopo <code>getline(cin, s);<\/code>. Cosa contiene <code>s<\/code>?<\/p>","opzioni":["la riga che l'utente scriverà dopo","una stringa vuota","<code>\" 42\"<\/code>","il codice non compila"],"giusta":1,"commento":"<p><code>cin &gt;&gt; n<\/code> lascia il <code>\\n<\/code> nel buffer; <code>getline<\/code> lo trova subito e si ferma.<\/p>"},{"id":"m02-q02","modulo":2,"rif":null,"domanda":"<p>Cosa fa <code>cin.clear()<\/code>?<\/p>","opzioni":["svuota il buffer di input","azzera i flag di errore dello stream","chiude lo stream","assegna 0 all'ultima variabile letta"],"giusta":1,"commento":"<p><code>clear<\/code> spegne solo la spia d'errore. Per svuotare il buffer (A) serve <code>ignore<\/code>.<\/p>"},{"id":"m02-q03","modulo":2,"rif":null,"domanda":"<p>Cosa stampa il seguente codice?<br><code>int x = 1; int main() { int x = 2; cout &lt;&lt; ::x &lt;&lt; x; }<\/code><\/p>","opzioni":["<code>22<\/code>","<code>12<\/code>","<code>21<\/code>","errore di compilazione: <code>x<\/code> è dichiarata due volte"],"giusta":1,"commento":"<p><code>::x<\/code> è la globale (1), <code>x<\/code> la locale (2). Non è un errore (D) perché le due <code>x<\/code> sono in scope diversi: è shadowing.<\/p>"},{"id":"m02-q04","modulo":2,"rif":null,"domanda":"<p>Qual è l'ordine corretto delle fasi di traduzione di un programma C++?<\/p>","opzioni":["linker, compilatore, preprocessore","preprocessore, compilatore, linker","compilatore, preprocessore, linker","compilatore, linker, preprocessore"],"giusta":1,"commento":"<p>Il preprocessore lavora sul testo (<code>#include<\/code>), il compilatore produce i <code>.o<\/code>, il linker li unisce.<\/p>"},{"id":"m02-q05","modulo":2,"rif":null,"domanda":"<p>Dato <code>stringstream ss(\" 10 abc\"); int a, b; ss &gt;&gt; a &gt;&gt; b;<\/code> quale affermazione è vera?<\/p>","opzioni":["<code>a<\/code> vale 10, <code>b<\/code> vale <code>abc<\/code>","<code>a<\/code> vale 10 e la lettura di <code>b<\/code> fallisce: <code>ss.fail()<\/code> è <code>true<\/code>","errore di compilazione","<code>a<\/code> vale 0 perché lo stream non è <code>cin<\/code>"],"giusta":1,"commento":"<p><code>abc<\/code> non è un intero: lo stream va in errore. Dal C++11 <code>b<\/code> viene messo a 0, ma l'importante è che <code>ss.fail()<\/code> sia <code>true<\/code>.<\/p>"},{"id":"m02-q06","modulo":2,"rif":null,"domanda":"<p>Che differenza c'è tra <code>endl<\/code> e <code>'\\ n'<\/code>?<\/p>","opzioni":["nessuna","<code>endl<\/code> va a capo e in più svuota il buffer di output","<code>'\\ n'<\/code> funziona solo con <code>cerr<\/code>","<code>endl<\/code> stampa due righe vuote"],"giusta":1,"commento":"<p><code>endl<\/code> equivale a <code>'\\n'<\/code> più <code>flush<\/code>.<\/p>"},{"id":"m02-q07","modulo":2,"rif":null,"domanda":"<p>Un programma compila senza errori, ma alla fine compare <i>undefined reference to `f(int)'<\/i>. Quale fase ha segnalato il problema?<\/p>","opzioni":["il preprocessore","il compilatore","il linker","il programma in esecuzione"],"giusta":2,"commento":"<p>Il compilatore si accontenta del prototipo; è il linker a non trovare il corpo della funzione.<\/p>"},{"id":"m02-q08","modulo":2,"rif":null,"domanda":"<p>A cosa servono <code>#ifndef<\/code>, <code>#define<\/code> ed <code>#endif<\/code> all'inizio e alla fine di un header?<\/p>","opzioni":["a rendere più veloce la compilazione del <code>main<\/code>","a evitare che il contenuto dell'header venga incluso più volte","a dichiarare il namespace dell'header","a definire le costanti globali del programma"],"giusta":1,"commento":"<p>Sono le <i>include guard<\/i>: la seconda inclusione viene saltata.<\/p>"},{"id":"m02-q09","modulo":2,"rif":null,"domanda":"<p>Quale espressione restituisce un intero casuale da 1 a 6 compresi?<\/p>","opzioni":["<code>rand() % 6<\/code>","<code>rand() % 7<\/code>","<code>1 + rand() % 6<\/code>","<code>1 + rand() % 5<\/code>"],"giusta":2,"commento":"<p><code>rand() % 6<\/code> va da 0 a 5; sommando 1 si ottiene da 1 a 6. La B va da 0 a 6, la D da 1 a 5.<\/p>"},{"id":"m02-q10","modulo":2,"rif":null,"domanda":"<p>Con l'input <code>Mario Rossi<\/code>, cosa contiene <code>s<\/code> dopo <code>cin &gt;&gt; s;<\/code>?<\/p>","opzioni":["<code>Mario Rossi<\/code>","<code>Mario<\/code>","<code>Casella<\/code>","una stringa vuota"],"giusta":1,"commento":"<p><code>&gt;&gt;<\/code> con una <code>string<\/code> si ferma al primo spazio; per la riga intera serve <code>getline<\/code>.<\/p>"},{"id":"m03-q01","modulo":3,"rif":null,"domanda":"<p>Dopo <code>int a = 5; int* p = &amp;a; *p = *p * 2;<\/code> quanto vale <code>a<\/code>?<\/p>","opzioni":["5","10","l'indirizzo di <code>a<\/code> moltiplicato per 2","errore di compilazione"],"giusta":1,"commento":"<p><code>*p<\/code> è <code>a<\/code>: l'istruzione equivale ad <code>a = a * 2<\/code>.<\/p>"},{"id":"m03-q02","modulo":3,"rif":null,"domanda":"<p>Quale affermazione sulle reference è <b>falsa<\/b>?<\/p>","opzioni":["una reference deve essere inizializzata nella dichiarazione","una reference può essere spostata su un'altra variabile dopo la dichiarazione","una reference ha lo stesso indirizzo della variabile a cui si riferisce","una reference non può essere nulla"],"giusta":1,"commento":"<p>Una reference resta legata per sempre. <code>r = y;<\/code> non sposta <code>r<\/code>: <b>copia il valore<\/b> di <code>y<\/code> dentro la variabile originale.<\/p>"},{"id":"m03-q03","modulo":3,"rif":null,"domanda":"<p>Dato <code>const int* p = &amp;x;<\/code> quale istruzione <b>non<\/b> compila?<\/p>","opzioni":["<code>p = &amp;y;<\/code>","<code>cout &lt;&lt; *p;<\/code>","<code>*p = 10;<\/code>","<code>int z = *p;<\/code>"],"giusta":2,"commento":"<p><code>const int*<\/code> blocca il <b>valore puntato<\/b>; spostare il puntatore (A) è permesso.<\/p>"},{"id":"m03-q04","modulo":3,"rif":null,"domanda":"<p>Come si libera correttamente <code>double* v = new double[n];<\/code>?<\/p>","opzioni":["<code>delete v;<\/code>","<code>delete[] v;<\/code>","<code>free(v);<\/code>","non serve: viene liberato alla fine della funzione"],"giusta":1,"commento":"<p><code>new[]<\/code> richiede <code>delete[]<\/code>. <code>free<\/code> (C) va solo con <code>malloc<\/code>; D è falsa: lo heap non si libera da solo.<\/p>"},{"id":"m03-q05","modulo":3,"rif":null,"domanda":"<p>Dato <code>int v[4] = {10, 20, 30, 40}; int* p = v;<\/code> quanto vale <code>*(p + 2)<\/code>?<\/p>","opzioni":["12","20","30","l'indirizzo di <code>v<\/code> più 2 byte"],"giusta":2,"commento":"<p><code>*(p + 2)<\/code> è <code>v[2]<\/code>. L'aritmetica avanza di <b>elementi<\/b>, non di byte.<\/p>"},{"id":"m03-q06","modulo":3,"rif":null,"domanda":"<p>In quale area di memoria si trova una variabile locale di una funzione?<\/p>","opzioni":["heap","stack","segmento dati statico","nei registri della CPU, sempre"],"giusta":1,"commento":"<p>Le variabili automatiche (locali) stanno nello stack.<\/p>"},{"id":"m03-q07","modulo":3,"rif":null,"domanda":"<p>Cosa dichiara <code>int (*f)(double);<\/code>?<\/p>","opzioni":["una funzione che restituisce un puntatore a <code>int<\/code>","un puntatore a una funzione che riceve un <code>double<\/code> e restituisce un <code>int<\/code>","un array di puntatori a <code>int<\/code>","un puntatore a <code>double<\/code>"],"giusta":1,"commento":"<p>Le parentesi attorno a <code>*f<\/code> la rendono un puntatore. Senza, sarebbe la A.<\/p>"},{"id":"m03-q08","modulo":3,"rif":null,"domanda":"<p>Dopo <code>int x = 1, y = 2; int&amp; r = x; r = y; y = 5;<\/code> quanto valgono <code>x<\/code> e <code>y<\/code>?<\/p>","opzioni":["<code>x = 1<\/code>, <code>y = 5<\/code>","<code>x = 2<\/code>, <code>y = 5<\/code>","<code>x = 5<\/code>, <code>y = 5<\/code>","errore: una reference non si può riassegnare"],"giusta":1,"commento":"<p><code>r = y<\/code> copia 2 dentro <code>x<\/code> (perché <code>r<\/code> <i>è<\/i> <code>x<\/code>); poi <code>y = 5<\/code> cambia solo <code>y<\/code>. La D è il distrattore: compila benissimo, solo non fa quello che sembra.<\/p>"},{"id":"m03-q09","modulo":3,"rif":null,"domanda":"<p>Una funzione deve riallocare un array dinamico ricevuto come parametro, in modo che il chiamante veda il nuovo blocco. Come va dichiarato il parametro?<\/p>","opzioni":["<code>int v[]<\/code>","<code>int* v<\/code>","<code>int*&amp; v<\/code>","<code>const int* v<\/code>"],"giusta":2,"commento":"<p>Serve un riferimento al puntatore: la funzione deve modificare il puntatore del chiamante, non solo gli elementi.<\/p>"},{"id":"m03-q10","modulo":3,"rif":null,"domanda":"<p>Cosa succede al puntatore <code>p<\/code> dopo <code>delete p;<\/code>?<\/p>","opzioni":["viene automaticamente impostato a <code>nullptr<\/code>","contiene ancora il vecchio indirizzo, ora non più valido","viene distrutto anche lui","punta al blocco di heap successivo"],"giusta":1,"commento":"<p><code>delete<\/code> libera il blocco ma non tocca il puntatore: è il dangling pointer. Per questo si scrive <code>p = nullptr;<\/code>.<\/p>"},{"id":"m03-q11","modulo":3,"rif":null,"domanda":"<p>Dato <code>int* a, b;<\/code> quale affermazione è vera?<\/p>","opzioni":["<code>a<\/code> e <code>b<\/code> sono entrambi puntatori a <code>int<\/code>","<code>a<\/code> è un puntatore, <code>b<\/code> è un <code>int<\/code>","<code>a<\/code> è un <code>int<\/code>, <code>b<\/code> è un puntatore","è un errore di sintassi"],"giusta":1,"commento":"<p>L'asterisco si lega al nome della variabile.<\/p>"},{"id":"m04-q01","modulo":4,"rif":null,"domanda":"<p>Quale affermazione sul costruttore è <b>falsa<\/b>?<\/p>","opzioni":["ha lo stesso nome della classe","restituisce <code>void<\/code>","può essere sovraccaricato (overloading)","viene eseguito automaticamente alla creazione dell'oggetto"],"giusta":1,"commento":"<p>Il costruttore non ha <i>nessun<\/i> tipo di ritorno, nemmeno <code>void<\/code>.<\/p>"},{"id":"m04-q02","modulo":4,"rif":null,"domanda":"<p>Una classe ha solo il costruttore <code>A(int x)<\/code>. Quale istruzione <b>non<\/b> compila?<\/p>","opzioni":["<code>A a(5);<\/code>","<code>A* p = new A(3);<\/code>","<code>A v[10];<\/code>","<code>A b = A(2);<\/code>"],"giusta":2,"commento":"<p>L'array richiede il costruttore senza parametri, che non esiste più.<\/p>"},{"id":"m04-q03","modulo":4,"rif":null,"domanda":"<p>Quante volte e con quanti parametri si può definire il distruttore di una classe?<\/p>","opzioni":["una volta sola, senza parametri","una volta per ogni costruttore","più volte, purché con parametri diversi","una volta sola, con un parametro di tipo <code>int<\/code>"],"giusta":0,"commento":"<p>Un solo distruttore, senza parametri e senza tipo di ritorno.<\/p>"},{"id":"m04-q04","modulo":4,"rif":null,"domanda":"<p>Dato <code>Vettore a(3);<\/code> quale istruzione chiama il <b>costruttore di copia<\/b>?<\/p>","opzioni":["<code>Vettore b; b = a;<\/code>","<code>Vettore b = a;<\/code>","<code>a = a;<\/code>","<code>Vettore* p = &amp;a;<\/code>"],"giusta":1,"commento":"<p><code>b<\/code> nasce da <code>a<\/code>. La A e la C sono assegnamenti (<code>operator=<\/code>), la D copia solo un indirizzo.<\/p>"},{"id":"m04-q05","modulo":4,"rif":null,"domanda":"<p>Perché il parametro del costruttore di copia è <code>const Classe&amp;<\/code> e non <code>Classe<\/code>?<\/p>","opzioni":["per motivi di velocità, ma funzionerebbe anche per valore","perché il passaggio per valore richiederebbe a sua volta una copia, causando una ricorsione infinita","perché i costruttori non possono ricevere oggetti","perché le reference sono obbligatorie in tutti i costruttori"],"giusta":1,"commento":"<p>È proprio un divieto, non una questione di velocità.<\/p>"},{"id":"m04-q06","modulo":4,"rif":null,"domanda":"<p>Cosa contiene <code>this<\/code> dentro un metodo?<\/p>","opzioni":["una copia dell'oggetto su cui il metodo è stato chiamato","l'indirizzo dell'oggetto su cui il metodo è stato chiamato","l'indirizzo della classe","l'indirizzo del metodo stesso"],"giusta":1,"commento":"<p><code>this<\/code> è un puntatore; <code>*this<\/code> è l'oggetto.<\/p>"},{"id":"m04-q07","modulo":4,"rif":null,"domanda":"<p>Un attributo dichiarato <code>static<\/code> in una classe:<\/p>","opzioni":["è condiviso da tutti gli oggetti della classe","non può essere modificato","viene allocato nello stack di ogni oggetto","è accessibile solo dai metodi <code>const<\/code>"],"giusta":0,"commento":"<p>Esiste in un'unica copia, nella memoria statica, anche senza oggetti.<\/p>"},{"id":"m04-q08","modulo":4,"rif":null,"domanda":"<p>Cosa afferma la Regola dei Tre?<\/p>","opzioni":["una classe deve avere al massimo tre costruttori","se serve uno tra distruttore, costruttore di copia e operatore di assegnamento, servono tutti e tre","ogni classe deve avere almeno tre metodi pubblici","un oggetto può essere copiato al massimo tre volte"],"giusta":1,"commento":"<p>I tre metodi gestiscono la stessa risorsa: o servono tutti o nessuno.<\/p>"},{"id":"m04-q09","modulo":4,"rif":null,"domanda":"<p>Una classe ha un attributo <code>int* dati<\/code> allocato con <code>new[]<\/code> nel costruttore e un distruttore che fa <code>delete[]<\/code>, ma <b>nessun<\/b> costruttore di copia. Cosa succede con <code>{ Classe a; Classe b = a; }<\/code>?<\/p>","opzioni":["niente di strano: il compilatore fa una copia profonda","<code>a<\/code> e <code>b<\/code> condividono il blocco e alla fine il blocco viene liberato due volte","errore di compilazione","<code>b<\/code> riceve un puntatore nullo"],"giusta":1,"commento":"<p>La copia automatica è superficiale: doppio <code>delete[]<\/code> alla chiusura del blocco. Compila senza problemi (C è falsa).<\/p>"},{"id":"m04-q10","modulo":4,"rif":null,"domanda":"<p>Perché <code>operator=<\/code> controlla <code>if (this == &amp;altro)<\/code>?<\/p>","opzioni":["per evitare di copiare oggetti di classi diverse","perché nell'autoassegnamento il <code>delete<\/code> iniziale distruggerebbe i dati da copiare","per velocizzare la copia di oggetti uguali","perché il compilatore lo richiede"],"giusta":1,"commento":"<p><code>a = a<\/code>: <code>delete[] dati<\/code> cancellerebbe proprio i dati di <code>altro<\/code>.<\/p>"},{"id":"m04-q11","modulo":4,"rif":null,"domanda":"<p>Un costruttore lancia un'eccezione con <code>throw<\/code>. Cosa succede all'oggetto?<\/p>","opzioni":["viene creato con gli attributi a zero","viene creato normalmente, l'eccezione è solo un avviso","non viene creato","il programma termina sempre"],"giusta":2,"commento":"<p>Un oggetto la cui costruzione fallisce non esiste: è il modo pulito per impedire la nascita di oggetti non validi. Il programma termina solo se nessuno cattura l'eccezione.<\/p>"},{"id":"m05-q01","modulo":5,"rif":null,"domanda":"<p>Quando vengono generate le versioni concrete di un template?<\/p>","opzioni":["durante l'esecuzione, la prima volta che vengono chiamate","durante la compilazione, per ogni tipo con cui il template viene usato","durante il linking, per tutti i tipi possibili","mai: il template viene interpretato"],"giusta":1,"commento":"<p>L'istanziazione avviene a compile-time, solo per i tipi effettivamente usati.<\/p>"},{"id":"m05-q02","modulo":5,"rif":null,"domanda":"<p>Dato <code>template &lt;typename T&gt; T massimo(T a, T b);<\/code> quale chiamata <b>non<\/b> compila?<\/p>","opzioni":["<code>massimo(3, 7)<\/code>","<code>massimo(2.5, 1.0)<\/code>","<code>massimo(3, 4.5)<\/code>","<code>massimo&lt;double&gt;(3, 4.5)<\/code>"],"giusta":2,"commento":"<p><code>T<\/code> dedotto in modo contraddittorio (<code>int<\/code> e <code>double<\/code>). La D risolve indicandolo esplicitamente.<\/p>"},{"id":"m05-q03","modulo":5,"rif":null,"domanda":"<p>In <code>template &lt;typename T&gt;<\/code>, la parola <code>typename<\/code> può essere sostituita da:<\/p>","opzioni":["<code>type<\/code>","<code>class<\/code>","<code>struct<\/code>","<code>auto<\/code>"],"giusta":1,"commento":"<p><code>template &lt;class T&gt;<\/code> è equivalente.<\/p>"},{"id":"m05-q04","modulo":5,"rif":null,"domanda":"<p>Come si dichiara un oggetto della classe template <code>Pila<\/code> per contenere stringhe?<\/p>","opzioni":["<code>Pila p&lt;string&gt;;<\/code>","<code>Pila&lt;string&gt; p;<\/code>","<code>Pila p(string);<\/code>","<code>template Pila&lt;string&gt; p;<\/code>"],"giusta":1,"commento":"<p>Per le classi il tipo si specifica sempre tra <code>&lt; &gt;<\/code> dopo il nome.<\/p>"},{"id":"m05-q05","modulo":5,"rif":null,"domanda":"<p>Un template <code>ordina(T a[], int n)<\/code> usa l'operatore <code>&lt;<\/code>. Cosa serve per ordinare un array di <code>Rettangolo<\/code>?<\/p>","opzioni":["niente: il compilatore confronta i rettangoli byte per byte","che <code>Rettangolo<\/code> definisca <code>operator&lt;<\/code>","una specializzazione obbligatoria <code>ordina&lt;Rettangolo&gt;<\/code>","che <code>Rettangolo<\/code> sia una <code>struct<\/code>"],"giusta":1,"commento":"<p>Il template funziona con qualunque tipo che fornisca le operazioni usate. La specializzazione (C) è possibile ma non obbligatoria.<\/p>"},{"id":"m05-q06","modulo":5,"rif":null,"domanda":"<p>Come si definisce fuori dalla classe il metodo <code>push<\/code> della classe template <code>Pila&lt;T&gt;<\/code>?<\/p>","opzioni":["<code>void Pila::push(T x) {...}<\/code>","<code>template &lt;typename T&gt; void Pila&lt;T&gt;::push(T x) {...}<\/code>","<code>void Pila&lt;T&gt;::push(T x) {...}<\/code>","<code>template void Pila::push(T x) {...}<\/code>"],"giusta":1,"commento":"<p>Servono sia <code>template &lt;typename T&gt;<\/code> sia <code>Pila&lt;T&gt;::<\/code>.<\/p>"},{"id":"m05-q07","modulo":5,"rif":null,"domanda":"<p>Un template di classe è dichiarato in <code>pila.h<\/code> e i suoi metodi sono definiti in <code>pila.cpp<\/code>. Il <code>main<\/code> usa <code>Pila&lt;int&gt;<\/code>. Cosa succede tipicamente?<\/p>","opzioni":["funziona tutto normalmente","errore del linker: <i>undefined reference<\/i>","errore del preprocessore","il programma funziona ma è più lento"],"giusta":1,"commento":"<p>Nessuna unità di traduzione genera il codice di <code>Pila&lt;int&gt;<\/code>.<\/p>"},{"id":"m05-q08","modulo":5,"rif":null,"domanda":"<p><code>Contenitore&lt;int&gt;<\/code> e <code>Contenitore&lt;double&gt;<\/code> sono:<\/p>","opzioni":["la stessa classe con due nomi","due classi distinte generate dallo stesso template","due oggetti della stessa classe","una classe e una sua sottoclasse"],"giusta":1,"commento":"<p>Ogni istanziazione è una classe a sé.<\/p>"},{"id":"m05-q09","modulo":5,"rif":null,"domanda":"<p>Cosa indica <code>template &lt;&gt;<\/code> prima di <code>bool uguali&lt;double&gt;(double a, double b)<\/code>?<\/p>","opzioni":["un template senza parametri, quindi un errore","una specializzazione esplicita del template per il tipo <code>double<\/code>","un template che accetta qualunque tipo tranne <code>double<\/code>","una funzione template con parametri di default"],"giusta":1,"commento":"<p>È la sintassi della specializzazione esplicita.<\/p>"},{"id":"m05-q10","modulo":5,"rif":null,"domanda":"<p>In <code>template &lt;typename T, int N&gt; class Buffer { T dati[N]; };<\/code> cos'è <code>N<\/code>?<\/p>","opzioni":["un secondo tipo","un parametro non di tipo: un valore intero costante noto a compile-time","una variabile che si può cambiare durante l'esecuzione","un errore: i template accettano solo tipi"],"giusta":1,"commento":"<p>Infatti si può usare come dimensione di un array statico.<\/p>"},{"id":"m06-q01","modulo":6,"rif":null,"domanda":"<p>Qual è la complessità di <code>for (i = 0; i &lt; n; i += 3) somma += i;<\/code>?<\/p>","opzioni":["O(1)","O(log n)","O(n)","O(n/3), diversa da O(n)"],"giusta":2,"commento":"<p>Circa n/3 giri: la costante 1/3 si ignora. La D è il distrattore: O(n/3) e O(n) sono la stessa cosa.<\/p>"},{"id":"m06-q02","modulo":6,"rif":null,"domanda":"<p>Qual è la complessità di <code>for (i = 1; i &lt; n; i *= 2) cont++;<\/code>?<\/p>","opzioni":["O(n)","O(log n)","O(n²)","O(2ⁿ)"],"giusta":1,"commento":"<p><code>i<\/code> raddoppia: si arriva a n in circa log₂ n passi.<\/p>"},{"id":"m06-q03","modulo":6,"rif":null,"domanda":"<p>Due cicli <code>for<\/code> da n giri ciascuno, scritti uno <b>dopo<\/b> l'altro (non annidati). Complessità totale?<\/p>","opzioni":["O(n)","O(n²)","O(2n²)","O(log n)"],"giusta":0,"commento":"<p>In sequenza si sommano: n + n = 2n, cioè O(n).<\/p>"},{"id":"m06-q04","modulo":6,"rif":null,"domanda":"<p>T(n) = 4n³ + 100n² + 7. Quale affermazione è <b>vera<\/b>?<\/p>","opzioni":["T(n) = O(n²)","T(n) = O(n³)","T(n) = O(100n²)","T(n) = O(7)"],"giusta":1,"commento":"<p>Vince il termine n³. La C è uguale ad O(n²) ed è falsa.<\/p>"},{"id":"m06-q05","modulo":6,"rif":null,"domanda":"<p>Se un algoritmo è O(n²), quale affermazione è sicuramente vera?<\/p>","opzioni":["è anche O(n³)","è anche O(n)","è anche Ω(n²)","impiega esattamente n² passi"],"giusta":0,"commento":"<p>O-grande è un limite superiore: un limite più alto è ancora valido. Le altre non sono garantite.<\/p>"},{"id":"m06-q06","modulo":6,"rif":null,"domanda":"<p>Cosa significa f(n) = Θ(g(n))?<\/p>","opzioni":["f cresce al più come g","f cresce almeno come g","f cresce esattamente come g: è sia O(g) sia Ω(g)","f e g sono la stessa funzione"],"giusta":2,"commento":"<p>Definizione di Θ.<\/p>"},{"id":"m06-q07","modulo":6,"rif":null,"domanda":"<p>Quale ordine di crescita è corretto, dal più lento al più veloce?<\/p>","opzioni":["log n, n, nlog n, n², 2ⁿ","n, log n, n², nlog n, 2ⁿ","log n, nlog n, n, 2ⁿ, n²","1, n, log n, n², nlog n"],"giusta":0,"commento":""},{"id":"m06-q08","modulo":6,"rif":null,"domanda":"<p>La ricorrenza C_N = 2C_(N/2) + N (divido a metà, risolvo le due metà, scorro tutto) ha soluzione:<\/p>","opzioni":["O(N)","O(log N)","O(N log N)","O(N²)"],"giusta":2,"commento":"<p>È la ricorrenza del MergeSort: log N livelli da N di lavoro.<\/p>"},{"id":"m06-q09","modulo":6,"rif":null,"domanda":"<p>Un algoritmo di ordinamento per confronti ha complessità O(n log n). Sapendo che il problema è Ω(n log n), l'algoritmo è:<\/p>","opzioni":["ottimo","migliorabile fino a O(n)","esponenziale","non si può dire nulla"],"giusta":0,"commento":"<p>Limite superiore dell'algoritmo e limite inferiore del problema coincidono.<\/p>"},{"id":"m06-q10","modulo":6,"rif":null,"domanda":"<p>In una ricerca lineare su un array di n elementi, il caso peggiore è:<\/p>","opzioni":["l'elemento cercato è il primo","l'elemento cercato è a metà","l'elemento è l'ultimo o non è presente","l'array è vuoto"],"giusta":2,"commento":"<p>Servono n confronti.<\/p>"},{"id":"m06-q11","modulo":6,"rif":null,"domanda":"<p>Qual è la complessità in <b>spazio<\/b> della potenza ricorsiva <code>pot(x, n) = x * pot(x, n-1)<\/code>?<\/p>","opzioni":["O(1), perché non usa array","O(n), perché le n chiamate sono contemporaneamente nello stack","O(log n)","O(n²)"],"giusta":1,"commento":"<p>Ogni chiamata occupa un record di attivazione finché le successive non terminano.<\/p>"},{"id":"m07-q01","modulo":7,"rif":null,"domanda":"<p>Qual è la complessità del merge sort nel caso peggiore?<\/p>","opzioni":["O(n)","O(n log n)","O(n²)","O(log n)"],"giusta":1,"commento":"<p>Divide sempre a metà: O(n log n) in ogni caso.<\/p>"},{"id":"m07-q02","modulo":7,"rif":null,"domanda":"<p>Qual è la complessità del quick sort nel caso peggiore?<\/p>","opzioni":["O(n log n)","O(n)","O(n²)","O(2ⁿ)"],"giusta":2,"commento":"<p>Con pivot sempre estremo le partizioni sono sbilanciate.<\/p>"},{"id":"m07-q03","modulo":7,"rif":null,"domanda":"<p>Quale algoritmo esegue sempre lo stesso numero di confronti, anche se l'array è già ordinato?<\/p>","opzioni":["bubble sort con controllo sugli scambi","insertion sort","selection sort","nessuno"],"giusta":2,"commento":"<p>Cerca comunque il minimo in tutta la parte restante.<\/p>"},{"id":"m07-q04","modulo":7,"rif":null,"domanda":"<p>Cosa richiede la ricerca binaria per funzionare correttamente?<\/p>","opzioni":["un array di numeri interi","un array ordinato","un array di dimensione pari","un array senza duplicati"],"giusta":1,"commento":"<p>I duplicati (D) non sono un problema.<\/p>"},{"id":"m07-q05","modulo":7,"rif":null,"domanda":"<p>Quale affermazione sul merge sort è <b>falsa<\/b>?<\/p>","opzioni":["segue il paradigma divide et impera","è stabile","ordina in loco senza memoria aggiuntiva","la fusione di due metà ordinate costa tempo lineare"],"giusta":2,"commento":"<p>Serve un array d'appoggio di dimensione n.<\/p>"},{"id":"m07-q06","modulo":7,"rif":null,"domanda":"<p>Nel quick sort, cosa garantisce la fase di partizione?<\/p>","opzioni":["che le due parti abbiano la stessa dimensione","che ogni elemento della parte sinistra sia ≤ di ogni elemento della parte destra","che la parte sinistra sia già ordinata","che il pivot sia il mediano"],"giusta":1,"commento":"<p>Le dimensioni possono essere molto diverse (A falsa); le due parti vanno poi ordinate ricorsivamente (C falsa).<\/p>"},{"id":"m07-q07","modulo":7,"rif":null,"domanda":"<p>Un algoritmo di ordinamento si dice stabile se:<\/p>","opzioni":["non va mai in crash","ha la stessa complessità in tutti i casi","mantiene l'ordine relativo degli elementi con chiave uguale","non usa memoria aggiuntiva"],"giusta":2,"commento":""},{"id":"m07-q08","modulo":7,"rif":null,"domanda":"<p>Quanti confronti servono al più per trovare un elemento con la ricerca binaria in un array ordinato di 1000 elementi?<\/p>","opzioni":["circa 10","circa 100","circa 500","1000"],"giusta":0,"commento":"<p>2¹⁰ = 1024: circa 10 dimezzamenti.<\/p>"},{"id":"m07-q09","modulo":7,"rif":null,"domanda":"<p>Quale algoritmo ha complessità O(n) nel caso migliore (array già ordinato)?<\/p>","opzioni":["merge sort","selection sort","insertion sort","quick sort"],"giusta":2,"commento":"<p>Il <code>while<\/code> interno non parte mai: un confronto per elemento. Vale anche per il bubble sort con il flag, che però non è tra le risposte.<\/p>"},{"id":"m07-q10","modulo":7,"rif":null,"domanda":"<p>Si può ordinare per confronti con complessità O(n) nel caso peggiore?<\/p>","opzioni":["sì, con il quick sort","sì, con il bubble sort ottimizzato","no: ogni ordinamento per confronti è Ω(n log n) nel caso peggiore","no, il limite è Ω(n²)"],"giusta":2,"commento":"<p>Limite inferiore del problema (Modulo 6). Il counting sort è lineare perché <i>non<\/i> confronta.<\/p>"},{"id":"m08-q01","modulo":8,"rif":null,"domanda":"<p>Quali sono i due elementi indispensabili di una funzione ricorsiva corretta?<\/p>","opzioni":["un ciclo <code>for<\/code> e una variabile globale","un caso base e una chiamata ricorsiva su un problema più piccolo","almeno due parametri e un valore di ritorno","un puntatore e un'allocazione dinamica"],"giusta":1,"commento":"<p>Le due regole d'oro.<\/p>"},{"id":"m08-q02","modulo":8,"rif":null,"domanda":"<p>Cosa succede se una funzione ricorsiva non raggiunge mai il caso base?<\/p>","opzioni":["restituisce 0","il compilatore segnala un errore","le chiamate si accumulano finché lo stack si esaurisce e il programma va in crash","il programma si ferma dopo 1000 chiamate restituendo l'ultimo valore"],"giusta":2,"commento":"<p>È lo <i>stack overflow<\/i>. Il compilatore non se ne accorge (B).<\/p>"},{"id":"m08-q03","modulo":8,"rif":null,"domanda":"<p>Cosa restituisce <code>f(4)<\/code>, con <code>int f(int n) { if (n == 0) return 0; return n + f(n - 1); }<\/code>?<\/p>","opzioni":["4","10","24","0"],"giusta":1,"commento":"<p>4 + 3 + 2 + 1 + 0.<\/p>"},{"id":"m08-q04","modulo":8,"rif":null,"domanda":"<p>Cosa stampa <code>g(3)<\/code>, con <code>void g(int n) { if (n == 0) return; g(n - 1); cout &lt;&lt; n; }<\/code>?<\/p>","opzioni":["<code>321<\/code>","<code>123<\/code>","<code>3<\/code>","<code>0123<\/code>"],"giusta":1,"commento":"<p>La stampa è <i>dopo<\/i> la chiamata: avviene al ritorno, partendo dalla chiamata più profonda.<\/p>"},{"id":"m08-q05","modulo":8,"rif":null,"domanda":"<p>Durante l'esecuzione di <code>fatt(5)<\/code>, quanti record di attivazione di <code>fatt<\/code> sono presenti contemporaneamente nello stack, al massimo?<\/p>","opzioni":["1","5","6","120"],"giusta":2,"commento":"<p><code>fatt(5)<\/code>, <code>fatt(4)<\/code>, …, <code>fatt(0)<\/code>: sei record.<\/p>"},{"id":"m08-q06","modulo":8,"rif":null,"domanda":"<p>Quale di queste funzioni è ricorsiva <b>di coda<\/b>?<\/p>","opzioni":["<code>return n * fatt(n - 1);<\/code>","<code>return mcd(b, a % b);<\/code>","<code>return 1 + lunghezza(p-&gt;next);<\/code>","<code>return f(n - 1) + f(n - 2);<\/code>"],"giusta":1,"commento":"<p>Nelle altre, dopo la chiamata c'è ancora un'operazione (<code>*<\/code>, <code>+<\/code>).<\/p>"},{"id":"m08-q07","modulo":8,"rif":null,"domanda":"<p>Qual è la complessità in spazio del fattoriale ricorsivo <code>fatt(n)<\/code>?<\/p>","opzioni":["O(1)","O(log n)","O(n)","O(n!)"],"giusta":2,"commento":"<p>La profondità massima della ricorsione è n + 1.<\/p>"},{"id":"m08-q08","modulo":8,"rif":null,"domanda":"<p>Quale affermazione su ricorsione e iterazione è corretta (secondo le slide)?<\/p>","opzioni":["alcuni problemi si possono risolvere solo con la ricorsione","ogni funzione ricorsiva ha un'equivalente iterativa, di solito più efficiente","la ricorsione è sempre più veloce dell'iterazione","l'iterazione non può usare lo stack"],"giusta":1,"commento":"<p>Proprio come dicono le slide.<\/p>"},{"id":"m08-q09","modulo":8,"rif":null,"domanda":"<p>Perché non si può dimostrare per induzione che <code>puzzle(N)<\/code> delle slide termini?<\/p>","opzioni":["perché non ha un caso base","perché alcune chiamate ricorsive hanno un argomento più grande di N","perché usa l'operatore <code>%<\/code>","perché restituisce sempre 1"],"giusta":1,"commento":"<p>Con N dispari si passa a 3N + 1.<\/p>"},{"id":"m08-q10","modulo":8,"rif":null,"domanda":"<p>Nella torre di Hanoi con n dischi servono 2ⁿ - 1 mosse. Che complessità ha l'algoritmo?<\/p>","opzioni":["O(n)","O(n²)","O(n log n)","O(2ⁿ)"],"giusta":3,"commento":"<p>Il numero di mosse raddoppia a ogni disco in più.<\/p>"},{"id":"m09-q01","modulo":9,"rif":null,"domanda":"<p>Una classe derivata con ereditarietà <code>public<\/code> può accedere ai membri <code>private<\/code> della classe base?<\/p>","opzioni":["sì, sempre","no: li eredita ma non può accedervi direttamente","sì, ma solo nel costruttore","no, e non li eredita nemmeno"],"giusta":1,"commento":"<p>I private sono dentro l'oggetto ma inaccessibili alla derivata.<\/p>"},{"id":"m09-q02","modulo":9,"rif":null,"domanda":"<p>In che ordine vengono eseguiti i costruttori creando un oggetto di una classe C derivata da B, a sua volta derivata da A?<\/p>","opzioni":["C, B, A","A, B, C","solo C","l'ordine non è definito"],"giusta":1,"commento":"<p>Dalla base verso la derivata; i distruttori al contrario.<\/p>"},{"id":"m09-q03","modulo":9,"rif":null,"domanda":"<p><code>Base* p = new Derivata();<\/code> Il metodo <code>f()<\/code> è definito in entrambe le classi ma <b>non<\/b> è <code>virtual<\/code>. Quale versione esegue <code>p-&gt;f()<\/code>?<\/p>","opzioni":["quella di <code>Derivata<\/code>","quella di <code>Base<\/code>","entrambe, prima Base poi Derivata","errore di compilazione"],"giusta":1,"commento":"<p>Senza <code>virtual<\/code>, binding statico sul tipo del puntatore.<\/p>"},{"id":"m09-q04","modulo":9,"rif":null,"domanda":"<p>Cosa rende una classe astratta?<\/p>","opzioni":["avere almeno un metodo <code>virtual<\/code>","avere almeno un metodo virtuale puro (<code>= 0<\/code>)","essere dichiarata con la parola <code>abstract<\/code>","non avere costruttori"],"giusta":1,"commento":"<p>In C++ non esiste la parola <code>abstract<\/code> (C).<\/p>"},{"id":"m09-q05","modulo":9,"rif":null,"domanda":"<p>Perché il distruttore di una classe base polimorfica dovrebbe essere virtuale?<\/p>","opzioni":["per poter essere chiamato più volte","perché con <code>delete<\/code> su un puntatore alla base venga chiamato anche il distruttore della derivata","perché i distruttori non virtuali non liberano la memoria dell'oggetto","non serve: è solo una convenzione di stile"],"giusta":1,"commento":"<p>Altrimenti parte solo il distruttore della base: comportamento indefinito, tipicamente un memory leak.<\/p>"},{"id":"m09-q06","modulo":9,"rif":null,"domanda":"<p>Cosa restituisce <code>dynamic_cast&lt;Cane*&gt;(p)<\/code> se <code>p<\/code> punta a un <code>Gatto<\/code>?<\/p>","opzioni":["un puntatore al Gatto convertito in Cane","<code>nullptr<\/code>","lancia sempre un'eccezione","non compila"],"giusta":1,"commento":"<p>Con i puntatori fallisce restituendo <code>nullptr<\/code>; con le reference lancia <code>bad_cast<\/code>.<\/p>"},{"id":"m09-q07","modulo":9,"rif":null,"domanda":"<p>Quale affermazione su <code>virtual<\/code> è <b>falsa<\/b>?<\/p>","opzioni":["un metodo <code>static<\/code> non può essere virtuale","<code>virtual<\/code> si scrive nella dichiarazione, non nella definizione fuori dalla classe","un metodo virtuale nella base resta virtuale nelle derivate anche senza ripetere <code>virtual<\/code>","una funzione esterna a qualunque classe può essere dichiarata <code>virtual<\/code>"],"giusta":3,"commento":"<p>Solo i metodi (non statici) possono essere virtuali.<\/p>"},{"id":"m09-q08","modulo":9,"rif":null,"domanda":"<p><code>Figura f = cerchio;<\/code> dove <code>cerchio<\/code> è un oggetto <code>Cerchio<\/code> derivato da <code>Figura<\/code>. Cosa succede?<\/p>","opzioni":["<code>f<\/code> è un Cerchio completo","errore di compilazione","viene copiata solo la parte Figura (slicing)","<code>f<\/code> diventa un riferimento a <code>cerchio<\/code>"],"giusta":2,"commento":""},{"id":"m09-q09","modulo":9,"rif":null,"domanda":"<p>Due <code>catch<\/code> in sequenza: prima <code>catch (const exception&amp; e)<\/code>, poi <code>catch (const out_of_range&amp; e)<\/code>. Viene lanciata una <code>out_of_range<\/code>. Quale blocco la gestisce?<\/p>","opzioni":["il primo, perché <code>out_of_range<\/code> deriva da <code>exception<\/code>","il secondo, perché è più specifico","entrambi","nessuno"],"giusta":0,"commento":"<p>Vince il primo catch compatibile: per questo i più specifici vanno scritti prima.<\/p>"},{"id":"m09-q10","modulo":9,"rif":null,"domanda":"<p>Nel problema del diamante (D deriva da B e C, che derivano da A), come si ottiene un'unica copia di A dentro D?<\/p>","opzioni":["dichiarando A astratta","derivando B e C da A con <code>public virtual A<\/code>","derivando D con <code>private<\/code>","non si può"],"giusta":1,"commento":"<p>Ereditarietà virtuale.<\/p>"},{"id":"m09-q11","modulo":9,"rif":null,"domanda":"<p>Quale relazione esprime l'ereditarietà pubblica?<\/p>","opzioni":["“ha un” (composizione)","“usa un” (associazione)","“è un”","“contiene un array di”"],"giusta":2,"commento":""},{"id":"m10-q01","modulo":10,"rif":null,"domanda":"<p>Quale di questi operatori <b>non<\/b> può essere sovraccaricato in C++?<\/p>","opzioni":["<code>[]<\/code>","<code>&lt;&lt;<\/code>","<code>::<\/code>","<code>()<\/code>"],"giusta":2,"commento":"<p>Non si sovraccaricano <code>::<\/code>, <code>.<\/code>, <code>.*<\/code>, <code>?:<\/code>, <code>sizeof<\/code>.<\/p>"},{"id":"m10-q02","modulo":10,"rif":null,"domanda":"<p>Perché <code>operator&lt;&lt;<\/code> per la stampa è definito come funzione esterna (spesso <code>friend<\/code>) e non come metodo?<\/p>","opzioni":["perché i metodi non possono restituire reference","perché l'operando di sinistra è lo stream, non un oggetto della classe","perché <code>friend<\/code> è obbligatorio per tutti gli operatori","perché gli operatori non possono essere metodi"],"giusta":1,"commento":"<p>Un metodo avrebbe l'oggetto a sinistra (<code>p &lt;&lt; cout<\/code>).<\/p>"},{"id":"m10-q03","modulo":10,"rif":null,"domanda":"<p>Qual è la firma corretta di <code>operator&lt;&lt;<\/code> per stampare un <code>Punto<\/code>?<\/p>","opzioni":["<code>void operator&lt;&lt;(ostream os, Punto p)<\/code>","<code>ostream&amp; operator&lt;&lt;(ostream&amp; os, const Punto&amp; p)<\/code>","<code>Punto&amp; operator&lt;&lt;(const Punto&amp; p, ostream&amp; os)<\/code>","<code>ostream operator&lt;&lt;(ostream&amp; os, Punto&amp; p) const<\/code>"],"giusta":1,"commento":"<p>Stream per reference (non si copia), oggetto per reference costante.<\/p>"},{"id":"m10-q04","modulo":10,"rif":null,"domanda":"<p>Perché <code>operator&lt;&lt;<\/code> restituisce <code>ostream&amp;<\/code>?<\/p>","opzioni":["per poter concatenare più stampe, come <code>cout &lt;&lt; a &lt;&lt; b<\/code>","perché è obbligatorio per tutte le funzioni friend","per poter modificare l'oggetto stampato","per velocità: altrimenti la stampa sarebbe più lenta"],"giusta":0,"commento":"<p><code>(cout &lt;&lt; a) &lt;&lt; b<\/code>.<\/p>"},{"id":"m10-q05","modulo":10,"rif":null,"domanda":"<p>Come si distingue l'operatore di incremento postfisso (<code>a++<\/code>) da quello prefisso?<\/p>","opzioni":["il postfisso ha un parametro fittizio di tipo <code>int<\/code>","il postfisso si dichiara con <code>operator++post<\/code>","non si distinguono: il compilatore usa sempre il prefisso","il postfisso deve essere <code>friend<\/code>"],"giusta":0,"commento":"<p><code>operator++(int)<\/code>.<\/p>"},{"id":"m10-q06","modulo":10,"rif":null,"domanda":"<p>Che tipo dovrebbe restituire <code>operator[]<\/code> per permettere <code>v[3] = 7;<\/code>?<\/p>","opzioni":["<code>int<\/code>","<code>int&amp;<\/code>","<code>void<\/code>","<code>const int<\/code>"],"giusta":1,"commento":"<p>Con <code>int<\/code> si modificherebbe una copia.<\/p>"},{"id":"m10-q07","modulo":10,"rif":null,"domanda":"<p>L'operatore <code>+=<\/code> definito come metodo dovrebbe restituire:<\/p>","opzioni":["<code>void<\/code>","una copia dell'oggetto, per valore","<code>*this<\/code> per reference","<code>bool<\/code>"],"giusta":2,"commento":"<p>Come gli <code>int<\/code>: <code>(a += b) += c<\/code>.<\/p>"},{"id":"m10-q08","modulo":10,"rif":null,"domanda":"<p>Una funzione dichiarata <code>friend<\/code> all'interno di una classe:<\/p>","opzioni":["è un metodo della classe e ha il puntatore <code>this<\/code>","non è un metodo, ma può accedere ai membri privati della classe","può essere dichiarata amica da qualunque altra classe, senza il consenso della classe","può accedere solo ai membri <code>public<\/code>"],"giusta":1,"commento":"<p>È la classe a concedere l'amicizia (C falsa).<\/p>"},{"id":"m10-q09","modulo":10,"rif":null,"domanda":"<p>La classe <code>Complesso<\/code> ha il costruttore <code>Complesso(double re = 0, double im = 0)<\/code> e <code>operator+<\/code> definito come <b>metodo<\/b>. Quale espressione <b>non<\/b> compila?<\/p>","opzioni":["<code>z + w<\/code>","<code>z + 2<\/code>","<code>2 + z<\/code>","<code>z + z<\/code>"],"giusta":2,"commento":"<p>Con un metodo l'operando di sinistra deve essere già un <code>Complesso<\/code>; <code>z + 2<\/code> funziona perché <code>2<\/code> (a destra) viene convertito. Con <code>operator+<\/code> esterno funzionerebbero tutte.<\/p>"},{"id":"m10-q10","modulo":10,"rif":null,"domanda":"<p>Quale affermazione sull'overloading degli operatori è vera?<\/p>","opzioni":["si può cambiare la precedenza di un operatore","si possono creare nuovi operatori, come <code>**<\/code>","almeno un operando deve essere di un tipo definito dall'utente","si può ridefinire <code>+<\/code> tra due <code>int<\/code>"],"giusta":2,"commento":""},{"id":"m11-q01","modulo":11,"rif":null,"domanda":"<p>Qual è il costo dell'accesso all'i-esimo elemento in una lista concatenata semplice?<\/p>","opzioni":["O(1)","O(log i)","O(i)","O(i²)"],"giusta":2,"commento":"<p>Accesso sequenziale: bisogna seguire i frecce.<\/p>"},{"id":"m11-q02","modulo":11,"rif":null,"domanda":"<p>Qual è il costo dell'inserimento in testa in una lista concatenata?<\/p>","opzioni":["O(1)","O(log n)","O(n)","dipende dal valore inserito"],"giusta":0,"commento":"<p>Un nodo nuovo e due assegnazioni.<\/p>"},{"id":"m11-q03","modulo":11,"rif":null,"domanda":"<p>Si può applicare la ricerca binaria a una lista concatenata ordinata ottenendo O(log n)?<\/p>","opzioni":["sì, come con gli array","no, perché non si può accedere in tempo costante all'elemento centrale","sì, ma solo con le liste doppie","no, perché le liste non possono essere ordinate"],"giusta":1,"commento":"<p>Raggiungere il centro costa O(n).<\/p>"},{"id":"m11-q04","modulo":11,"rif":null,"domanda":"<p>Per inserire un nodo <code>nuovo<\/code> dopo il nodo <code>p<\/code>, quale sequenza è corretta?<\/p>","opzioni":["<code>p-&gt;succ = nuovo; nuovo-&gt;succ = p-&gt;succ;<\/code>","<code>nuovo-&gt;succ = p-&gt;succ; p-&gt;succ = nuovo;<\/code>","<code>nuovo-&gt;succ = p; p-&gt;succ = nuovo;<\/code>","<code>p = nuovo; nuovo-&gt;succ = p;<\/code>"],"giusta":1,"commento":"<p>Prima si copia <code>p-&gt;succ<\/code>, poi lo si sovrascrive.<\/p>"},{"id":"m11-q05","modulo":11,"rif":null,"domanda":"<p>Per rimuovere un nodo da una lista concatenata semplice, di quale nodo serve conoscere l'indirizzo, oltre a quello da rimuovere?<\/p>","opzioni":["del successivo","del precedente","dell'ultimo","di nessuno"],"giusta":1,"commento":"<p>Il precedente deve scavalcare il nodo rimosso.<\/p>"},{"id":"m11-q06","modulo":11,"rif":null,"domanda":"<p>Cosa c'è di sbagliato in <code>while (p) { delete p; p = p-&gt;succ; }<\/code>?<\/p>","opzioni":["niente","si legge <code>p-&gt;succ<\/code> da un nodo già liberato","non libera l'ultimo nodo","<code>delete<\/code> non si può usare in un ciclo"],"giusta":1,"commento":"<p>Va salvato il successivo prima del <code>delete<\/code>.<\/p>"},{"id":"m11-q07","modulo":11,"rif":null,"domanda":"<p>Quale vantaggio ha una lista doppiamente concatenata rispetto a una semplice?<\/p>","opzioni":["occupa meno memoria","permette l'accesso diretto all'i-esimo elemento","permette di scorrere la lista in entrambe le direzioni e di rimuovere un nodo noto senza cercare il precedente","non richiede il puntatore alla testa"],"giusta":2,"commento":"<p>Costa invece <i>più<\/i> memoria (A falsa).<\/p>"},{"id":"m11-q08","modulo":11,"rif":null,"domanda":"<p>In una lista circolare semplice, come si capisce di aver finito di scorrerla?<\/p>","opzioni":["quando si trova <code>nullptr<\/code>","quando si torna al nodo di partenza","quando il valore è zero","non si può scorrere"],"giusta":1,"commento":"<p>Non c'è nessun <code>nullptr<\/code>.<\/p>"},{"id":"m11-q09","modulo":11,"rif":null,"domanda":"<p>A cosa serve il nodo sentinella in una lista doppia circolare?<\/p>","opzioni":["a contenere il numero di elementi","a eliminare i casi speciali (lista vuota, testa, coda) e ad accedere a primo e ultimo in O(1)","a rendere la lista ordinata","a impedire le copie della lista"],"giusta":1,"commento":""},{"id":"m11-q10","modulo":11,"rif":null,"domanda":"<p>Qual è la complessità dell'inversione in loco di una lista di n nodi?<\/p>","opzioni":["O(1)","O(log n)","O(n) in tempo e O(1) di memoria aggiuntiva","O(n) in tempo e O(n) di memoria aggiuntiva"],"giusta":2,"commento":"<p>Tre puntatori ausiliari, indipendenti da n.<\/p>"},{"id":"m12-q01","modulo":12,"rif":null,"domanda":"<p>Si eseguono <code>push(1); push(2); push(3); pop(); push(4);<\/code> su una pila vuota. Cosa restituisce ora <code>top()<\/code>?<\/p>","opzioni":["1","2","3","4"],"giusta":3,"commento":"<p>Pila: 1, 2, 3; <code>pop<\/code> toglie 3; poi entra 4, che sta in cima.<\/p>"},{"id":"m12-q02","modulo":12,"rif":null,"domanda":"<p>Si eseguono <code>enqueue(1); enqueue(2); enqueue(3); dequeue(); enqueue(4);<\/code> su una coda vuota. Cosa restituisce ora <code>front()<\/code>?<\/p>","opzioni":["1","2","3","4"],"giusta":1,"commento":"<p>Coda: 1, 2, 3; <code>dequeue<\/code> toglie 1; in testa ora c'è 2.<\/p>"},{"id":"m12-q03","modulo":12,"rif":null,"domanda":"<p>Quale politica segue una coda?<\/p>","opzioni":["LIFO","FIFO","per priorità","casuale"],"giusta":1,"commento":""},{"id":"m12-q04","modulo":12,"rif":null,"domanda":"<p>Implementando una pila con una lista concatenata, dove conviene mettere la cima?<\/p>","opzioni":["in testa alla lista","in coda alla lista","a metà lista","indifferente: costa sempre O(n)"],"giusta":0,"commento":"<p>Inserimento e rimozione in testa costano O(1); in coda la rimozione costerebbe O(n).<\/p>"},{"id":"m12-q05","modulo":12,"rif":null,"domanda":"<p>Perché in una coda su lista concatenata si tiene anche un puntatore al fondo?<\/p>","opzioni":["per poter scorrere la lista all'indietro","per rendere <code>enqueue<\/code> O(1) invece di O(n)","per rendere <code>dequeue<\/code> O(1)","non serve"],"giusta":1,"commento":""},{"id":"m12-q06","modulo":12,"rif":null,"domanda":"<p>Coda circolare su array di dimensione 5, con <code>inizio = 3<\/code> e <code>n = 4<\/code>. In quale indice viene scritto il prossimo elemento?<\/p>","opzioni":["7","2","4","0"],"giusta":1,"commento":"<p>(3 + 4) % 5 = 2.<\/p>"},{"id":"m12-q07","modulo":12,"rif":null,"domanda":"<p>Cosa succede facendo <code>pop<\/code> su una pila vuota?<\/p>","opzioni":["restituisce 0","si verifica un underflow","si verifica un overflow","la pila si riempie"],"giusta":1,"commento":""},{"id":"m12-q08","modulo":12,"rif":null,"domanda":"<p>Quanto vale l'espressione postfissa <code>6 2 / 3 *<\/code>?<\/p>","opzioni":["1","4","9","36"],"giusta":2,"commento":"<p>6 / 2 = 3, poi 3 · 3 = 9.<\/p>"},{"id":"m12-q09","modulo":12,"rif":null,"domanda":"<p>Quale struttura dati è più adatta per controllare se le parentesi di un'espressione sono bilanciate?<\/p>","opzioni":["una coda","una pila","un array ordinato","una lista circolare"],"giusta":1,"commento":"<p>L'ultima aperta deve essere la prima chiusa: LIFO.<\/p>"},{"id":"m12-q10","modulo":12,"rif":null,"domanda":"<p>Qual è la complessità di <code>push<\/code>, <code>pop<\/code>, <code>enqueue<\/code> e <code>dequeue<\/code> nelle implementazioni viste?<\/p>","opzioni":["O(1)","O(log n)","O(n)","O(n) per la coda, O(1) per la pila"],"giusta":0,"commento":"<p>Con il puntatore al fondo anche la coda è tutta O(1).<\/p>"},{"id":"m13-q01","modulo":13,"rif":null,"domanda":"<p>Quale visita di un BST restituisce i valori in ordine crescente?<\/p>","opzioni":["pre-order","in-order","post-order","per livelli"],"giusta":1,"commento":""},{"id":"m13-q02","modulo":13,"rif":null,"domanda":"<p>Si inseriscono nell'ordine 50, 30, 70, 20, 40 in un BST vuoto. Qual è la visita pre-order?<\/p>","opzioni":["20 30 40 50 70","50 30 20 40 70","20 40 30 70 50","50 30 70 20 40"],"giusta":1,"commento":"<p>Radice 50, poi tutto il sottoalbero sinistro (30, 20, 40), poi il destro (70). La A è l'in-order, la C il post-order.<\/p>"},{"id":"m13-q03","modulo":13,"rif":null,"domanda":"<p>Qual è la complessità della ricerca in un BST di altezza h con n nodi?<\/p>","opzioni":["O(1)","O(h), cioè O(log n) se bilanciato e O(n) nel caso peggiore","sempre O(log n)","sempre O(n²)"],"giusta":1,"commento":""},{"id":"m13-q04","modulo":13,"rif":null,"domanda":"<p>Inserendo in un BST vuoto i valori 1, 2, 3, …, n in quest'ordine, che albero si ottiene?<\/p>","opzioni":["un albero bilanciato di altezza log n","un albero degenere di altezza n - 1","un albero con tutte le foglie allo stesso livello","un errore: i valori devono essere inseriti in ordine casuale"],"giusta":1,"commento":"<p>Ogni nuovo valore va a destra dell'ultimo: è una lista.<\/p>"},{"id":"m13-q05","modulo":13,"rif":null,"domanda":"<p>Dove si trova il minimo di un BST?<\/p>","opzioni":["nella radice","nel nodo più a sinistra (si scende sempre a sinistra)","in una foglia qualunque","nel nodo più a destra"],"giusta":1,"commento":""},{"id":"m13-q06","modulo":13,"rif":null,"domanda":"<p>Cancellando da un BST un nodo con due figli, quale nodo ne prende il posto (nella procedura delle slide)?<\/p>","opzioni":["il figlio sinistro","il figlio destro","il successore, cioè il minimo del sottoalbero destro","la radice"],"giusta":2,"commento":""},{"id":"m13-q07","modulo":13,"rif":null,"domanda":"<p>Quale visita è adatta a distruggere un albero liberando tutti i nodi?<\/p>","opzioni":["pre-order","in-order","post-order","nessuna: bisogna usare una coda"],"giusta":2,"commento":"<p>Prima i figli, poi il padre.<\/p>"},{"id":"m13-q08","modulo":13,"rif":null,"domanda":"<p>Quanti nodi può avere al massimo un albero binario di altezza 3?<\/p>","opzioni":["7","8","15","16"],"giusta":2,"commento":"<p>2³⁺¹ - 1 = 15 (1 + 2 + 4 + 8).<\/p>"},{"id":"m13-q09","modulo":13,"rif":null,"domanda":"<p>Dove vengono sempre inseriti i nuovi elementi in un BST?<\/p>","opzioni":["come nuova radice","come nuove foglie","a metà dell'albero","nel sottoalbero più basso"],"giusta":1,"commento":""},{"id":"m13-q10","modulo":13,"rif":null,"domanda":"<p>Un albero binario ha radice 10, figlio sinistro 5 e, come figlio destro di 5, il nodo 12. È un BST?<\/p>","opzioni":["sì, perché 12 &gt; 5","no, perché 12 si trova nel sottoalbero sinistro di 10 ma è maggiore di 10","sì, perché ogni nodo ha al più due figli","non si può dire senza conoscere l'altezza"],"giusta":1,"commento":"<p>La proprietà vale per tutto il sottoalbero.<\/p>"},{"id":"m14-q01","modulo":14,"rif":null,"domanda":"<p>Un grafo non orientato ha 5 archi e viene rappresentato con liste di adiacenza. Quanti nodi contengono, in totale, tutte le liste?<\/p>","opzioni":["5","10","25","dipende dal numero di vertici"],"giusta":1,"commento":"<p>Ogni arco compare in due liste: 2 × 5 = 10.<\/p>"},{"id":"m14-q02","modulo":14,"rif":null,"domanda":"<p>Quanto spazio occupa la matrice di adiacenza di un grafo con |V| vertici e |E| archi?<\/p>","opzioni":["O(|E|)","O(|V| + |E|)","O(|V|²)","O(|V| · |E|)"],"giusta":2,"commento":"<p>Sempre |V| × |V| celle, qualunque sia il numero di archi.<\/p>"},{"id":"m14-q03","modulo":14,"rif":null,"domanda":"<p>Quale struttura dati di supporto usa la visita in ampiezza (BFS)?<\/p>","opzioni":["una pila","una coda","un albero binario di ricerca","nessuna"],"giusta":1,"commento":"<p>La DFS usa invece una pila (o la ricorsione).<\/p>"},{"id":"m14-q04","modulo":14,"rif":null,"domanda":"<p>In quale rappresentazione si verifica in tempo costante se esiste l'arco (u,v)?<\/p>","opzioni":["liste di adiacenza","matrice di adiacenza","in entrambe","in nessuna delle due"],"giusta":1,"commento":"<p>Basta leggere <code>adj[u][v]<\/code>; con le liste bisogna scorrere quella di u.<\/p>"},{"id":"m14-q05","modulo":14,"rif":null,"domanda":"<p>Nel grafo del pattern (A: B C; B: A D; C: A D E; D: B C F; E: C F; F: D E), in che ordine la BFS da A estrae i vertici dalla coda?<\/p>","opzioni":["A B D C E F","A B C D E F","A C E F D B","A B C F D E"],"giusta":1,"commento":"<p>Vedi la tabella del passo per passo. La A è l'ordine della DFS.<\/p>"},{"id":"m14-q06","modulo":14,"rif":null,"domanda":"<p>Perché durante una visita i vertici vengono colorati (o marcati come visitati)?<\/p>","opzioni":["per stampare il grafo a colori","per evitare di visitare più volte lo stesso vertice e di girare all'infinito nei cicli","per ordinare i vertici","perché la coda accetta solo vertici colorati"],"giusta":1,"commento":""},{"id":"m14-q07","modulo":14,"rif":null,"domanda":"<p>La matrice di adiacenza di un grafo non orientato è sempre:<\/p>","opzioni":["diagonale","simmetrica","piena di 1","triangolare inferiore"],"giusta":1,"commento":"<p>L'arco (u,v) si scrive sia in <code>adj[u][v]<\/code> sia in <code>adj[v][u]<\/code>.<\/p>"},{"id":"m14-q08","modulo":14,"rif":null,"domanda":"<p>Cosa calcola la BFS da s su un grafo non pesato?<\/p>","opzioni":["la distanza minima (in numero di archi) da s a ogni vertice raggiungibile","l'ordinamento topologico","il ciclo più lungo","il vertice di grado massimo"],"giusta":0,"commento":""},{"id":"m14-q09","modulo":14,"rif":null,"domanda":"<p>Su quali grafi esiste un ordinamento topologico?<\/p>","opzioni":["su tutti i grafi non orientati","sui grafi orientati aciclici (DAG)","solo sugli alberi binari","sui grafi completi"],"giusta":1,"commento":"<p>Un ciclo renderebbe impossibile rispettare tutti i vincoli.<\/p>"},{"id":"m14-q10","modulo":14,"rif":null,"domanda":"<p>Qual è il costo di una DFS su un grafo rappresentato con liste di adiacenza?<\/p>","opzioni":["O(|V|)","O(|E|²)","O(|V| + |E|)","O(|V|²)"],"giusta":2,"commento":"<p>Ogni vertice visitato una volta, ogni lista scorsa una volta.<\/p>"},{"id":"esame-q01","modulo":0,"rif":1,"domanda":"<p>Cosa si intende per <i>information hiding<\/i>?<\/p>","opzioni":["rendere tutti gli attributi <code>static<\/code>","nascondere i dettagli dell'implementazione, rendendo accessibile solo l'interfaccia pubblica","cifrare i dati di un oggetto","impedire l'ereditarietà"],"giusta":1,"commento":""},{"id":"esame-q02","modulo":0,"rif":2,"domanda":"<p>Cosa stampa il codice <code>int x = 5; { int x = 7; x++; } cout &lt;&lt; x;<\/code>?<\/p>","opzioni":["5","7","8","errore di compilazione: <code>x<\/code> è già definita"],"giusta":0,"commento":"<p>La <code>x<\/code> interna è un'altra variabile che “nasconde” quella esterna solo dentro il blocco; fuori, <code>x<\/code> vale ancora 5.<\/p>"},{"id":"esame-q03","modulo":0,"rif":3,"domanda":"<p>Dati <code>int a[5]<\/code> e <code>int* p = a;<\/code>, a cosa equivale <code>*(p + 2)<\/code>?<\/p>","opzioni":["all'indirizzo di <code>a[2]<\/code>","ad <code>a[0] + 2<\/code>","ad <code>a[2]<\/code>","a un errore, perché <code>p<\/code> non è un array"],"giusta":2,"commento":"<p>Aritmetica dei puntatori: <code>p + 2<\/code> punta ad <code>a[2]<\/code>, l'asterisco ne legge il valore.<\/p>"},{"id":"esame-q04","modulo":0,"rif":3,"domanda":"<p>Cos'è un <i>memory leak<\/i>?<\/p>","opzioni":["un puntatore che punta
