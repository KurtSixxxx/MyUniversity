 << fisso.area() << endl;   // ok: area() è const\n    // fisso.setBase(3);      // ERRORE: setBase non è const\n    return 0;\n}\n"}],"input":null,"output":"1x1: area 1, perimetro 4, diagonale 1.41421 (quadrato)\n4x1: area 4, perimetro 10, diagonale 4.12311\n3x4: area 12, perimetro 14, diagonale 5\n1x5: area 5, perimetro 12, diagonale 5.09902\nArea del rettangolo costante: 4\n"}},{"id":"m04-e02","modulo":4,"tipo":"es","numero":2,"titolo":"Chi nasce e chi muore","difficolta":"facile","testo":"<p>Scrivi una classe <code>Traccia<\/code> il cui costruttore stampa <code>nasce &lt;nome&gt;<\/code> e il cui distruttore stampa <code>muore &lt;nome&gt;<\/code>. Creane una globale, alcune locali nel <code>main<\/code> e in un blocco, una in una funzione e una con <code>new<\/code>. <b>Prima<\/b> di eseguire, scrivi su un foglio l'ordine che ti aspetti.<\/p>","soluzione":{"commento":"<p><code>GLOBALE<\/code> nasce prima di <code>inizio main<\/code> e muore dopo <code>fine main<\/code>. <code>HEAP<\/code> muore quando lo decide il <code>delete<\/code>, non alla fine del blocco.<\/p>","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 4.2 - Quando nascono e quando muoiono gli oggetti?\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Traccia {\nprivate:\n    string nome;\npublic:\n    Traccia(string n) : nome(n) { cout << \"  nasce \" << nome << endl; }\n    ~Traccia() { cout << \"  muore \" << nome << endl; }\n};\n\nTraccia globale(\"GLOBALE\");              // nasce PRIMA del main, muore DOPO\n\nvoid funzione() {\n    cout << \"inizio funzione\" << endl;\n    Traccia locale(\"LOCALE_F\");\n    cout << \"fine funzione\" << endl;\n}                                        // LOCALE_F muore qui\n\nint main() {\n    cout << \"inizio main\" << endl;\n    Traccia a(\"A\");\n    {\n        Traccia b(\"B\");\n        Traccia c(\"C\");\n        cout << \"fine blocco\" << endl;\n    }                                    // muoiono C e poi B (ordine inverso)\n    funzione();\n    Traccia* h = new Traccia(\"HEAP\");    // nello heap: vive finché non faccio delete\n    Traccia d(\"D\");\n    delete h;                            // HEAP muore ORA, prima di D\n    cout << \"fine main\" << endl;\n    return 0;\n}                                        // muoiono D e poi A\n"}],"input":null,"output":"  nasce GLOBALE\ninizio main\n  nasce A\n  nasce B\n  nasce C\nfine blocco\n  muore C\n  muore B\ninizio funzione\n  nasce LOCALE_F\nfine funzione\n  muore LOCALE_F\n  nasce HEAP\n  nasce D\n  muore HEAP\nfine main\n  muore D\n  muore A\n  muore GLOBALE\n"}},{"id":"m04-e03","modulo":4,"tipo":"es","numero":3,"titolo":"Contatore di istanze","difficolta":"facile","testo":"<p>Classe <code>Punto<\/code> con due attributi <code>static<\/code>: <code>vivi<\/code> (oggetti esistenti) e <code>creati<\/code> (oggetti mai creati). Aggiornali in costruttore, costruttore di copia e distruttore. Verifica cosa succede passando un <code>Punto<\/code> per valore a una funzione.<\/p>","soluzione":{"commento":"<p>Dentro <code>perValore<\/code> i vivi sono 3: il parametro è una copia, creata con il costruttore di copia e distrutta all'uscita.<\/p>","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 4.3 - Contare gli oggetti vivi con un membro static\n#include <iostream>\nusing namespace std;\n\nclass Punto {\nprivate:\n    int x, y;\n    static int vivi;                 // UNO solo per tutta la classe\n    static int creati;\n\npublic:\n    Punto(int a = 0, int b = 0) : x(a), y(b) { vivi++; creati++; }\n    Punto(const Punto& p) : x(p.x), y(p.y) { vivi++; creati++; }   // anche le copie contano\n    ~Punto() { vivi--; }\n\n    static int getVivi() { return vivi; }       // si chiama con Punto::getVivi()\n    static int getCreati() { return creati; }\n};\n\nint Punto::vivi = 0;                 // definizione e inizializzazione, fuori dalla classe\nint Punto::creati = 0;\n\nvoid perValore(Punto) {              // parametro senza nome: riceve una COPIA, che nasce qui e muore alla fine\n    cout << \"  dentro perValore: vivi = \" << Punto::getVivi() << endl;\n}\n\nint main() {\n    cout << \"all'inizio: \" << Punto::getVivi() << endl;\n    Punto a(1, 2), b;\n    cout << \"dopo a, b: \" << Punto::getVivi() << endl;\n    {\n        Punto c = a;\n        Punto* d = new Punto(5, 5);\n        cout << \"nel blocco: \" << Punto::getVivi() << endl;\n        delete d;\n    }\n    cout << \"dopo il blocco: \" << Punto::getVivi() << endl;\n    perValore(a);\n    cout << \"dopo perValore: \" << Punto::getVivi()\n         << \" (creati in tutto: \" << Punto::getCreati() << \")\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"all'inizio: 0\ndopo a, b: 2\nnel blocco: 4\ndopo il blocco: 2\n  dentro perValore: vivi = 3\ndopo perValore: 2 (creati in tutto: 5)\n"}},{"id":"m04-e04","modulo":4,"tipo":"es","numero":4,"titolo":"Concatenare con this","difficolta":"facile","testo":"<p>Classe <code>Punto<\/code> il cui costruttore ha parametri con lo stesso nome degli attributi (usa <code>this-&gt;<\/code>). Aggiungi <code>setX<\/code>, <code>setY<\/code> e <code>sposta<\/code> che restituiscono <code>Punto&amp;<\/code> per scrivere <code>p.setX(3).setY(4).sposta(1, 1);<\/code>, e un metodo <code>stessoOggetto(const Punto&amp;)<\/code> che confronta gli indirizzi.<\/p>","soluzione":{"commento":"","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 4.4 - Il puntatore this\n#include <iostream>\nusing namespace std;\n\nclass Punto {\nprivate:\n    int x, y;\n\npublic:\n    Punto(int x = 0, int y = 0) {\n        this->x = x;      // this->x è l'attributo, x da solo è il parametro\n        this->y = y;\n    }\n    // Restituendo *this (per reference) si possono concatenare le chiamate\n    Punto& setX(int x) { this->x = x; return *this; }\n    Punto& setY(int y) { this->y = y; return *this; }\n    Punto& sposta(int dx, int dy) { x += dx; y += dy; return *this; }\n\n    bool stessoOggetto(const Punto& altro) const { return this == &altro; }  // stesso indirizzo?\n    bool stesseCoordinate(const Punto& altro) const { return x == altro.x && y == altro.y; }\n\n    void stampa() const { cout << \"(\" << x << \", \" << y << \") all'indirizzo \" << this << endl; }\n};\n\nint main() {\n    Punto p;\n    p.setX(3).setY(4).sposta(1, 1);       // tre messaggi in fila allo STESSO oggetto\n    p.stampa();\n\n    Punto q(4, 5);\n    Punto& r = p;\n    cout << boolalpha;                    // stampa true/false invece di 1/0\n    cout << \"p e q stesse coordinate? \" << p.stesseCoordinate(q) << endl;\n    cout << \"p e q stesso oggetto?    \" << p.stessoOggetto(q) << endl;\n    cout << \"p e r stesso oggetto?    \" << p.stessoOggetto(r) << endl;\n    return 0;\n}\n"}],"input":null,"output":"(4, 5) all'indirizzo 0xbef87ff790\np e q stesse coordinate? true\np e q stesso oggetto?    false\np e r stesso oggetto?    true\n"}},{"id":"m04-e05","modulo":4,"tipo":"es","numero":5,"titolo":"Punti e rettangoli","difficolta":"medio","testo":"<p>Classe <code>Punto2D<\/code> e classe <code>Rettangolo<\/code> con due attributi <code>Punto2D<\/code> (<code>topLeft<\/code> e <code>bottomRight<\/code>) inizializzati nella lista. Metodi <code>contiene(Punto2D)<\/code> e <code>contiene(const Rettangolo&amp;)<\/code> (overloading). Deve compilare <code>Rettangolo B({10, 20}, {50, 10});<\/code>. (Esercizio delle slide.)<\/p>","soluzione":{"commento":"<p><code>Punto2D(int x = 0, int y = 0) : x(x), y(y)<\/code> funziona: nella lista, fuori dalle parentesi c'è l'attributo, dentro il parametro.<\/p>","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 4.5 - Punto2D dentro Rettangolo (composizione + lista di inizializzazione)\n#include <iostream>\nusing namespace std;\n\nclass Punto2D {\nprivate:\n    int x, y;\npublic:\n    Punto2D(int x = 0, int y = 0) : x(x), y(y) {}   // x(x): l'attributo x prende il parametro x\n    int getX() const { return x; }\n    int getY() const { return y; }\n};\n\nclass Rettangolo {\nprivate:\n    Punto2D topLeft, bottomRight;      // due OGGETTI come attributi\npublic:\n    // I membri oggetto si inizializzano nella lista: è il modo giusto\n    Rettangolo(Punto2D tl, Punto2D br) : topLeft(tl), bottomRight(br) {}\n\n    bool contiene(Punto2D p) const {\n        return p.getX() >= topLeft.getX() && p.getX() <= bottomRight.getX()\n            && p.getY() <= topLeft.getY() && p.getY() >= bottomRight.getY();\n    }\n    bool contiene(const Rettangolo& r) const {      // overloading: stesso nome, parametro diverso\n        return contiene(r.topLeft) && contiene(r.bottomRight);\n    }\n};\n\nint main() {\n    Punto2D p = {10, 20};                  // le graffe chiamano il costruttore Punto2D(10, 20)\n    Rettangolo B({10, 20}, {50, 10});      // come nella traccia delle slide\n    Rettangolo piccolo({20, 18}, {30, 12});\n    Rettangolo sporge({40, 25}, {60, 15});\n    cout << boolalpha;\n    cout << \"B contiene p (sul bordo)?   \" << B.contiene(p) << endl;\n    cout << \"B contiene (5, 15)?         \" << B.contiene(Punto2D(5, 15)) << endl;\n    cout << \"B contiene piccolo?         \" << B.contiene(piccolo) << endl;\n    cout << \"B contiene sporge?          \" << B.contiene(sporge) << endl;\n    return 0;\n}\n"}],"input":null,"output":"B contiene p (sul bordo)?   true\nB contiene (5, 15)?         false\nB contiene piccolo?         true\nB contiene sporge?          false\n"}},{"id":"m04-e06","modulo":4,"tipo":"es","numero":6,"titolo":"Orario con eccezioni","difficolta":"medio","testo":"<p>Classe <code>Tempo<\/code> con ore, minuti e secondi i cui setter lanciano <code>invalid_argument<\/code> per valori fuori intervallo, e un costruttore che usa i setter. Nel <code>main<\/code> cattura un errore di un setter, un errore del costruttore (con <code>catch (const exception&amp;)<\/code>) e un <code>throw 42;<\/code> con <code>catch (...)<\/code>.<\/p>","soluzione":{"commento":"","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 4.6 - Tempo con eccezioni invece di exit(1)\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\nclass Tempo {\nprivate:\n    int ore, minuti, secondi;\n\npublic:\n    Tempo(int h = 0, int m = 0, int s = 0) : ore(0), minuti(0), secondi(0) {\n        setOre(h);            // se un valore è sbagliato, il costruttore lancia:\n        setMinuti(m);         // l'oggetto NON viene creato\n        setSecondi(s);\n    }\n    void setOre(int h) {\n        if (h < 0 || h > 23) throw invalid_argument(\"ore valide: 0-23\");\n        ore = h;\n    }\n    void setMinuti(int m) {\n        if (m < 0 || m > 59) throw invalid_argument(\"minuti validi: 0-59\");\n        minuti = m;\n    }\n    void setSecondi(int s) {\n        if (s < 0 || s > 59) throw invalid_argument(\"secondi validi: 0-59\");\n        secondi = s;\n    }\n    void stampa() const { cout << ore << \"h \" << minuti << \"m \" << secondi << \"s\" << endl; }\n};\n\nint main() {\n    Tempo t(10, 30, 0);\n    t.stampa();\n\n    try {\n        t.setOre(100);\n        cout << \"non arrivo qui\" << endl;\n    } catch (const invalid_argument& e) {\n        cout << \"Eccezione: \" << e.what() << endl;\n    }\n    t.stampa();                       // t non è stato modificato\n\n    try {\n        Tempo sbagliato(12, 75, 0);   // lancia dal costruttore\n        sbagliato.stampa();\n    } catch (const exception& e) {    // exception è la \"madre\" di tutte le eccezioni standard\n        cout << \"Costruzione fallita: \" << e.what() << endl;\n    }\n\n    try {\n        throw 42;                     // si può lanciare anche un int...\n    } catch (const invalid_argument& e) {\n        cout << \"non sono io\" << endl;\n    } catch (...) {                   // ...che viene preso dal catch \"pigliatutto\"\n        cout << \"Eccezione sconosciuta catturata\" << endl;\n    }\n    return 0;\n}\n"}],"input":null,"output":"10h 30m 0s\nEccezione: ore valide: 0-23\n10h 30m 0s\nCostruzione fallita: minuti validi: 0-59\nEccezione sconosciuta catturata\n"}},{"id":"m04-e07","modulo":4,"tipo":"es","numero":7,"titolo":"Vedere la copia superficiale","difficolta":"medio","testo":"<p>Scrivi una classe con un attributo <code>int*<\/code> allocato nel costruttore e <b>nessun<\/b> costruttore di copia: copia un oggetto, modifica la copia e stampa l'originale. Poi scrivi una seconda classe con la Regola dei Tre e ripeti la prova. (Non dare un distruttore alla prima classe, altrimenti il programma farebbe un doppio <code>delete<\/code>: libera la memoria a mano, una volta sola.)<\/p>","soluzione":{"commento":"","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 4.7 - Copia superficiale contro copia profonda\n#include <iostream>\nusing namespace std;\n\n// Versione SBAGLIATA: nessun costruttore di copia -> il compilatore copia il PUNTATORE.\n// (Non ha distruttore apposta: con il distruttore il programma farebbe un doppio delete.)\nclass Superficiale {\npublic:\n    int* valore;\n    Superficiale(int v) : valore(new int(v)) {}\n};\n\n// Versione GIUSTA: Regola dei Tre\nclass Profonda {\npublic:\n    int* valore;\n    Profonda(int v) : valore(new int(v)) {}\n    Profonda(const Profonda& altra) : valore(new int(*altra.valore)) {}   // blocco nuovo\n    Profonda& operator=(const Profonda& altra) {\n        if (this != &altra) *valore = *altra.valore;   // stessa dimensione: basta copiare il valore\n        return *this;\n    }\n    ~Profonda() { delete valore; }\n};\n\nint main() {\n    Superficiale s1(10);\n    Superficiale s2 = s1;          // copia membro a membro: s2.valore == s1.valore\n    *s2.valore = 99;\n    cout << \"Superficiale: s1 = \" << *s1.valore << \", s2 = \" << *s2.valore\n         << \"  stesso blocco? \" << (s1.valore == s2.valore ? \"SI\" : \"no\") << endl;\n    delete s1.valore;              // libero UNA volta sola (s2.valore ora è dangling!)\n\n    Profonda p1(10);\n    Profonda p2 = p1;              // costruttore di copia profondo\n    *p2.valore = 99;\n    cout << \"Profonda:     p1 = \" << *p1.valore << \", p2 = \" << *p2.valore\n         << \"  stesso blocco? \" << (p1.valore == p2.valore ? \"SI\" : \"no\") << endl;\n    return 0;\n}\n"}],"input":null,"output":"Superficiale: s1 = 99, s2 = 99  stesso blocco? SI\nProfonda:     p1 = 10, p2 = 99  stesso blocco? no\n"}},{"id":"m04-e08","modulo":4,"tipo":"es","numero":8,"titolo":"Stringa fatta in casa","difficolta":"medio","testo":"<p>Classe <code>MiaStringa<\/code> che memorizza il testo in un <code>char*<\/code> dinamico terminato da <code>'\\0'<\/code>. Costruttore da <code>const char*<\/code>, Regola dei Tre, <code>size()<\/code>, <code>concatena(const MiaStringa&amp;)<\/code> che restituisce una nuova stringa, <code>maiuscolo()<\/code> e <code>stampa()<\/code>. Non usare <code>string<\/code> né <code>&lt;cstring&gt;<\/code>.<\/p>","soluzione":{"commento":"<p>In <code>concatena<\/code> la stringa temporanea <code>tmp<\/code> va liberata, perché il costruttore di <code>MiaStringa<\/code> ne fa una copia sua.<\/p>","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 4.8 - Una stringa fatta in casa (char* dinamico + Regola dei Tre)\n#include <iostream>\nusing namespace std;\n\nclass MiaStringa {\nprivate:\n    char* testo;      // terminato da '\\0', come in C\n    int len;\n\n    static int lunghezza(const char* s) {\n        int l = 0;\n        while (s[l] != '\\0') l++;\n        return l;\n    }\n    void copiaDa(const char* s, int l) {        // alloca e copia (usata in più punti)\n        len = l;\n        testo = new char[len + 1];\n        for (int i = 0; i < len; i++) testo[i] = s[i];\n        testo[len] = '\\0';\n    }\n\npublic:\n    MiaStringa(const char* s = \"\") { copiaDa(s, lunghezza(s)); }\n    MiaStringa(const MiaStringa& altra) { copiaDa(altra.testo, altra.len); }\n    MiaStringa& operator=(const MiaStringa& altra) {\n        if (this != &altra) {\n            delete[] testo;\n            copiaDa(altra.testo, altra.len);\n        }\n        return *this;\n    }\n    ~MiaStringa() { delete[] testo; }\n\n    int size() const { return len; }\n\n    MiaStringa concatena(const MiaStringa& altra) const {\n        char* tmp = new char[len + altra.len + 1];\n        for (int i = 0; i < len; i++) tmp[i] = testo[i];\n        for (int i = 0; i < altra.len; i++) tmp[len + i] = altra.testo[i];\n        tmp[len + altra.len] = '\\0';\n        MiaStringa risultato(tmp);              // il costruttore fa la SUA copia...\n        delete[] tmp;                           // ...quindi tmp va liberato\n        return risultato;\n    }\n\n    void maiuscolo() {\n        for (int i = 0; i < len; i++)\n            if (testo[i] >= 'a' && testo[i] <= 'z') testo[i] = testo[i] - 'a' + 'A';\n    }\n\n    void stampa() const { cout << \"\\\"\" << testo << \"\\\" (\" << len << \")\" << endl; }\n};\n\nint main() {\n    MiaStringa a(\"Ciao\"), b(\" mondo\");\n    MiaStringa c = a.concatena(b);\n    c.stampa();\n    MiaStringa d = c;           // copia\n    d.maiuscolo();              // modifico SOLO la copia\n    c.stampa();\n    d.stampa();\n    a = d;                      // assegnamento\n    a.stampa();\n    return 0;\n}\n"}],"input":null,"output":"\"Ciao mondo\" (10)\n\"Ciao mondo\" (10)\n\"CIAO MONDO\" (10)\n\"CIAO MONDO\" (10)\n"}},{"id":"m04-e09","modulo":4,"tipo":"es","numero":9,"titolo":"Classe Matrice","difficolta":"difficile","testo":"<p>Classe <code>Matrice<\/code> con <code>int** m<\/code>: costruttore (lancia <code>invalid_argument<\/code> per dimensioni non positive), distruttore, costruttore di copia, <code>operator=<\/code> che funziona anche tra matrici di dimensioni diverse, <code>get<\/code>/<code>set<\/code> che lanciano <code>out_of_range<\/code> e <code>somma(const Matrice&amp;)<\/code> che restituisce una nuova matrice (o lancia se le dimensioni sono diverse).<\/p>","soluzione":{"commento":"<p>I metodi privati <code>allocaMemoria<\/code> e <code>liberaMemoria<\/code> evitano di ripetere lo stesso codice in costruttori, <code>operator=<\/code> e distruttore.<\/p>","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 4.9 - Classe Matrice con int** e Regola dei Tre\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\nclass Matrice {\nprivate:\n    int r, c;\n    int** m;\n\n    void allocaMemoria() {\n        m = new int*[r];\n        for (int i = 0; i < r; i++) {\n            m[i] = new int[c];\n            for (int j = 0; j < c; j++) m[i][j] = 0;\n        }\n    }\n    void liberaMemoria() {\n        for (int i = 0; i < r; i++) delete[] m[i];\n        delete[] m;\n    }\n\npublic:\n    Matrice(int righe, int colonne) : r(righe), c(colonne), m(nullptr) {\n        if (r <= 0 || c <= 0) throw invalid_argument(\"dimensioni non valide\");\n        allocaMemoria();\n    }\n    Matrice(const Matrice& altra) : r(altra.r), c(altra.c), m(nullptr) {\n        allocaMemoria();\n        for (int i = 0; i < r; i++)\n            for (int j = 0; j < c; j++) m[i][j] = altra.m[i][j];\n    }\n    Matrice& operator=(const Matrice& altra) {\n        if (this == &altra) return *this;\n        liberaMemoria();                         // le dimensioni possono essere diverse\n        r = altra.r; c = altra.c;\n        allocaMemoria();\n        for (int i = 0; i < r; i++)\n            for (int j = 0; j < c; j++) m[i][j] = altra.m[i][j];\n        return *this;\n    }\n    ~Matrice() { liberaMemoria(); }\n\n    void set(int i, int j, int v) {\n        if (i < 0 || i >= r || j < 0 || j >= c) throw out_of_range(\"cella fuori dalla matrice\");\n        m[i][j] = v;\n    }\n    int get(int i, int j) const {\n        if (i < 0 || i >= r || j < 0 || j >= c) throw out_of_range(\"cella fuori dalla matrice\");\n        return m[i][j];\n    }\n    Matrice somma(const Matrice& altra) const {\n        if (r != altra.r || c != altra.c) throw invalid_argument(\"dimensioni diverse\");\n        Matrice ris(r, c);\n        for (int i = 0; i < r; i++)\n            for (int j = 0; j < c; j++) ris.m[i][j] = m[i][j] + altra.m[i][j];\n        return ris;\n    }\n    void stampa() const {\n        for (int i = 0; i < r; i++) {\n            for (int j = 0; j < c; j++) cout << m[i][j] << \" \";\n            cout << endl;\n        }\n    }\n};\n\nint main() {\n    try {\n        Matrice a(2, 3);\n        for (int i = 0; i < 2; i++)\n            for (int j = 0; j < 3; j++) a.set(i, j, i * 3 + j);\n        Matrice b = a;                 // copia profonda\n        b.set(0, 0, 100);\n        Matrice s = a.somma(b);\n        cout << \"a:\" << endl; a.stampa();\n        cout << \"a + b:\" << endl; s.stampa();\n        Matrice piccola(1, 1);\n        piccola = s;                   // assegnamento con dimensioni diverse\n        cout << \"piccola dopo l'assegnamento:\" << endl; piccola.stampa();\n        a.get(5, 5);                   // lancia out_of_range\n    } catch (const exception& e) {\n        cout << \"Errore: \" << e.what() << endl;\n    }\n    try {\n        Matrice x(2, 2), y(3, 3);\n        x.somma(y);\n    } catch (const invalid_argument& e) {\n        cout << \"Errore: \" << e.what() << endl;\n    }\n    return 0;\n}\n"}],"input":null,"output":"a:\n0 1 2 \n3 4 5 \na + b:\n100 2 4 \n6 8 10 \npiccola dopo l'assegnamento:\n100 2 4 \n6 8 10 \nErrore: cella fuori dalla matrice\nErrore: dimensioni diverse\n"}},{"id":"m04-e10","modulo":4,"tipo":"es","numero":10,"titolo":"Pila di interi","difficolta":"difficile","testo":"<p>Classe <code>Pila<\/code> su array dinamico con <code>push<\/code> (raddoppia se piena), <code>pop<\/code> e <code>top<\/code> (lanciano <code>underflow_error<\/code> se vuota), <code>vuota<\/code>, <code>size<\/code> e Regola dei Tre. Verifica che svuotare una pila non svuoti la sua copia. È un'anteprima del Modulo 12.<\/p>","soluzione":{"commento":"<p><code>explicit<\/code> davanti al costruttore impedisce conversioni automatiche indesiderate, come <code>Pila p = 5;<\/code>.<\/p>","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 4.10 - Pila di interi su array dinamico (anteprima del Modulo 12)\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\nclass Pila {\nprivate:\n    int* dati;\n    int cima;       // numero di elementi presenti (= indice della prima cella libera)\n    int cap;\n\npublic:\n    explicit Pila(int capacita = 4) : dati(new int[capacita > 0 ? capacita : 1]), cima(0),\n                                     cap(capacita > 0 ? capacita : 1) {}\n    Pila(const Pila& p) : dati(new int[p.cap]), cima(p.cima), cap(p.cap) {\n        for (int i = 0; i < cima; i++) dati[i] = p.dati[i];\n    }\n    Pila& operator=(const Pila& p) {\n        if (this != &p) {\n            int* nuovo = new int[p.cap];\n            for (int i = 0; i < p.cima; i++) nuovo[i] = p.dati[i];\n            delete[] dati;\n            dati = nuovo; cima = p.cima; cap = p.cap;\n        }\n        return *this;\n    }\n    ~Pila() { delete[] dati; }\n\n    void push(int x) {\n        if (cima == cap) {                         // piena: raddoppio\n            int* nuovo = new int[cap * 2];\n            for (int i = 0; i < cima; i++) nuovo[i] = dati[i];\n            delete[] dati;\n            dati = nuovo;\n            cap *= 2;\n        }\n        dati[cima++] = x;\n    }\n    int pop() {\n        if (vuota()) throw underflow_error(\"pop su pila vuota\");\n        return dati[--cima];\n    }\n    int top() const {\n        if (vuota()) throw underflow_error(\"top su pila vuota\");\n        return dati[cima - 1];\n    }\n    bool vuota() const { return cima == 0; }\n    int size() const { return cima; }\n};\n\nint main() {\n    Pila p;\n    for (int i = 1; i <= 6; i++) p.push(i * 10);\n    Pila copia = p;                       // copia profonda\n    cout << \"Svuoto p: \";\n    while (!p.vuota()) cout << p.pop() << \" \";     // LIFO: esce prima l'ultimo entrato\n    cout << endl;\n    cout << \"La copia ha ancora \" << copia.size() << \" elementi, in cima \" << copia.top() << endl;\n    try {\n        p.pop();\n    } catch (const underflow_error& e) {\n        cout << \"Errore: \" << e.what() << endl;\n    }\n    return 0;\n}\n"}],"input":null,"output":"Svuoto p: 60 50 40 30 20 10 \nLa copia ha ancora 6 elementi, in cima 60\nErrore: pop su pila vuota\n"}},{"id":"m05-pattern","modulo":5,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 5 (Template di Funzione e di Classe).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 5 - Pattern: template di funzione e template di classe\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\n// ---------- 1. TEMPLATE DI FUNZIONE ----------\n// T è un \"segnaposto\" per un tipo: verrà sostituito dal compilatore.\ntemplate <typename T>\nT massimo(T a, T b) {\n    return (a > b) ? a : b;          // richiede che T sappia fare \">\"\n}\n\ntemplate <typename T>\nvoid scambia(T& a, T& b) {\n    T tmp = a;\n    a = b;\n    b = tmp;\n}\n\ntemplate <typename T>\nvoid stampaArray(const T v[], int n) {\n    cout << \"[ \";\n    for (int i = 0; i < n; i++) cout << v[i] << \" \";   // richiede che T sappia fare \"<<\"\n    cout << \"]\" << endl;\n}\n\n// ---------- 2. TEMPLATE DI CLASSE ----------\ntemplate <typename T>\nclass Scatola {\nprivate:\n    T* dati;\n    int n, cap;\n\npublic:\n    Scatola(int capacita = 4);\n    ~Scatola() { delete[] dati; }\n    Scatola(const Scatola& s);\n    Scatola& operator=(const Scatola& s);\n\n    void inserisci(const T& x);\n    T get(int i) const;\n    int size() const { return n; }\n};\n\n// I metodi definiti FUORI dalla classe ripetono \"template <typename T>\"\n// e usano il nome completo Scatola<T>::\ntemplate <typename T>\nScatola<T>::Scatola(int capacita) : dati(new T[capacita]), n(0), cap(capacita) {}\n\ntemplate <typename T>\nScatola<T>::Scatola(const Scatola& s) : dati(new T[s.cap]), n(s.n), cap(s.cap) {\n    for (int i = 0; i < n; i++) dati[i] = s.dati[i];\n}\n\ntemplate <typename T>\nScatola<T>& Scatola<T>::operator=(const Scatola& s) {\n    if (this != &s) {\n        T* nuovo = new T[s.cap];\n        for (int i = 0; i < s.n; i++) nuovo[i] = s.dati[i];\n        delete[] dati;\n        dati = nuovo; n = s.n; cap = s.cap;\n    }\n    return *this;\n}\n\ntemplate <typename T>\nvoid Scatola<T>::inserisci(const T& x) {\n    if (n == cap) {\n        T* nuovo = new T[cap * 2];\n        for (int i = 0; i < n; i++) nuovo[i] = dati[i];\n        delete[] dati;\n        dati = nuovo;\n        cap *= 2;\n    }\n    dati[n++] = x;\n}\n\ntemplate <typename T>\nT Scatola<T>::get(int i) const {\n    if (i < 0 || i >= n) throw out_of_range(\"indice non valido\");\n    return dati[i];\n}\n\nint main() {\n    // Il compilatore DEDUCE T dagli argomenti\n    cout << massimo(3, 7) << \" \" << massimo(2.5, 1.5) << \" \"\n         << massimo(string(\"ciao\"), string(\"mondo\")) << endl;\n    // massimo(3, 4.5) non compila: T sarebbe int o double? Lo dico io:\n    cout << massimo<double>(3, 4.5) << endl;\n\n    int a = 1, b = 2;\n    string s1 = \"uno\", s2 = \"due\";\n    scambia(a, b);\n    scambia(s1, s2);\n    cout << a << \" \" << b << \" \" << s1 << \" \" << s2 << endl;\n\n    char lettere[] = {'c', 'i', 'a', 'o'};\n    stampaArray(lettere, 4);\n\n    // Per le classi template il tipo si scrive SEMPRE tra < >\n    Scatola<int> si;\n    for (int i = 1; i <= 6; i++) si.inserisci(i * i);\n    Scatola<string> ss;\n    ss.inserisci(\"alfa\");\n    ss.inserisci(\"beta\");\n    Scatola<string> copia = ss;                 // costruttore di copia del template\n    copia.inserisci(\"gamma\");\n    cout << \"si: \" << si.size() << \" elementi, l'ultimo e' \" << si.get(5) << endl;\n    cout << \"ss: \" << ss.size() << \", copia: \" << copia.size() << \" (\" << copia.get(2) << \")\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"7 2.5 mondo\n4.5\n2 1 due uno\n[ c i a o ]\nsi: 6 elementi, l'ultimo e' 36\nss: 2, copia: 3 (gamma)\n"}},{"id":"m05-lab","modulo":5,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Magazzino generico<\/b><\/p><p>Si vuole scrivere un piccolo insieme di strumenti generici (funzioni e classi template) per memorizzare, ordinare e stampare oggetti di qualunque tipo, e usarli con interi, caratteri, stringhe e una classe <code>Rettangolo<\/code>. Niente STL.<\/p><p><b>Step 1 – template di funzione<\/b><br>Scrivi <code>template &lt;typename T&gt; void stampa(const T v[], int n)<\/code> (elementi separati da virgole) e <code>int indiceMassimo(const T v[], int n)<\/code>, che usa <b>solo<\/b> l'operatore <code>&lt;<\/code>. Provale con un array di <code>int<\/code> e uno di <code>string<\/code>.<br><b>Concetto nuovo:<\/b> <code>template &lt;typename T&gt;<\/code>, deduzione del tipo.<\/p><p><b>Step 2 – ordinamento generico<\/b><br>Scrivi <code>void ordina(T a[], int n)<\/code> (selection sort, usando solo <code>&lt;<\/code>) e applicalo ad array di <code>int<\/code>, <code>char<\/code> e <code>string<\/code>.<br><b>Concetto nuovo:<\/b> un algoritmo, molti tipi.<\/p><p><b>Step 3 – una classe compatibile<\/b><br>Scrivi <code>Rettangolo<\/code> (base, altezza, <code>area()<\/code>) con <code>operator&lt;<\/code> che confronta le aree e <code>operator&lt;&lt;<\/code> per la stampa (usa la forma fornita negli esempi). Ordina un array di rettangoli e trova il più grande con le funzioni degli step 1–2. (È l'esercizio delle slide del corso.)<br><b>Concetto nuovo:<\/b> requisiti che un tipo deve soddisfare per un template.<\/p><p><b>Step 4 – template di classe<\/b><br>Scrivi <code>template &lt;typename T&gt; class Magazzino<\/code> con un array dinamico che raddoppia, Regola dei Tre, <code>inserire<\/code>, <code>estrarre<\/code> (lancia <code>underflow_error<\/code> se vuoto), <code>numero<\/code>, <code>vuoto<\/code>, <code>ordinaTutto()<\/code> (riusa <code>ordina<\/code>) e <code>stampaTutto()<\/code>. Usalo con <code>double<\/code> e con <code>Rettangolo<\/code>.<br><b>Concetto nuovo:<\/b> template di classe con memoria dinamica.<\/p><p><b>Step 5 – due parametri e template annidati<\/b><br>Scrivi <code>template &lt;typename K, typename V&gt; class Coppia<\/code> (chiave e valore, <code>operator&lt;<\/code> sulla chiave, <code>operator&lt;&lt;<\/code>) e crea un <code>Magazzino&lt; Coppia&lt;string, int&gt; &gt;<\/code> come inventario: inserisci tre articoli, ordinali per nome e stampali.<br><b>Concetto nuovo:<\/b> più parametri di tipo, istanziazione con un tipo template.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 5 - Laboratorio a step: un magazzino generico\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\n// ===== STEP 1 =====  Template di funzione: stampa e massimo di un array\ntemplate <typename T>\nvoid stampa(const T v[], int n) {\n    for (int i = 0; i < n; i++) cout << v[i] << (i < n - 1 ? \", \" : \"\\n\");\n}\n\ntemplate <typename T>\nint indiceMassimo(const T v[], int n) {\n    int im = 0;\n    for (int i = 1; i < n; i++)\n        if (v[im] < v[i]) im = i;          // uso solo \"<\": meno richieste su T\n    return im;\n}\n\n// ===== STEP 2 =====  Ordinamento generico (selection sort)\ntemplate <typename T>\nvoid ordina(T a[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        int iMin = i;\n        for (int j = i + 1; j < n; j++)\n            if (a[j] < a[iMin]) iMin = j;\n        T tmp = a[i]; a[i] = a[iMin]; a[iMin] = tmp;\n    }\n}\n\n// ===== STEP 3 =====  Una classe \"compatibile\" con i template: serve < e <<\nclass Rettangolo {\nprivate:\n    double b, h;\npublic:\n    Rettangolo(double base = 1, double altezza = 1) : b(base), h(altezza) {}\n    double area() const { return b * h; }\n    // Anteprima Modulo 10: insegniamo a Rettangolo cosa vuol dire \"<\"\n    bool operator<(const Rettangolo& altro) const { return area() < altro.area(); }\n    // ...e come si stampa con <<\n    friend ostream& operator<<(ostream& os, const Rettangolo& r) {\n        return os << r.b << \"x\" << r.h;\n    }\n};\n\n// ===== STEP 4 =====  Template di classe: un contenitore che cresce\ntemplate <typename T>\nclass Magazzino {\nprivate:\n    T* dati;\n    int n, cap;\npublic:\n    Magazzino() : dati(new T[2]), n(0), cap(2) {}\n    ~Magazzino() { delete[] dati; }\n    Magazzino(const Magazzino& m) : dati(new T[m.cap]), n(m.n), cap(m.cap) {\n        for (int i = 0; i < n; i++) dati[i] = m.dati[i];\n    }\n    Magazzino& operator=(const Magazzino& m) {\n        if (this != &m) {\n            T* nuovo = new T[m.cap];\n            for (int i = 0; i < m.n; i++) nuovo[i] = m.dati[i];\n            delete[] dati;\n            dati = nuovo; n = m.n; cap = m.cap;\n        }\n        return *this;\n    }\n    void inserire(const T& x) {\n        if (n == cap) {\n            cap *= 2;\n            T* nuovo = new T[cap];\n            for (int i = 0; i < n; i++) nuovo[i] = dati[i];\n            delete[] dati;\n            dati = nuovo;\n        }\n        dati[n++] = x;\n    }\n    T estrarre() {                                  // toglie e restituisce l'ultimo\n        if (vuoto()) throw underflow_error(\"magazzino vuoto\");\n        return dati[--n];\n    }\n    int numero() const { return n; }\n    bool vuoto() const { return n == 0; }\n    void ordinaTutto() { ordina(dati, n); }          // riuso il template dello STEP 2\n    void stampaTutto() const { stampa(dati, n); }\n};\n\n// ===== STEP 5 =====  Template con DUE parametri, usato dentro un altro template\ntemplate <typename K, typename V>\nclass Coppia {\nprivate:\n    K chiave;\n    V valore;\npublic:\n    Coppia() : chiave(), valore() {}               // K() e V(): valore \"vuoto\" del tipo\n    Coppia(K k, V v) : chiave(k), valore(v) {}\n    K getChiave() const { return chiave; }\n    V getValore() const { return valore; }\n    bool operator<(const Coppia& c) const { return chiave < c.chiave; }\n    friend ostream& operator<<(ostream& os, const Coppia& c) {\n        return os << c.chiave << \"=\" << c.valore;\n    }\n};\n\nint main() {\n    cout << \"=== STEP 1 ===\" << endl;\n    int numeri[] = {7, 3, 9, 1, 4};\n    string nomi[] = {\"Rita\", \"Ugo\", \"Anna\", \"Zoe\"};\n    stampa(numeri, 5);\n    cout << \"massimo: \" << numeri[indiceMassimo(numeri, 5)]\n         << \", ultimo in ordine alfabetico: \" << nomi[indiceMassimo(nomi, 4)] << endl;\n\n    cout << \"\\n=== STEP 2 ===\" << endl;\n    char lettere[] = {'t', 'e', 'm', 'p', 'l', 'a', 't', 'e'};\n    ordina(numeri, 5);  stampa(numeri, 5);\n    ordina(lettere, 8); stampa(lettere, 8);\n    ordina(nomi, 4);    stampa(nomi, 4);\n\n    cout << \"\\n=== STEP 3 ===\" << endl;\n    Rettangolo r[] = {Rettangolo(3, 4), Rettangolo(1, 1), Rettangolo(2, 5), Rettangolo(6, 0.5)};\n    cout << \"prima:  \"; stampa(r, 4);\n    ordina(r, 4);\n    cout << \"dopo:   \"; stampa(r, 4);\n    cout << \"il piu' grande: \" << r[indiceMassimo(r, 4)] << endl;\n\n    cout << \"\\n=== STEP 4 ===\" << endl;\n    Magazzino<double> md;\n    double valori[] = {2.5, 0.5, 9.75, 4.0};\n    for (int i = 0; i < 4; i++) md.inserire(valori[i]);\n    md.ordinaTutto();\n    md.stampaTutto();\n    cout << \"estraggo \" << md.estrarre() << \", ne restano \" << md.numero() << endl;\n    Magazzino<Rettangolo> mr;\n    mr.inserire(Rettangolo(2, 2));\n    mr.inserire(Rettangolo(1, 3));\n    mr.ordinaTutto();\n    mr.stampaTutto();\n    try {\n        Magazzino<int> vuoto;\n        vuoto.estrarre();\n    } catch (const underflow_error& e) {\n        cout << \"errore: \" << e.what() << endl;\n    }\n\n    cout << \"\\n=== STEP 5 ===\" << endl;\n    Magazzino< Coppia<string, int> > inventario;      // template dentro template\n    inventario.inserire(Coppia<string, int>(\"viti\", 120));\n    inventario.inserire(Coppia<string, int>(\"bulloni\", 45));\n    inventario.inserire(Coppia<string, int>(\"dadi\", 300));\n    inventario.ordinaTutto();                          // ordina per chiave\n    inventario.stampaTutto();\n    return 0;\n}\n"}],"input":null,"output":"=== STEP 1 ===\n7, 3, 9, 1, 4\nmassimo: 9, ultimo in ordine alfabetico: Zoe\n\n=== STEP 2 ===\n1, 3, 4, 7, 9\na, e, e, l, m, p, t, t\nAnna, Rita, Ugo, Zoe\n\n=== STEP 3 ===\nprima:  3x4, 1x1, 2x5, 6x0.5\ndopo:   1x1, 6x0.5, 2x5, 3x4\nil piu' grande: 3x4\n\n=== STEP 4 ===\n0.5, 2.5, 4, 9.75\nestraggo 9.75, ne restano 3\n1x3, 2x2\nerrore: magazzino vuoto\n\n=== STEP 5 ===\nbulloni=45, dadi=300, viti=120\n"}},{"id":"m05-e01","modulo":5,"tipo":"es","numero":1,"titolo":"Massimo e minimo","difficolta":"facile","testo":"<p>Scrivi i template <code>massimo<\/code> e <code>minimo<\/code> e provali con <code>int<\/code>, <code>double<\/code>, <code>char<\/code> e <code>string<\/code>. Prova a chiamare <code>massimo(3, 4.5)<\/code>, leggi l'errore, poi risolvi in due modi diversi.<\/p>","soluzione":{"commento":"","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 5.1 - massimo e minimo generici\n#include <iostream>\n#include <string>\nusing namespace std;\n\ntemplate <typename T>\nT massimo(T a, T b) { return (a > b) ? a : b; }\n\ntemplate <typename T>\nT minimo(T a, T b) { return (a < b) ? a : b; }\n\nint main() {\n    cout << massimo(3, 8) << \" \" << minimo(3, 8) << endl;                 // T = int\n    cout << massimo(2.71, 3.14) << \" \" << minimo(2.71, 3.14) << endl;     // T = double\n    cout << massimo('a', 'z') << \" \" << minimo('a', 'z') << endl;         // T = char\n    string x = \"pera\", y = \"mela\";\n    cout << massimo(x, y) << \" \" << minimo(x, y) << endl;                 // T = string\n    // massimo(3, 4.5);            // ERRORE: T dedotto sia int che double\n    cout << massimo<double>(3, 4.5) << endl;                              // T forzato\n    cout << massimo(static_cast<double>(3), 4.5) << endl;                 // oppure converto io\n    return 0;\n}\n"}],"input":null,"output":"8 3\n3.14 2.71\nz a\npera mela\n4.5\n4.5\n"}},{"id":"m05-e02","modulo":5,"tipo":"es","numero":2,"titolo":"Scambia e ruota","difficolta":"facile","testo":"<p>Scrivi <code>template &lt;typename T&gt; void scambia(T&amp;, T&amp;)<\/code> e, usandola, <code>void ruota(T&amp; a, T&amp; b, T&amp; c)<\/code> che sposta i valori a sinistra (<code>a<\/code> prende il valore di <code>b<\/code>, <code>b<\/code> quello di <code>c<\/code>, <code>c<\/code> quello di <code>a<\/code>). Provala con interi, stringhe e reali.<\/p>","soluzione":{"commento":"","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 5.2 - scambia generico e ruota tre valori\n#include <iostream>\n#include <string>\nusing namespace std;\n\ntemplate <typename T>\nvoid scambia(T& a, T& b) {\n    T tmp = a;\n    a = b;\n    b = tmp;\n}\n\n// a <- b <- c <- a  (rotazione a sinistra), usando scambia due volte\ntemplate <typename T>\nvoid ruota(T& a, T& b, T& c) {\n    scambia(a, b);       // ora a = b_vecchio, b = a_vecchio\n    scambia(b, c);       // ora b = c_vecchio, c = a_vecchio\n}\n\nint main() {\n    int i = 1, j = 2, k = 3;\n    ruota(i, j, k);\n    cout << i << \" \" << j << \" \" << k << endl;\n    string a = \"rosso\", b = \"verde\", c = \"blu\";\n    ruota(a, b, c);\n    cout << a << \" \" << b << \" \" << c << endl;\n    double x = 1.5, y = -1.5;\n    scambia(x, y);\n    cout << x << \" \" << y << endl;\n    return 0;\n}\n"}],"input":null,"output":"2 3 1\nverde blu rosso\n-1.5 1.5\n"}},{"id":"m05-e03","modulo":5,"tipo":"es","numero":3,"titolo":"Stampa e somma","difficolta":"facile","testo":"<p>Scrivi <code>stampaArray<\/code> e <code>T somma(const T v[], int n)<\/code>, partendo da <code>T s = T();<\/code>. Provala con <code>int<\/code>, <code>double<\/code> e <code>string<\/code>: cosa vuol dire “sommare” delle stringhe?<\/p>","soluzione":{"commento":"<p><code>T()<\/code> è il “valore zero” del tipo: 0 per i numeri, stringa vuota per <code>string<\/code>. Per le stringhe <code>+=<\/code> concatena.<\/p>","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 5.3 - stampa e somma generiche\n#include <iostream>\n#include <string>\nusing namespace std;\n\ntemplate <typename T>\nvoid stampaArray(const T v[], int n) {\n    for (int i = 0; i < n; i++) cout << v[i] << \" \";\n    cout << endl;\n}\n\n// Richiede: T() (valore \"zero\" del tipo) e l'operatore +=\ntemplate <typename T>\nT somma(const T v[], int n) {\n    T s = T();            // int() = 0, double() = 0.0, string() = \"\"\n    for (int i = 0; i < n; i++) s += v[i];\n    return s;\n}\n\nint main() {\n    int vi[] = {1, 2, 3, 4};\n    double vd[] = {0.5, 0.25, 0.125};\n    string vs[] = {\"tem\", \"pla\", \"te\"};\n    stampaArray(vi, 4); cout << \"somma: \" << somma(vi, 4) << endl;\n    stampaArray(vd, 3); cout << \"somma: \" << somma(vd, 3) << endl;\n    stampaArray(vs, 3); cout << \"somma: \" << somma(vs, 3) << endl;   // per le stringhe + concatena\n    return 0;\n}\n"}],"input":null,"output":"1 2 3 4 \nsomma: 10\n0.5 0.25 0.125 \nsomma: 0.875\ntem pla te \nsomma: template\n"}},{"id":"m05-e04","modulo":5,"tipo":"es","numero":4,"titolo":"Contare le occorrenze","difficolta":"facile","testo":"<p>Scrivi <code>int conta(const T v[], int n, const T&amp; x)<\/code> e un template con due parametri di tipo, <code>int contaMaggiori(const T v[], int n, U soglia)<\/code>, che permette di confrontare un array di <code>double<\/code> con una soglia <code>int<\/code>.<\/p>","soluzione":{"commento":"<p>Per contare “rosso” serve <code>string(\"rosso\")<\/code>: con il letterale <code>\"rosso\"<\/code> il terzo argomento sarebbe un <code>const char*<\/code> e <code>T<\/code> risulterebbe dedotto in due modi diversi.<\/p>","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 5.4 - contare le occorrenze (due parametri template)\n#include <iostream>\n#include <string>\nusing namespace std;\n\ntemplate <typename T>\nint conta(const T v[], int n, const T& x) {\n    int c = 0;\n    for (int i = 0; i < n; i++)\n        if (v[i] == x) c++;\n    return c;\n}\n\n// T e U possono essere tipi diversi: confronto un double con un int\ntemplate <typename T, typename U>\nint contaMaggiori(const T v[], int n, U soglia) {\n    int c = 0;\n    for (int i = 0; i < n; i++)\n        if (v[i] > soglia) c++;\n    return c;\n}\n\nint main() {\n    int voti[] = {28, 30, 18, 30, 25, 30};\n    char dna[] = {'A', 'C', 'G', 'A', 'T', 'A'};\n    string colori[] = {\"rosso\", \"blu\", \"rosso\", \"verde\"};\n    double temp[] = {18.5, 22.1, 25.0, 19.9};\n    cout << \"30 compare \" << conta(voti, 6, 30) << \" volte\" << endl;\n    cout << \"'A' compare \" << conta(dna, 6, 'A') << \" volte\" << endl;\n    cout << \"rosso compare \" << conta(colori, 4, string(\"rosso\")) << \" volte\" << endl;\n    cout << \"temperature sopra 20: \" << contaMaggiori(temp, 4, 20) << endl;\n    return 0;\n}\n"}],"input":null,"output":"30 compare 3 volte\n'A' compare 3 volte\nrosso compare 2 volte\ntemperature sopra 20: 2\n"}},{"id":"m05-e05","modulo":5,"tipo":"es","numero":5,"titolo":"Ricerca generica","difficolta":"medio","testo":"<p>Scrivi <code>int ricerca(T dato, T v[], int dim)<\/code> (indice della prima occorrenza, o -1) e una classe <code>Punto<\/code> con <code>operator==<\/code>. Cerca nei tre array (<code>int<\/code>, <code>char<\/code>, <code>Punto<\/code>) valori letti da tastiera. (Esercizio delle slide.)<\/p>","soluzione":{"commento":"","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 5.5 - ricerca generica (esercizio delle slide) con int, char e Punto\n#include <iostream>\nusing namespace std;\n\ntemplate <typename T>\nint ricerca(T dato, T v[], int dim) {\n    for (int i = 0; i < dim; i++)\n        if (v[i] == dato) return i;      // richiede l'operatore == su T\n    return -1;\n}\n\nclass Punto {\nprivate:\n    int x, y;\npublic:\n    Punto(int x = 0, int y = 0) : x(x), y(y) {}\n    bool operator==(const Punto& p) const { return x == p.x && y == p.y; }   // anteprima Modulo 10\n    friend ostream& operator<<(ostream& os, const Punto& p) { return os << \"(\" << p.x << \",\" << p.y << \")\"; }\n};\n\ntemplate <typename T>\nvoid stampa(T v[], int n) {\n    for (int i = 0; i < n; i++) cout << v[i] << \" \";\n    cout << endl;\n}\n\nint main() {\n    int vi[] = {5, 8, 13, 21};\n    char vc[] = {'x', 'y', 'z'};\n    Punto vp[] = {Punto(0, 0), Punto(1, 2), Punto(3, 4)};\n    stampa(vi, 4); stampa(vc, 3); stampa(vp, 3);\n\n    int ni; char nc; int px, py;\n    cin >> ni >> nc >> px >> py;                 // valori da cercare (dall'input)\n    cout << ni << \" -> indice \" << ricerca(ni, vi, 4) << endl;\n    cout << nc << \" -> indice \" << ricerca(nc, vc, 3) << endl;\n    cout << Punto(px, py) << \" -> indice \" << ricerca(Punto(px, py), vp, 3) << endl;\n    cout << \"(9,9) -> indice \" << ricerca(Punto(9, 9), vp, 3) << endl;\n    return 0;\n}\n"}],"input":"13 z 3 4\n","output":"5 8 13 21 \nx y z \n(0,0) (1,2) (3,4) \n13 -> indice 2\nz -> indice 2\n(3,4) -> indice 2\n(9,9) -> indice -1\n"}},{"id":"m05-e06","modulo":5,"tipo":"es","numero":6,"titolo":"Ordinamento generico","difficolta":"medio","testo":"<p>Scrivi <code>void ordina(T a[], int n)<\/code> (bubble sort, usando solo <code>&lt;<\/code>) e ordinaci un array di <code>int<\/code>, uno di <code>char<\/code> e uno di <code>Rettangolo<\/code> confrontati per area. Stampa prima e dopo. (Esercizio delle slide.)<\/p>","soluzione":{"commento":"","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 5.6 - ordinamento generico (esercizio delle slide): int, char, Rettangolo per area\n#include <iostream>\nusing namespace std;\n\ntemplate <typename T>\nvoid ordina(T a[], int n) {                 // bubble sort\n    for (int i = 0; i < n - 1; i++)\n        for (int j = 0; j < n - 1 - i; j++)\n            if (a[j + 1] < a[j]) {          // richiede solo l'operatore <\n                T t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n            }\n}\n\ntemplate <typename T>\nvoid stampa(const T a[], int n) {\n    for (int i = 0; i < n; i++) cout << a[i] << \" \";\n    cout << endl;\n}\n\nclass Rettangolo {\nprivate:\n    double b, h;\npublic:\n    Rettangolo(double b = 1, double h = 1) : b(b), h(h) {}\n    double area() const { return b * h; }\n    bool operator<(const Rettangolo& r) const { return area() < r.area(); }\n    friend ostream& operator<<(ostream& os, const Rettangolo& r) {\n        return os << \"[\" << r.b << \"x\" << r.h << \"=\" << r.area() << \"]\";\n    }\n};\n\nint main() {\n    int vi[] = {42, 7, 19, 3};\n    char vc[] = {'q', 'w', 'e', 'r', 't', 'y'};\n    Rettangolo vr[] = {Rettangolo(5, 5), Rettangolo(2, 3), Rettangolo(10, 1), Rettangolo(1, 1)};\n\n    cout << \"prima:\" << endl; stampa(vi, 4); stampa(vc, 6); stampa(vr, 4);\n    ordina(vi, 4); ordina(vc, 6); ordina(vr, 4);\n    cout << \"dopo:\" << endl;  stampa(vi, 4); stampa(vc, 6); stampa(vr, 4);\n    return 0;\n}\n"}],"input":null,"output":"prima:\n42 7 19 3 \nq w e r t y \n[5x5=25] [2x3=6] [10x1=10] [1x1=1] \ndopo:\n3 7 19 42 \ne q r t w y \n[1x1=1] [2x3=6] [10x1=10] [5x5=25] \n"}},{"id":"m05-e07","modulo":5,"tipo":"es","numero":7,"titolo":"Coppia di due tipi","difficolta":"medio","testo":"<p>Scrivi <code>template &lt;typename T, typename U&gt; class Coppia<\/code> con getter, setter, <code>stampa()<\/code> e un metodo <code>invertita()<\/code> che restituisce una <code>Coppia&lt;U, T&gt;<\/code>. Scrivi anche una funzione template <code>creaCoppia(a, b)<\/code> che deduce i tipi da sola.<\/p>","soluzione":{"commento":"<p><code>invertita()<\/code> restituisce un tipo diverso da quello dell'oggetto (<code>Coppia&lt;U, T&gt;<\/code>): dentro un template si possono usare altre istanziazioni dello stesso template.<\/p>","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 5.7 - Coppia<T, U>: un template di classe con due tipi\n#include <iostream>\n#include <string>\nusing namespace std;\n\ntemplate <typename T, typename U>\nclass Coppia {\nprivate:\n    T primo;\n    U secondo;\npublic:\n    Coppia(T p, U s) : primo(p), secondo(s) {}\n    T getPrimo() const { return primo; }\n    U getSecondo() const { return secondo; }\n    void setPrimo(T p) { primo = p; }\n    void setSecondo(U s) { secondo = s; }\n    Coppia<U, T> invertita() const { return Coppia<U, T>(secondo, primo); }   // tipi scambiati!\n    void stampa() const { cout << \"(\" << primo << \", \" << secondo << \")\" << endl; }\n};\n\n// Funzione template che \"costruisce\" una coppia deducendo i tipi da sola\ntemplate <typename T, typename U>\nCoppia<T, U> creaCoppia(T a, U b) { return Coppia<T, U>(a, b); }\n\nint main() {\n    Coppia<string, int> eta(\"Mario\", 22);\n    eta.stampa();\n    eta.setSecondo(23);\n    eta.invertita().stampa();                 // Coppia<int, string>\n\n    Coppia<double, double> punto(1.5, -2.0);\n    punto.stampa();\n\n    creaCoppia('x', 3.14).stampa();           // Coppia<char, double>, tipi dedotti\n    return 0;\n}\n"}],"input":null,"output":"(Mario, 22)\n(23, Mario)\n(1.5, -2)\n(x, 3.14)\n"}},{"id":"m05-e08","modulo":5,"tipo":"es","numero":8,"titolo":"Contenitore a dimensione fissa","difficolta":"medio","testo":"<p>Scrivi <code>template &lt;typename T = int, int N = 5&gt; class Contenitore<\/code> con un array <b>statico<\/b> <code>T dati[N]<\/code>, <code>inserire<\/code> (lancia <code>overflow_error<\/code> se pieno), <code>estrarre<\/code> (lancia <code>underflow_error<\/code> se vuoto), <code>numero<\/code>, <code>vuoto<\/code>, <code>capacita<\/code>. Crea un <code>Contenitore&lt;&gt;<\/code> e un <code>Contenitore&lt;char, 3&gt;<\/code>.<\/p>","soluzione":{"commento":"<p>Attenzione a <code>cout &lt;&lt; lettere.estrarre() &lt;&lt; lettere.estrarre()<\/code>: dal C++17 le espressioni concatenate con <code>&lt;&lt;<\/code> sono valutate da sinistra a destra, quindi esce prima <code>b<\/code> e poi <code>a<\/code>. Con compilatori più vecchi l'ordine non era garantito: meglio usare due istruzioni separate.<\/p>","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 5.8 - Contenitore<T, N> con parametri di default (dalle slide)\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\n// N è un parametro NON di tipo: un valore intero noto a compile-time\ntemplate <typename T = int, int N = 5>\nclass Contenitore {\nprivate:\n    T dati[N];                    // array STATICO: N deve essere una costante\n    int elementi;\npublic:\n    Contenitore() : elementi(0) {}\n    void inserire(T el) {\n        if (elementi == N) throw overflow_error(\"contenitore pieno\");\n        dati[elementi++] = el;\n    }\n    T estrarre() {\n        if (vuoto()) throw underflow_error(\"contenitore vuoto\");\n        return dati[--elementi];\n    }\n    int numero() const { return elementi; }\n    bool vuoto() const { return elementi == 0; }\n    int capacita() const { return N; }\n};\n\nint main() {\n    Contenitore<> c;                       // T = int, N = 5 (tutti i default)\n    Contenitore<char, 3> lettere;          // T = char, N = 3\n    for (int i = 1; i <= 5; i++) c.inserire(i * 100);\n    cout << \"c: \" << c.numero() << \"/\" << c.capacita() << endl;\n    try {\n        c.inserire(600);\n    } catch (const overflow_error& e) {\n        cout << \"errore: \" << e.what() << endl;\n    }\n    lettere.inserire('a'); lettere.inserire('b');\n    cout << \"estraggo da lettere: \" << lettere.estrarre() << lettere.estrarre() << endl;\n    // Contenitore<int, 5> e Contenitore<int, 6> sono DUE CLASSI DIVERSE per il compilatore\n    return 0;\n}\n"}],"input":null,"output":"c: 5/5\nerrore: contenitore pieno\nestraggo da lettere: ba\n"}},{"id":"m05-e09","modulo":5,"tipo":"es","numero":9,"titolo":"Specializzazioni","difficolta":"difficile","testo":"<p>Scrivi <code>template &lt;typename T&gt; bool uguali(T a, T b)<\/code> con <code>==<\/code> e due specializzazioni: per <code>double<\/code> (tolleranza 10⁻⁹) e per <code>const char*<\/code> (confronto carattere per carattere). Mostra che <code>0.1 + 0.2 == 0.3<\/code> è falso ma <code>uguali(0.1 + 0.2, 0.3)<\/code> è vero.<\/p>","soluzione":{"commento":"","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 5.9 - Specializzazione: un caso particolare per un tipo\n#include <iostream>\nusing namespace std;\n\n// Versione generale: usa ==\ntemplate <typename T>\nbool uguali(T a, T b) {\n    return a == b;\n}\n\n// Specializzazione per double: == sui reali è inaffidabile (0.1 + 0.2 != 0.3)\ntemplate <>\nbool uguali<double>(double a, double b) {\n    double diff = a - b;\n    if (diff < 0) diff = -diff;\n    return diff < 1e-9;\n}\n\n// Specializzazione per stringhe C: == confronterebbe gli INDIRIZZI, non il testo\ntemplate <>\nbool uguali<const char*>(const char* a, const char* b) {\n    int i = 0;\n    while (a[i] != '\\0' && a[i] == b[i]) i++;\n    return a[i] == b[i];\n}\n\nint main() {\n    cout << boolalpha;\n    cout << \"int:    \" << uguali(3, 3) << endl;\n    cout << \"0.1+0.2 == 0.3 con l'operatore ==: \" << (0.1 + 0.2 == 0.3) << endl;\n    cout << \"double: \" << uguali(0.1 + 0.2, 0.3) << endl;\n    char s1[] = \"ciao\", s2[] = \"ciao\";\n    const char* p1 = s1;\n    const char* p2 = s2;\n    cout << \"indirizzi uguali? \" << (p1 == p2) << endl;\n    cout << \"const char*: \" << uguali(p1, p2) << endl;\n    return 0;\n}\n"}],"input":null,"output":"int:    true\n0.1+0.2 == 0.3 con l'operatore ==: false\ndouble: true\nindirizzi uguali? false\nconst char*: true\n"}},{"id":"m05-e10","modulo":5,"tipo":"es","numero":10,"titolo":"Pila generica","difficolta":"difficile","testo":"<p>Scrivi <code>template &lt;typename T&gt; class Pila<\/code> su array dinamico (Regola dei Tre, <code>push<\/code>, <code>pop<\/code> con eccezione, <code>vuota<\/code>). Usala in una funzione template <code>invertiConPila(T v[], int n)<\/code> e per controllare se le parentesi di un'espressione come <code>{[(a+b)*c]-(d)}<\/code> sono bilanciate.<\/p>","soluzione":{"commento":"","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 5.10 - Pila<T> generica e una funzione template che la usa\n#include <iostream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\ntemplate <typename T>\nclass Pila {\nprivate:\n    T* dati;\n    int cima, cap;\npublic:\n    Pila() : dati(new T[2]), cima(0), cap(2) {}\n    ~Pila() { delete[] dati; }\n    Pila(const Pila& p) : dati(new T[p.cap]), cima(p.cima), cap(p.cap) {\n        for (int i = 0; i < cima; i++) dati[i] = p.dati[i];\n    }\n    Pila& operator=(const Pila& p) {\n        if (this != &p) {\n            T* nuovo = new T[p.cap];\n            for (int i = 0; i < p.cima; i++) nuovo[i] = p.dati[i];\n            delete[] dati;\n            dati = nuovo; cima = p.cima; cap = p.cap;\n        }\n        return *this;\n    }\n    void push(const T& x) {\n        if (cima == cap) {\n            T* nuovo = new T[cap * 2];\n            for (int i = 0; i < cima; i++) nuovo[i] = dati[i];\n            delete[] dati;\n            dati = nuovo;\n            cap *= 2;\n        }\n        dati[cima++] = x;\n    }\n    T pop() {\n        if (vuota()) throw underflow_error(\"pila vuota\");\n        return dati[--cima];\n    }\n    bool vuota() const { return cima == 0; }\n};\n\n// Inverte un array di QUALSIASI tipo passando per una Pila<T>\ntemplate <typename T>\nvoid invertiConPila(T v[], int n) {\n    Pila<T> p;\n    for (int i = 0; i < n; i++) p.push(v[i]);\n    for (int i = 0; i < n; i++) v[i] = p.pop();     // escono al contrario (LIFO)\n}\n\ntemplate <typename T>\nvoid stampa(const T v[], int n) {\n    for (int i = 0; i < n; i++) cout << v[i] << \" \";\n    cout << endl;\n}\n\nint main() {\n    int vi[] = {1, 2, 3, 4, 5};\n    string vs[] = {\"primo\", \"secondo\", \"terzo\"};\n    invertiConPila(vi, 5);\n    invertiConPila(vs, 3);\n    stampa(vi, 5);\n    stampa(vs, 3);\n\n    // Parentesi bilanciate con Pila<char>\n    string espr = \"{[(a+b)*c]-(d)}\";\n    Pila<char> p;\n    bool ok = true;\n    for (int i = 0; i < (int)espr.length() && ok; i++) {\n        char c = espr[i];\n        if (c == '(' || c == '[' || c == '{') p.push(c);\n        else if (c == ')' || c == ']' || c == '}') {\n            if (p.vuota()) { ok = false; break; }\n            char a = p.pop();\n            ok = (a == '(' && c == ')') || (a == '[' && c == ']') || (a == '{' && c == '}');\n        }\n    }\n    if (!p.vuota()) ok = false;\n    cout << espr << (ok ? \" e' bilanciata\" : \" NON e' bilanciata\") << endl;\n    return 0;\n}\n"}],"input":null,"output":"5 4 3 2 1 \nterzo secondo primo \n{[(a+b)*c]-(d)} e' bilanciata\n"}},{"id":"m06-pattern","modulo":6,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 6 (Complessità Computazionale).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 6 - Pattern: CONTARE I PASSI per vedere la complessità\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\nusing namespace std;\n\nlong long passi;     // contatore globale: ogni operazione \"elementare\" fa passi++\n\nvoid costante(int n) {               // O(1): non dipende da n\n    passi++;                         // es. leggere v[0]\n    (void)n;\n}\n\nvoid logaritmico(int n) {            // O(log n): i raddoppia a ogni giro\n    for (int i = 1; i < n; i *= 2) passi++;\n}\n\nvoid lineare(int n) {                // O(n): un giro per ogni elemento\n    for (int i = 0; i < n; i++) passi++;\n}\n\nvoid nlogn(int n) {                  // O(n log n): n volte un ciclo logaritmico\n    for (int i = 0; i < n; i++)\n        for (int j = 1; j < n; j *= 2) passi++;\n}\n\nvoid quadratico(int n) {             // O(n^2): due cicli annidati su n\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n; j++) passi++;\n}\n\n// Esegue f(n), restituisce quanti passi ha fatto\nlong long conta(void (*f)(int), int n) {   // f è un puntatore a funzione (Modulo 3)\n    passi = 0;\n    f(n);\n    return passi;\n}\n\nint main() {\n    int dimensioni[] = {10, 100, 1000, 10000};\n    cout << \"n\\tO(1)\\tO(logn)\\tO(n)\\tO(nlogn)\\tO(n^2)\" << endl;\n    for (int k = 0; k < 4; k++) {\n        int n = dimensioni[k];\n        cout << n << \"\\t\" << conta(costante, n) << \"\\t\" << conta(logaritmico, n)\n             << \"\\t\" << conta(lineare, n) << \"\\t\" << conta(nlogn, n)\n             << \"\\t\\t\" << conta(quadratico, n) << endl;\n    }\n    return 0;\n}\n"}],"input":null,"output":"n       O(1)    O(logn) O(n)    O(nlogn)        O(n^2)\n10      1       4       10      40              100\n100     1       7       100     700             10000\n1000    1       10      1000    10000           1000000\n10000   1       14      10000   140000          100000000\n"}},{"id":"m06-lab","modulo":6,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Segmento di somma massima (dalle slide)<\/b><\/p><p>Dato un array <code>S<\/code> di n interi (positivi e negativi, almeno uno positivo), un <i>segmento<\/i> è una sequenza di elementi <b>consecutivi<\/b> <code>S[i..j]<\/code>. Si vuole trovare il segmento con la <b>somma massima<\/b>; a parità di somma si preferisce il segmento più corto. Si scriveranno tre algoritmi via via più efficienti e se ne misurerà il costo.<\/p><p><b>Step 1 – il contatore<\/b><br>Dichiara una variabile globale <code>long long passi<\/code> che ogni algoritmo incrementerà a ogni somma di un elemento. Azzerala prima di ogni misura.<br><b>Concetto nuovo:<\/b> misurare la complessità sperimentalmente.<\/p><p><b>Step 2 – la soluzione ingenua<\/b><br>Scrivi <code>int sommaMassima1(const int S[], int n)<\/code>: per ogni coppia <code>(i, j)<\/code> con <code>i &lt;= j<\/code> calcola da capo la somma di <code>S[i..j]<\/code> con un terzo ciclo. Prima di eseguirla, prevedi la complessità.<br><b>Concetto nuovo:<\/b> tre cicli annidati, O(n³).<\/p><p><b>Step 3 – non ricalcolare<\/b><br>Scrivi <code>sommaMassima2<\/code>: osserva che la somma di <code>S[i..j]<\/code> è la somma di <code>S[i..j-1]<\/code> più <code>S[j]<\/code>, quindi non serve il terzo ciclo.<br><b>Concetto nuovo:<\/b> riusare risultati già calcolati, da O(n³) a O(n²).<\/p><p><b>Step 4 – una sola passata<\/b><br>Scrivi <code>int sommaMassima3(const int S[], int n, int&amp; inizio, int&amp; fine)<\/code>, che scorre l'array <b>una volta<\/b> tenendo una somma “in corso”: se diventa negativa, la azzera e fa ripartire il segmento dall'elemento successivo (una somma negativa può solo peggiorare quello che viene dopo). Restituisci anche gli estremi del segmento, preferendo il più corto a parità di somma.<br><b>Concetto nuovo:<\/b> un'idea migliore batte un computer più veloce, O(n).<\/p><p><b>Step 5 – il confronto<\/b><br>Con <code>srand(111222333)<\/code> genera array casuali di 10, 100 e 1000 elementi (valori tra -10 e 10) e stampa una tabella con i passi dei tre algoritmi, verificando che diano tutti lo stesso risultato.<br><b>Concetto nuovo:<\/b> leggere la crescita in una tabella.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 6 - Laboratorio a step: segmento di somma massima (dalle slide)\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <cstdlib>\nusing namespace std;\n\nlong long passi = 0;   // ===== STEP 1 ===== il contatore di passi\n\n// ===== STEP 2 =====  Prova TUTTI i segmenti e li somma da capo: O(n^3)\nint sommaMassima1(const int S[], int n) {\n    int massimo = 0;\n    for (int i = 0; i < n; i++)\n        for (int j = i; j < n; j++) {\n            int somma = 0;\n            for (int k = i; k <= j; k++) {    // ricalcolo S[i] + ... + S[j]\n                somma += S[k];\n                passi++;\n            }\n            if (somma > massimo) massimo = somma;\n        }\n    return massimo;\n}\n\n// ===== STEP 3 =====  Riuso la somma precedente: somma(i..j) = somma(i..j-1) + S[j]: O(n^2)\nint sommaMassima2(const int S[], int n) {\n    int massimo = 0;\n    for (int i = 0; i < n; i++) {\n        int somma = 0;\n        for (int j = i; j < n; j++) {\n            somma += S[j];\n            passi++;\n            if (somma > massimo) massimo = somma;\n        }\n    }\n    return massimo;\n}\n\n// ===== STEP 4 =====  Una sola passata: O(n)\n// Se la somma \"in corso\" diventa negativa, non conviene portarsela dietro: riparto da zero.\nint sommaMassima3(const int S[], int n, int& inizio, int& fine) {\n    int massimo = 0, somma = 0, partenza = 0;\n    inizio = 0; fine = -1;                       // segmento vuoto\n    for (int j = 0; j < n; j++) {\n        somma += S[j];\n        passi++;\n        bool migliore = somma > massimo;\n        bool piuCorto = somma == massimo && somma > 0 && (j - partenza) < (fine - inizio);\n        if (migliore || piuCorto) {              // a parità di somma preferisco il più corto\n            massimo = somma;\n            inizio = partenza;\n            fine = j;\n        }\n        if (somma < 0) {                         // zavorra: la butto\n            somma = 0;\n            partenza = j + 1;\n        }\n    }\n    return massimo;\n}\n\n// ===== STEP 5 =====  Confronto su array casuali di dimensione crescente\nvoid riempiCasuale(int v[], int n) {\n    for (int i = 0; i < n; i++) v[i] = rand() % 21 - 10;    // valori tra -10 e 10\n}\n\nint main() {\n    // STEP 2-4 sull'esempio piccolo\n    int S[] = {2, -6, 3, 5, -2, 4, -9, 1};\n    int n = 8, ini, fin;\n    passi = 0; int r1 = sommaMassima1(S, n); long long p1 = passi;\n    passi = 0; int r2 = sommaMassima2(S, n); long long p2 = passi;\n    passi = 0; int r3 = sommaMassima3(S, n, ini, fin); long long p3 = passi;\n    cout << \"Esempio: somma massima \" << r1 << \" / \" << r2 << \" / \" << r3\n         << \"  (segmento S[\" << ini << \"..\" << fin << \"])\" << endl;\n    cout << \"Passi: \" << p1 << \" / \" << p2 << \" / \" << p3 << endl << endl;\n\n    // STEP 5\n    srand(111222333);\n    cout << \"n\\tO(n^3)\\t\\tO(n^2)\\t\\tO(n)\\trisultati uguali?\" << endl;\n    int dims[] = {10, 100, 1000};\n    for (int t = 0; t < 3; t++) {\n        int m = dims[t];\n        int* v = new int[m];\n        riempiCasuale(v, m);\n        passi = 0; int a = sommaMassima1(v, m); long long q1 = passi;\n        passi = 0; int b = sommaMassima2(v, m); long long q2 = passi;\n        passi = 0; int c = sommaMassima3(v, m, ini, fin); long long q3 = passi;\n        cout << m << \"\\t\" << q1 << (q1 < 10000000 ? \"\\t\\t\" : \"\\t\") << q2\n             << (q2 < 10000000 ? \"\\t\\t\" : \"\\t\") << q3 << \"\\t\"\n             << ((a == b && b == c) ? \"si\" : \"NO\") << endl;\n        delete[] v;\n    }\n    return 0;\n}\n"}],"input":null,"output":"Esempio: somma massima 10 / 10 / 10  (segmento S[2..5])\nPassi: 120 / 36 / 8\n\nn       O(n^3)          O(n^2)          O(n)    risultati uguali?\n10      220             55              10      si\n100     171700          5050            100     si\n1000    167167000       500500          1000    si\n"}},{"id":"m06-e01","modulo":6,"tipo":"es","numero":1,"titolo":"Un passo sì e uno no","difficolta":"facile","testo":"<p>Conta i giri di <code>for (i = 0; i &lt; n; i += 2)<\/code> per n = 10, 100, 1000, 10 000 e stampa anche <code>passi / n<\/code>. Cosa noti nel rapporto? Che complessità è?<\/p>","soluzione":{"commento":"<p>Il rapporto resta fermo a 0.5: i passi crescono come n, quindi O(n).<\/p>","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 6.1 - Ciclo che avanza di 2: quanti giri?\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int dims[] = {10, 100, 1000, 10000};\n    for (int t = 0; t < 4; t++) {\n        int n = dims[t];\n        long long passi = 0;\n        for (int i = 0; i < n; i += 2) passi++;    // salta di 2: circa n/2 giri\n        cout << \"n = \" << n << \"\\tpassi = \" << passi << \"\\tpassi/n = \" << (double)passi / n << endl;\n    }\n    // passi/n resta fisso a 0.5: i passi crescono COME n -> O(n). Il \"/2\" non conta.\n    return 0;\n}\n"}],"input":null,"output":"n = 10  passi = 5       passi/n = 0.5\nn = 100 passi = 50      passi/n = 0.5\nn = 1000        passi = 500     passi/n = 0.5\nn = 10000       passi = 5000    passi/n = 0.5\n"}},{"id":"m06-e02","modulo":6,"tipo":"es","numero":2,"titolo":"Quadrato e triangolo","difficolta":"facile","testo":"<p>Conta i giri di due cicli annidati completi (<code>j<\/code> da 0 a n) e di due cicli “a triangolo” (<code>j<\/code> da <code>i+1<\/code> a n). Stampa i rapporti con n². Hanno la stessa complessità?<\/p>","soluzione":{"commento":"<p>Il triangolo fa circa metà dei passi, ma il rapporto con n² si stabilizza: entrambi O(n²).<\/p>","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 6.2 - Due cicli annidati: quadrato pieno e triangolo\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int dims[] = {10, 100, 1000};\n    cout << \"n\\tpieno\\ttriangolo\\tpieno/n^2\\ttriangolo/n^2\" << endl;\n    for (int t = 0; t < 3; t++) {\n        int n = dims[t];\n        long long pieno = 0, triangolo = 0;\n        for (int i = 0; i < n; i++)\n            for (int j = 0; j < n; j++) pieno++;          // n * n\n        for (int i = 0; i < n; i++)\n            for (int j = i + 1; j < n; j++) triangolo++;  // (n-1) + (n-2) + ... + 1 = n(n-1)/2\n        cout << n << \"\\t\" << pieno << \"\\t\" << triangolo << \"\\t\\t\"\n             << (double)pieno / ((double)n * n) << \"\\t\\t\" << (double)triangolo / ((double)n * n) << endl;\n    }\n    // Il triangolo fa circa META' dei passi, ma il rapporto con n^2 si stabilizza: anche lui è O(n^2).\n    return 0;\n}\n"}],"input":null,"output":"n       pieno   triangolo       pieno/n^2       triangolo/n^2\n10      100     45              1               0.45\n100     10000   4950            1               0.495\n1000    1000000 499500          1               0.4995\n"}},{"id":"m06-e03","modulo":6,"tipo":"es","numero":3,"titolo":"Raddoppiare","difficolta":"facile","testo":"<p>Conta i giri di <code>for (i = 1; i &lt; n; i *= 2)<\/code> per n = 1, 10, 100, …, 1 000 000. Di quanto crescono i passi quando n si moltiplica per 10?<\/p>","soluzione":{"commento":"<p>n × 10 significa solo +3 o +4 passi: logaritmico.<\/p>","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 6.3 - Ciclo che raddoppia: logaritmo \"a occhio\"\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // Quante volte posso raddoppiare 1 prima di superare n? = quante volte posso dimezzare n\n    for (int n = 1; n <= 1000000; n *= 10) {\n        int passi = 0;\n        for (int i = 1; i < n; i *= 2) passi++;\n        cout << \"n = \" << n << \"\\tpassi = \" << passi << endl;\n    }\n    // n moltiplicato per 10 -> passi aumentano solo di circa 3 o 4: crescita logaritmica.\n    return 0;\n}\n"}],"input":null,"output":"n = 1   passi = 0\nn = 10  passi = 4\nn = 100 passi = 7\nn = 1000        passi = 10\nn = 10000       passi = 14\nn = 100000      passi = 17\nn = 1000000     passi = 20\n"}},{"id":"m06-e04","modulo":6,"tipo":"es","numero":4,"titolo":"Vince il più pesante","difficolta":"facile","testo":"<p>Metti in sequenza un ciclo da n giri e due cicli annidati da n. Stampa i passi dei due blocchi e la percentuale di lavoro del secondo per n = 10, 100, 1000.<\/p>","soluzione":{"commento":"","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 6.4 - Blocchi in sequenza: vince il più pesante\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int dims[] = {10, 100, 1000};\n    cout << \"n\\tblocco A (n)\\tblocco B (n^2)\\ttotale\\tquota di B\" << endl;\n    for (int t = 0; t < 3; t++) {\n        int n = dims[t];\n        long long a = 0, b = 0;\n        for (int i = 0; i < n; i++) a++;                  // blocco A: O(n)\n        for (int i = 0; i < n; i++)                       // blocco B: O(n^2)\n            for (int j = 0; j < n; j++) b++;\n        cout << n << \"\\t\" << a << \"\\t\\t\" << b << \"\\t\\t\" << a + b << \"\\t\"\n             << 100.0 * b / (a + b) << \"%\" << endl;\n    }\n    // Il totale è n + n^2, ma per n grande il blocco B è quasi tutto: O(n + n^2) = O(n^2).\n    return 0;\n}\n"}],"input":null,"output":"n       blocco A (n)    blocco B (n^2)  totale  quota di B\n10      10              100             110     90.9091%\n100     100             10000           10100   99.0099%\n1000    1000            1000000         1001000 99.9001%\n"}},{"id":"m06-e05","modulo":6,"tipo":"es","numero":5,"titolo":"I tre casi della ricerca lineare","difficolta":"medio","testo":"<p>Su un array di 1000 elementi, conta i confronti della ricerca lineare nel caso migliore, nel caso peggiore (ultimo elemento e assente) e nel caso medio (media cercando, uno alla volta, tutti gli elementi presenti).<\/p>","soluzione":{"commento":"<p>Caso medio (n+1)/2 = 500.5: sempre O(n).<\/p>","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 6.5 - Ricerca lineare: caso migliore, peggiore, medio\n#include <iostream>\nusing namespace std;\n\nint confronti;\n\nint ricerca(const int v[], int n, int x) {\n    for (int i = 0; i < n; i++) {\n        confronti++;\n        if (v[i] == x) return i;\n    }\n    return -1;\n}\n\nint main() {\n    const int N = 1000;\n    int v[N];\n    for (int i = 0; i < N; i++) v[i] = i * 3;          // 0, 3, 6, ...\n\n    confronti = 0; ricerca(v, N, 0);\n    cout << \"caso migliore (primo elemento): \" << confronti << \" confronti\" << endl;\n    confronti = 0; ricerca(v, N, 3 * (N - 1));\n    cout << \"caso peggiore (ultimo elemento): \" << confronti << \" confronti\" << endl;\n    confronti = 0; ricerca(v, N, 1);\n    cout << \"caso peggiore (assente): \" << confronti << \" confronti\" << endl;\n\n    long long totale = 0;                                // media su tutti gli elementi presenti\n    for (int i = 0; i < N; i++) {\n        confronti = 0;\n        ricerca(v, N, v[i]);\n        totale += confronti;\n    }\n    cout << \"caso medio (elemento presente): \" << (double)totale / N << \" confronti\" << endl;\n    // migliore O(1), peggiore O(n), medio circa n/2 -> O(n)\n    return 0;\n}\n"}],"input":null,"output":"caso migliore (primo elemento): 1 confronti\ncaso peggiore (ultimo elemento): 1000 confronti\ncaso peggiore (assente): 1000 confronti\ncaso medio (elemento presente): 500.5 confronti\n"}},{"id":"m06-e06","modulo":6,"tipo":"es","numero":6,"titolo":"L'esempio delle slide","difficolta":"medio","testo":"<p>Implementa la funzione <code>func(n)<\/code> delle slide (ciclo esterno da n/2 a n, due cicli interni che raddoppiano) e verifica che <code>count<\/code> sia esattamente (n/2 + 1) · L · L, dove L è il numero di giri di un ciclo che raddoppia fino a n. Che complessità ne deduci?<\/p>","soluzione":{"commento":"<p>O(n log² n), cioè n · log n · log n.<\/p>","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 6.6 - L'esempio delle slide: tre cicli, solo uno lineare\n#include <iostream>\nusing namespace std;\n\nlong long func(int n) {\n    long long count = 0;\n    for (int i = n / 2; i <= n; i++)          // circa n/2 giri         -> O(n)\n        for (int j = 1; j <= n; j = 2 * j)    // raddoppia              -> O(log n)\n            for (int k = 1; k <= n; k = k * 2) // raddoppia             -> O(log n)\n                count++;\n    return count;\n}\n\nint main() {\n    for (int n = 16; n <= 65536; n *= 16) {\n        int lg = 0;\n        for (int x = 1; x <= n; x *= 2) lg++;          // giri di un ciclo che raddoppia\n        long long c = func(n);\n        cout << \"n = \" << n << \"\\tcount = \" << c\n             << \"\\t(n/2+1) * lg * lg = \" << (long long)(n / 2 + 1) * lg * lg << endl;\n    }\n    // Il prodotto dei tre fattori torna esatto: complessità O(n * log n * log n)\n    return 0;\n}\n"}],"input":null,"output":"n = 16  count = 225     (n/2+1) * lg * lg = 225\nn = 256 count = 10449   (n/2+1) * lg * lg = 10449\nn = 4096        count = 346281  (n/2+1) * lg * lg = 346281\nn = 65536       count = 9470241 (n/2+1) * lg * lg = 9470241\n"}},{"id":"m06-e07","modulo":6,"tipo":"es","numero":7,"titolo":"Potenza lenta e veloce","difficolta":"medio","testo":"<p>Implementa le due versioni ricorsive della potenza delle slide e conta le moltiplicazioni per 2¹⁰, 2³⁰, 2⁶² (usa <code>long long<\/code>).<\/p>","soluzione":{"commento":"","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 6.7 - Potenza: O(n) contro O(log n) (dalle slide)\n#include <iostream>\nusing namespace std;\n\nint moltiplicazioni;\n\nlong long potenzaLenta(long long x, int n) {        // x * x * ... * x (n volte)\n    if (n == 0) return 1;\n    moltiplicazioni++;\n    return x * potenzaLenta(x, n - 1);\n}\n\nlong long potenzaVeloce(long long x, int n) {       // dimezza l'esponente a ogni chiamata\n    if (n == 0) return 1;\n    long long y = potenzaVeloce(x, n / 2);          // n/2 con divisione intera\n    if (n % 2 == 0) {\n        moltiplicazioni++;\n        return y * y;                               // x^n = (x^(n/2))^2\n    }\n    moltiplicazioni += 2;\n    return x * y * y;                               // n dispari: x^n = x * (x^((n-1)/2))^2\n}\n\nint main() {\n    int esponenti[] = {10, 30, 62};\n    for (int t = 0; t < 3; t++) {\n        int n = esponenti[t];\n        moltiplicazioni = 0;\n        long long a = potenzaLenta(2, n);\n        int ml = moltiplicazioni;\n        moltiplicazioni = 0;\n        long long b = potenzaVeloce(2, n);\n        cout << \"2^\" << n << \" = \" << a << (a == b ? \"\" : \" ERRORE\")\n             << \"\\tlenta: \" << ml << \" molt.\\tveloce: \" << moltiplicazioni << \" molt.\" << endl;\n    }\n    return 0;\n}\n"}],"input":null,"output":"2^10 = 1024     lenta: 10 molt. veloce: 6 molt.\n2^30 = 1073741824       lenta: 30 molt. veloce: 9 molt.\n2^62 = 4611686018427387904      lenta: 62 molt. veloce: 11 molt.\n"}},{"id":"m06-e08","modulo":6,"tipo":"es","numero":8,"titolo":"Numeri primi","difficolta":"medio","testo":"<p>Scrivi due test di primalità: uno che prova tutti i divisori da 2 a n-1 e uno che si ferma quando <code>d * d &gt; n<\/code>. Conta le divisioni sui numeri primi 97, 9973 e 999 983 e spiega perché basta arrivare alla radice quadrata.<\/p>","soluzione":{"commento":"<p>Se n = a · b con a ≤ b, allora a · a ≤ n: il divisore più piccolo, se esiste, è al più la radice di n. Da O(n) a O(√n).<\/p>","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 6.8 - Numeri primi: provare tutti i divisori o solo fino alla radice?\n#include <iostream>\nusing namespace std;\n\nlong long divisioni;\n\nbool primoLento(int n) {                  // prova d = 2, 3, ..., n-1   -> O(n)\n    if (n < 2) return false;\n    for (int d = 2; d < n; d++) {\n        divisioni++;\n        if (n % d == 0) return false;\n    }\n    return true;\n}\n\nbool primoVeloce(int n) {                 // prova solo finché d*d <= n  -> O(radice di n)\n    if (n < 2) return false;\n    for (int d = 2; d * d <= n; d++) {    // se n = a*b, uno dei due è <= radice di n\n        divisioni++;\n        if (n % d == 0) return false;\n    }\n    return true;\n}\n\nint main() {\n    int numeri[] = {97, 9973, 999983};    // tutti primi: il caso PEGGIORE\n    for (int t = 0; t < 3; t++) {\n        int n = numeri[t];\n        divisioni = 0; bool a = primoLento(n);  long long dl = divisioni;\n        divisioni = 0; bool b = primoVeloce(n); long long dv = divisioni;\n        cout << n << (a && b ? \" primo\" : \" non primo\") << \"\\tlento: \" << dl\n             << \"\\tveloce: \" << dv << endl;\n    }\n    int quanti = 0;\n    for (int n = 2; n <= 100000; n++) if (primoVeloce(n)) quanti++;\n    cout << \"Primi fino a 100000: \" << quanti << endl;\n    return 0;\n}\n"}],"input":null,"output":"97 primo        lento: 95       veloce: 8\n9973 primo      lento: 9971     veloce: 98\n999983 primo    lento: 999981   veloce: 998\nPrimi fino a 100000: 9592\n"}},{"id":"m06-e09","modulo":6,"tipo":"es","numero":9,"titolo":"Lineare contro binaria","difficolta":"difficile","testo":"<p>Su array ordinati di 10³, 10⁵ e 10⁶ elementi (allocati con <code>new<\/code>), conta i confronti della ricerca lineare e della ricerca binaria cercando un valore assente.<\/p>","soluzione":{"commento":"<p>Un milione di confronti contro 19.<\/p>","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 6.9 - Ricerca lineare contro ricerca binaria (anteprim
