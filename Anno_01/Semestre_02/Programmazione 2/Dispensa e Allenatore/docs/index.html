 endl; }\n\nint main() {\n    Persona p(\"Paolo\");\n    Studente s(\"Sara\");\n    cammina(p);      // OK\n    cammina(s);      // OK: uno studente E' una persona (dove serve una Persona, va bene uno Studente)\n    studia(s);       // OK\n    // studia(p);    // ERRORE: una persona qualunque NON è uno studente\n    Persona* elenco[2] = {&p, &s};   // array di Persona* che contiene anche uno Studente\n    for (int i = 0; i < 2; i++) cammina(*elenco[i]);\n    return 0;\n}\n"}],"input":null,"output":"Paolo cammina\nSara cammina\nSara ha 1 esami\nPaolo cammina\nSara cammina\n"}},{"id":"m09-e05","modulo":9,"tipo":"es","numero":5,"titolo":"La gerarchia Shape delle slide","difficolta":"medio","testo":"<p>Implementa la gerarchia UML delle slide: <code>Shape<\/code> astratta (colore, <code>getArea()<\/code> virtuale puro, <code>print()<\/code>), <code>Rectangle<\/code> (con <code>isASquare<\/code>), <code>Circle<\/code> (con <code>getCircumference<\/code>) e <code>Triangle<\/code>. Nel <code>main<\/code> leggi da tastiera il numero di figure e i loro dati, crea un array dinamico di <code>Shape*<\/code>, stampalo e calcola l'area media.<\/p>","soluzione":{"commento":"<p><code>Color(c)<\/code> converte l'intero letto in un valore dell'<code>enum<\/code>. L'array di puntatori è dinamico perché la sua dimensione si conosce solo leggendo l'input: si libera prima ogni figura, poi l'array.<\/p>","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 9.5 - La gerarchia Shape delle slide (UML): area media delle figure\n#include <iostream>\n#include <string>\nusing namespace std;\n\nenum Color { ROSSO, VERDE, BLU };\nstring nomeColore(Color c) {\n    string n[] = {\"rosso\", \"verde\", \"blu\"};\n    return n[c];\n}\n\nclass Shape {                                   // astratta\nprotected:\n    Color color;\npublic:\n    Shape(Color c = ROSSO) : color(c) {}\n    virtual ~Shape() {}\n    Color getColor() const { return color; }\n    void setColor(Color c) { color = c; }\n    virtual double getArea() const = 0;\n    virtual void print() const { cout << \" \" << nomeColore(color) << \", area \" << getArea() << endl; }\n};\n\nclass Rectangle : public Shape {\n    double height, width;\npublic:\n    Rectangle(double h, double w, Color c = ROSSO) : Shape(c), height(h), width(w) {}\n    double getArea() const override { return height * width; }\n    bool isASquare() const { return height == width; }\n    void print() const override { cout << \"Rettangolo \" << height << \"x\" << width; Shape::print(); }\n};\n\nclass Circle : public Shape {\n    double radius, xc, yc;\npublic:\n    Circle(double r, double x = 0, double y = 0, Color c = ROSSO) : Shape(c), radius(r), xc(x), yc(y) {}\n    double getArea() const override { return 3.14159 * radius * radius; }\n    double getCircumference() const { return 2 * 3.14159 * radius; }\n    bool isGoniometric() const { return radius == 1 && xc == 0 && yc == 0; }   // cerchio unitario centrato\n    void print() const override { cout << \"Cerchio r=\" << radius; Shape::print(); }\n};\n\nclass Triangle : public Shape {\n    double base, height;\npublic:\n    Triangle(double b, double h, Color c = ROSSO) : Shape(c), base(b), height(h) {}\n    double getArea() const override { return base * height / 2; }\n    void print() const override { cout << \"Triangolo \" << base << \"x\" << height; Shape::print(); }\n};\n\nint main() {\n    // Input: numero di figure, poi per ognuna \"tipo dati colore\"\n    int n;\n    cin >> n;\n    Shape** figure = new Shape*[n];            // array DINAMICO di puntatori\n    for (int i = 0; i < n; i++) {\n        char tipo; double a, b; int c;\n        cin >> tipo;\n        if (tipo == 'C') { cin >> a >> c; figure[i] = new Circle(a, 0, 0, Color(c)); }\n        else if (tipo == 'R') { cin >> a >> b >> c; figure[i] = new Rectangle(a, b, Color(c)); }\n        else { cin >> a >> b >> c; figure[i] = new Triangle(a, b, Color(c)); }\n    }\n    double somma = 0;\n    for (int i = 0; i < n; i++) {\n        figure[i]->print();\n        somma += figure[i]->getArea();\n    }\n    cout << \"Area media: \" << somma / n << endl;\n    for (int i = 0; i < n; i++) delete figure[i];\n    delete[] figure;\n    return 0;\n}\n"}],"input":"4\nR 3 4 0\nC 1 2\nT 6 2 1\nR 5 5 1\n","output":"Rettangolo 3x4 rosso, area 12\nCerchio r=1 blu, area 3.14159\nTriangolo 6x2 verde, area 6\nRettangolo 5x5 verde, area 25\nArea media: 11.5354\n"}},{"id":"m09-e06","modulo":9,"tipo":"es","numero":6,"titolo":"Il distruttore virtuale","difficolta":"medio","testo":"<p>Due coppie base/derivata in cui la derivata alloca un array nel costruttore e lo libera nel distruttore. In una coppia il distruttore della base è virtuale, nell'altra no. Distruggi un oggetto derivato tramite un puntatore alla base e confronta i messaggi.<\/p>","soluzione":{"commento":"<p>Senza <code>virtual<\/code> il distruttore della derivata non parte e il suo buffer non viene liberato.<\/p>","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 9.6 - Perché il distruttore della base deve essere virtual\n#include <iostream>\nusing namespace std;\n\nclass BaseSbagliata {\npublic:\n    ~BaseSbagliata() { cout << \"  ~BaseSbagliata\" << endl; }      // NON virtual\n};\nclass DerivataSbagliata : public BaseSbagliata {\n    int* buffer;\npublic:\n    DerivataSbagliata() : buffer(new int[1000]) {}\n    ~DerivataSbagliata() { cout << \"  ~DerivataSbagliata (libero il buffer)\" << endl; delete[] buffer; }\n};\n\nclass BaseGiusta {\npublic:\n    virtual ~BaseGiusta() { cout << \"  ~BaseGiusta\" << endl; }    // virtual\n};\nclass DerivataGiusta : public BaseGiusta {\n    int* buffer;\npublic:\n    DerivataGiusta() : buffer(new int[1000]) {}\n    ~DerivataGiusta() override { cout << \"  ~DerivataGiusta (libero il buffer)\" << endl; delete[] buffer; }\n};\n\nint main() {\n    cout << \"delete tramite puntatore alla base, distruttore NON virtual:\" << endl;\n    BaseSbagliata* p = new DerivataSbagliata();\n    delete p;            // comportamento indefinito: di solito parte solo ~BaseSbagliata -> leak\n    cout << \"delete tramite puntatore alla base, distruttore virtual:\" << endl;\n    BaseGiusta* q = new DerivataGiusta();\n    delete q;            // partono entrambi, prima la derivata\n    return 0;\n}\n"}],"input":null,"output":"delete tramite puntatore alla base, distruttore NON virtual:\n  ~BaseSbagliata\ndelete tramite puntatore alla base, distruttore virtual:\n  ~DerivataGiusta (libero il buffer)\n  ~BaseGiusta\n"}},{"id":"m09-e07","modulo":9,"tipo":"es","numero":7,"titolo":"Parcheggio con RTTI","difficolta":"medio","testo":"<p>Classe astratta <code>Veicolo<\/code> con <code>ruote()<\/code> virtuale puro; <code>Auto<\/code> (4), <code>Moto<\/code> (2) e <code>Camion<\/code> (4 per asse, con numero di assi). Con <code>srand(111222333)<\/code> riempi un parcheggio di 12 veicoli casuali; conta auto e moto con <code>typeid<\/code>, i camion e i loro assi con <code>dynamic_cast<\/code>, e somma le ruote con il polimorfismo.<\/p>","soluzione":{"commento":"<p><code>typeid(...).name()<\/code> restituisce <code>4Auto<\/code> con g++: un nome interno del compilatore, utile solo per il debug.<\/p>","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 9.7 - RTTI: typeid e dynamic_cast su un array misto\n#include <iostream>\n#include <typeinfo>\n#include <cstdlib>\nusing namespace std;\n\nclass Veicolo {\npublic:\n    virtual ~Veicolo() {}\n    virtual int ruote() const = 0;\n};\nclass Auto : public Veicolo { public: int ruote() const override { return 4; } };\nclass Moto : public Veicolo { public: int ruote() const override { return 2; } };\nclass Camion : public Veicolo {\n    int assi;\npublic:\n    Camion(int a) : assi(a) {}\n    int ruote() const override { return assi * 4; }\n    int getAssi() const { return assi; }\n};\n\nint main() {\n    srand(111222333);\n    const int N = 12;\n    Veicolo* parcheggio[N];\n    for (int i = 0; i < N; i++) {\n        int t = rand() % 3;\n        if (t == 0) parcheggio[i] = new Auto();\n        else if (t == 1) parcheggio[i] = new Moto();\n        else parcheggio[i] = new Camion(2 + rand() % 3);\n    }\n    int nAuto = 0, nMoto = 0, nCamion = 0, ruoteTotali = 0, assiTotali = 0;\n    for (int i = 0; i < N; i++) {\n        ruoteTotali += parcheggio[i]->ruote();                    // polimorfismo: non serve sapere il tipo\n        if (typeid(*parcheggio[i]) == typeid(Auto)) nAuto++;       // typeid: il tipo VERO dell'oggetto\n        else if (typeid(*parcheggio[i]) == typeid(Moto)) nMoto++;\n        Camion* c = dynamic_cast<Camion*>(parcheggio[i]);          // dynamic_cast: è un Camion?\n        if (c != nullptr) { nCamion++; assiTotali += c->getAssi(); }   // solo Camion ha getAssi()\n    }\n    cout << \"auto \" << nAuto << \", moto \" << nMoto << \", camion \" << nCamion << endl;\n    cout << \"ruote totali \" << ruoteTotali << \", assi dei camion \" << assiTotali << endl;\n    cout << \"nome del tipo secondo il compilatore: \" << typeid(*parcheggio[0]).name() << endl;\n    for (int i = 0; i < N; i++) delete parcheggio[i];\n    return 0;\n}\n"}],"input":null,"output":"auto 6, moto 4, camion 2\nruote totali 56, assi dei camion 6\nnome del tipo secondo il compilatore: 4Auto\n"}},{"id":"m09-e08","modulo":9,"tipo":"es","numero":8,"titolo":"Eccezioni bancarie","difficolta":"medio","testo":"<p>Crea <code>ErroreBanca : public exception<\/code> e due sue derivate, <code>SaldoInsufficiente<\/code> (con un messaggio che dice quanto manca) e <code>ContoBloccato<\/code>. Scrivi una funzione di prelievo che le lancia e gestiscile con tre <code>catch<\/code> nell'ordine giusto.<\/p>","soluzione":{"commento":"<p><code>to_string<\/code> converte il numero in testo; <code>c_str()<\/code> restituisce la stringa nel formato <code>const char*<\/code> che <code>what()<\/code> richiede. Il messaggio è salvato in un attributo, così resta valido anche dopo la fine del costruttore.<\/p>","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 9.8 - Gerarchia di eccezioni e ordine dei catch (dalle slide)\n#include <iostream>\n#include <exception>\n#include <string>\nusing namespace std;\n\nclass ErroreBanca : public exception {               // eccezione \"madre\" del programma\npublic:\n    const char* what() const noexcept override { return \"errore bancario generico\"; }\n};\nclass SaldoInsufficiente : public ErroreBanca {       // eccezione più specifica\n    string msg;\npublic:\n    SaldoInsufficiente(double mancano) : msg(\"saldo insufficiente, mancano \" + to_string((int)mancano) + \" euro\") {}\n    const char* what() const noexcept override { return msg.c_str(); }\n};\nclass ContoBloccato : public ErroreBanca {\npublic:\n    const char* what() const noexcept override { return \"conto bloccato\"; }\n};\n\nvoid preleva(double saldo, double importo, bool bloccato) {\n    if (bloccato) throw ContoBloccato();\n    if (importo > saldo) throw SaldoInsufficiente(importo - saldo);\n    cout << \"prelievo di \" << importo << \" eseguito\" << endl;\n}\n\nint main() {\n    double prove[3][3] = {{100, 50, 0}, {100, 250, 0}, {100, 10, 1}};\n    for (int k = 0; k < 3; k++) {\n        try {\n            preleva(prove[k][0], prove[k][1], prove[k][2] != 0);\n        } catch (const SaldoInsufficiente& e) {       // le PIU' SPECIFICHE per prime\n            cout << \"[SaldoInsufficiente] \" << e.what() << endl;\n        } catch (const ErroreBanca& e) {              // poi quelle più generali\n            cout << \"[ErroreBanca] \" << e.what() << endl;\n        } catch (const exception& e) {                // infine la madre di tutte\n            cout << \"[exception] \" << e.what() << endl;\n        }\n    }\n    // Se catch(const ErroreBanca&) fosse PRIMO, catturerebbe anche SaldoInsufficiente\n    // e il catch specifico non verrebbe mai raggiunto (il compilatore avvisa).\n    return 0;\n}\n"}],"input":null,"output":"prelievo di 50 eseguito\n[SaldoInsufficiente] saldo insufficiente, mancano 150 euro\n[ErroreBanca] conto bloccato\n"}},{"id":"m09-e09","modulo":9,"tipo":"es","numero":9,"titolo":"Dipendenti","difficolta":"difficile","testo":"<p>Classe astratta <code>Dipendente<\/code> (<code>stipendio()<\/code> e <code>ruolo()<\/code> virtuali puri), con <code>Impiegato<\/code> (stipendio fisso), <code>Manager<\/code> derivato da <code>Impiegato<\/code> (fisso più bonus, riusando <code>Impiegato::stipendio()<\/code>) e <code>Operaio<\/code> (ore per paga oraria). Ordina un array di <code>Dipendente*<\/code> per stipendio decrescente e calcola il monte stipendi.<\/p>","soluzione":{"commento":"<p>Si ordinano i <i>puntatori<\/i>: gli oggetti restano dove sono nello heap, cambia solo l'ordine delle frecce.<\/p>","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 9.9 - Dipendenti: stipendio polimorfico e ordinamento di puntatori\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Dipendente {\nprotected:\n    string nome;\npublic:\n    Dipendente(string n) : nome(n) {}\n    virtual ~Dipendente() {}\n    virtual double stipendio() const = 0;\n    virtual string ruolo() const = 0;\n    void stampa() const { cout << nome << \" (\" << ruolo() << \"): \" << stipendio() << \" euro\" << endl; }\n};\n\nclass Impiegato : public Dipendente {\nprotected:\n    double fisso;\npublic:\n    Impiegato(string n, double f) : Dipendente(n), fisso(f) {}\n    double stipendio() const override { return fisso; }\n    string ruolo() const override { return \"impiegato\"; }\n};\n\nclass Manager : public Impiegato {                // 3 livelli: Manager -> Impiegato -> Dipendente\n    double bonus;\npublic:\n    Manager(string n, double f, double b) : Impiegato(n, f), bonus(b) {}\n    double stipendio() const override { return Impiegato::stipendio() + bonus; }   // riuso la base\n    string ruolo() const override { return \"manager\"; }\n};\n\nclass Operaio : public Dipendente {\n    int ore;\n    double pagaOraria;\npublic:\n    Operaio(string n, int o, double p) : Dipendente(n), ore(o), pagaOraria(p) {}\n    double stipendio() const override { return ore * pagaOraria; }\n    string ruolo() const override { return \"operaio\"; }\n};\n\n// Ordino i PUNTATORI (non gli oggetti) per stipendio decrescente: insertion sort\nvoid ordina(Dipendente* v[], int n) {\n    for (int i = 1; i < n; i++) {\n        Dipendente* x = v[i];\n        int j = i - 1;\n        while (j >= 0 && v[j]->stipendio() < x->stipendio()) { v[j + 1] = v[j]; j--; }\n        v[j + 1] = x;\n    }\n}\n\nint main() {\n    Dipendente* staff[5] = {\n        new Impiegato(\"Anna\", 1600), new Operaio(\"Bruno\", 160, 11.5),\n        new Manager(\"Carla\", 2500, 900), new Operaio(\"Dario\", 120, 13),\n        new Impiegato(\"Elisa\", 1750)\n    };\n    ordina(staff, 5);\n    double totale = 0;\n    for (int i = 0; i < 5; i++) { staff[i]->stampa(); totale += staff[i]->stipendio(); }\n    cout << \"Monte stipendi: \" << totale << \" euro\" << endl;\n    for (int i = 0; i < 5; i++) delete staff[i];\n    return 0;\n}\n"}],"input":null,"output":"Carla (manager): 3400 euro\nBruno (operaio): 1840 euro\nElisa (impiegato): 1750 euro\nAnna (impiegato): 1600 euro\nDario (operaio): 1560 euro\nMonte stipendi: 10150 euro\n"}},{"id":"m09-e10","modulo":9,"tipo":"es","numero":10,"titolo":"Il diamante","difficolta":"difficile","testo":"<p>Riproduci il problema del diamante delle slide (<code>A<\/code>, <code>B<\/code> e <code>C<\/code> derivate da <code>A<\/code>, <code>D<\/code> da <code>B<\/code> e <code>C<\/code>) con un costruttore di <code>A<\/code> che stampa un messaggio: quante volte viene costruito <code>A<\/code>? Risolvi con l'ereditarietà virtuale. Infine scrivi un uso “sano” dell'ereditarietà multipla (<code>Anatra<\/code> che deriva da <code>Volante<\/code> e <code>Nuotante<\/code>).<\/p>","soluzione":{"commento":"<p>Senza <code>virtual<\/code> il costruttore di <code>A<\/code> parte due volte: in <code>D<\/code> ci sono due <code>A<\/code>. Con l'ereditarietà virtuale una volta sola.<\/p>","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 9.10 - Ereditarietà multipla e problema del diamante (dalle slide)\n#include <iostream>\nusing namespace std;\n\n// --- Senza virtual: D contiene DUE copie di A ---\nclass A { public: int x = 5; A() { cout << \"  costruisco A\" << endl; } };\nclass B : public A {};\nclass C : public A {};\nclass D : public B, public C {};\n\n// --- Con ereditarietà virtual: UNA sola copia di A ---\nclass A2 { public: int x = 5; A2() { cout << \"  costruisco A2\" << endl; } };\nclass B2 : public virtual A2 {};\nclass C2 : public virtual A2 {};\nclass D2 : public B2, public C2 {};\n\n// --- Uso tipico e innocuo: due capacità indipendenti ---\nclass Volante { public: void vola() const { cout << \"  volo\" << endl; } };\nclass Nuotante { public: void nuota() const { cout << \"  nuoto\" << endl; } };\nclass Anatra : public Volante, public Nuotante {};\n\nint main() {\n    cout << \"D senza virtual:\" << endl;\n    D d;\n    // cout << d.x;                       // ERRORE: 'x' è ambiguo (quella di B o quella di C?)\n    d.B::x = 1; d.C::x = 2;               // due copie distinte\n    cout << \"  B::x = \" << d.B::x << \", C::x = \" << d.C::x << endl;\n\n    cout << \"D2 con ereditarieta' virtual:\" << endl;\n    D2 d2;\n    cout << \"  d2.x = \" << d2.x << \" (richiesta non piu' ambigua)\" << endl;\n\n    cout << \"Anatra:\" << endl;\n    Anatra a;\n    a.vola();\n    a.nuota();\n    return 0;\n}\n"}],"input":null,"output":"D senza virtual:\n  costruisco A\n  costruisco A\n  B::x = 1, C::x = 2\nD2 con ereditarieta' virtual:\n  costruisco A2\n  d2.x = 5 (richiesta non piu' ambigua)\nAnatra:\n  volo\n  nuoto\n"}},{"id":"m10-pattern","modulo":10,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 10 (Sovraccaricamento degli Operatori).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 10 - Pattern: la classe Frazione con tutti gli operatori principali\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\nclass Frazione {\nprivate:\n    int num, den;                               // den > 0, sempre ridotta\n    static int mcd(int a, int b) {\n        if (a < 0) a = -a;\n        while (b != 0) { int r = a % b; a = b; b = r; }\n        return a;\n    }\n    void semplifica() {\n        if (den < 0) { num = -num; den = -den; }\n        int m = mcd(num, den);\n        if (m > 1) { num /= m; den /= m; }\n    }\n\npublic:\n    Frazione(int n = 0, int d = 1) : num(n), den(d) {\n        if (den == 0) throw invalid_argument(\"denominatore nullo\");\n        semplifica();\n    }\n\n    // --- OPERATORI MEMBRO: l'operando di SINISTRA è *this ---\n    Frazione& operator+=(const Frazione& b) {          // modifica me stesso, restituisce me stesso\n        num = num * b.den + b.num * den;\n        den = den * b.den;\n        semplifica();\n        return *this;\n    }\n    Frazione operator-() const { return Frazione(-num, den); }   // meno unario: -f\n    Frazione& operator++() { num += den; return *this; }          // ++f (prefisso): +1, poi restituisce\n    Frazione operator++(int) {                                     // f++ (postfisso): il parametro int\n        Frazione vecchia = *this;                                  // è solo un segnaposto\n        num += den;\n        return vecchia;                                            // restituisce il valore PRIMA\n    }\n\n    // --- OPERATORI ESTERNI dichiarati friend: possono leggere num e den ---\n    friend Frazione operator+(const Frazione& a, const Frazione& b);\n    friend Frazione operator*(const Frazione& a, const Frazione& b);\n    friend bool operator==(const Frazione& a, const Frazione& b);\n    friend bool operator<(const Frazione& a, const Frazione& b);\n    friend ostream& operator<<(ostream& os, const Frazione& f);\n    friend istream& operator>>(istream& is, Frazione& f);\n};\n\nFrazione operator+(const Frazione& a, const Frazione& b) {\n    Frazione r = a;          // copia di a...\n    r += b;                  // ...riuso += (il codice della somma sta in un solo posto)\n    return r;                // restituisco un oggetto NUOVO, per valore\n}\nFrazione operator*(const Frazione& a, const Frazione& b) {\n    return Frazione(a.num * b.num, a.den * b.den);\n}\nbool operator==(const Frazione& a, const Frazione& b) {\n    return a.num == b.num && a.den == b.den;     // sono sempre ridotte: basta confrontare\n}\nbool operator!=(const Frazione& a, const Frazione& b) { return !(a == b); }   // riuso ==\nbool operator<(const Frazione& a, const Frazione& b) {\n    return a.num * b.den < b.num * a.den;        // a/b < c/d  <=>  a*d < c*b  (den positivi)\n}\nostream& operator<<(ostream& os, const Frazione& f) {\n    os << f.num;\n    if (f.den != 1) os << \"/\" << f.den;\n    return os;                                   // restituisco lo stream: cout << a << b\n}\nistream& operator>>(istream& is, Frazione& f) {  // legge \"n/d\"\n    int n, d;\n    char barra;\n    if (is >> n >> barra >> d && barra == '/' && d != 0) f = Frazione(n, d);\n    else is.setstate(ios::failbit);              // segnalo l'errore come fa cin\n    return is;\n}\n\nint main() {\n    Frazione a(1, 2), b(3, 4), c(2, 4);\n    cout << \"a = \" << a << \", b = \" << b << \", c = \" << c << endl;\n    cout << \"a + b = \" << a + b << endl;\n    cout << \"a * b = \" << a * b << endl;\n    cout << \"-b = \" << -b << endl;\n    cout << \"a == c ? \" << (a == c ? \"si\" : \"no\") << \",  a != b ? \" << (a != b ? \"si\" : \"no\") << endl;\n    cout << \"a < b ? \" << (a < b ? \"si\" : \"no\") << endl;\n    a += Frazione(1, 3);\n    cout << \"dopo a += 1/3: a = \" << a << endl;\n    Frazione x = a++;\n    cout << \"x = a++  ->  x = \" << x << \", a = \" << a << endl;\n    Frazione y = ++a;\n    cout << \"y = ++a  ->  y = \" << y << \", a = \" << a << endl;\n    cout << \"a + 1 = \" << a + 1 << \"   (1 diventa Frazione(1) da solo)\" << endl;\n\n    Frazione letta;\n    while (cin >> letta) cout << \"letta: \" << letta << endl;\n    return 0;\n}\n"}],"input":"3/4\n-2/6\n5/0\n","output":"a = 1/2, b = 3/4, c = 1/2\na + b = 5/4\na * b = 3/8\n-b = -3/4\na == c ? si,  a != b ? si\na < b ? si\ndopo a += 1/3: a = 5/6\nx = a++  ->  x = 5/6, a = 11/6\ny = ++a  ->  y = 17/6, a = 17/6\na + 1 = 23/6   (1 diventa Frazione(1) da solo)\nletta: 3/4\nletta: -1/3\n"}},{"id":"m10-lab","modulo":10,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>La classe Vettore<\/b><\/p><p>Implementare una classe <code>Vettore<\/code> che gestisce un array dinamico di interi di dimensione fissata alla costruzione e che si usa con la stessa naturalezza di un array (come la classe <code>Array<\/code> delle slide), arricchita da operatori per confronto, somma, stampa e lettura.<\/p><p><b>Step 1 – stampa<\/b><br>Scrivi la classe (array dinamico <code>int* dati<\/code> e dimensione <code>n<\/code>, costruttore <code>explicit<\/code> che azzera gli elementi, distruttore) e <code>operator&lt;&lt;<\/code> che stampa <code>[ 0 0 0 0 ]<\/code>.<br><b>Concetto nuovo:<\/b> <code>friend ostream&amp; operator&lt;&lt;<\/code>.<\/p><p><b>Step 2 – indicizzazione<\/b><br>Scrivi <code>operator[]<\/code> in due versioni (<code>int&amp;<\/code> e <code>const<\/code>), entrambe con controllo dell'indice che lancia <code>out_of_range<\/code>. Riempi il vettore con <code>a[i] = ...<\/code> e leggi un elemento da una copia <code>const<\/code>.<br><b>Concetto nuovo:<\/b> <code>operator[]<\/code>, versione <code>const<\/code>.<\/p><p><b>Step 3 – confronto<\/b><br>Scrivi <code>operator==<\/code> (stessa dimensione e stessi elementi, come nelle slide) e <code>operator!=<\/code> che riusa <code>==<\/code>.<br><b>Concetto nuovo:<\/b> operatori di confronto.<\/p><p><b>Step 4 – somma<\/b><br>Scrivi <code>operator+=<\/code> come metodo (somma elemento per elemento, lancia <code>invalid_argument<\/code> se le dimensioni differiscono) e <code>operator+<\/code> esterno che lo riusa.<br><b>Concetto nuovo:<\/b> <code>+=<\/code> restituisce <code>*this<\/code>, <code>+<\/code> un oggetto nuovo.<\/p><p><b>Step 5 – copia e assegnamento<\/b><br>Completa la Regola dei Tre (costruttore di copia e <code>operator=<\/code>) e verifica che una copia modificata non cambi l'originale.<br><b>Concetto nuovo:<\/b> <code>operator=<\/code> come operatore a tutti gli effetti.<\/p><p><b>Step 6 – lettura e concatenazione<\/b><br>Scrivi <code>operator&gt;&gt;<\/code> che legge la dimensione e poi gli elementi (modificando il vettore solo se la lettura riesce) e un operatore | che restituisce la concatenazione di due vettori.<br><b>Concetto nuovo:<\/b> <code>operator&gt;&gt;<\/code>, <code>setstate(ios::failbit)<\/code>.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 10 - Laboratorio a step: la classe Vettore (come la classe Array delle slide)\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\nclass Vettore {\nprivate:\n    int* dati;\n    int n;\n\npublic:\n    explicit Vettore(int dim = 0) : dati(dim > 0 ? new int[dim] : nullptr), n(dim > 0 ? dim : 0) {\n        for (int i = 0; i < n; i++) dati[i] = 0;\n    }\n\n    // ===== STEP 5 =====  Regola dei Tre (operator= è anch'esso un operatore!)\n    Vettore(const Vettore& v) : dati(v.n > 0 ? new int[v.n] : nullptr), n(v.n) {\n        for (int i = 0; i < n; i++) dati[i] = v.dati[i];\n    }\n    Vettore& operator=(const Vettore& v) {\n        if (this != &v) {\n            int* nuovo = (v.n > 0) ? new int[v.n] : nullptr;\n            for (int i = 0; i < v.n; i++) nuovo[i] = v.dati[i];\n            delete[] dati;\n            dati = nuovo;\n            n = v.n;\n        }\n        return *this;\n    }\n    ~Vettore() { delete[] dati; }\n\n    int size() const { return n; }\n\n    // ===== STEP 2 =====  operator[]: due versioni\n    int& operator[](int i) {                       // per SCRIVERE: v[3] = 7 (restituisce un riferimento)\n        if (i < 0 || i >= n) throw out_of_range(\"indice fuori dal vettore\");\n        return dati[i];\n    }\n    int operator[](int i) const {                  // per LEGGERE da un Vettore const\n        if (i < 0 || i >= n) throw out_of_range(\"indice fuori dal vettore\");\n        return dati[i];\n    }\n\n    // ===== STEP 4 =====  += come membro (modifica me), + come esterno (crea un nuovo vettore)\n    Vettore& operator+=(const Vettore& v) {        // somma elemento per elemento\n        if (n != v.n) throw invalid_argument(\"dimensioni diverse\");\n        for (int i = 0; i < n; i++) dati[i] += v.dati[i];\n        return *this;\n    }\n\n    // ===== STEP 6 =====  Concatenazione con l'operatore |  (un uso \"creativo\" ma lecito)\n    Vettore operator|(const Vettore& v) const {\n        Vettore r(n + v.n);\n        for (int i = 0; i < n; i++) r.dati[i] = dati[i];\n        for (int i = 0; i < v.n; i++) r.dati[n + i] = v.dati[i];\n        return r;\n    }\n\n    friend ostream& operator<<(ostream& os, const Vettore& v);   // ===== STEP 1 =====\n    friend istream& operator>>(istream& is, Vettore& v);         // ===== STEP 6 =====\n    friend bool operator==(const Vettore& a, const Vettore& b);  // ===== STEP 3 =====\n};\n\n// ===== STEP 1 =====  Stampa: [ 1 2 3 ]\nostream& operator<<(ostream& os, const Vettore& v) {\n    os << \"[ \";\n    for (int i = 0; i < v.n; i++) os << v.dati[i] << \" \";\n    return os << \"]\";\n}\n\n// ===== STEP 3 =====  Uguaglianza (come nelle slide) e disuguaglianza\nbool operator==(const Vettore& a, const Vettore& b) {\n    if (a.n != b.n) return false;\n    for (int i = 0; i < a.n; i++)\n        if (a.dati[i] != b.dati[i]) return false;\n    return true;\n}\nbool operator!=(const Vettore& a, const Vettore& b) { return !(a == b); }\n\n// ===== STEP 4 =====\nVettore operator+(const Vettore& a, const Vettore& b) {\n    Vettore r = a;\n    r += b;\n    return r;\n}\n\n// ===== STEP 6 =====  Lettura: prima la dimensione, poi gli elementi\nistream& operator>>(istream& is, Vettore& v) {\n    int dim;\n    if (!(is >> dim) || dim < 0) { is.setstate(ios::failbit); return is; }\n    Vettore tmp(dim);\n    for (int i = 0; i < dim; i++) is >> tmp.dati[i];\n    if (is) v = tmp;                               // solo se tutto è andato bene\n    return is;\n}\n\nint main() {\n    Vettore a(4);\n    cout << \"STEP 1: a = \" << a << endl;\n\n    for (int i = 0; i < a.size(); i++) a[i] = (i + 1) * 10;     // STEP 2: [] in scrittura\n    const Vettore copiaCostante = a;\n    cout << \"STEP 2: a = \" << a << \", copiaCostante[2] = \" << copiaCostante[2] << endl;\n    try {\n        a[10] = 5;\n    } catch (const out_of_range& e) {\n        cout << \"        errore: \" << e.what() << endl;\n    }\n\n    Vettore b = a;                                              // STEP 3\n    cout << \"STEP 3: a == b ? \" << (a == b ? \"si\" : \"no\");\n    b[0] = 99;\n    cout << \", dopo b[0] = 99: a == b ? \" << (a == b ? \"si\" : \"no\") << endl;\n\n    cout << \"STEP 4: a + b = \" << a + b << endl;                // STEP 4\n    a += a;\n    cout << \"        dopo a += a: a = \" << a << endl;\n\n    Vettore c;                                                  // STEP 5\n    c = a;\n    c[1] = -1;\n    cout << \"STEP 5: c = \" << c << \", a = \" << a << \" (indipendenti)\" << endl;\n\n    Vettore letto;                                              // STEP 6\n    cin >> letto;\n    cout << \"STEP 6: letto = \" << letto << \", letto | b = \" << (letto | b) << endl;\n    return 0;\n}\n"}],"input":"3 7 8 9\n","output":"STEP 1: a = [ 0 0 0 0 ]\nSTEP 2: a = [ 10 20 30 40 ], copiaCostante[2] = 30\n        errore: indice fuori dal vettore\nSTEP 3: a == b ? si, dopo b[0] = 99: a == b ? no\nSTEP 4: a + b = [ 109 40 60 80 ]\n        dopo a += a: a = [ 20 40 60 80 ]\nSTEP 5: c = [ 20 -1 60 80 ], a = [ 20 40 60 80 ] (indipendenti)\nSTEP 6: letto = [ 7 8 9 ], letto | b = [ 7 8 9 99 20 30 40 ]\n"}},{"id":"m10-e01","modulo":10,"tipo":"es","numero":1,"titolo":"Punto confrontabile","difficolta":"facile","testo":"<p>Classe <code>Punto<\/code> con <code>==<\/code> e <code>!=<\/code> come metodi (<code>!=<\/code> che riusa <code>==<\/code>) e <code>&lt;&lt;<\/code> come <code>friend<\/code> nel formato <code>(x, y)<\/code>. Verifica che più <code>&lt;&lt;<\/code> si possano concatenare.<\/p>","soluzione":{"commento":"","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 10.1 - Punto con ==, != e <<\n#include <iostream>\nusing namespace std;\n\nclass Punto {\n    int x, y;\npublic:\n    Punto(int x = 0, int y = 0) : x(x), y(y) {}\n    // == come METODO: l'operando di sinistra è *this, quello di destra è il parametro\n    bool operator==(const Punto& p) const { return x == p.x && y == p.y; }\n    bool operator!=(const Punto& p) const { return !(*this == p); }       // riuso ==\n    // << deve essere ESTERNO (a sinistra c'è cout, non un Punto): friend per leggere x e y\n    friend ostream& operator<<(ostream& os, const Punto& p) {\n        return os << \"(\" << p.x << \", \" << p.y << \")\";\n    }\n};\n\nint main() {\n    Punto a(1, 2), b(1, 2), c(3, 4);\n    cout << a << \" == \" << b << \" ? \" << (a == b ? \"si\" : \"no\") << endl;\n    cout << a << \" != \" << c << \" ? \" << (a != c ? \"si\" : \"no\") << endl;\n    cout << \"concatenato: \" << a << \" \" << b << \" \" << c << endl;\n    return 0;\n}\n"}],"input":null,"output":"(1, 2) == (1, 2) ? si\n(1, 2) != (3, 4) ? si\nconcatenato: (1, 2) (1, 2) (3, 4)\n"}},{"id":"m10-e02","modulo":10,"tipo":"es","numero":2,"titolo":"Durate","difficolta":"facile","testo":"<p>Classe <code>Durata<\/code> che memorizza i secondi totali, con costruttore da ore, minuti e secondi, <code>+<\/code> come metodo <code>const<\/code> e <code>&lt;&lt;<\/code> nel formato <code>hh:mm:ss<\/code> con gli zeri iniziali. Somma tre durate in una sola espressione.<\/p>","soluzione":{"commento":"<p>Memorizzare un solo numero (i secondi totali) rende la somma banale; la conversione in ore, minuti e secondi si fa solo nella stampa.<\/p>","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 10.2 - Durata con + e << nel formato hh:mm:ss\n#include <iostream>\nusing namespace std;\n\nclass Durata {\n    int secondiTotali;\npublic:\n    Durata(int h = 0, int m = 0, int s = 0) : secondiTotali(h * 3600 + m * 60 + s) {}\n    Durata operator+(const Durata& d) const {         // + come metodo const: non modifica *this\n        Durata r;\n        r.secondiTotali = secondiTotali + d.secondiTotali;\n        return r;\n    }\n    friend ostream& operator<<(ostream& os, const Durata& d) {\n        int h = d.secondiTotali / 3600, m = d.secondiTotali % 3600 / 60, s = d.secondiTotali % 60;\n        if (h < 10) os << \"0\";\n        os << h << \":\";\n        if (m < 10) os << \"0\";\n        os << m << \":\";\n        if (s < 10) os << \"0\";\n        return os << s;\n    }\n};\n\nint main() {\n    Durata brano1(0, 3, 45), brano2(0, 4, 30), film(1, 52, 0);\n    cout << brano1 << \" + \" << brano2 << \" = \" << brano1 + brano2 << endl;\n    cout << \"tutto insieme: \" << brano1 + brano2 + film << endl;   // (brano1 + brano2) + film\n    return 0;\n}\n"}],"input":null,"output":"00:03:45 + 00:04:30 = 00:08:15\ntutto insieme: 02:00:15\n"}},{"id":"m10-e03","modulo":10,"tipo":"es","numero":3,"titolo":"Numeri complessi","difficolta":"facile","testo":"<p>Classe <code>Complesso<\/code> con getter e operatori <b>esterni senza friend<\/b> <code>+<\/code>, <code>-<\/code>, <code>*<\/code> e <code>&lt;&lt;<\/code> (formato <code>3+2i<\/code>). Verifica che i · i = -1 e che <code>2 + z<\/code> compili.<\/p>","soluzione":{"commento":"<p>Gli operatori esterni non hanno bisogno di <code>friend<\/code> se la classe offre getter pubblici sufficienti.<\/p>","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 10.3 - Numeri complessi: + - * con operatori esterni\n#include <iostream>\nusing namespace std;\n\nclass Complesso {\n    double re, im;\npublic:\n    Complesso(double r = 0, double i = 0) : re(r), im(i) {}\n    double getRe() const { return re; }\n    double getIm() const { return im; }\n};\n\n// Operatori ESTERNI senza friend: usano solo i getter pubblici\nComplesso operator+(const Complesso& a, const Complesso& b) {\n    return Complesso(a.getRe() + b.getRe(), a.getIm() + b.getIm());\n}\nComplesso operator-(const Complesso& a, const Complesso& b) {\n    return Complesso(a.getRe() - b.getRe(), a.getIm() - b.getIm());\n}\nComplesso operator*(const Complesso& a, const Complesso& b) {     // (a+bi)(c+di) = (ac-bd) + (ad+bc)i\n    return Complesso(a.getRe() * b.getRe() - a.getIm() * b.getIm(),\n                     a.getRe() * b.getIm() + a.getIm() * b.getRe());\n}\nostream& operator<<(ostream& os, const Complesso& c) {\n    os << c.getRe();\n    if (c.getIm() >= 0) os << \"+\";\n    return os << c.getIm() << \"i\";\n}\n\nint main() {\n    Complesso z(3, 2), w(1, -1);\n    cout << \"z = \" << z << \", w = \" << w << endl;\n    cout << \"z + w = \" << z + w << endl;\n    cout << \"z - w = \" << z - w << endl;\n    cout << \"z * w = \" << z * w << endl;\n    Complesso i(0, 1);\n    cout << \"i * i = \" << i * i << endl;\n    cout << \"2 + z = \" << 2 + z << \"   (funziona perche' + e' esterno: 2 diventa Complesso(2))\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"z = 3+2i, w = 1-1i\nz + w = 4+1i\nz - w = 2+3i\nz * w = 5-1i\ni * i = -1+0i\n2 + z = 5+2i   (funziona perche' + e' esterno: 2 diventa Complesso(2))\n"}},{"id":"m10-e04","modulo":10,"tipo":"es","numero":4,"titolo":"Contatore","difficolta":"facile","testo":"<p>Classe <code>Contatore<\/code> con <code>++<\/code> e <code>--<\/code>, sia prefissi sia postfissi (non sotto zero). Mostra la differenza tra <code>a = c++<\/code> e <code>b = ++c<\/code>.<\/p>","soluzione":{"commento":"<p><code>++(++c)<\/code> funziona perché il prefisso restituisce <code>Contatore&amp;<\/code>: il secondo <code>++<\/code> agisce sullo stesso oggetto.<\/p>","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 10.4 - ++ e -- prefissi e postfissi\n#include <iostream>\nusing namespace std;\n\nclass Contatore {\n    int valore;\npublic:\n    Contatore(int v = 0) : valore(v) {}\n    Contatore& operator++() { ++valore; return *this; }            // ++c: incrementa e restituisce SE STESSO\n    Contatore operator++(int) { Contatore v = *this; ++valore; return v; }   // c++: restituisce la COPIA vecchia\n    Contatore& operator--() { if (valore > 0) --valore; return *this; }      // non sotto zero\n    Contatore operator--(int) { Contatore v = *this; if (valore > 0) --valore; return v; }\n    friend ostream& operator<<(ostream& os, const Contatore& c) { return os << c.valore; }\n};\n\nint main() {\n    Contatore c(5);\n    cout << \"c = \" << c << endl;\n    Contatore a = c++;\n    cout << \"a = c++  -> a = \" << a << \", c = \" << c << endl;\n    Contatore b = ++c;\n    cout << \"b = ++c  -> b = \" << b << \", c = \" << c << endl;\n    ++(++c);                                     // il prefisso restituisce un riferimento: si concatena\n    cout << \"dopo ++(++c): c = \" << c << endl;\n    Contatore z(1);\n    z--; z--; z--;\n    cout << \"z dopo tre z--: \" << z << endl;\n    return 0;\n}\n"}],"input":null,"output":"c = 5\na = c++  -> a = 5, c = 6\nb = ++c  -> b = 7, c = 7\ndopo ++(++c): c = 9\nz dopo tre z--: 0\n"}},{"id":"m10-e05","modulo":10,"tipo":"es","numero":5,"titolo":"Ordinare frazioni","difficolta":"medio","testo":"<p>Definisci solo <code>operator&lt;<\/code> e <code>operator&lt;&lt;<\/code> per una classe <code>Frazione<\/code> e ordina un array di frazioni con un template <code>ordina<\/code> (insertion sort che usa solo <code>&lt;<\/code>). Attenzione alle frazioni negative.<\/p>","soluzione":{"commento":"<p>Il costruttore porta il segno al numeratore (<code>5/-6<\/code> diventa <code>-5/6<\/code>), così nel confronto incrociato i denominatori sono positivi e la disuguaglianza non si capovolge.<\/p>","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 10.5 - Basta definire < per poter ordinare con un template\n#include <iostream>\nusing namespace std;\n\nclass Frazione {\n    int num, den;               // den > 0\npublic:\n    Frazione(int n = 0, int d = 1) : num(d < 0 ? -n : n), den(d < 0 ? -d : d) {}\n    bool operator<(const Frazione& f) const { return num * f.den < f.num * den; }\n    friend ostream& operator<<(ostream& os, const Frazione& f) { return os << f.num << \"/\" << f.den; }\n};\n\ntemplate <typename T>\nvoid ordina(T a[], int n) {                      // insertion sort: usa SOLO <\n    for (int i = 1; i < n; i++) {\n        T x = a[i];\n        int j = i - 1;\n        while (j >= 0 && x < a[j]) { a[j + 1] = a[j]; j--; }\n        a[j + 1] = x;\n    }\n}\n\nint main() {\n    Frazione v[] = {Frazione(3, 4), Frazione(1, 3), Frazione(5, -6), Frazione(2, 5), Frazione(7, 8)};\n    ordina(v, 5);\n    for (int i = 0; i < 5; i++) cout << v[i] << \" \";\n    cout << endl;\n    return 0;\n}\n"}],"input":null,"output":"-5/6 1/3 2/5 3/4 7/8 \n"}},{"id":"m10-e06","modulo":10,"tipo":"es","numero":6,"titolo":"Matrice 2x2","difficolta":"medio","testo":"<p>Classe <code>Matrice2<\/code> con <code>operator()(int i, int j)<\/code> in due versioni (scrittura e lettura <code>const<\/code>), prodotto <code>*<\/code>, <code>==<\/code> e <code>&lt;&lt;<\/code>. Verifica che A · I = A e che A · B ≠ B · A.<\/p>","soluzione":{"commento":"","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 10.6 - Matrice 2x2 con operator() per l'accesso, * e ==\n#include <iostream>\nusing namespace std;\n\nclass Matrice2 {\n    double m[2][2];\npublic:\n    Matrice2(double a = 0, double b = 0, double c = 0, double d = 0) {\n        m[0][0] = a; m[0][1] = b; m[1][0] = c; m[1][1] = d;\n    }\n    double& operator()(int i, int j) { return m[i][j]; }          // M(i, j) = valore\n    double operator()(int i, int j) const { return m[i][j]; }     // lettura su const\n    Matrice2 operator*(const Matrice2& b) const {                  // prodotto righe per colonne\n        Matrice2 r;\n        for (int i = 0; i < 2; i++)\n            for (int j = 0; j < 2; j++)\n                r(i, j) = m[i][0] * b(0, j) + m[i][1] * b(1, j);\n        return r;\n    }\n    bool operator==(const Matrice2& b) const {\n        for (int i = 0; i < 2; i++)\n            for (int j = 0; j < 2; j++)\n                if (m[i][j] != b(i, j)) return false;\n        return true;\n    }\n    friend ostream& operator<<(ostream& os, const Matrice2& a) {\n        return os << \"[\" << a(0, 0) << \" \" << a(0, 1) << \"; \" << a(1, 0) << \" \" << a(1, 1) << \"]\";\n    }\n};\n\nint main() {\n    Matrice2 A(1, 2, 3, 4), I(1, 0, 0, 1), B(0, 1, 1, 0);\n    cout << \"A * I = \" << A * I << (A * I == A ? \"  (uguale ad A)\" : \"\") << endl;\n    cout << \"A * B = \" << A * B << endl;\n    cout << \"B * A = \" << B * A << \"  (il prodotto non e' commutativo)\" << endl;\n    A(1, 1) = 10;\n    cout << \"dopo A(1,1) = 10: A = \" << A << endl;\n    return 0;\n}\n"}],"input":null,"output":"A * I = [1 2; 3 4]  (uguale ad A)\nA * B = [2 1; 4 3]\nB * A = [3 4; 1 2]  (il prodotto non e' commutativo)\ndopo A(1,1) = 10: A = [1 2; 3 10]\n"}},{"id":"m10-e07","modulo":10,"tipo":"es","numero":7,"titolo":"Leggere studenti","difficolta":"medio","testo":"<p>Scrivi <code>operator&gt;&gt;<\/code> per una classe <code>Studente<\/code> che legge <code>nome voto<\/code> e imposta il <i>failbit<\/i> se il voto non è un numero tra 18 e 30. Nel <code>main<\/code> leggi fino a fine input saltando le righe non valide.<\/p>","soluzione":{"commento":"<p>Dopo un fallimento, <code>clear()<\/code> e <code>ignore()<\/code> (Modulo 2) saltano la riga sbagliata. <code>Bruno 33<\/code> viene letto correttamente come testo e numero, ma scartato per il valore fuori intervallo.<\/p>","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 10.7 - operator>> che legge uno Studente e segnala gli errori\n#include <iostream>\n#include <string>\n#include <limits>\nusing namespace std;\n\nclass Studente {\n    string nome;\n    int voto;\npublic:\n    Studente() : nome(\"?\"), voto(0) {}\n    friend istream& operator>>(istream& is, Studente& s) {\n        string n; int v;\n        if (is >> n >> v && v >= 18 && v <= 30) {   // tutto valido: modifico s\n            s.nome = n;\n            s.voto = v;\n        } else {\n            is.setstate(ios::failbit);              // altrimenti segnalo il fallimento come cin\n        }\n        return is;\n    }\n    friend ostream& operator<<(ostream& os, const Studente& s) { return os << s.nome << \" (\" << s.voto << \")\"; }\n};\n\nint main() {\n    Studente s;\n    int letti = 0;\n    while (true) {\n        if (cin >> s) {\n            cout << \"letto \" << s << endl;\n            letti++;\n        } else {\n            if (cin.eof()) break;                   // fine input\n            cout << \"riga non valida, la salto\" << endl;\n            cin.clear();\n            cin.ignore(numeric_limits<streamsize>::max(), '\\n');\n        }\n    }\n    cout << letti << \" studenti letti\" << endl;\n    return 0;\n}\n"}],"input":"Anna 28\nBruno 33\nCarla 30\nDario trenta\nElena 18\n","output":"letto Anna (28)\nriga non valida, la salto\nletto Carla (30)\nriga non valida, la salto\nletto Elena (18)\n3 studenti letti\n"}},{"id":"m10-e08","modulo":10,"tipo":"es","numero":8,"titolo":"MiaStringa con operatori","difficolta":"medio","testo":"<p>Riprendi <code>MiaStringa<\/code> dell'Esercizio 4.8 e aggiungi <code>operator[]<\/code> (con controllo), <code>+<\/code> (concatenazione), <code>==<\/code> e <code>&lt;&lt;<\/code>.<\/p>","soluzione":{"commento":"","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 10.8 - MiaStringa con +, ==, [] e << (seguito dell'Esercizio 4.8)\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\nclass MiaStringa {\n    char* t;\n    int len;\n    void copia(const char* s, int l) {\n        len = l;\n        t = new char[len + 1];\n        for (int i = 0; i < len; i++) t[i] = s[i];\n        t[len] = '\\0';\n    }\npublic:\n    MiaStringa(const char* s = \"\") { int l = 0; while (s[l]) l++; copia(s, l); }\n    MiaStringa(const MiaStringa& o) { copia(o.t, o.len); }\n    MiaStringa& operator=(const MiaStringa& o) {\n        if (this != &o) { delete[] t; copia(o.t, o.len); }\n        return *this;\n    }\n    ~MiaStringa() { delete[] t; }\n\n    char& operator[](int i) {\n        if (i < 0 || i >= len) throw out_of_range(\"indice fuori dalla stringa\");\n        return t[i];\n    }\n    MiaStringa operator+(const MiaStringa& o) const {\n        MiaStringa r;\n        delete[] r.t;\n        r.len = len + o.len;\n        r.t = new char[r.len + 1];\n        for (int i = 0; i < len; i++) r.t[i] = t[i];\n        for (int i = 0; i < o.len; i++) r.t[len + i] = o.t[i];\n        r.t[r.len] = '\\0';\n        return r;\n    }\n    bool operator==(const MiaStringa& o) const {\n        if (len != o.len) return false;\n        for (int i = 0; i < len; i++) if (t[i] != o.t[i]) return false;\n        return true;\n    }\n    friend ostream& operator<<(ostream& os, const MiaStringa& s) { return os << s.t; }\n};\n\nint main() {\n    MiaStringa a(\"Prog\"), b(\"rammazione\"), c = a + b;\n    cout << c << endl;\n    c[0] = 'p';                                   // [] restituisce char&: posso scrivere\n    cout << c << endl;\n    cout << (a + b == MiaStringa(\"Programmazione\") ? \"uguali\" : \"diverse\") << endl;\n    try { c[100] = 'x'; } catch (const out_of_range& e) { cout << \"errore: \" << e.what() << endl; }\n    return 0;\n}\n"}],"input":null,"output":"Programmazione\nprogrammazione\nuguali\nerrore: indice fuori dalla stringa\n"}},{"id":"m10-e09","modulo":10,"tipo":"es","numero":9,"titolo":"Insiemi","difficolta":"difficile","testo":"<p>Classe <code>Insieme<\/code> di interi senza duplicati su array dinamico (Regola dei Tre), con <code>+= x<\/code> (aggiunge un elemento), <code>+<\/code> (unione), <code>*<\/code> (intersezione), <code>-<\/code> (differenza), <code>==<\/code> (stessi elementi in qualunque ordine) e <code>&lt;&lt;<\/code> nel formato <code>{1, 2, 3}<\/code>.<\/p>","soluzione":{"commento":"<p><code>+=<\/code> fa tutto il lavoro di inserimento (controllo dei duplicati, crescita): unione, intersezione e differenza lo riusano.<\/p>","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 10.9 - Insieme di interi: unione (+), intersezione (*), differenza (-), ==\n#include <iostream>\nusing namespace std;\n\nclass Insieme {\n    int* v;\n    int n, cap;\npublic:\n    Insieme() : v(new int[4]), n(0), cap(4) {}\n    Insieme(const Insieme& o) : v(new int[o.cap]), n(o.n), cap(o.cap) { for (int i = 0; i < n; i++) v[i] = o.v[i]; }\n    Insieme& operator=(const Insieme& o) {\n        if (this != &o) {\n            int* nuovo = new int[o.cap];\n            for (int i = 0; i < o.n; i++) nuovo[i] = o.v[i];\n            delete[] v; v = nuovo; n = o.n; cap = o.cap;\n        }\n        return *this;\n    }\n    ~Insieme() { delete[] v; }\n\n    bool contiene(int x) const { for (int i = 0; i < n; i++) if (v[i] == x) return true; return false; }\n    Insieme& operator+=(int x) {                      // aggiunge x se non c'è già\n        if (contiene(x)) return *this;\n        if (n == cap) {\n            int* nuovo = new int[cap * 2];\n            for (int i = 0; i < n; i++) nuovo[i] = v[i];\n            delete[] v; v = nuovo; cap *= 2;\n        }\n        v[n++] = x;\n        return *this;\n    }\n    Insieme operator+(const Insieme& o) const {        // unione\n        Insieme r = *this;\n        for (int i = 0; i < o.n; i++) r += o.v[i];\n        return r;\n    }\n    Insieme operator*(const Insieme& o) const {        // intersezione\n        Insieme r;\n        for (int i = 0; i < n; i++) if (o.contiene(v[i])) r += v[i];\n        return r;\n    }\n    Insieme operator-(const Insieme& o) const {        // differenza\n        Insieme r;\n        for (int i = 0; i < n; i++) if (!o.contiene(v[i])) r += v[i];\n        return r;\n    }\n    bool operator==(const Insieme& o) const {          // stessi elementi, ordine qualunque\n        if (n != o.n) return false;\n        for (int i = 0; i < n; i++) if (!o.contiene(v[i])) return false;\n        return true;\n    }\n    friend ostream& operator<<(ostream& os, const Insieme& s) {\n        os << \"{\";\n        for (int i = 0; i < s.n; i++) os << (i ? \", \" : \"\") << s.v[i];\n        return os << \"}\";\n    }\n};\n\nint main() {\n    Insieme a, b;\n    int va[] = {1, 2, 3, 4, 2, 1};\n    int vb[] = {3, 4, 5, 6};\n    for (int i = 0; i < 6; i++) a += va[i];\n    for (int i = 0; i < 4; i++) b += vb[i];\n    cout << \"A = \" << a << \", B = \" << b << endl;\n    cout << \"A + B = \" << a + b << endl;\n    cout << \"A * B = \" << a * b << endl;\n    cout << \"A - B = \" << a - b << endl;\n    cout << \"(A - B) + (A * B) == A ? \" << ((a - b) + (a * b) == a ? \"si\" : \"no\") << endl;\n    return 0;\n}\n"}],"input":null,"output":"A = {1, 2, 3, 4}, B = {3, 4, 5, 6}\nA + B = {1, 2, 3, 4, 5, 6}\nA * B = {3, 4}\nA - B = {1, 2}\n(A - B) + (A * B) == A ? si\n"}},{"id":"m10-e10","modulo":10,"tipo":"es","numero":10,"titolo":"Date","difficolta":"difficile","testo":"<p>Classe <code>Data<\/code> con <code>++<\/code> (giorno successivo, con mesi di lunghezza diversa e anni bisestili), <code>&lt;<\/code>, <code>==<\/code>, <code>-<\/code> (numero di giorni tra due date) e <code>&lt;&lt;<\/code> nel formato <code>gg/mm/aaaa<\/code>. Calcola quanti giorni mancano al tuo esame.<\/p>","soluzione":{"commento":"<p><code>operator-<\/code> conta i giorni applicando <code>++<\/code> finché le date coincidono: semplice e sicuro, anche se lento per intervalli enormi.<\/p>","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 10.10 - Data con ++ (giorno successivo), <, - (giorni di differenza) e <<\n#include <iostream>\nusing namespace std;\n\nclass Data {\n    int g, m, a;\n    static bool bisestile(int anno) { return (anno % 4 == 0 && anno % 100 != 0) || anno % 400 == 0; }\n    static int giorniNelMese(int mese, int anno) {\n        int gm[] = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n        return (mese == 2 && bisestile(anno)) ? 29 : gm[mese - 1];\n    }\npublic:\n    Data(int giorno, int mese, int anno) : g(giorno), m(mese), a(anno) {}\n    Data& operator++() {                           // giorno successivo\n        g++;\n        if (g > giorniNelMese(m, a)) { g = 1; m++; }\n        if (m > 12) { m = 1; a++; }\n        return *this;\n    }\n    bool operator<(const Data& d) const {\n        if (a != d.a) return a < d.a;\n        if (m != d.m) return m < d.m;\n        return g < d.g;\n    }\n    bool operator==(const Data& d) const { return g == d.g && m == d.m && a == d.a; }\n    int operator-(const Data& prima) const {       // giorni da \"prima\" a *this (contando con ++)\n        if (*this < prima) return -(prima - *this);\n        int giorni = 0;\n        Data d = prima;\n        while (!(d == *this)) { ++d; giorni++; }\n        return giorni;\n    }\n    friend ostream& operator<<(ostream& os, const Data& d) {\n        return os << (d.g < 10 ? \"0\" : \"\") << d.g << \"/\" << (d.m < 10 ? \"0\" : \"\") << d.m << \"/\" << d.a;\n    }\n};\n\nint main() {\n    Data d(28, 2, 2024);\n    cout << d;\n    ++d; cout << \" -> \" << d;\n    ++d; cout << \" -> \" << d << endl;\n    Data capodanno(31, 12, 2025);\n    cout << capodanno << \" -> \" << ++capodanno << endl;\n    Data oggi(5, 11, 2026), esame(27, 11, 2026);\n    cout << \"giorni all'esame: \" << esame - oggi << endl;\n    cout << (oggi < esame ? \"oggi viene prima dell'esame\" : \"?\") << endl;\n    return 0;\n}\n"}],"input":null,"output":"28/02/2024 -> 29/02/2024 -> 01/03/2024\n31/12/2025 -> 01/01/2026\ngiorni all'esame: 22\noggi viene prima dell'esame\n"}},{"id":"m11-pattern","modulo":11,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 11 (Liste Concatenate).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 11 - Pattern: lista concatenata semplice generica (template), senza STL\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\n#include <string>\nusing namespace std;\n\ntemplate <typename T>\nstruct Nodo {\n    T valore;\n    Nodo<T>* succ;                     // indirizzo del nodo successivo (nullptr = fine)\n    Nodo(T v, Nodo<T>* s = nullptr) : valore(v), succ(s) {}\n};\n\ntemplate <typename T>\nclass Lista {\nprivate:\n    Nodo<T>* testa;                    // unico accesso alla lista\n    int n;\n\npublic:\n    Lista() : testa(nullptr), n(0) {}\n\n    // --- Regola dei Tre: la lista POSSIEDE i suoi nodi ---\n    ~Lista() {\n        while (testa != nullptr) {     // stacco un nodo alla volta dalla testa\n            Nodo<T>* tmp = testa;\n            testa = testa->succ;\n            delete tmp;\n        }\n    }\n    Lista(const Lista& altra) : testa(nullptr), n(0) {\n        for (Nodo<T>* p = altra.testa; p != nullptr; p = p->succ) inserisciCoda(p->valore);\n    }\n    Lista& operator=(const Lista& altra) {\n        if (this != &altra) {\n            Lista copia(altra);                       // copio...\n            Nodo<T>* t = testa; testa = copia.testa; copia.testa = t;   // ...e scambio le teste:\n            int k = n; n = copia.n; copia.n = k;      // il distruttore di copia libera i MIEI vecchi nodi\n        }\n        return *this;\n    }\n\n    bool vuota() const { return testa == nullptr; }\n    int size() const { return n; }\n\n    // INSERIMENTO IN TESTA: O(1)\n    void inserisciTesta(T v) {\n        testa = new Nodo<T>(v, testa);  // il nuovo nodo punta alla vecchia testa, poi diventa la testa\n        n++;\n    }\n\n    // INSERIMENTO IN CODA: O(n), bisogna arrivare all'ultimo nodo\n    void inserisciCoda(T v) {\n        Nodo<T>* nuovo = new Nodo<T>(v);\n        if (testa == nullptr) { testa = nuovo; n++; return; }   // lista vuota: caso speciale\n        Nodo<T>* p = testa;\n        while (p->succ != nullptr) p = p->succ;                 // mi fermo SULL'ultimo\n        p->succ = nuovo;\n        n++;\n    }\n\n    // INSERIMENTO ORDINATO (crescente): richiede l'operatore < su T\n    void inserisciOrdinato(T v) {\n        if (testa == nullptr || v < testa->valore) { inserisciTesta(v); return; }\n        Nodo<T>* p = testa;\n        while (p->succ != nullptr && p->succ->valore < v) p = p->succ;   // p = ultimo nodo < v\n        p->succ = new Nodo<T>(v, p->succ);                              // aggancio DOPO p\n        n++;\n    }\n\n    // RICERCA: restituisce il puntatore al nodo, o nullptr\n    Nodo<T>* ricerca(T v) const {\n        for (Nodo<T>* p = testa; p != nullptr; p = p->succ)\n            if (p->valore == v) return p;\n        return nullptr;\n    }\n\n    // RIMOZIONE della prima occorrenza: serve il nodo PRECEDENTE (ant)\n    bool rimuovi(T v) {\n        Nodo<T>* ant = nullptr;\n        Nodo<T>* pos = testa;\n        while (pos != nullptr && !(pos->valore == v)) { ant = pos; pos = pos->succ; }\n        if (pos == nullptr) return false;              // non trovato\n        if (ant == nullptr) testa = pos->succ;         // era il primo: sposto la testa\n        else ant->succ = pos->succ;                    // scavalco pos\n        delete pos;\n        n--;\n        return true;\n    }\n\n    // INVERSIONE IN LOCO: giro tutte le frecce, senza creare nodi\n    void inverti() {\n        Nodo<T>* prec = nullptr;\n        Nodo<T>* corr = testa;\n        while (corr != nullptr) {\n            Nodo<T>* succ = corr->succ;   // 1. ricordo il successivo\n            corr->succ = prec;            // 2. giro la freccia all'indietro\n            prec = corr;                  // 3. avanzo di un passo\n            corr = succ;\n        }\n        testa = prec;                     // l'ultimo nodo è la nuova testa\n    }\n\n    // STAMPA: friend definita dentro la classe (la forma più semplice per i template)\n    friend ostream& operator<<(ostream& os, const Lista& l) {\n        os << \"[\";\n        for (Nodo<T>* p = l.testa; p != nullptr; p = p->succ)\n            os << p->valore << (p->succ ? \" -> \" : \"\");\n        return os << \"]\";\n    }\n};\n\nint main() {\n    Lista<int> l;\n    l.inserisciTesta(3);\n    l.inserisciTesta(1);\n    l.inserisciCoda(7);\n    l.inserisciCoda(9);\n    cout << \"lista:            \" << l << \"  (\" << l.size() << \" nodi)\" << endl;\n    cout << \"ricerca(7):       \" << (l.ricerca(7) ? \"trovato\" : \"assente\") << endl;\n    l.rimuovi(1);  l.rimuovi(9);  l.rimuovi(42);\n    cout << \"tolti 1, 9, 42:   \" << l << endl;\n    l.inserisciOrdinato(5);\n    cout << \"inserito 5:       \" << l << endl;\n    Lista<int> copia = l;\n    l.inverti();\n    cout << \"invertita:        \" << l << \", la copia: \" << copia << endl;\n\n    Lista<string> parole;\n    parole.inserisciOrdinato(\"pera\");\n    parole.inserisciOrdinato(\"mela\");\n    parole.inserisciOrdinato(\"uva\");\n    parole.inserisciOrdinato(\"kiwi\");\n    cout << \"parole ordinate:  \" << parole << endl;\n    return 0;\n}\n"}],"input":null,"output":"lista:            [1 -> 3 -> 7 -> 9]  (4 nodi)\nricerca(7):       trovato\ntolti 1, 9, 42:   [3 -> 7]\ninserito 5:       [3 -> 5 -> 7]\ninvertita:        [7 -> 5 -> 3], la copia: [3 -> 5 -> 7]\nparole ordinate:  [kiwi -> mela -> pera -> uva]\n"}},{"id":"m11-lab","modulo":11,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Rettangoli in una lista (dalle slide)<\/b><\/p><p>Definire una semplice classe <code>Rettangolo<\/code> e una lista concatenata generica scritta da zero. Definire un metodo statico che legge da input un numero arbitrario di rettangoli e li inserisce nella lista, e un metodo statico che elimina dalla lista tutti i rettangoli con area compresa tra due valori dati.<\/p><p><b>Step 1 – la lista minima<\/b><br><code>template &lt;typename T&gt; struct Nodo<\/code> e <code>class Lista<\/code> con <code>inserisciTesta<\/code>, <code>operator&lt;&lt;<\/code> e distruttore. Vieta la copia con <code>= delete<\/code>. Provala con degli interi.<br><b>Concetto nuovo:<\/b> nodo, testa, scorrimento, distruzione.<\/p><p><b>Step 2 – la coda<\/b><br>Aggiungi un attributo <code>coda<\/code> (puntatore all'ultimo nodo), <code>inserisciCoda<\/code> in O(1) e <code>size()<\/code>. Aggiorna <code>coda<\/code> anche in <code>inserisciTesta<\/code> quando la lista era vuota.<br><b>Concetto nuovo:<\/b> mantenere più puntatori coerenti.<\/p><p><b>Step 3 – rimozione multipla<\/b><br>Scrivi <code>int rimuoviSe(bool (*condizione)(const T&amp;, double, double), double a, double b)<\/code>, che toglie <b>tutti<\/b> i nodi per cui la condizione è vera e restituisce quanti ne ha tolti. Attenzione: dopo una rimozione <code>ant<\/code> non avanza; e se togli l'ultimo nodo, aggiorna <code>coda<\/code>.<br><b>Concetto nuovo:<\/b> rimozione durante lo scorrimento, puntatore a funzione.<\/p><p><b>Step 4 – i rettangoli<\/b><br>Scrivi <code>Rettangolo<\/code> (con <code>area()<\/code> e <code>operator&lt;&lt;<\/code>) e una classe <code>Gestore<\/code> con i metodi statici <code>leggi(Lista&lt;Rettangolo&gt;&amp;)<\/code> (legge il numero di rettangoli e poi le coppie base altezza) ed <code>eliminaTra(Lista&lt;Rettangolo&gt;&amp;, double a, double b)<\/code>.<br><b>Concetto nuovo:<\/b> lista di oggetti, metodi statici, la traccia delle slide.<\/p><p><b>Step 5 – lista ordinata<\/b><br>Aggiungi <code>operator&lt;<\/code> a <code>Rettangolo<\/code> (per area) e <code>inserisciOrdinato<\/code> alla lista, e costruisci una lista di rettangoli ordinata per area.<br><b>Concetto nuovo:<\/b> inserimento ordinato.<\/p><p><b>Step 6 – inversione<\/b><br>Scrivi <code>inverti()<\/code> in loco, aggiornando correttamente <code>coda<\/code> (la vecchia testa). Verifica con un <code>inserisciCoda<\/code> dopo l'inversione.<br><b>Concetto nuovo:<\/b> manipolazione di tutti i puntatori.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 11 - Laboratorio a step: rettangoli in una lista (esercizio delle slide)\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\nusing namespace std;\n\n// ===== STEP 1 =====  Nodo e lista generica con inserimento in testa, stampa, distruttore\ntemplate <typename T>\nstruct Nodo {\n    T valore;\n    Nodo<T>* succ;\n    Nodo(const T& v, Nodo<T>* s = nullptr) : valore(v), succ(s) {}\n};\n\ntemplate <typename T>\nclass Lista {\n    Nodo<T>* testa;\n    Nodo<T>* coda;                       // ===== STEP 2 ===== puntatore all'ultimo: coda in O(1)\n    int n;\npublic:\n    Lista() : testa(nullptr), coda(nullptr), n(0) {}\n    ~Lista() { svuota(); }\n    Lista(const Lista&) = delete;        // in questo laboratorio non serve copiare: lo VIETO\n    Lista& operator=(const Lista&) = delete;\n\n    void svuota() {\n        while (testa) { Nodo<T>* t = testa; testa = testa->succ; delete t; }\n        coda = nullptr;\n        n = 0;\n    }\n    void inserisciTesta(const T& v) {\n        testa = new Nodo<T>(v, testa);\n        if (coda == nullptr) coda = testa;          // era vuota: il nuovo è anche l'ultimo\n        n++;\n    }\n    // ===== STEP 2 =====\n    void inserisciCoda(const T& v) {\n        Nodo<T>* nuovo = new Nodo<T>(v);\n        if (coda == nullptr) testa = coda = nuovo;\n        else { coda->succ = nuovo; coda = nuovo; }\n        n++;\n    }\n    int size() const { return n; }\n\n    // ===== STEP 3 =====  Rimuove TUTTI i nodi per cui \"condizione\" è vera\n    int rimuoviSe(bool (*condizione)(const T&, double, double), double a, double b) {\n        int tolti = 0;\n        Nodo<T>* ant = nullptr;\n        Nodo<T>* pos = testa;\n        while (pos != nullptr) {\n            if (condizione(pos->valore, a, b)) {\n                Nodo<T>* daTogliere = pos;\n                pos = pos->succ;                       // avanzo PRIMA di cancellare\n                if (ant == nullptr) testa = pos; else ant->succ = pos;\n                if (daTogliere == coda) coda = ant;    // ho tolto l'ultimo\n                delete daTogliere;\n                n--; tolti++;\n            } else {\n                ant = pos;\n                pos = pos->succ;\n            }\n        }\n        return tolti;\n    }\n\n    // ===== STEP 5 =====  Inserimento ordinato\n    void inserisciOrdinato(const T& v) {\n        if (testa == nullptr || v < testa->valore) { inserisciTesta(v); return; }\n        Nodo<T>* p = testa;\n        while (p->succ != nullptr && p->succ->valore < v) p = p->succ;\n        p->succ = new Nodo<T>(v, p->succ);\n        if (p == coda) coda = p->succ;\n        n++;\n    }\n\n    // ===== STEP 6 =====  Inversione in loco: la testa diventa la coda\n    void inverti() {\n        Nodo<T>* prec = nullptr;\n        Nodo<T>* corr = testa;\n        coda = testa;\n        while (corr) {\n            Nodo<T>* s = corr->succ;\n            corr->succ = prec;\n            prec = corr;\n            corr = s;\n        }\n        testa = prec;\n    }\n\n    friend ostream& operator<<(ostream& os, const Lista& l) {\n        if (l.testa == nullptr) return os << \"(lista vuota)\";\n        for (Nodo<T>* p = l.testa; p; p = p->succ) os << p->valore << (p->succ ? \"  \" : \"\");\n        return os;\n    }\n};\n\n// ===== STEP 4 =====  La classe Rettangolo e il \"gestore\" con metodi statici\nclass Rettangolo {\n    double b, h;\npublic:\n    Rettangolo(double base = 1, double altezza = 1) : b(base), h(altezza) {}\n    double area() const { return b * h; }\n    bool operator<(const Rettangolo& r) const { return area() < r.area(); }    // per lo STEP 5\n    friend ostream& operator<<(ostream& os, const Rettangolo& r) {\n        return os << r.b << \"x\" << r.h << \"(\" << r.area() << \")\";\n    }\n};\n\nclass Gestore {\npublic:\n    // Legge \"quanti\" e poi le coppie base altezza; li mette in coda\n    static void leggi(Lista<Rettangolo>& l) {\n        int quanti;\n        cin >> quanti;\n        for (int i = 0; i < quanti; i++) {\n            double b, h;\n            cin >> b >> h;\n            l.inserisciCoda(Rettangolo(b, h));\n        }\n    }\n    static bool areaTra(const Rettangolo& r, double a, double b) {\n        return r.area() >= a && r.area() <= b;\n    }\n    // Elimina tutti i rettangoli con area in [a, b]\n    static int eliminaTra(Lista<Rettangolo>& l, double a, double b) {\n        return l.rimuoviSe(areaTra, a, b);\n    }\n};\n\nint main() {\n    Lista<int> numeri;                                   // STEP 1-2 con gli interi\n    numeri.inserisciTesta(2); numeri.inserisciTesta(1); numeri.inserisciCoda(3);\n    cout << \"STEP 1-2: \" << numeri << endl;\n\n    Lista<Rettangolo> rett;                              // STEP 4\n    Gestore::leggi(rett);\n    cout << \"STEP 4: letti \" << rett.size() << \": \" << rett << endl;\n    int tolti = Gestore::eliminaTra(rett, 10, 30);       // STEP 3 usato dallo STEP 4\n    cout << \"        tolti \" << tolti << \" con area in [10, 30]: \" << rett << endl;\n\n    Lista<Rettangolo> ordinati;                          // STEP 5\n    Rettangolo prove[] = {Rettangolo(3, 3), Rettangolo(1, 2), Rettangolo(5, 1), Rettangolo(2, 2)};\n    for (int i = 0; i < 4; i++) ordinati.inserisciOrdinato(prove[i]);\n    cout << \"STEP 5: ordinati per area: \" << ordinati << endl;\n\n    ordinati.inverti();                                  // STEP 6\n    ordinati.inserisciCoda(Rettangolo(0.5, 1));          // la coda è aggiornata correttamente?\n    cout << \"STEP 6: invertiti (+ uno in coda): \" << ordinati << endl;\n    return 0;\n}\n"}],"input":"5\n2 3\n4 5\n1 1\n3 4\n6 5\n","output":"STEP 1-2: 1  2  3\nSTEP 4: letti 5: 2x3(6)  4x5(20)  1x1(1)  3x4(12)  6x5(30)\n        tolti 3 con area in [10, 30]: 2x3(6)  1x1(1)\nSTEP 5: ordinati per area: 1x2(2)  2x2(4)  5x1(5)  3x3(9)\nSTEP 6: invertiti (+ uno in coda): 3x3(9)  5x1(5)  2x2(4)  1x2(2)  0.5x1(0.5)\n"}},{"id":"m11-e01","modulo":11,"tipo":"es","numero":1,"titolo":"La prima lista, a mano","difficolta":"facile","testo":"<p>Senza classi: dichiara <code>struct Nodo { int valore; Nodo* succ; };<\/code>, costruisci la lista 4 → 3 → 5 inserendo in testa (come nelle slide), aggiungi 8 in coda, scorrila contando i nodi e sommando i valori, poi libera tutti i nodi.<\/p>","soluzione":{"commento":"<p><code>new Nodo{5, primo}<\/code> crea il nodo inizializzando i campi nell'ordine in cui sono dichiarati nella <code>struct<\/code>.<\/p>","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 11.1 - Costruire una lista \"a mano\" e scorrerla\n#include <iostream>\nusing namespace std;\n\nstruct Nodo {\n    int valore;\n    Nodo* succ;\n};\n\nint main() {\n    // Costruzione come nelle slide: ogni nuovo nodo va in TESTA\n    Nodo* primo = nullptr;                       // lista vuota\n    primo = new Nodo{5, primo};\n    primo = new Nodo{3, primo};\n    primo = new Nodo{4, primo};                  // lista: 4 -> 3 -> 5\n\n    // Aggiungo 8 in CODA: devo arrivare all'ultimo nodo\n    Nodo* p = primo;\n    while (p->succ != nullptr) p = p->succ;\n    p->succ = new Nodo{8, nullptr};\n\n    // Scorrimento: il \"for\" delle liste\n    int conta = 0, somma = 0;\n    for (Nodo* q = primo; q != nullptr; q = q->succ) {\n        cout << q->valore << \" \";\n        conta++;\n        somma += q->valore;\n    }\n    cout << \"\\nnodi: \" << conta << \", somma: \" << somma << endl;\n\n    // Liberare tutto: salvo il successivo PRIMA di cancellare\n    while (primo != nullptr) {\n        Nodo* tmp = primo->succ;\n        delete primo;\n        primo = tmp;\n    }\n    cout << \"memoria liberata\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"4 3 5 8 \nnodi: 4, somma: 20\nmemoria liberata\n"}},{"id":"m11-e02","modulo":11,"tipo":"es","numero":2,"titolo":"Ricerca e modifica","difficolta":"facile","testo":"<p>Scrivi <code>Nodo* ricerca(Nodo* testa, int x)<\/code> e <code>int posizione(Nodo* testa, int x)<\/code>. Usa il puntatore restituito da <code>ricerca<\/code> per modificare il valore del nodo direttamente nella lista.<\/p>","soluzione":{"commento":"","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 11.2 - Ricerca che restituisce il nodo: modificare un valore \"sul posto\"\n#include <iostream>\nusing namespace std;\n\nstruct Nodo { int valore; Nodo* succ; };\n\nNodo* ricerca(Nodo* testa, int x) {\n    for (Nodo* p = testa; p != nullptr; p = p->succ)\n        if (p->valore == x) return p;\n    return nullptr;\n}\n\nint posizione(Nodo* testa, int x) {              // indice (da 0) della prima occorrenza\n    int i = 0;\n    for (Nodo* p = testa; p != nullptr; p = p->succ, i++)\n        if (p->valore == x) return i;\n    return -1;\n}\n\nvoid stampa(Nodo* p) { for (; p; p = p->succ) cout << p->valore << \" \"; cout << endl; }\n\nint main() {\n    Nodo* l = nullptr;\n    for (int v = 50; v >= 10; v -= 10) l = new Nodo{v, l};    // 10 20 30 40 50\n    stampa(l);\n    Nodo* trovato = ricerca(l, 30);\n    if (trovato) trovato->valore = 33;                        // modifico il nodo vero della lista\n    stampa(l);\n    cout << \"33 in posizione \" << posizione(l, 33) << \", 99 in posizione \" << posizione(l, 99) << endl;\n    while (l) { Nodo* t = l->succ; delete l; l = t; }\n    return 0;\n}\n"}],"input":null,"output":"10 20 30 40 50 \n10 20 33 40 50 \n33 in posizione 2, 99 in posizione -1\n"}},{"id":"m11-e03","modulo":11,"tipo":"es","numero":3,"titolo":"Massimo","difficolta":"facile","testo":"<p>Scrivi il massimo di una lista non vuota in versione iterativa e in versione ricorsiva (caso base: un solo nodo).<\/p>","soluzione":{"commento":"","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 11.3 - Massimo di una lista: iterativo e ricorsivo\n#include <iostream>\nusing namespace std;\n\nstruct Nodo { int valore; Nodo* succ; };\n\nint massimoIter(Nodo* testa) {                    // la lista non deve essere vuota\n    int m = testa->valore;\n    for (Nodo* p = testa->succ; p != nullptr; p = p->succ)\n        if (p->valore > m) m = p->valore;\n    return m;\n}\n\nint massimoRic(Nodo* p) {\n    if (p->succ == nullptr) return p->valore;     // caso base: un solo nodo\n    int mResto = massimoRic(p->succ);             // massimo del resto della lista\n    return (p->valore > mResto) ? p->valore : mResto;\n}\n\nint main() {\n    int dati[] = {7, -2, 15, 4, 15, 0};\n    Nodo* l = nullptr;\n    for (int i = 5; i >= 0; i--) l = new Nodo{dati[i], l};\n    cout << \"iterativo: \" << massimoIter(l) << \", ricorsivo: \" << massimoRic(l) << endl;\n    while (l) { Nodo* t = l->succ; delete l; l = t; }\n    return 0;\n}\n"}],"input":null,"output":"iterativo: 15, ricorsivo: 15\n"}},{"id":"m11-e04","modulo":11,"tipo":"es","numero":4,"titolo":"Togliere in testa e in coda","difficolta":"facile","testo":"<p>Scrivi <code>bool rimuoviTesta(Nodo*&amp; testa)<\/code> e <code>bool rimuoviCoda(Nodo*&amp; testa)<\/code> (che si ferma sul <i>penultimo<\/i> nodo). Perché la testa va passata per reference? Svuota una lista a forza di <code>rimuoviCoda<\/code>.<\/p>","soluzione":{"commento":"<p>La testa va passata per reference perché <code>rimuoviTesta<\/code> (e <code>rimuoviCoda<\/code> con un solo nodo) deve cambiare il puntatore del chiamante, non una sua copia.<\/p>","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 11.4 - Rimuovere in testa e in coda (puntatore passato per reference)\n#include <iostream>\nusing namespace std;\n\nstruct Nodo { int valore; Nodo* succ; };\n\n// La testa può cambiare: la passo per REFERENCE (Nodo*&)\nbool rimuoviTesta(Nodo*& testa) {\n    if (testa == nullptr) return false;\n    Nodo* vecchia = testa;\n    testa = testa->succ;\n    delete vecchia;\n    return true;\n}\n\nbool rimuoviCoda(Nodo*& testa) {\n    if (testa == nullptr) return false;\n    if (testa->succ == nullptr) {                 // un solo nodo: la lista diventa vuota\n        delete testa;\n        testa = nullptr;\n        return true;\n    }\n    Nodo* p = testa;\n    while (p->succ->succ != nullptr) p = p->succ; // mi fermo sul PENULTIMO\n    delete p->succ;\n    p->succ = nullptr;\n    return true;\n}\n\nvoid stampa(Nodo* p) { cout << \"[ \"; for (; p; p = p->succ) cout << p->valore << \" \"; cout << \"]\" << endl; }\n\nint main() {\n    Nodo* l = nullptr;\n    for (int v = 5; v >= 1; v--) l = new Nodo{v, l};\n    stampa(l);\n    rimuoviTesta(l); stampa(l);\n    rimuoviCoda(l);  stampa(l);\n    while (rimuoviCoda(l)) stampa(l);             // svuoto dalla coda\n    cout << \"rimuoviTesta su lista vuota: \" << (rimuoviTesta(l) ? \"ok\" : \"niente da fare\") << endl;\n    return 0;\n}\n"}],"input":null,"output":"[ 1 2 3 4 5 ]\n[ 2 3 4 5 ]\n[ 2 3 4 ]\n[ 2 3 ]\n[ 2 ]\n[ ]\nrimuoviTesta su lista vuota: niente da fare\n"}},{"id":"m11-e05","modulo":11,"tipo":"es","numero":5,"titolo":"Lista ordinata senza duplicati","difficolta":"medio","testo":"<p>Classe template <code>ListaOrdinata&lt;T&gt;<\/code> (con il nodo come <code>struct<\/code> interna) con <code>bool inserisci(const T&amp;)<\/code> che mantiene l'ordine e rifiuta i duplicati, e <code>bool rimuovi(const T&amp;)<\/code> che sfrutta l'ordinamento per fermarsi prima.<\/p>","soluzione":{"commento":"<p>In <code>rimuovi<\/code> il ciclo si ferma al primo valore non minore: in una lista ordinata, se lì non c'è il valore cercato, non c'è nemmeno più avanti.<\/p>","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 11.5 - Lista ordinata senza duplicati (classe template)\n#include <iostream>\nusing namespace std;\n\ntemplate <typename T>\nclass ListaOrdinata {\n    struct Nodo { T valore; Nodo* succ; };      // il nodo è un dettaglio interno della classe\n    Nodo* testa = nullptr;\npublic:\n    ~ListaOrdinata() { while (testa) { Nodo* t = testa->succ; delete testa; testa = t; } }\n\n    bool inserisci(const T& v) {                 // false se c'era già\n        Nodo* ant = nullptr;\n        Nodo* pos = testa;\n        while (pos != nullptr && pos->valore < v) { ant = pos; pos = pos->succ; }\n        if (pos != nullptr && pos->valore == v) return false;     // duplicato\n        Nodo* nuovo = new Nodo{v, pos};\n        if (ant == nullptr) testa = nuovo; else ant->succ = nuovo;\n        return true;\n    }\n    bool rimuovi(const T& v) {\n        Nodo* ant = nullptr;\n        Nodo* pos = testa;\n        while (pos != nullptr && pos->valore < v) { ant = pos; pos = pos->succ; }\n        if (pos == nullptr || !(pos->valore == v)) return false;  // essendo ordinata, mi fermo prima\n        if (ant == nullptr) testa = pos->succ; else ant->succ = pos->succ;\n        delete pos;\n        return true;\n    }\n    friend ostream& operator<<(ostream& os, const ListaOrdinata& l) {\n        for (Nodo* p = l.testa; p; p = p->succ) os << p->valore << \" \";\n        return os;\n    }\n};\n\nint main() {\n    ListaOrdinata<int> l;\n    int dati[] = {42, 7, 19, 7, 3, 42, 25};\n    for (int i = 0; i < 7; i++)\n        if (!l.inserisci(dati[i])) cout << dati[i] << \" gia' presente\" << endl;\n    cout << \"lista: \" << l << endl;\n    l.rimuovi(3); l.rimuovi(42); l.rimuovi(20);\n    cout << \"dopo aver tolto 3, 42 e 20: \" << l << endl;\n    return 0;\n}\n"}],"input":null,"output":"7 gia' presente\n42 gia' presente\nlista: 3 7 19 25 42 \ndopo aver tolto 3, 42 e 20: 7 19 25 \n"}},{"id":"m11-e06","modulo":11,"tipo":"es","numero":6,"titolo":"Invertire","difficolta":"medio","testo":"<p>Inverti una lista in loco in due modi: iterativo con tre puntatori e ricorsivo (inverti il resto, poi aggancia il nodo corrente in fondo). Le due funzioni restituiscono la nuova testa.<\/p>","soluzione":{"commento":"<p>Nella versione ricorsiva, <code>testa-&gt;succ<\/code> è (prima della chiamata) il secondo nodo, che dopo l'inversione del resto è diventato l'ultimo: gli si aggancia la testa.<\/p>","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 11.6 - Invertire una lista: iterativo (3 puntatori) e ricorsivo\n#include <iostream>\nusing namespace std;\n\nstruct Nodo { int valore; Nodo* succ; };\n\nNodo* invertiIter(Nodo* testa) {\n    Nodo* prec = nullptr;\n    Nodo* corr = testa;\n    while (corr != nullptr) {\n        Nodo* succ = corr->succ;     // salvo il resto della lista\n        corr->succ = prec;           // giro la freccia\n        prec = corr;\n        corr = succ;\n    }\n    return prec;                     // nuova testa\n}\n\n// Inverto il resto, poi aggancio me stesso in fondo\nNodo* invertiRic(Nodo* testa) {\n    if (testa == nullptr || testa->succ == nullptr) return testa;   // 0 o 1 nodi\n    Nodo* nuovaTesta = invertiRic(testa->succ);\n    testa->succ->succ = testa;       // il mio vecchio successivo ora punta a me\n    testa->succ = nullptr;           // io divento l'ultimo\n    return nuovaTesta;\n}\n\nvoid stampa(Nodo* p) { for (; p; p = p->succ) cout << p->valore << \" \"; cout << endl; }\n\nint main() {\n    Nodo* l = nullptr;\n    for (int v = 6; v >= 1; v--) l = new Nodo{v, l};\n    stampa(l);\n    l = invertiIter(l); stampa(l);\n    l = invertiRic(l);  stampa(l);\n    while (l) { Nodo* t = l->succ; delete l; l = t; }\n    return 0;\n}\n"}],"input":null,"output":"1 2 3 4 5 6 \n6 5 4 3 2 1 \n1 2 3 4 5 6 \n"}},{"id":"m11-e07","modulo":11,"tipo":"es","numero":7,"titolo":"Lista doppia del prof","difficolta":"medio","testo":"<p>Completa la <code>ListaDoppiaT<\/code> del codice del prof: aggiungi <code>inserisci(T valPrec, T val)<\/code>, che inserisce <code>val<\/code> come <b>precedente<\/b> del nodo che contiene <code>valPrec<\/code> (se esiste), una rimozione che sfrutta <code>prec<\/code>, e la stampa in avanti e all'indietro (tieni un puntatore alla coda).<\/p>","soluzione":{"commento":"<p>Nell'inserimento prima di <code>pos<\/code> si aggiornano quattro frecce: <code>nuovo-&gt;succ<\/code>, <code>nuovo-&gt;prec<\/code>, il <code>succ<\/code> del vecchio precedente (o la testa) e <code>pos-&gt;prec<\/code>.<\/p>","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 11.7 - Lista doppia (il \"TODO\" del prof): ins
