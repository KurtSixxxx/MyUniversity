a del Modulo 7)\n#include <iostream>\nusing namespace std;\n\nint confronti;\n\nint lineare(const int v[], int n, int x) {\n    for (int i = 0; i < n; i++) {\n        confronti++;\n        if (v[i] == x) return i;\n    }\n    return -1;\n}\n\nint binaria(const int v[], int n, int x) {      // v deve essere ORDINATO\n    int sx = 0, dx = n - 1;\n    while (sx <= dx) {\n        int m = (sx + dx) / 2;                  // guardo a metà\n        confronti++;\n        if (v[m] == x) return m;\n        if (v[m] < x) sx = m + 1;               // butto la metà sinistra\n        else dx = m - 1;                        // butto la metà destra\n    }\n    return -1;\n}\n\nint main() {\n    int dims[] = {1000, 100000, 1000000};\n    for (int t = 0; t < 3; t++) {\n        int n = dims[t];\n        int* v = new int[n];\n        for (int i = 0; i < n; i++) v[i] = 2 * i;        // ordinato, solo numeri pari\n        confronti = 0; lineare(v, n, -1); int cl = confronti;   // assente: caso peggiore\n        confronti = 0; binaria(v, n, -1); int cb = confronti;\n        cout << \"n = \" << n << \"\\tlineare: \" << cl << \"\\tbinaria: \" << cb << endl;\n        delete[] v;\n    }\n    return 0;\n}\n"}],"input":null,"output":"n = 1000        lineare: 1000   binaria: 9\nn = 100000      lineare: 100000 binaria: 16\nn = 1000000     lineare: 1000000        binaria: 19\n"}},{"id":"m06-e10","modulo":6,"tipo":"es","numero":10,"titolo":"Fibonacci","difficolta":"difficile","testo":"<p>Scrivi Fibonacci ricorsivo “ingenuo” e iterativo e confronta il numero di chiamate ricorsive con il numero di giri del ciclo per n = 10, 15, …, 35. Di quanto si moltiplicano le chiamate a ogni +5?<\/p>","soluzione":{"commento":"<p>A ogni +5 le chiamate si moltiplicano per circa 11: crescita esponenziale. Il ciclo invece cresce di 5 giri.<\/p>","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 6.10 - Fibonacci: ricorsione \"ingenua\" esponenziale contro ciclo lineare\n#include <iostream>\nusing namespace std;\n\nlong long chiamate;\n\nlong long fibRicorsivo(int n) {        // T(n) = T(n-1) + T(n-2) + 1  -> cresce come 2^n circa\n    chiamate++;\n    if (n <= 1) return n;\n    return fibRicorsivo(n - 1) + fibRicorsivo(n - 2);\n}\n\nlong long fibIterativo(int n, long long& giri) {   // un giro per ogni n -> O(n)\n    long long a = 0, b = 1;\n    giri = 0;\n    for (int i = 0; i < n; i++) {\n        giri++;\n        long long c = a + b;\n        a = b;\n        b = c;\n    }\n    return a;\n}\n\nint main() {\n    for (int n = 10; n <= 35; n += 5) {\n        chiamate = 0;\n        long long r = fibRicorsivo(n);\n        long long giri;\n        long long s = fibIterativo(n, giri);\n        cout << \"fib(\" << n << \") = \" << r << (r == s ? \"\" : \" ERRORE\")\n             << \"\\tchiamate ricorsive: \" << chiamate << \"\\tgiri del ciclo: \" << giri << endl;\n    }\n    // Ogni +5 su n moltiplica le chiamate per circa 11: crescita esponenziale.\n    return 0;\n}\n"}],"input":null,"output":"fib(10) = 55    chiamate ricorsive: 177 giri del ciclo: 10\nfib(15) = 610   chiamate ricorsive: 1973        giri del ciclo: 15\nfib(20) = 6765  chiamate ricorsive: 21891       giri del ciclo: 20\nfib(25) = 75025 chiamate ricorsive: 242785      giri del ciclo: 25\nfib(30) = 832040        chiamate ricorsive: 2692537     giri del ciclo: 30\nfib(35) = 9227465       chiamate ricorsive: 29860703    giri del ciclo: 35\n"}},{"id":"m07-pattern","modulo":7,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 7 (Algoritmi di Ordinamento e Ricerca).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 7 - Pattern: i 5 algoritmi di ordinamento + ricerca binaria\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\nusing namespace std;\n\nvoid scambia(int& a, int& b) { int t = a; a = b; b = t; }\n\n// BUBBLE SORT: confronta coppie vicine; ogni passata porta il massimo in fondo\nvoid bubbleSort(int a[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        bool scambiato = false;\n        for (int j = 0; j < n - 1 - i; j++)          // gli ultimi i sono già a posto\n            if (a[j] > a[j + 1]) { scambia(a[j], a[j + 1]); scambiato = true; }\n        if (!scambiato) break;                        // nessuno scambio: è già ordinato\n    }\n}\n\n// SELECTION SORT: cerca il minimo del resto e lo mette in posizione i\nvoid selectionSort(int a[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        int iMin = i;\n        for (int j = i + 1; j < n; j++)\n            if (a[j] < a[iMin]) iMin = j;\n        scambia(a[i], a[iMin]);\n    }\n}\n\n// INSERTION SORT: come le carte in mano; inserisce a[i] al suo posto tra i precedenti\nvoid insertionSort(int a[], int n) {\n    for (int i = 1; i < n; i++) {\n        int x = a[i];\n        int j = i - 1;\n        while (j >= 0 && a[j] > x) {      // sposto a destra i più grandi di x\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = x;                     // e metto x nel buco\n    }\n}\n\n// MERGE SORT: divide a metà, ordina le metà, le fonde\nvoid merge(int a[], int sx, int centro, int dx) {\n    int* b = new int[dx - sx + 1];        // array di appoggio\n    int i = sx, j = centro + 1, k = 0;\n    while (i <= centro && j <= dx)\n        b[k++] = (a[i] <= a[j]) ? a[i++] : a[j++];\n    while (i <= centro) b[k++] = a[i++];\n    while (j <= dx) b[k++] = a[j++];\n    for (k = 0; k < dx - sx + 1; k++) a[sx + k] = b[k];   // ricopio in a\n    delete[] b;\n}\nvoid mergeSort(int a[], int sx, int dx) {\n    if (sx >= dx) return;                 // caso base: 0 o 1 elemento\n    int centro = (sx + dx) / 2;\n    mergeSort(a, sx, centro);\n    mergeSort(a, centro + 1, dx);\n    merge(a, sx, centro, dx);\n}\n\n// QUICK SORT (versione delle slide): pivot centrale, due indici che si vengono incontro\nvoid quickSort(int a[], int sx, int dx) {\n    int i = sx, j = dx;\n    int pivot = a[(sx + dx) / 2];\n    while (i <= j) {\n        while (a[i] < pivot) i++;         // da sinistra: primo elemento \"fuori posto\"\n        while (a[j] > pivot) j--;         // da destra: primo elemento \"fuori posto\"\n        if (i <= j) { scambia(a[i], a[j]); i++; j--; }\n    }\n    if (sx < j) quickSort(a, sx, j);      // parte sinistra (tutti <= pivot)\n    if (i < dx) quickSort(a, i, dx);      // parte destra (tutti >= pivot)\n}\n\n// RICERCA BINARIA (solo su array ORDINATO)\nint ricercaBinaria(const int a[], int n, int x) {\n    int sx = 0, dx = n - 1;\n    while (sx <= dx) {\n        int m = (sx + dx) / 2;\n        if (a[m] == x) return m;\n        if (a[m] < x) sx = m + 1; else dx = m - 1;\n    }\n    return -1;\n}\n\nvoid stampa(const char* nome, const int a[], int n) {\n    cout << nome;\n    for (int i = 0; i < n; i++) cout << a[i] << \" \";\n    cout << endl;\n}\n\nint main() {\n    const int N = 8;\n    int base[N] = {38, 27, 43, 3, 9, 82, 10, 27};\n    int v[N];\n    void (*algoritmi[3])(int[], int) = {bubbleSort, selectionSort, insertionSort};\n    const char* nomi[3] = {\"bubble:    \", \"selection: \", \"insertion: \"};\n    for (int k = 0; k < 3; k++) {\n        for (int i = 0; i < N; i++) v[i] = base[i];\n        algoritmi[k](v, N);\n        stampa(nomi[k], v, N);\n    }\n    for (int i = 0; i < N; i++) v[i] = base[i];\n    mergeSort(v, 0, N - 1);  stampa(\"merge:     \", v, N);\n    for (int i = 0; i < N; i++) v[i] = base[i];\n    quickSort(v, 0, N - 1);  stampa(\"quick:     \", v, N);\n\n    cout << \"43 in posizione \" << ricercaBinaria(v, N, 43)\n         << \", 50 in posizione \" << ricercaBinaria(v, N, 50) << endl;\n    return 0;\n}\n"}],"input":null,"output":"bubble:    3 9 10 27 27 38 43 82 \nselection: 3 9 10 27 27 38 43 82 \ninsertion: 3 9 10 27 27 38 43 82 \nmerge:     3 9 10 27 27 38 43 82 \nquick:     3 9 10 27 27 38 43 82 \n43 in posizione 6, 50 in posizione -1\n"}},{"id":"m07-lab","modulo":7,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Prestazioni degli algoritmi di ordinamento (dalle slide)<\/b><\/p><p>Implementare un metodo <code>generaArrayCasuale(int* a, int num)<\/code> e gli algoritmi di ordinamento; generare array di dimensioni crescenti per potenze di 10 e confrontare le prestazioni degli algoritmi al crescere della dimensione, misurando il tempo con <code>&lt;chrono&gt;<\/code> come indicato nelle slide.<\/p><p><b>Step 1 – gli strumenti<\/b><br>Scrivi <code>generaArrayCasuale<\/code>, <code>copia<\/code> (per ordinare ogni volta la <i>stessa<\/i> sequenza) e <code>bool ordinato(const int* a, int n)<\/code> per verificare il risultato. Dichiara un contatore globale di confronti.<br><b>Concetto nuovo:<\/b> misurare in modo equo (stessi dati per tutti).<\/p><p><b>Step 2 – due algoritmi quadratici<\/b><br>Implementa bubble sort (con uscita anticipata) e insertion sort, incrementando il contatore a ogni confronto tra elementi.<br><b>Concetto nuovo:<\/b> algoritmi O(n²).<\/p><p><b>Step 3 – merge sort<\/b><br>Implementa il merge sort allocando l'array d'appoggio <b>una sola volta<\/b> in una funzione involucro <code>mergeSort(int a[], int n)<\/code> e passandolo alle chiamate ricorsive.<br><b>Concetto nuovo:<\/b> divide et impera, fusione, memoria aggiuntiva O(n).<\/p><p><b>Step 4 – quick sort<\/b><br>Implementa il quick sort con pivot centrale e partizione a due indici, come nelle slide, più l'involucro <code>quickSort(int a[], int n)<\/code>.<br><b>Concetto nuovo:<\/b> partizione, ordinamento in loco.<\/p><p><b>Step 5 – il confronto<\/b><br>Scrivi <code>misura(nome, puntatoreAFunzione, array, n)<\/code>, che copia l'array, azzera il contatore, cronometra l'ordinamento con <code>high_resolution_clock<\/code> e stampa confronti e millisecondi. Usala per n = 10², 10³, 10⁴, 10⁵ (i quadratici solo fino a 10⁴).<br><b>Concetto nuovo:<\/b> misurare i tempi reali; puntatori a funzione come parametri.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 7 - Laboratorio a step: prestazioni degli algoritmi di ordinamento (dalle slide)\n// Compila: g++ -O2 lab.cpp -o lab.exe\n#include <iostream>\n#include <cstdlib>\n#include <chrono>\n#include <iomanip>\nusing namespace std;\nusing namespace std::chrono;\n\nlong long confronti = 0;                 // contatore globale\n\n// ===== STEP 1 =====  Strumenti: array casuale, copia, verifica\nvoid generaArrayCasuale(int* a, int num) {\n    for (int i = 0; i < num; i++) a[i] = rand();   // 0 .. RAND_MAX (32767 con MinGW)\n}\nvoid copia(const int* da, int* a, int n) { for (int i = 0; i < n; i++) a[i] = da[i]; }\nbool ordinato(const int* a, int n) {\n    for (int i = 1; i < n; i++) if (a[i - 1] > a[i]) return false;\n    return true;\n}\nvoid scambia(int& a, int& b) { int t = a; a = b; b = t; }\n\n// ===== STEP 2 =====  Gli algoritmi quadratici (con contatore)\nvoid bubbleSort(int a[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        bool scambiato = false;\n        for (int j = 0; j < n - 1 - i; j++) {\n            confronti++;\n            if (a[j] > a[j + 1]) { scambia(a[j], a[j + 1]); scambiato = true; }\n        }\n        if (!scambiato) break;\n    }\n}\nvoid insertionSort(int a[], int n) {\n    for (int i = 1; i < n; i++) {\n        int x = a[i], j = i - 1;\n        while (j >= 0 && (confronti++, a[j] > x)) { a[j + 1] = a[j]; j--; }\n        a[j + 1] = x;\n    }\n}\n\n// ===== STEP 3 =====  Merge sort\nvoid merge(int a[], int sx, int c, int dx, int* b) {    // b: appoggio allocato UNA volta\n    int i = sx, j = c + 1, k = sx;\n    while (i <= c && j <= dx) {\n        confronti++;\n        b[k++] = (a[i] <= a[j]) ? a[i++] : a[j++];\n    }\n    while (i <= c) b[k++] = a[i++];\n    while (j <= dx) b[k++] = a[j++];\n    for (k = sx; k <= dx; k++) a[k] = b[k];\n}\nvoid mergeSort(int a[], int sx, int dx, int* b) {\n    if (sx >= dx) return;\n    int c = (sx + dx) / 2;\n    mergeSort(a, sx, c, b);\n    mergeSort(a, c + 1, dx, b);\n    merge(a, sx, c, dx, b);\n}\nvoid mergeSort(int a[], int n) {                        // \"involucro\" comodo\n    int* b = new int[n];\n    mergeSort(a, 0, n - 1, b);\n    delete[] b;\n}\n\n// ===== STEP 4 =====  Quick sort (pivot centrale, come nelle slide)\nvoid quickSort(int a[], int sx, int dx) {\n    int i = sx, j = dx, pivot = a[(sx + dx) / 2];\n    while (i <= j) {\n        while (confronti++, a[i] < pivot) i++;\n        while (confronti++, a[j] > pivot) j--;\n        if (i <= j) { scambia(a[i], a[j]); i++; j--; }\n    }\n    if (sx < j) quickSort(a, sx, j);\n    if (i < dx) quickSort(a, i, dx);\n}\nvoid quickSort(int a[], int n) { quickSort(a, 0, n - 1); }\n\n// ===== STEP 5 =====  Misura: confronti e millisecondi\nvoid misura(const char* nome, void (*ordina)(int[], int), const int* orig, int n) {\n    int* v = new int[n];\n    copia(orig, v, n);\n    confronti = 0;\n    auto t1 = high_resolution_clock::now();\n    ordina(v, n);\n    auto t2 = high_resolution_clock::now();\n    duration<double, milli> ms = t2 - t1;\n    cout << \"  \" << nome << \"  confronti: \" << setw(10) << confronti      // setw: colonna larga 10\n         << \"   tempo: \" << setw(9) << fixed << setprecision(3) << ms.count() << \" ms\"\n         << (ordinato(v, n) ? \"\" : \"  ERRORE: non ordinato!\") << endl;\n    delete[] v;\n}\n\nint main() {\n    srand(111222333);\n    for (int n = 100; n <= 100000; n *= 10) {\n        int* orig = new int[n];\n        generaArrayCasuale(orig, n);\n        cout << \"n = \" << n << endl;\n        if (n <= 10000) {                                // i quadratici oltre diventano lenti\n            misura(\"bubble   \", bubbleSort, orig, n);\n            misura(\"insertion\", insertionSort, orig, n);\n        }\n        misura(\"merge    \", mergeSort, orig, n);\n        misura(\"quick    \", quickSort, orig, n);\n        delete[] orig;\n    }\n    return 0;\n}\n"}],"input":null,"output":"n = 100\n  bubble     confronti:       4845   tempo:     0.022 ms\n  insertion  confronti:       2590   tempo:     0.007 ms\n  merge      confronti:        546   tempo:     0.007 ms\n  quick      confronti:        967   tempo:     0.006 ms\nn = 1000\n  bubble     confronti:     495035   tempo:     1.497 ms\n  insertion  confronti:     233975   tempo:     0.471 ms\n  merge      confronti:       8699   tempo:     0.082 ms\n  quick      confronti:      12862   tempo:     0.069 ms\nn = 10000\n  bubble     confronti:   49990814   tempo:   168.715 ms\n  insertion  confronti:   25064257   tempo:    54.130 ms\n  merge      confronti:     120343   tempo:     1.053 ms\n  quick      confronti:     175546   tempo:     0.997 ms\nn = 100000\n  merge      confronti:    1536381   tempo:    13.681 ms\n  quick      confronti:    2326409   tempo:    11.686 ms\n"}},{"id":"m07-e01","modulo":7,"tipo":"es","numero":1,"titolo":"Bubble sort e passate","difficolta":"facile","testo":"<p>Modifica il bubble sort con uscita anticipata in modo che restituisca il numero di passate eseguite. Provalo su un array già ordinato, su uno quasi ordinato (due elementi scambiati) e su uno al contrario.<\/p>","soluzione":{"commento":"","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 7.1 - Bubble sort con uscita anticipata: quante passate?\n#include <iostream>\nusing namespace std;\n\nint bubbleSort(int a[], int n) {          // restituisce il numero di passate fatte\n    int passate = 0;\n    for (int i = 0; i < n - 1; i++) {\n        passate++;\n        bool scambiato = false;\n        for (int j = 0; j < n - 1 - i; j++)\n            if (a[j] > a[j + 1]) {\n                int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n                scambiato = true;\n            }\n        if (!scambiato) break;            // passata senza scambi: ho finito\n    }\n    return passate;\n}\n\nint main() {\n    int ordinato[] = {1, 2, 3, 4, 5, 6, 7, 8};\n    int quasi[]    = {1, 2, 3, 5, 4, 6, 7, 8};\n    int inverso[]  = {8, 7, 6, 5, 4, 3, 2, 1};\n    cout << \"gia' ordinato: \" << bubbleSort(ordinato, 8) << \" passate (caso migliore, O(n))\" << endl;\n    cout << \"quasi ordinato: \" << bubbleSort(quasi, 8) << \" passate\" << endl;\n    cout << \"al contrario:  \" << bubbleSort(inverso, 8) << \" passate (caso peggiore, O(n^2))\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"gia' ordinato: 1 passate (caso migliore, O(n))\nquasi ordinato: 2 passate\nal contrario:  7 passate (caso peggiore, O(n^2))\n"}},{"id":"m07-e02","modulo":7,"tipo":"es","numero":2,"titolo":"Selection sort decrescente","difficolta":"facile","testo":"<p>Scrivi un selection sort che ordina in modo <b>decrescente<\/b> (cerca il massimo) e stampa l'array dopo ogni passata.<\/p>","soluzione":{"commento":"","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 7.2 - Selection sort decrescente, con stampa di ogni passata\n#include <iostream>\nusing namespace std;\n\nvoid stampa(const int a[], int n) {\n    for (int i = 0; i < n; i++) cout << a[i] << \" \";\n    cout << endl;\n}\n\nvoid selectionSortDecrescente(int a[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        int iMax = i;                              // cerco il MASSIMO del resto\n        for (int j = i + 1; j < n; j++)\n            if (a[j] > a[iMax]) iMax = j;\n        int t = a[i]; a[i] = a[iMax]; a[iMax] = t;\n        cout << \"dopo la passata \" << i + 1 << \": \";\n        stampa(a, n);\n    }\n}\n\nint main() {\n    int v[] = {29, 10, 14, 37, 13};\n    selectionSortDecrescente(v, 5);\n    return 0;\n}\n"}],"input":null,"output":"dopo la passata 1: 37 10 14 29 13 \ndopo la passata 2: 37 29 14 10 13 \ndopo la passata 3: 37 29 14 10 13 \ndopo la passata 4: 37 29 14 13 10 \n"}},{"id":"m07-e03","modulo":7,"tipo":"es","numero":3,"titolo":"Insertion sort di stringhe","difficolta":"facile","testo":"<p>Ordina in ordine alfabetico un array di <code>string<\/code> con l'insertion sort. Inserisci anche un nome che inizia con la minuscola: dove finisce, e perché?<\/p>","soluzione":{"commento":"<p>Nel codice ASCII le maiuscole (65–90) vengono prima delle minuscole (97–122), quindi “bianchi” va dopo “Verdi”.<\/p>","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 7.3 - Insertion sort su stringhe (ordine alfabetico)\n#include <iostream>\n#include <string>\nusing namespace std;\n\nvoid insertionSort(string a[], int n) {\n    for (int i = 1; i < n; i++) {\n        string x = a[i];\n        int j = i - 1;\n        while (j >= 0 && a[j] > x) {      // per le string, > è l'ordine alfabetico\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = x;\n    }\n}\n\nint main() {\n    string nomi[] = {\"Rossi\", \"Bianchi\", \"Verdi\", \"Neri\", \"Esposito\", \"bianchi\"};\n    insertionSort(nomi, 6);\n    for (int i = 0; i < 6; i++) cout << nomi[i] << endl;\n    // \"bianchi\" minuscolo finisce in fondo: le minuscole vengono DOPO le maiuscole (codici ASCII)\n    return 0;\n}\n"}],"input":null,"output":"Bianchi\nEsposito\nNeri\nRossi\nVerdi\nbianchi\n"}},{"id":"m07-e04","modulo":7,"tipo":"es","numero":4,"titolo":"Ricerca binaria al rallentatore","difficolta":"facile","testo":"<p>Scrivi la ricerca binaria iterativa stampando a ogni passo <code>sx<\/code>, <code>dx<\/code>, <code>m<\/code> e <code>a[m]<\/code>. Cerca un valore presente e uno assente.<\/p>","soluzione":{"commento":"<p>Il risultato si salva in una variabile <i>prima<\/i> di stamparlo: se la chiamata fosse dentro lo stesso <code>cout<\/code>, la scritta <code>-&gt; indice<\/code> comparirebbe prima dei passi.<\/p>","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 7.4 - Ricerca binaria \"al rallentatore\"\n#include <iostream>\nusing namespace std;\n\nint ricercaBinaria(const int a[], int n, int x) {\n    int sx = 0, dx = n - 1, passo = 0;\n    while (sx <= dx) {\n        int m = (sx + dx) / 2;\n        passo++;\n        cout << \"  passo \" << passo << \": sx=\" << sx << \" dx=\" << dx\n             << \" m=\" << m << \" a[m]=\" << a[m] << endl;\n        if (a[m] == x) return m;\n        if (a[m] < x) sx = m + 1;        // x è più a destra\n        else dx = m - 1;                 // x è più a sinistra\n    }\n    return -1;\n}\n\nint main() {\n    int a[] = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};\n    cout << \"cerco 23:\" << endl;\n    int r = ricercaBinaria(a, 10, 23);     // prima la chiamata (che stampa i passi)...\n    cout << \"-> indice \" << r << endl;    // ...poi il risultato\n    cout << \"cerco 7:\" << endl;\n    r = ricercaBinaria(a, 10, 7);\n    cout << \"-> indice \" << r << endl;\n    return 0;\n}\n"}],"input":null,"output":"cerco 23:\n  passo 1: sx=0 dx=9 m=4 a[m]=16\n  passo 2: sx=5 dx=9 m=7 a[m]=56\n  passo 3: sx=5 dx=6 m=5 a[m]=23\n-> indice 5\ncerco 7:\n  passo 1: sx=0 dx=9 m=4 a[m]=16\n  passo 2: sx=0 dx=3 m=1 a[m]=5\n  passo 3: sx=2 dx=3 m=2 a[m]=8\n-> indice -1\n"}},{"id":"m07-e05","modulo":7,"tipo":"es","numero":5,"titolo":"Ricerca binaria ricorsiva","difficolta":"medio","testo":"<p>Scrivi la ricerca binaria in versione ricorsiva e una funzione <code>posizioneInserimento(a, n, x)<\/code> che restituisce la prima posizione in cui <code>x<\/code> si può inserire mantenendo l'ordine (con duplicati: la prima occorrenza).<\/p>","soluzione":{"commento":"","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 7.5 - Ricerca binaria ricorsiva e posizione di inserimento\n#include <iostream>\nusing namespace std;\n\nint binariaRic(const int a[], int sx, int dx, int x) {\n    if (sx > dx) return -1;                         // caso base: intervallo vuoto\n    int m = (sx + dx) / 2;\n    if (a[m] == x) return m;\n    if (a[m] < x) return binariaRic(a, m + 1, dx, x);\n    return binariaRic(a, sx, m - 1, x);\n}\n\n// Prima posizione in cui x può essere inserito mantenendo l'array ordinato\nint posizioneInserimento(const int a[], int n, int x) {\n    int sx = 0, dx = n;                             // nota: dx = n, non n-1\n    while (sx < dx) {\n        int m = (sx + dx) / 2;\n        if (a[m] < x) sx = m + 1;\n        else dx = m;\n    }\n    return sx;\n}\n\nint main() {\n    int a[] = {3, 8, 8, 15, 21, 40};\n    int n = 6;\n    int prove[] = {15, 4, 8, 50, 1};\n    for (int k = 0; k < 5; k++) {\n        int x = prove[k];\n        cout << x << \": trovato in \" << binariaRic(a, 0, n - 1, x)\n             << \", si inserirebbe in posizione \" << posizioneInserimento(a, n, x) << endl;\n    }\n    return 0;\n}\n"}],"input":null,"output":"15: trovato in 3, si inserirebbe in posizione 3\n4: trovato in -1, si inserirebbe in posizione 1\n8: trovato in 2, si inserirebbe in posizione 1\n50: trovato in -1, si inserirebbe in posizione 6\n1: trovato in -1, si inserirebbe in posizione 0\n"}},{"id":"m07-e06","modulo":7,"tipo":"es","numero":6,"titolo":"Merge sort stabile di studenti","difficolta":"medio","testo":"<p>Ordina per voto con il merge sort un array di <code>struct Studente<\/code> (nome, voto) già in ordine alfabetico, e verifica che a parità di voto l'ordine alfabetico resti. Cosa succederebbe usando <code>&lt;<\/code> invece di <code>&lt;=<\/code> nella fusione?<\/p>","soluzione":{"commento":"<p>Con <code>&lt;<\/code>, a parità di voto verrebbe preso prima l'elemento della metà destra, e l'ordine alfabetico si romperebbe.<\/p>","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 7.6 - MergeSort di oggetti per chiave: è STABILE\n#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Studente {\n    string nome;\n    int voto;\n};\n\nvoid merge(Studente a[], int sx, int c, int dx) {\n    Studente* b = new Studente[dx - sx + 1];\n    int i = sx, j = c + 1, k = 0;\n    while (i <= c && j <= dx)\n        // \"<=\" e non \"<\": a parità di voto passa prima quello di SINISTRA -> stabilità\n        b[k++] = (a[i].voto <= a[j].voto) ? a[i++] : a[j++];\n    while (i <= c) b[k++] = a[i++];\n    while (j <= dx) b[k++] = a[j++];\n    for (k = 0; k <= dx - sx; k++) a[sx + k] = b[k];\n    delete[] b;\n}\n\nvoid mergeSort(Studente a[], int sx, int dx) {\n    if (sx >= dx) return;\n    int c = (sx + dx) / 2;\n    mergeSort(a, sx, c);\n    mergeSort(a, c + 1, dx);\n    merge(a, sx, c, dx);\n}\n\nint main() {\n    // già in ordine alfabetico\n    Studente s[] = {{\"Anna\", 27}, {\"Bruno\", 30}, {\"Carla\", 27}, {\"Dario\", 18},\n                    {\"Elena\", 30}, {\"Franco\", 24}, {\"Gina\", 27}};\n    mergeSort(s, 0, 6);\n    for (int i = 0; i < 7; i++) cout << s[i].voto << \"  \" << s[i].nome << endl;\n    // A parità di voto i nomi restano in ordine alfabetico: Anna, Carla, Gina\n    return 0;\n}\n"}],"input":null,"output":"18  Dario\n24  Franco\n27  Anna\n27  Carla\n27  Gina\n30  Bruno\n30  Elena\n"}},{"id":"m07-e07","modulo":7,"tipo":"es","numero":7,"titolo":"Il caso peggiore del quick sort","difficolta":"medio","testo":"<p>Implementa un quick sort con pivot sul <b>primo<\/b> elemento e confronta i suoi confronti con quelli della versione delle slide (pivot centrale) su un array già ordinato di 2000 elementi.<\/p>","soluzione":{"commento":"","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 7.7 - QuickSort: il caso peggiore dipende dalla scelta del pivot\n#include <iostream>\nusing namespace std;\n\nlong long confronti;\n\n// Partizione con pivot = PRIMO elemento (versione \"da manuale\", vulnerabile)\nint partiziona(int a[], int sx, int dx) {\n    int pivot = a[sx];\n    int i = sx;                                    // ultimo elemento < pivot\n    for (int j = sx + 1; j <= dx; j++) {\n        confronti++;\n        if (a[j] < pivot) { i++; int t = a[i]; a[i] = a[j]; a[j] = t; }\n    }\n    int t = a[sx]; a[sx] = a[i]; a[i] = t;         // pivot al suo posto definitivo\n    return i;\n}\nvoid quickPrimo(int a[], int sx, int dx) {\n    if (sx >= dx) return;\n    int p = partiziona(a, sx, dx);\n    quickPrimo(a, sx, p - 1);\n    quickPrimo(a, p + 1, dx);\n}\n\n// Versione delle slide: pivot = elemento CENTRALE\nvoid quickCentro(int a[], int sx, int dx) {\n    int i = sx, j = dx, pivot = a[(sx + dx) / 2];\n    while (i <= j) {\n        while (confronti++, a[i] < pivot) i++;\n        while (confronti++, a[j] > pivot) j--;\n        if (i <= j) { int t = a[i]; a[i] = a[j]; a[j] = t; i++; j--; }\n    }\n    if (sx < j) quickCentro(a, sx, j);\n    if (i < dx) quickCentro(a, i, dx);\n}\n\nint main() {\n    const int N = 2000;\n    int* v = new int[N];\n    for (int i = 0; i < N; i++) v[i] = i;          // GIA' ORDINATO\n    confronti = 0; quickPrimo(v, 0, N - 1);\n    cout << \"ordinato, pivot primo:   \" << confronti << \" confronti (circa n^2/2 = \" << (long long)N * N / 2 << \")\" << endl;\n    for (int i = 0; i < N; i++) v[i] = i;\n    confronti = 0; quickCentro(v, 0, N - 1);\n    cout << \"ordinato, pivot centrale: \" << confronti << \" confronti\" << endl;\n    delete[] v;\n    return 0;\n}\n"}],"input":null,"output":"ordinato, pivot primo:   1999000 confronti (circa n^2/2 = 2000000)\nordinato, pivot centrale: 20010 confronti\n"}},{"id":"m07-e08","modulo":7,"tipo":"es","numero":8,"titolo":"Counting sort dei voti","difficolta":"medio","testo":"<p>Ordina 20 voti casuali tra 18 e 30 senza confronti: conta quante volte compare ogni voto in un array di contatori, poi riscrivi l'array. Che complessità ha?<\/p>","soluzione":{"commento":"<p>O(n + k), con k = numero di valori possibili (13).<\/p>","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 7.8 - Counting sort: ordinare voti 18-30 SENZA confronti, in O(n + k)\n#include <iostream>\n#include <cstdlib>\nusing namespace std;\n\nvoid countingSort(int a[], int n, int minimo, int massimo) {\n    int k = massimo - minimo + 1;\n    int* conta = new int[k];\n    for (int i = 0; i < k; i++) conta[i] = 0;\n    for (int i = 0; i < n; i++) conta[a[i] - minimo]++;      // 1. conto le occorrenze\n    int pos = 0;\n    for (int v = 0; v < k; v++)                              // 2. riscrivo in ordine\n        for (int c = 0; c < conta[v]; c++) a[pos++] = v + minimo;\n    delete[] conta;\n}\n\nint main() {\n    srand(111222333);\n    const int N = 20;\n    int voti[N];\n    for (int i = 0; i < N; i++) voti[i] = 18 + rand() % 13;  // 18..30\n    countingSort(voti, N, 18, 30);\n    for (int i = 0; i < N; i++) cout << voti[i] << \" \";\n    cout << endl;\n    return 0;\n}\n"}],"input":null,"output":"19 20 20 21 21 22 22 22 22 22 26 26 26 27 28 28 28 29 30 30 \n"}},{"id":"m07-e09","modulo":7,"tipo":"es","numero":9,"titolo":"Ordinare con un criterio a scelta","difficolta":"difficile","testo":"<p>Scrivi <code>template &lt;typename T&gt; void ordina(T a[], int n, bool (*minore)(const T&amp;, const T&amp;))<\/code> e usalo per ordinare un array di <code>Persona<\/code> per età, per nome e per età decrescente, e un array di <code>int<\/code> in ordine decrescente, passando ogni volta una funzione di confronto diversa.<\/p>","soluzione":{"commento":"","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 7.9 - Ordinamento generico con criterio a scelta (template + puntatore a funzione)\n#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Persona {\n    string nome;\n    int eta;\n};\n\n// \"minore\" decide l'ordine: lo sceglie chi chiama\ntemplate <typename T>\nvoid ordina(T a[], int n, bool (*minore)(const T&, const T&)) {\n    for (int i = 1; i < n; i++) {                 // insertion sort\n        T x = a[i];\n        int j = i - 1;\n        while (j >= 0 && minore(x, a[j])) { a[j + 1] = a[j]; j--; }\n        a[j + 1] = x;\n    }\n}\n\nbool perEta(const Persona& a, const Persona& b) { return a.eta < b.eta; }\nbool perNome(const Persona& a, const Persona& b) { return a.nome < b.nome; }\nbool perEtaDecrescente(const Persona& a, const Persona& b) { return a.eta > b.eta; }\nbool decrescente(const int& a, const int& b) { return a > b; }\n\nvoid stampa(const Persona p[], int n) {\n    for (int i = 0; i < n; i++) cout << p[i].nome << \"(\" << p[i].eta << \") \";\n    cout << endl;\n}\n\nint main() {\n    Persona p[] = {{\"Marco\", 31}, {\"Ada\", 22}, {\"Luca\", 45}, {\"Bea\", 19}};\n    ordina(p, 4, perEta);             stampa(p, 4);\n    ordina(p, 4, perNome);            stampa(p, 4);\n    ordina(p, 4, perEtaDecrescente);  stampa(p, 4);\n    int v[] = {4, 9, 1, 7};\n    ordina(v, 4, decrescente);\n    for (int i = 0; i < 4; i++) cout << v[i] << \" \";\n    cout << endl;\n    return 0;\n}\n"}],"input":null,"output":"Bea(19) Ada(22) Marco(31) Luca(45) \nAda(22) Bea(19) Luca(45) Marco(31) \nLuca(45) Marco(31) Ada(22) Bea(19) \n9 7 4 1 \n"}},{"id":"m07-e10","modulo":7,"tipo":"es","numero":10,"titolo":"Sfruttare l'ordine","difficolta":"difficile","testo":"<p>Su array ordinati scrivi in O(n): (a) una funzione che trova due elementi con somma data usando due indici che si vengono incontro; (b) una funzione che trova gli elementi comuni a due array, con un procedimento simile alla fusione.<\/p>","soluzione":{"commento":"","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 7.10 - Sfruttare l'ordinamento: coppia con somma data e intersezione, in O(n)\n#include <iostream>\nusing namespace std;\n\n// Array ORDINATO: esiste una coppia con somma x? Due indici che si vengono incontro.\nbool coppiaConSomma(const int a[], int n, int x, int& i, int& j) {\n    i = 0; j = n - 1;\n    while (i < j) {\n        int s = a[i] + a[j];\n        if (s == x) return true;\n        if (s < x) i++;            // serve una somma più grande: avanzo a sinistra\n        else j--;                  // serve una somma più piccola: arretro a destra\n    }\n    return false;\n}\n\n// Elementi comuni a due array ORDINATI (come il merge)\nint intersezione(const int a[], int na, const int b[], int nb, int out[]) {\n    int i = 0, j = 0, k = 0;\n    while (i < na && j < nb) {\n        if (a[i] < b[j]) i++;\n        else if (a[i] > b[j]) j++;\n        else { out[k++] = a[i]; i++; j++; }\n    }\n    return k;\n}\n\nint main() {\n    int a[] = {1, 3, 4, 7, 10, 12, 15};\n    int i, j;\n    int obiettivi[] = {22, 8, 2};\n    for (int t = 0; t < 3; t++) {\n        if (coppiaConSomma(a, 7, obiettivi[t], i, j))\n            cout << obiettivi[t] << \" = \" << a[i] << \" + \" << a[j] << endl;\n        else\n            cout << obiettivi[t] << \": nessuna coppia\" << endl;\n    }\n    int b[] = {2, 3, 7, 8, 12, 20};\n    int comuni[6];\n    int k = intersezione(a, 7, b, 6, comuni);\n    cout << \"comuni: \";\n    for (int t = 0; t < k; t++) cout << comuni[t] << \" \";\n    cout << endl;\n    return 0;\n}\n"}],"input":null,"output":"22 = 7 + 15\n8 = 1 + 7\n2: nessuna coppia\ncomuni: 3 7 12 \n"}},{"id":"m08-pattern","modulo":8,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 8 (Ricorsione).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 8 - Pattern: una funzione ricorsiva che RACCONTA cosa sta facendo\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\nusing namespace std;\n\n// Stampa 4 spazi per ogni livello di profondità: così si vede chi ha chiamato chi\nvoid rientra(int livello) {\n    for (int i = 0; i < livello; i++) cout << \"    \";\n}\n\n// Fattoriale: n! = n * (n-1)!   e   0! = 1\n// Il parametro \"livello\" serve SOLO per la stampa: l'algoritmo non ne ha bisogno.\nint fattoriale(int n, int livello) {\n    rientra(livello);\n    cout << \"fattoriale(\" << n << \"): \";\n    if (n == 0) {                                   // 1. CASO BASE: so rispondere subito\n        cout << \"caso base, restituisco 1\" << endl;\n        return 1;\n    }\n    cout << \"non lo so ancora, chiedo fattoriale(\" << n - 1 << \")\" << endl;\n    int risultatoPiccolo = fattoriale(n - 1, livello + 1);   // 2. PASSO RICORSIVO: problema più piccolo\n    int risultato = n * risultatoPiccolo;                    // 3. uso la risposta per la mia\n    rientra(livello);\n    cout << \"fattoriale(\" << n << \"): mi e' tornato \" << risultatoPiccolo\n         << \", restituisco \" << n << \" * \" << risultatoPiccolo << \" = \" << risultato << endl;\n    return risultato;\n}\n\n// La stessa funzione, SENZA stampe: ecco come la scriveresti all'esame\nint fatt(int n) {\n    if (n == 0) return 1;           // caso base\n    return n * fatt(n - 1);         // passo ricorsivo\n}\n\n// Per confronto: la versione iterativa (con un ciclo)\nint fattIterativo(int n) {\n    int r = 1;\n    for (int i = 2; i <= n; i++) r *= i;\n    return r;\n}\n\nint main() {\n    int r = fattoriale(4, 0);         // prima la chiamata (che stampa la traccia)...\n    cout << \"Risultato: \" << r << endl << endl;   // ...poi il risultato\n    cout << \"fatt(5) = \" << fatt(5) << \", fattIterativo(5) = \" << fattIterativo(5) << endl;\n    return 0;\n}\n"}],"input":null,"output":"fattoriale(4): non lo so ancora, chiedo fattoriale(3)\n    fattoriale(3): non lo so ancora, chiedo fattoriale(2)\n        fattoriale(2): non lo so ancora, chiedo fattoriale(1)\n            fattoriale(1): non lo so ancora, chiedo fattoriale(0)\n                fattoriale(0): caso base, restituisco 1\n            fattoriale(1): mi e' tornato 1, restituisco 1 * 1 = 1\n        fattoriale(2): mi e' tornato 1, restituisco 2 * 1 = 2\n    fattoriale(3): mi e' tornato 2, restituisco 3 * 2 = 6\nfattoriale(4): mi e' tornato 6, restituisco 4 * 6 = 24\nRisultato: 24\n\nfatt(5) = 120, fattIterativo(5) = 120\n"}},{"id":"m08-lab","modulo":8,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Una cassetta degli attrezzi ricorsivi<\/b><\/p><p>Scrivere, <b>senza usare cicli<\/b> (salvo dove indicato), un insieme di funzioni ricorsive su numeri, array, stringhe e liste, e provarle nel <code>main<\/code>. Per ogni funzione, prima di scriverla, rispondi alle tre domande del “passo per passo”.<\/p><p><b>Step 1 – prima o dopo<\/b><br>Scrivi <code>contoAllaRovescia(n)<\/code> (stampa n, …, 1) e <code>contoInAvanti(n)<\/code> (stampa 1, …, n). Devono differire <b>solo<\/b> nella posizione del <code>cout<\/code> rispetto alla chiamata.<br><b>Concetto nuovo:<\/b> andata e ritorno.<\/p><p><b>Step 2 – il primo più il resto<\/b><br>Scrivi <code>int somma(const int v[], int n)<\/code>, che restituisce <code>v[0]<\/code> più la somma del resto dell'array (<code>v + 1<\/code>, <code>n - 1<\/code>).<br><b>Concetto nuovo:<\/b> ricorsione lineare su array, uso del valore restituito.<\/p><p><b>Step 3 – dividi a metà<\/b><br>Scrivi <code>int massimo(const int v[], int sx, int dx)<\/code> come nelle slide: se c'è un solo elemento lo restituisci, altrimenti calcoli il massimo delle due metà e restituisci il maggiore.<br><b>Concetto nuovo:<\/b> due chiamate ricorsive, divide et impera.<\/p><p><b>Step 4 – stringhe<\/b><br>Scrivi <code>bool palindromo(const string&amp; s, int i, int j)<\/code> e provala su “radar”, “osso”, “ciao”, “a”, “anna”.<br><b>Concetto nuovo:<\/b> due indici che si avvicinano, caso base doppio.<\/p><p><b>Step 5 – liste<\/b><br>Definisci <code>struct Nodo { int valore; Nodo* next; };<\/code>, costruisci la lista 1 → 2 → 3 → 4 con <code>new<\/code> (un ciclo qui è permesso) e scrivi <code>lunghezza(Nodo*)<\/code>, <code>stampaAlContrario(Nodo*)<\/code> e <code>distruggi(Nodo*)<\/code>, che libera tutti i nodi.<br><b>Concetto nuovo:<\/b> ricorsione su strutture collegate (anteprima del Modulo 11).<\/p><p><b>Step 6 – di coda<\/b><br>Riscrivi la somma come ricorsione di coda con un accumulatore (<code>sommaCoda(v, n, 0)<\/code>), poi trasformala in un ciclo <code>while<\/code> seguendo la regola “i parametri diventano variabili”.<br><b>Concetto nuovo:<\/b> ricorsione di coda, da ricorsione a iterazione.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 8 - Laboratorio a step: ricorsione su numeri, array, stringhe e liste\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <string>\nusing namespace std;\n\n// ===== STEP 1 =====  Il PRIMA e il DOPO della chiamata ricorsiva\nvoid contoAllaRovescia(int n) {          // stampa PRIMA di chiamare: n, n-1, ..., 1\n    if (n == 0) return;                  // caso base: non faccio niente\n    cout << n << \" \";\n    contoAllaRovescia(n - 1);\n}\nvoid contoInAvanti(int n) {              // stampa DOPO la chiamata: 1, 2, ..., n\n    if (n == 0) return;\n    contoInAvanti(n - 1);                // prima faccio contare fino a n-1...\n    cout << n << \" \";                    // ...poi aggiungo il mio numero\n}\n\n// ===== STEP 2 =====  Somma di un array: \"il primo + la somma del resto\"\nint somma(const int v[], int n) {\n    if (n == 0) return 0;                       // array vuoto: somma 0\n    return v[0] + somma(v + 1, n - 1);          // v + 1 = l'array che parte dal secondo elemento\n}\n\n// ===== STEP 3 =====  Massimo con divide et impera (esercizio delle slide)\nint massimo(const int v[], int sx, int dx) {\n    if (sx == dx) return v[sx];                 // un solo elemento: è lui il massimo\n    int m = (sx + dx) / 2;\n    int maxSx = massimo(v, sx, m);              // massimo della metà sinistra\n    int maxDx = massimo(v, m + 1, dx);          // massimo della metà destra\n    return (maxSx > maxDx) ? maxSx : maxDx;     // il più grande dei due\n}\n\n// ===== STEP 4 =====  Palindromo: primo == ultimo E il \"dentro\" è palindromo\nbool palindromo(const string& s, int i, int j) {\n    if (i >= j) return true;                    // 0 o 1 carattere: sempre palindromo\n    if (s[i] != s[j]) return false;             // estremi diversi: fallito subito\n    return palindromo(s, i + 1, j - 1);         // controllo la parte interna\n}\n\n// ===== STEP 5 =====  Ricorsione su una lista (anteprima del Modulo 11)\nstruct Nodo {\n    int valore;\n    Nodo* next;          // puntatore al nodo successivo (nullptr = fine lista)\n};\nint lunghezza(Nodo* p) {\n    if (p == nullptr) return 0;                 // lista vuota\n    return 1 + lunghezza(p->next);              // io + la lunghezza del resto\n}\nvoid stampaAlContrario(Nodo* p) {\n    if (p == nullptr) return;\n    stampaAlContrario(p->next);                 // prima stampa il resto...\n    cout << p->valore << \" \";                   // ...poi me (come contoInAvanti)\n}\nvoid distruggi(Nodo* p) {                       // libera la memoria, ricorsivamente\n    if (p == nullptr) return;\n    distruggi(p->next);\n    delete p;\n}\n\n// ===== STEP 6 =====  Ricorsione di coda: l'accumulatore porta avanti il risultato\nint sommaCoda(const int v[], int n, int accumulatore) {\n    if (n == 0) return accumulatore;            // il risultato è già pronto\n    return sommaCoda(v + 1, n - 1, accumulatore + v[0]);   // ULTIMA cosa che faccio\n}\nint sommaCiclo(const int v[], int n) {          // la stessa cosa trasformata in ciclo\n    int accumulatore = 0;\n    while (n != 0) { accumulatore += v[0]; v = v + 1; n = n - 1; }\n    return accumulatore;\n}\n\nint main() {\n    cout << \"STEP 1: \"; contoAllaRovescia(5); cout << \"| \"; contoInAvanti(5); cout << endl;\n\n    int v[] = {7, 3, 12, 5, 9, 1};\n    cout << \"STEP 2: somma = \" << somma(v, 6) << endl;\n    cout << \"STEP 3: massimo = \" << massimo(v, 0, 5) << endl;\n\n    string parole[] = {\"radar\", \"osso\", \"ciao\", \"a\", \"anna\"};\n    cout << \"STEP 4:\";\n    for (int k = 0; k < 5; k++)\n        cout << \" \" << parole[k] << (palindromo(parole[k], 0, parole[k].length() - 1) ? \"(si)\" : \"(no)\");\n    cout << endl;\n\n    Nodo* testa = nullptr;                      // costruisco la lista 1 -> 2 -> 3 -> 4\n    for (int x = 4; x >= 1; x--) testa = new Nodo{x, testa};   // inserimento in testa\n    cout << \"STEP 5: lunghezza = \" << lunghezza(testa) << \", al contrario: \";\n    stampaAlContrario(testa);\n    cout << endl;\n    distruggi(testa);\n\n    cout << \"STEP 6: sommaCoda = \" << sommaCoda(v, 6, 0) << \", sommaCiclo = \" << sommaCiclo(v, 6) << endl;\n    return 0;\n}\n"}],"input":null,"output":"STEP 1: 5 4 3 2 1 | 1 2 3 4 5 \nSTEP 2: somma = 37\nSTEP 3: massimo = 12\nSTEP 4: radar(si) osso(si) ciao(no) a(si) anna(si)\nSTEP 5: lunghezza = 4, al contrario: 4 3 2 1 \nSTEP 6: sommaCoda = 37, sommaCiclo = 37\n"}},{"id":"m08-e01","modulo":8,"tipo":"es","numero":1,"titolo":"Prima, dopo, prima e dopo","difficolta":"facile","testo":"<p>Scrivi tre funzioni ricorsive <code>giu(n)<\/code>, <code>su(n)<\/code> e <code>suEGiu(n)<\/code> che differiscono solo per la posizione del <code>cout<\/code> rispetto alla chiamata. Prevedi cosa stampano <code>giu(5)<\/code>, <code>su(5)<\/code> e <code>suEGiu(3)<\/code>, poi verifica.<\/p>","soluzione":{"commento":"<p><code>suEGiu(3)<\/code> stampa all'andata 3, 2, 1 e al ritorno 1, 2, 3: ogni numero compare due volte, “a specchio”.<\/p>","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 8.1 - Stessa funzione, cout prima o dopo: cambia tutto\n#include <iostream>\nusing namespace std;\n\nvoid giu(int n) {               // cout PRIMA della chiamata\n    if (n < 1) return;\n    cout << n << \" \";\n    giu(n - 1);\n}\n\nvoid su(int n) {                // cout DOPO la chiamata\n    if (n < 1) return;\n    su(n - 1);\n    cout << n << \" \";\n}\n\nvoid suEGiu(int n) {            // cout PRIMA e DOPO\n    if (n < 1) return;\n    cout << n << \" \";\n    suEGiu(n - 1);\n    cout << n << \" \";\n}\n\nint main() {\n    giu(5);    cout << endl;\n    su(5);     cout << endl;\n    suEGiu(3); cout << endl;\n    return 0;\n}\n"}],"input":null,"output":"5 4 3 2 1 \n1 2 3 4 5 \n3 2 1 1 2 3 \n"}},{"id":"m08-e02","modulo":8,"tipo":"es","numero":2,"titolo":"Prodotto come somme","difficolta":"facile","testo":"<p>Scrivi <code>prod(a, b)<\/code> delle slide (<code>a<\/code> se <code>b == 1<\/code>, altrimenti <code>a + prod(a, b - 1)<\/code>). Cosa succede con <code>b = 0<\/code>? Scrivi una versione con caso base <code>b == 0<\/code> che funzioni anche lì.<\/p>","soluzione":{"commento":"<p>Con caso base <code>b == 1<\/code> la chiamata <code>prod(5, 0)<\/code> non termina: <code>b<\/code> scende a -1, -2, … senza mai valere 1.<\/p>","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 8.2 - Prodotto come somme ripetute (dalle slide)\n#include <iostream>\nusing namespace std;\n\n// prod(a, b) = a                    se b = 1\n// prod(a, b) = a + prod(a, b - 1)   altrimenti\nint prod(int a, int b) {\n    if (b == 1) return a;\n    return a + prod(a, b - 1);\n}\n\n// Versione che accetta anche b = 0 (caso base più \"naturale\")\nint prod0(int a, int b) {\n    if (b == 0) return 0;\n    return a + prod0(a, b - 1);\n}\n\nint main() {\n    cout << \"prod(7, 4) = \" << prod(7, 4) << endl;      // 7 + 7 + 7 + 7\n    cout << \"prod(5, 1) = \" << prod(5, 1) << endl;\n    cout << \"prod0(5, 0) = \" << prod0(5, 0) << endl;\n    // prod(5, 0) andrebbe all'infinito: b = 0, -1, -2, ... non arriva mai a 1!\n    return 0;\n}\n"}],"input":null,"output":"prod(7, 4) = 28\nprod(5, 1) = 5\nprod0(5, 0) = 0\n"}},{"id":"m08-e03","modulo":8,"tipo":"es","numero":3,"titolo":"Cifre di un numero","difficolta":"facile","testo":"<p>Scrivi <code>sommaCifre(n)<\/code> e <code>numeroCifre(n)<\/code> ricorsive. <i>Suggerimento<\/i>: <code>n % 10<\/code> è l'ultima cifra, <code>n / 10<\/code> è il numero senza l'ultima cifra.<\/p>","soluzione":{"commento":"","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 8.3 - Somma e numero delle cifre di un intero\n#include <iostream>\nusing namespace std;\n\n// 4721 -> 1 + sommaCifre(472) -> ... ; n % 10 = ultima cifra, n / 10 = \"toglie\" l'ultima cifra\nint sommaCifre(int n) {\n    if (n < 10) return n;                       // una sola cifra\n    return n % 10 + sommaCifre(n / 10);\n}\n\nint numeroCifre(int n) {\n    if (n < 10) return 1;\n    return 1 + numeroCifre(n / 10);\n}\n\nint main() {\n    int numeri[] = {4721, 9, 100000, 987654321};\n    for (int k = 0; k < 4; k++)\n        cout << numeri[k] << \": somma cifre \" << sommaCifre(numeri[k])\n             << \", cifre \" << numeroCifre(numeri[k]) << endl;\n    return 0;\n}\n"}],"input":null,"output":"4721: somma cifre 14, cifre 4\n9: somma cifre 9, cifre 1\n100000: somma cifre 1, cifre 6\n987654321: somma cifre 45, cifre 9\n"}},{"id":"m08-e04","modulo":8,"tipo":"es","numero":4,"titolo":"Potenza con traccia","difficolta":"facile","testo":"<p>Scrivi la potenza ricorsiva bⁿ = b · bⁿ⁻¹ con un parametro <code>livello<\/code> che stampi le chiamate rientrate all'andata e i risultati al ritorno.<\/p>","soluzione":{"commento":"<p>Le righe <code>-&gt;<\/code> compaiono in ordine inverso rispetto alle chiamate: è il ritorno.<\/p>","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 8.4 - Potenza ricorsiva con la traccia delle chiamate\n#include <iostream>\nusing namespace std;\n\nlong long potenza(long long b, int n, int livello) {\n    for (int i = 0; i < livello; i++) cout << \"  \";\n    cout << \"potenza(\" << b << \", \" << n << \")\" << endl;\n    if (n == 0) return 1;\n    long long r = b * potenza(b, n - 1, livello + 1);\n    for (int i = 0; i < livello; i++) cout << \"  \";\n    cout << \"-> \" << r << endl;\n    return r;\n}\n\nint main() {\n    long long r = potenza(3, 4, 0);\n    cout << \"3^4 = \" << r << endl;\n    return 0;\n}\n"}],"input":null,"output":"potenza(3, 4)\n  potenza(3, 3)\n    potenza(3, 2)\n      potenza(3, 1)\n        potenza(3, 0)\n      -> 3\n    -> 9\n  -> 27\n-> 81\n3^4 = 81\n"}},{"id":"m08-e05","modulo":8,"tipo":"es","numero":5,"titolo":"Contare un carattere","difficolta":"medio","testo":"<p>Scrivi <code>int conta(const string&amp; s, char c, int i)<\/code>, che conta quante volte <code>c<\/code> compare in <code>s<\/code> a partire dalla posizione <code>i<\/code>. Caso base: <code>i<\/code> arriva alla fine della stringa.<\/p>","soluzione":{"commento":"","files":[{"nome":"es05.cpp","contenuto":"// Esercizio 8.5 - Contare un carattere in una stringa, ricorsivamente\n#include <iostream>\n#include <string>\nusing namespace std;\n\n// Guardo il carattere in posizione i, il resto lo chiedo alla ricorsione\nint conta(const string& s, char c, int i) {\n    if (i == (int)s.length()) return 0;                // stringa finita\n    int questo = (s[i] == c) ? 1 : 0;\n    return questo + conta(s, c, i + 1);\n}\n\nint main() {\n    string frase = \"la ricorsione e' una cosa seria\";\n    cout << \"'a' compare \" << conta(frase, 'a', 0) << \" volte\" << endl;\n    cout << \"'r' compare \" << conta(frase, 'r', 0) << \" volte\" << endl;\n    cout << \"'z' compare \" << conta(frase, 'z', 0) << \" volte\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"'a' compare 4 volte\n'r' compare 3 volte\n'z' compare 0 volte\n"}},{"id":"m08-e06","modulo":8,"tipo":"es","numero":6,"titolo":"Invertire","difficolta":"medio","testo":"<p>Scrivi <code>void inverti(int v[], int i, int j)<\/code>, che inverte l'array scambiando gli estremi e poi invertendo la parte interna, e <code>string contrario(const string&amp; s)<\/code>, che restituisce la stringa al contrario (<i>suggerimento<\/i>: <code>s.substr(1)<\/code> è la stringa senza il primo carattere).<\/p>","soluzione":{"commento":"<p>In <code>contrario<\/code>, <code>contrario(s.substr(1)) + s[0]<\/code> mette il primo carattere <i>in fondo<\/i> al contrario del resto.<\/p>","files":[{"nome":"es06.cpp","contenuto":"// Esercizio 8.6 - Invertire un array e una stringa, ricorsivamente\n#include <iostream>\n#include <string>\nusing namespace std;\n\n// Scambio gli estremi, poi inverto la parte interna\nvoid inverti(int v[], int i, int j) {\n    if (i >= j) return;                  // 0 o 1 elementi: niente da fare\n    int t = v[i]; v[i] = v[j]; v[j] = t;\n    inverti(v, i + 1, j - 1);\n}\n\n// Il contrario di \"ciao\" è: contrario(\"iao\") + 'c'\nstring contrario(const string& s) {\n    if (s.length() <= 1) return s;\n    return contrario(s.substr(1)) + s[0];      // substr(1) = la stringa senza il primo carattere\n}\n\nint main() {\n    int v[] = {1, 2, 3, 4, 5, 6, 7};\n    inverti(v, 0, 6);\n    for (int i = 0; i < 7; i++) cout << v[i] << \" \";\n    cout << endl;\n    cout << contrario(\"ricorsione\") << endl;\n    return 0;\n}\n"}],"input":null,"output":"7 6 5 4 3 2 1 \nenoisrocir\n"}},{"id":"m08-e07","modulo":8,"tipo":"es","numero":7,"titolo":"Euclide","difficolta":"medio","testo":"<p>Scrivi l'MCD con l'algoritmo di Euclide in forma ricorsiva (<code>mcd(a, 0) = a<\/code>, <code>mcd(a, b) = mcd(b, a % b)<\/code>), stampando ogni chiamata. È di coda? Trasformalo in un ciclo.<\/p>","soluzione":{"commento":"<p>È di coda: la chiamata è l'ultima cosa. Nel ciclo, i parametri <code>a<\/code> e <code>b<\/code> diventano variabili aggiornate a ogni giro.<\/p>","files":[{"nome":"es07.cpp","contenuto":"// Esercizio 8.7 - MCD di Euclide: ricorsione di coda e versione con il ciclo\n#include <iostream>\nusing namespace std;\n\n// mcd(a, b) = a               se b = 0\n// mcd(a, b) = mcd(b, a % b)   altrimenti\nint mcd(int a, int b) {\n    cout << \"  mcd(\" << a << \", \" << b << \")\" << endl;\n    if (b == 0) return a;\n    return mcd(b, a % b);          // la chiamata è l'ULTIMA cosa: ricorsione di coda\n}\n\nint mcdCiclo(int a, int b) {       // stessa logica: i parametri diventano variabili\n    while (b != 0) {\n        int r = a % b;\n        a = b;\n        b = r;\n    }\n    return a;\n}\n\nint main() {\n    int r = mcd(1071, 462);\n    cout << \"mcd(1071, 462) = \" << r << \", con il ciclo: \" << mcdCiclo(1071, 462) << endl;\n    return 0;\n}\n"}],"input":null,"output":"  mcd(1071, 462)\n  mcd(462, 147)\n  mcd(147, 21)\n  mcd(21, 0)\nmcd(1071, 462) = 21, con il ciclo: 21\n"}},{"id":"m08-e08","modulo":8,"tipo":"es","numero":8,"titolo":"Il puzzle di Collatz","difficolta":"medio","testo":"<p>Scrivi la funzione <code>puzzle<\/code> delle slide in modo che stampi il percorso dei numeri fino a 1 e una funzione che conti i passi. Trova il numero fino a 30 con il percorso più lungo. Perché non si può garantire che termini?<\/p>","soluzione":{"commento":"<p>27 fa ben 111 passi, salendo fino a 9232 prima di scendere. Che ogni numero arrivi a 1 non è mai stato dimostrato.<\/p>","files":[{"nome":"es08.cpp","contenuto":"// Esercizio 8.8 - La funzione \"puzzle\" delle slide (congettura di Collatz)\n#include <iostream>\nusing namespace std;\n\n// Se N è pari chiama se stessa su N/2, se è dispari su 3N+1.\n// 3N+1 è PIÙ GRANDE di N: non possiamo garantire che si arrivi al caso base!\nint passi(long long N) {\n    if (N == 1) return 0;\n    if (N % 2 == 0) return 1 + passi(N / 2);\n    return 1 + passi(3 * N + 1);\n}\n\nvoid percorso(long long N) {\n    cout << N;\n    if (N == 1) { cout << endl; return; }\n    cout << \" -> \";\n    percorso(N % 2 == 0 ? N / 2 : 3 * N + 1);\n}\n\nint main() {\n    percorso(6);\n    percorso(7);\n    int record = 1;\n    for (int n = 1; n <= 30; n++)\n        if (passi(n) > passi(record)) record = n;\n    cout << \"fino a 30, il numero piu' lungo e' \" << record << \" con \" << passi(record) << \" passi\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"6 -> 3 -> 10 -> 5 -> 16 -> 8 -> 4 -> 2 -> 1\n7 -> 22 -> 11 -> 34 -> 17 -> 52 -> 26 -> 13 -> 40 -> 20 -> 10 -> 5 -> 16 -> 8 -> 4 -> 2 -> 1\nfino a 30, il numero piu' lungo e' 27 con 111 passi\n"}},{"id":"m08-e09","modulo":8,"tipo":"es","numero":9,"titolo":"Torre di Hanoi","difficolta":"difficile","testo":"<p>Sposta n dischi dal piolo A al piolo C usando B come appoggio, senza mai mettere un disco grande su uno piccolo. Idea ricorsiva: sposta n-1 dischi su B, sposta il disco grande su C, riporta gli n-1 dischi su C. Stampa le mosse per 3 dischi e conta le mosse fino a 20 dischi.<\/p>","soluzione":{"commento":"<p>Le mosse sono 2ⁿ - 1: per 20 dischi più di un milione.<\/p>","files":[{"nome":"es09.cpp","contenuto":"// Esercizio 8.9 - Torre di Hanoi\n#include <iostream>\nusing namespace std;\n\nint mosse = 0;\n\n// Sposta n dischi dal piolo \"da\" al piolo \"a\", usando \"via\" come appoggio\nvoid hanoi(int n, char da, char a, char via, bool stampa) {\n    if (n == 0) return;                          // nessun disco: nulla da fare\n    hanoi(n - 1, da, via, a, stampa);            // 1. sposto i n-1 dischi sopra, fuori dai piedi\n    mosse++;\n    if (stampa) cout << \"  disco \" << n << \": \" << da << \" -> \" << a << endl;   // 2. sposto il disco grande\n    hanoi(n - 1, via, a, da, stampa);            // 3. rimetto i n-1 dischi sopra il grande\n}\n\nint main() {\n    cout << \"3 dischi da A a C:\" << endl;\n    hanoi(3, 'A', 'C', 'B', true);\n    cout << \"mosse: \" << mosse << endl;\n    for (int n = 1; n <= 20; n += (n < 5 ? 1 : 5)) {\n        mosse = 0;\n        hanoi(n, 'A', 'C', 'B', false);\n        cout << n << \" dischi: \" << mosse << \" mosse\" << endl;   // 2^n - 1\n    }\n    return 0;\n}\n"}],"input":null,"output":"3 dischi da A a C:\n  disco 1: A -> C\n  disco 2: A -> B\n  disco 1: C -> B\n  disco 3: A -> C\n  disco 1: B -> A\n  disco 2: B -> C\n  disco 1: A -> C\nmosse: 7\n1 dischi: 1 mosse\n2 dischi: 3 mosse\n3 dischi: 7 mosse\n4 dischi: 15 mosse\n5 dischi: 31 mosse\n10 dischi: 1023 mosse\n15 dischi: 32767 mosse\n20 dischi: 1048575 mosse\n"}},{"id":"m08-e10","modulo":8,"tipo":"es","numero":10,"titolo":"Permutazioni","difficolta":"difficile","testo":"<p>Stampa tutte le permutazioni di una stringa: per ogni posizione k, prova a metterci ognuno dei caratteri rimasti (scambiandolo in posizione k), permuta il resto e poi <b>rimetti a posto<\/b> lo scambio (backtracking). Verifica che “1234” abbia 4! = 24 permutazioni.<\/p>","soluzione":{"commento":"<p>Il secondo <code>swap<\/code>, dopo la chiamata, rimette la stringa com'era: senza, i tentativi successivi partirebbero da una stringa già modificata.<\/p>","files":[{"nome":"es10.cpp","contenuto":"// Esercizio 8.10 - Tutte le permutazioni di una stringa (backtracking)\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint contatore = 0;\n\n// Le posizioni da 0 a k-1 sono già fissate; provo ogni carattere rimasto in posizione k\nvoid permuta(string& s, int k) {\n    if (k == (int)s.length()) {                  // tutte fissate: ho una permutazione\n        contatore++;\n        cout << s << \" \";\n        return;\n    }\n    for (int i = k; i < (int)s.length(); i++) {\n        swap(s[k], s[i]);          // scelgo s[i] per la posizione k\n        permuta(s, k + 1);         // permuto il resto\n        swap(s[k], s[i]);          // TORNO INDIETRO: rimetto a posto (backtracking)\n    }\n}\n\nint main() {\n    string s = \"abc\";\n    permuta(s, 0);\n    cout << \"\\n\" << contatore << \" permutazioni di abc\" << endl;\n    contatore = 0;\n    string t = \"1234\";\n    permuta(t, 0);\n    cout << \"\\n\" << contatore << \" permutazioni di 1234 (4! = 24)\" << endl;\n    return 0;\n}\n"}],"input":null,"output":"abc acb bac bca cba cab \n6 permutazioni di abc\n1234 1243 1324 1342 1432 1423 2134 2143 2314 2341 2431 2413 3214 3241 3124 3142 3412 3421 4231 4213 4321 4312 4132 4123 \n24 permutazioni di 1234 (4! = 24)\n"}},{"id":"m09-pattern","modulo":9,"tipo":"pattern","numero":null,"titolo":"Pattern da riscrivere a memoria","difficolta":"kit","testo":"<p><b>Obiettivo: <\/b>riscrivere da zero, senza guardare, il codice della sezione “Pattern di Codice di Laboratorio” del Modulo 9 (Ereditarietà, Polimorfismo, Classi Astratte e RTTI).<\/p><div class=\"elenco\"><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">1.<\/span><span>Rileggi il pattern nella dispensa e capisci ogni riga.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">2.<\/span><span>Chiudi la dispensa e riscrivilo qui, con il cronometro avviato.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">3.<\/span><span>Compila ed esegui, poi confronta con l'output atteso.<\/span><\/div><div class=\"voce\" style=\"--l:0\"><span class=\"segno\">4.<\/span><span>Se hai dovuto guardare, rifallo domani.<\/span><\/div><\/div><p>È il “kit da sapere a memoria” del capitolo “Superare l'esame”.<\/p>","soluzione":{"commento":"<p>Il pattern della dispensa.<\/p>","files":[{"nome":"pattern.cpp","contenuto":"// Modulo 9 - Pattern: gerarchia con classe astratta, virtual e polimorfismo\n// Compila: g++ -g pattern.cpp -o pattern.exe\n#include <iostream>\n#include <string>\nusing namespace std;\n\n// CLASSE BASE ASTRATTA: ha almeno un metodo virtuale puro (= 0) -> non si può istanziare\nclass Figura {\nprotected:                          // visibile alle classi derivate, non al main\n    string nome;\npublic:\n    Figura(string n) : nome(n) { cout << \"  [costruttore Figura]\" << endl; }\n    virtual ~Figura() { cout << \"  [distruttore Figura \" << nome << \"]\" << endl; }   // SEMPRE virtual\n\n    virtual double area() const = 0;            // virtuale PURO: ogni figura la calcola a modo suo\n    virtual void stampa() const {               // virtuale con un comportamento di default\n        cout << nome << \", area \" << area() << endl;   // area() chiama la versione GIUSTA\n    }\n    string getNome() const { return nome; }     // non virtuale: uguale per tutti\n};\n\nclass Rettangolo : public Figura {              // Rettangolo \"è una\" Figura\nprotected:\n    double b, h;\npublic:\n    Rettangolo(double base, double altezza, string n = \"rettangolo\")\n        : Figura(n), b(base), h(altezza) {      // PRIMA si costruisce la parte Figura\n        cout << \"  [costruttore Rettangolo]\" << endl;\n    }\n    ~Rettangolo() { cout << \"  [distruttore Rettangolo]\" << endl; }\n    double area() const override { return b * h; }       // override: ridefinisco\n};\n\nclass Quadrato : public Rettangolo {            // Quadrato \"è un\" Rettangolo (3 livelli)\npublic:\n    Quadrato(double lato) : Rettangolo(lato, lato, \"quadrato\") {\n        cout << \"  [costruttore Quadrato]\" << endl;\n    }\n    ~Quadrato() { cout << \"  [distruttore Quadrato]\" << endl; }\n    void stampa() const override {              // estendo la stampa della base\n        Figura::stampa();                       // riuso la versione di Figura...\n        cout << \"    (e' anche un rettangolo \" << b << \"x\" << h << \")\" << endl;   // ...e aggiungo\n    }\n};\n\nclass Cerchio : public Figura {\n    double r;\npublic:\n    Cerchio(double raggio) : Figura(\"cerchio\"), r(raggio) { cout << \"  [costruttore Cerchio]\" << endl; }\n    ~Cerchio() { cout << \"  [distruttore Cerchio]\" << endl; }\n    double area() const override { return 3.14159 * r * r; }\n};\n\nint main() {\n    // Figura f(\"x\");        // ERRORE: Figura è astratta (area() è = 0)\n    cout << \"Creo le figure:\" << endl;\n    Figura* figure[3];                          // array di PUNTATORI alla base\n    figure[0] = new Rettangolo(3, 4);\n    figure[1] = new Cerchio(1);\n    figure[2] = new Quadrato(2);\n\n    cout << \"\\nStampo (polimorfismo: stesso messaggio, comportamenti diversi):\" << endl;\n    double totale = 0;\n    for (int i = 0; i < 3; i++) {\n        figure[i]->stampa();                    // collegamento DINAMICO\n        totale += figure[i]->area();\n    }\n    cout << \"Area totale: \" << totale << endl;\n\n    cout << \"\\nDistruggo:\" << endl;\n    for (int i = 0; i < 3; i++) delete figure[i];   // grazie a ~Figura virtual parte il distruttore giusto\n    return 0;\n}\n"}],"input":null,"output":"Creo le figure:\n  [costruttore Figura]\n  [costruttore Rettangolo]\n  [costruttore Figura]\n  [costruttore Cerchio]\n  [costruttore Figura]\n  [costruttore Rettangolo]\n  [costruttore Quadrato]\n\nStampo (polimorfismo: stesso messaggio, comportamenti diversi):\nrettangolo, area 12\ncerchio, area 3.14159\nquadrato, area 4\n    (e' anche un rettangolo 2x2)\nArea totale: 19.1416\n\nDistruggo:\n  [distruttore Rettangolo]\n  [distruttore Figura rettangolo]\n  [distruttore Cerchio]\n  [distruttore Figura cerchio]\n  [distruttore Quadrato]\n  [distruttore Rettangolo]\n  [distruttore Figura quadrato]\n"}},{"id":"m09-lab","modulo":9,"tipo":"lab","numero":null,"titolo":"Laboratorio a step","difficolta":"esame","testo":"<p><b>Il rifugio per animali<\/b><\/p><p>Un rifugio ospita cani, gatti e pappagalli. Ogni animale ha un nome e un'età (0–30 anni) e sa “fare il suo verso”. I cani hanno una razza e sanno riportare la pallina, i gatti possono essere casalinghi o no, i pappagalli ripetono una parola. Si vuole generare a caso il contenuto del rifugio e calcolare alcune statistiche.<\/p><p><b>Step 1 – la classe base<\/b><br>Scrivi <code>Animale<\/code> con attributi <code>protected<\/code> <code>nome<\/code> ed <code>eta<\/code>, costruttore, un metodo <code>string verso() const<\/code> che restituisce “...” e un metodo <code>void stampa() const<\/code> che stampa nome, età e verso.<br><b>Concetto nuovo:<\/b> attributi <code>protected<\/code>.<\/p><p><b>Step 2 – le derivate<\/b><br>Scrivi <code>Cane<\/code> (con <code>razza<\/code> e il metodo <code>riporta()<\/code>), <code>Gatto<\/code> (con <code>casalingo<\/code>) e <code>Pappagallo<\/code> (con <code>parola<\/code>). Ogni costruttore chiama quello di <code>Animale<\/code> nella lista di inizializzazione; ognuna ridefinisce <code>verso()<\/code>; <code>Cane<\/code> e <code>Gatto<\/code> ridefiniscono <code>stampa()<\/code> richiamando <code>Animale::stampa()<\/code> e aggiungendo i propri dati. Prova a mettere un <code>Cane<\/code> in un <code>Animale*<\/code> e a chiamare <code>stampa()<\/code>: che verso fa?<br><b>Concetto nuovo:<\/b> estensione, ridefinizione, costruttore della base, binding statico.<\/p><p><b>Step 3 – polimorfismo<\/b><br>Rendi <code>virtual<\/code> <code>verso()<\/code> e <code>stampa()<\/code> e ripeti la prova dello step 2.<br><b>Concetto nuovo:<\/b> binding dinamico, <code>override<\/code>.<\/p><p><b>Step 4 – classe astratta<\/b><br>Rendi <code>verso()<\/code> virtuale puro e aggiungi <code>virtual ~Animale() {}<\/code>. Verifica che <code>Animale a(\"x\", 1);<\/code> non compili più.<br><b>Concetto nuovo:<\/b> classe astratta, distruttore virtuale.<\/p><p><b>Step 5 – il rifugio e le statistiche<\/b><br>Con <code>srand(111222333)<\/code> riempi un array di 10 <code>Animale*<\/code> con animali casuali (età casuale tra 0 e 15, tipo casuale, nome scelto in base al tipo). Stampali tutti, conta cani, gatti e pappagalli (usa sia <code>typeid<\/code> sia <code>dynamic_cast<\/code>), calcola l'età media dei gatti e fai <code>riporta()<\/code> a tutti i cani. Libera la memoria.<br><b>Concetto nuovo:<\/b> array polimorfico, RTTI.<\/p><p><b>Step 6 – eccezioni<\/b><br>Crea <code>class EtaNonValida : public exception<\/code> con <code>what()<\/code>; il costruttore di <code>Animale<\/code> la lancia se l'età non è tra 0 e 30. Prova a creare un gatto di 99 anni e cattura l'eccezione, mettendo prima il <code>catch<\/code> di <code>EtaNonValida<\/code> e poi quello di <code>exception<\/code>.<br><b>Concetto nuovo:<\/b> eccezioni personalizzate, gerarchia di eccezioni.<\/p><p>Scrivi un solo file e fallo compilare alla fine di ogni step, come in laboratorio.<\/p>","soluzione":{"commento":"<p>La soluzione è divisa in blocchi <code>// ===== STEP n =====<\/code>.<\/p>","files":[{"nome":"lab.cpp","contenuto":"// Modulo 9 - Laboratorio a step: il rifugio per animali (stile esame UNICT)\n// Compila: g++ -g lab.cpp -o lab.exe\n#include <iostream>\n#include <string>\n#include <cstdlib>\n#include <typeinfo>\n#include <exception>\nusing namespace std;\n\n// ===== STEP 6 =====  Un'eccezione personalizzata che deriva da exception\nclass EtaNonValida : public exception {\npublic:\n    const char* what() const noexcept override { return \"eta' non valida (0-30)\"; }\n};\n\n// ===== STEP 1 =====  La classe base\n// ===== STEP 4 =====  ...che diventa ASTRATTA, con distruttore virtuale\nclass Animale {\nprotected:\n    string nome;\n    int eta;\npublic:\n    Animale(string n, int e) : nome(n), eta(e) {\n        if (e < 0 || e > 30) throw EtaNonValida();\n    }\n    virtual ~Animale() {}\n    virtual string verso() const = 0;               // STEP 3: virtual; STEP 4: = 0\n    virtual void stampa() const {\n        cout << nome << \" (\" << eta << \" anni) fa \" << verso();\n    }\n    int getEta() const { return eta; }\n};\n\n// ===== STEP 2 =====  Classi derivate: estensione (nuovi attributi) e ridefinizione\nclass Cane : public Animale {\n    string razza;\npublic:\n    Cane(string n, int e, string r) : Animale(n, e), razza(r) {}\n    string verso() const override { return \"Bau\"; }\n    void stampa() const override {\n        Animale::stampa();                          // riuso la stampa della base\n        cout << \", razza \" << razza;\n    }\n    void riporta() const { cout << nome << \" riporta la pallina!\" << endl; }   // solo i cani\n};\n\nclass Gatto : public Animale {\n    bool casalingo;\npublic:\n    Gatto(string n, int e, bool c) : Animale(n, e), casalingo(c) {}\n    string verso() const override { return \"Miao\"; }\n    void stampa() const override {\n        Animale::stampa();\n        cout << (casalingo ? \", casalingo\" : \", esce di casa\");\n    }\n};\n\nclass Pappagallo : public Animale {\n    string parola;\npublic:\n    Pappagallo(string n, int e, string p) : Animale(n, e), parola(p) {}\n    string verso() const override { return parola + \"!\"; }\n};\n\n// ===== STEP 5 =====  Generazione casuale e statistiche\nAnimale* creaCasuale(int i) {\n    string nomiCani[] = {\"Fido\", \"Rex\", \"Argo\"};\n    string nomiGatti[] = {\"Micia\", \"Tom\", \"Luna\"};\n    int eta = rand() % 16;\n    int tipo = rand() % 3;\n    string suffisso = to_string(i);                 // per distinguere omonimi\n    switch (tipo) {\n        case 0:  return new Cane(nomiCani[rand() % 3] + suffisso, eta, (rand() % 2) ? \"meticcio\" : \"labrador\");\n        case 1:  return new Gatto(nomiGatti[rand() % 3] + suffisso, eta, rand() % 2);\n        default: return new Pappagallo(\"Polly\" + suffisso, eta, \"Ciao\");\n    }\n}\n\nint main() {\n    srand(111222333);\n    const int N = 10;\n    Animale* rifugio[N];\n    for (int i = 0; i < N; i++) rifugio[i] = creaCasuale(i);\n\n    cout << \"=== Ospiti del rifugio ===\" << endl;\n    for (int i = 0; i < N; i++) {\n        rifugio[i]->stampa();                       // dinamico: la stampa giusta per ogni animale\n        cout << endl;\n    }\n\n    // Conteggio per tipo: due modi\n    int cani = 0, gatti = 0, altri = 0;\n    double sommaEtaGatti = 0;\n    for (int i = 0; i < N; i++) {\n        if (typeid(*rifugio[i]) == typeid(Cane)) cani++;                    // modo 1: typeid\n        Gatto* g = dynamic_cast<Gatto*>(rifugio[i]);                         // modo 2: dynamic_cast\n        if (g != nullptr) { gatti++; sommaEtaGatti += g->getEta(); }\n        if (typeid(*rifugio[i]) == typeid(Pappagallo)) altri++;\n    }\n    cout << \"\\nCani: \" << cani << \", gatti: \" << gatti << \", pappagalli: \" << altri << endl;\n    if (gatti > 0) cout << \"Eta' media dei gatti: \" << sommaEtaGatti / gatti << endl;\n\n    cout << \"\\nI cani giocano:\" << endl;\n    for (int i = 0; i < N; i++) {\n        Cane* c = dynamic_cast<Cane*>(rifugio[i]);  // è davvero un Cane? Se no -> nullptr\n        if (c) c->riporta();                        // metodo che esiste solo in Cane\n    }\n\n    // STEP 6: un'eccezione dal costruttore\n    try {\n        Animale* sbagliato = new Gatto(\"Matusalemme\", 99, true);\n        delete sbagliato;\n    } catch (const EtaNonValida& e) {               // prima la più specifica...\n        cout << \"\\nErrore specifico: \" << e.what() << endl;\n    } catch (const exception& e) {                  // ...poi la più generale\n        cout << \"Errore generico: \" << e.what() << endl;\n    }\n\n    for (int i = 0; i < N; i++) delete rifugio[i];\n    return 0;\n}\n"}],"input":null,"output":"=== Ospiti del rifugio ===\nPolly0 (2 anni) fa Ciao!\nPolly1 (2 anni) fa Ciao!\nRex2 (4 anni) fa Bau, razza meticcio\nRex3 (11 anni) fa Bau, razza labrador\nRex4 (0 anni) fa Bau, razza meticcio\nTom5 (2 anni) fa Miao, esce di casa\nLuna6 (14 anni) fa Miao, esce di casa\nFido7 (13 anni) fa Bau, razza meticcio\nLuna8 (14 anni) fa Miao, esce di casa\nMicia9 (5 anni) fa Miao, esce di casa\n\nCani: 4, gatti: 4, pappagalli: 2\nEta' media dei gatti: 8.75\n\nI cani giocano:\nRex2 riporta la pallina!\nRex3 riporta la pallina!\nRex4 riporta la pallina!\nFido7 riporta la pallina!\n\nErrore specifico: eta' non valida (0-30)\n"}},{"id":"m09-e01","modulo":9,"tipo":"es","numero":1,"titolo":"Persona e Studente","difficolta":"facile","testo":"<p>Scrivi <code>Persona<\/code> (nome <code>protected<\/code>, <code>saluta()<\/code>) e <code>Studente<\/code> derivato (con matricola e <code>presentaMatricola()<\/code>). Fai stampare a costruttori e distruttori un messaggio e verifica l'ordine in cui vengono chiamati, creando uno studente dentro un blocco <code>{ }<\/code>.<\/p>","soluzione":{"commento":"<p>Costruttori dalla base alla derivata, distruttori al contrario, alla chiusura del blocco.<\/p>","files":[{"nome":"es01.cpp","contenuto":"// Esercizio 9.1 - Persona e Studente: costruttori e distruttori in catena\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Persona {\nprotected:\n    string nome;\npublic:\n    Persona(string n) : nome(n) { cout << \"costruttore Persona(\" << nome << \")\" << endl; }\n    ~Persona() { cout << \"distruttore Persona(\" << nome << \")\" << endl; }\n    void saluta() const { cout << \"Ciao, sono \" << nome << endl; }\n};\n\nclass Studente : public Persona {\n    int matricola;                                       // ESTENSIONE: un attributo in più\npublic:\n    Studente(string n, int m) : Persona(n), matricola(m) {   // chiamo il costruttore della base\n        cout << \"costruttore Studente(\" << matricola << \")\" << endl;\n    }\n    ~Studente() { cout << \"distruttore Studente(\" << matricola << \")\" << endl; }\n    void presentaMatricola() const {                     // ESTENSIONE: un metodo in più\n        cout << nome << \" ha matricola \" << matricola << endl;   // nome è protected: lo vedo\n    }\n};\n\nint main() {\n    {\n        Studente s(\"Mario\", 1000123);\n        s.saluta();                  // ereditato da Persona\n        s.presentaMatricola();       // aggiunto in Studente\n        cout << \"--- fine blocco ---\" << endl;\n    }\n    return 0;\n}\n"}],"input":null,"output":"costruttore Persona(Mario)\ncostruttore Studente(1000123)\nCiao, sono Mario\nMario ha matricola 1000123\n--- fine blocco ---\ndistruttore Studente(1000123)\ndistruttore Persona(Mario)\n"}},{"id":"m09-e02","modulo":9,"tipo":"es","numero":2,"titolo":"Trova l'errore","difficolta":"facile","testo":"<p>Ricopia l'esempio delle slide (<code>Base<\/code> con <code>meth1<\/code> public e <code>meth2<\/code> protected, <code>Derived<\/code>, <code>DerivedDerived<\/code>) e scopri quale chiamata nel <code>main<\/code> non compila. Aggiungi un metodo private e una classe derivata con ereditarietà <code>private<\/code> e verifica cosa diventa accessibile.<\/p>","soluzione":{"commento":"<p>Le righe commentate sono quelle che non compilano.<\/p>","files":[{"nome":"es02.cpp","contenuto":"// Esercizio 9.2 - \"Trova l'errore\" delle slide: public, protected, private nell'ereditarietà\n#include <iostream>\nusing namespace std;\n\nclass Base {\npublic:\n    void meth1() const { cout << \"meth1 (public)\" << endl; }\nprotected:\n    void meth2() const { cout << \"meth2 (protected)\" << endl; }\nprivate:\n    void meth5() const { cout << \"meth5 (private)\" << endl; }\n};\n\nclass Derived : public Base {\npublic:\n    void meth3() const {\n        meth2();               // OK: protected è visibile alle classi derivate\n        // meth5();            // ERRORE: private non è visibile nemmeno alle derivate\n    }\n};\n\nclass DerivedDerived : public Derived {\npublic:\n    void meth4() const { meth2(); }   // OK: protected resta visibile lungo la gerarchia\n};\n\nclass DerivataPrivata : private Base {   // eredità PRIVATA: meth1 diventa private qui\npublic:\n    void usa() const { meth1(); }        // dentro la classe si può usare\n};\n\nint main() {\n    Derived d1;\n    d1.meth1();\n    d1.meth3();\n    // d1.meth2();             // ERRORE delle slide: 'meth2' is protected within this context\n    DerivedDerived d2;\n    d2.meth4();\n    DerivataPrivata dp;\n    dp.usa();\n    // dp.meth1();             // ERRORE: con eredità private, meth1 non è più pubblico\n    return 0;\n}\n"}],"input":null,"output":"meth1 (public)\nmeth2 (protected)\nmeth2 (protected)\nmeth1 (public)\n"}},{"id":"m09-e03","modulo":9,"tipo":"es","numero":3,"titolo":"Statico o dinamico?","difficolta":"facile","testo":"<p>Una classe <code>Veicolo<\/code> con un metodo <i>non<\/i> virtuale e uno virtuale, ridefiniti in <code>Moto<\/code>. Chiama entrambi su un oggetto <code>Moto<\/code>, tramite un <code>Veicolo*<\/code>, tramite un <code>Veicolo&amp;<\/code> e su una copia <code>Veicolo copia = moto;<\/code>. Spiega ogni risultato.<\/p>","soluzione":{"commento":"<p>Tramite <code>Veicolo*<\/code> il metodo non virtuale esegue la versione di <code>Veicolo<\/code>, quello virtuale la versione di <code>Moto<\/code>. Sulla copia <code>Veicolo copia = m;<\/code> anche il virtuale esegue la versione di <code>Veicolo<\/code>: la copia <i>è<\/i> un <code>Veicolo<\/code> (slicing).<\/p>","files":[{"nome":"es03.cpp","contenuto":"// Esercizio 9.3 - Binding statico contro binding dinamico\n#include <iostream>\nusing namespace std;\n\nclass Veicolo {\npublic:\n    void descriviStatico() const { cout << \"  [statico]  sono un veicolo generico\" << endl; }\n    virtual void descriviDinamico() const { cout << \"  [dinamico] sono un veicolo generico\" << endl; }\n    virtual ~Veicolo() {}\n};\n\nclass Moto : public Veicolo {\npublic:\n    void descriviStatico() const { cout << \"  [statico]  sono una moto\" << endl; }       // NON virtual nella base\n    void descriviDinamico() const override { cout << \"  [dinamico] sono una moto\" << endl; }\n};\n\nint main() {\n    Moto m;\n    cout << \"Chiamata diretta sull'oggetto Moto:\" << endl;\n    m.descriviStatico();\n    m.descriviDinamico();\n\n    Veicolo* p = &m;                  // puntatore alla BASE che punta a una Moto\n    cout << \"Chiamata tramite Veicolo*:\" << endl;\n    p->descriviStatico();             // decide il TIPO DEL PUNTATORE (Veicolo): a compile-time\n    p->descriviDinamico();            // decide il TIPO DELL'OGGETTO (Moto): a run-time\n\n    Veicolo& r = m;                   // vale anche con le reference\n    cout << \"Chiamata tramite Veicolo&:\" << endl;\n    r.descriviDinamico();\n\n    Veicolo copia = m;                // COPIA per valore: si perde la parte Moto (slicing)\n    cout << \"Chiamata su una copia di tipo Veicolo:\" << endl;\n    copia.descriviDinamico();\n    return 0;\n}\n"}],"input":null,"output":"Chiamata diretta sull'oggetto Moto:\n  [statico]  sono una moto\n  [dinamico] sono una moto\nChiamata tramite Veicolo*:\n  [statico]  sono un veicolo generico\n  [dinamico] sono una moto\nChiamata tramite Veicolo&:\n  [dinamico] sono una moto\nChiamata su una copia di tipo Veicolo:\n  [dinamico] sono un veicolo generico\n"}},{"id":"m09-e04","modulo":9,"tipo":"es","numero":4,"titolo":"Liskov","difficolta":"facile","testo":"<p>Scrivi <code>cammina(const Persona&amp;)<\/code> e <code>studia(Studente&amp;)<\/code>. Verifica che a <code>cammina<\/code> si possa passare uno <code>Studente<\/code> e che <code>studia(persona)<\/code> non compili. Crea un array di <code>Persona*<\/code> che contenga anche uno studente.<\/p>","soluzione":{"commento":"","files":[{"nome":"es04.cpp","contenuto":"// Esercizio 9.4 - Principio di sostituzione di Liskov (dalle slide)\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Persona {\nprotected:\n    string nome;\npublic:\n    Persona(string n) : nome(n) {}\n    string getNome() const { return nome; }\n    virtual ~Persona() {}\n};\n\nclass Studente : public Persona {\n    int esamiSostenuti = 0;\npublic:\n    Studente(string n) : Persona(n) {}\n    void superaEsame() { esamiSostenuti++; }\n    int getEsami() const { return esamiSostenuti; }\n};\n\nvoid cammina(const Persona& p) { cout << p.getNome() << \" cammina\" << endl; }\nvoid studia(Studente& s) { s.superaEsame(); cout << s.getNome() << \" ha \" << s.getEsami() << \" esami\" <<
