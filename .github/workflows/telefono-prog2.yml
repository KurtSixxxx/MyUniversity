# Pubblica su GitHub Pages la versione per telefono dell'Allenatore Prog2
# (https://kurtsixxxx.github.io/MyUniversity/). Va nella RADICE del repository.
# Una volta sola: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Allenatore Prog2 per telefono
on:
  push:
    branches: [main]
    paths: ['Anno_01/Semestre_02/Programmazione 2/Dispensa e Allenatore/docs/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'Anno_01/Semestre_02/Programmazione 2/Dispensa e Allenatore/docs'
      - id: deploy
        uses: actions/deploy-pages@v4
